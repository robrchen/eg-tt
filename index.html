裝置安培額定的80%。因為斷路器長時間通以額定電流會過熱誤跳，所以要留20%裕度。"},{"c":9,"n":13,"a":[2],"q":"配電盤頂部有開孔未完全封閉者，與可燃材質天花板間應保持多少米以上之間隔？","o":["0.5","0.9","1.2","2.5"],"x":"依「用戶用電設備裝置規則」，配電盤頂部若有開孔未完全封閉，與可燃材質天花板之間應保持0.9米以上間隔，以防盤內電弧或熱氣引燃天花板。0.9米大約就是3英尺。"},{"c":9,"n":14,"a":[2],"q":"配電盤變比器一次側接自對地電壓超過多少伏特以上線路時，其二次側應加以接地？","o":["150","300","450","600"],"x":"依「用戶用電設備裝置規則」，配電盤變比器一次側接自對地電壓超過300伏特的線路時，二次側應加以接地。這樣一次與二次間絕緣破壞時，高電壓能經接地導走，避免儀表與人員遭受高壓。"},{"c":9,"n":15,"a":[2],"q":"高壓電力開關設備“GIS”係指","o":["氣體斷路器","氣體絕緣開關設備","電力熔絲","雙投空斷開關"],"x":"GIS是Gas Insulated Switchgear，氣體絕緣開關設備，把斷路器、隔離開關、匯流排等封裝在充滿SF6氣體的金屬槽內，體積小、可靠度高。氣體斷路器是GCB，只是其中一個元件，不要混淆。"},{"c":9,"n":16,"a":[2],"q":"3E 電驛在做三相感應電動機保護時，需與比流器及下列何種器具配合使用？","o":["伏特計用切換開關","電流轉換器","安培計用切換開關","比壓器"],"x":"3E電驛要保護過載、欠相、逆相，需要取得各相電流的資訊，所以須與比流器及電流轉換器配合使用，將CT二次電流轉換成電驛可以處理的訊號。它不需要比壓器或儀表切換開關。"},{"c":9,"n":17,"a":[4],"q":"變電室或內裝有超過對地電壓多少伏特帶電部分之封閉箱體，其進出口應加以上鎖？但經常有合格人員值班者，不在此限","o":["150","300","450","600"],"x":"依「用戶用電設備裝置規則」，變電室或內裝有超過對地電壓600伏特帶電部分的封閉箱體，進出口應加以上鎖，防止非合格人員誤入；若經常有合格人員值班者則不在此限。"},{"c":9,"n":18,"a":[3],"q":"配電盤、配電箱之箱體若採用鋼板，其厚度應在多少毫米以上？","o":["1.0","1.2","1.6","2.0"],"x":"依「用戶用電設備裝置規則」，配電盤、配電箱箱體若採用鋼板，厚度應在1.6毫米以上，確保足夠的機械強度與防火能力。電度表接線箱用鋼板也是1.6毫米，兩題可以一起記。"},{"c":9,"n":19,"a":[4],"q":"未裝設主過電流保護裝置之配電箱，其分路過電流保護裝置不得超過多少極數？","o":["24","30","36","42"],"x":"依「用戶用電設備裝置規則」，未裝設主過電流保護裝置的配電箱，其分路過電流保護裝置不得超過42極。極數太多代表負載過大且缺乏總保護，故規定上限。記法：42極就是14個三極或42個單極。"},{"c":9,"n":20,"a":[2],"q":"電度表中心點距離地面高度，應在1.8 米以上，2.0 米以下為最適宜，如現場場地受限制，施工確有困難時得予增減之，惟最高不得超過多少米？","o":["2","2.5","3","3.5"],"x":"依台電電度表裝置相關規定，電度表中心點距地面以1.8至2.0米最適宜，現場受限時可增減，但最高不得超過2.5米，以方便抄表與檢查。太高抄表困難，所以有上限。"},{"c":9,"n":21,"a":[3],"q":"電度表接線箱，其箱體若採用鋼板其厚度應在多少毫米以上？","o":["1.0","1.2","1.6","2.0"],"x":"依相關規定，電度表接線箱若採用鋼板，厚度應在1.6毫米以上。和配電盤、配電箱的鋼板厚度相同，記一個數字1.6就能應付兩題。"},{"c":9,"n":22,"a":[3],"q":"高壓配電盤內裝置有CO、LCO、UV、OV 等保護電驛，如電源停電時，何種電驛會動作？","o":["CO","LCO","UV","OV"],"x":"UV是欠電壓電驛（Under Voltage，代號27），電源停電時電壓降為零，會使UV電驛動作，跳脫斷路器，以免復電時大量負載同時起動。CO、LCO是過電流電驛，OV是過電壓電驛，停電時都不會動作。"},{"c":9,"n":23,"a":[1],"q":"配電盤內變比器之二次側依規定接地時，其電路與計器、儀表、電驛及變比器外殼之設備接地導線線徑應為多少平方毫米以上？","o":["3.5","5.5","8","14"],"x":"依「用戶用電設備裝置規則」，配電盤內變比器二次側接地時，其電路與計器、儀表、電驛及變比器外殼的設備接地導線線徑應為3.5平方毫米以上。二次側電流電壓都小，所以不用很粗的線。"},{"c":9,"n":24,"a":[1,2,4],"q":"下列哪些是配電盤送電前應檢查之項目？","o":["檢查控制線、電力電纜、匯流排之連接是否正確、端子台是否鎖緊","檢查各熔線座是否均裝有熔線","檢查是否有異常噪音產生","檢查斷路器及操作開關是否置於OFF 位置"],"x":"送電前要做靜態檢查：控制線、電纜、匯流排連接是否正確、端子是否鎖緊；熔線座是否都裝了熔線；斷路器和操作開關是否置於OFF位置，避免送電瞬間負載突然起動。「是否有異常噪音」必須通電後才聽得到，屬於送電後檢查項目。"},{"c":9,"n":25,"a":[1,2,3],"q":"下列哪些開關得用於屋內及地下室？","o":["電力熔絲","負載啟斷開關","高壓啟斷器","熔絲鏈開關"],"x":"電力熔絲、負載啟斷開關、高壓啟斷器都是封閉或可限制電弧外洩的設備，可用於屋內及地下室。熔絲鏈開關（俗稱鏈開）熔斷時會噴出電弧與氣體，只適合屋外使用。"},{"c":9,"n":26,"a":[1,2,4],"q":"用戶之電力系統中，下列哪些為故障電流之來源？","o":["電動機","發電機","電熱器","供電系統"],"x":"故障時能回饋電流到故障點的都是故障電流來源：供電系統（台電）是最主要來源，發電機會送出故障電流，運轉中的電動機在故障瞬間也會因慣性變成發電機回饋電流。電熱器是純電阻負載，沒有電源能力，不會提供故障電流。"},{"c":9,"n":27,"a":[1,3],"q":"一般高壓受配電盤計器用變比器，下列哪些正確？","o":["CT 二次側額定電流為5A 或1A","CT 二次側不得短路","PT 二次側額定電壓為110V","PT 二次側不得開路"],"x":"計器用CT二次額定電流為5A或1A，PT二次額定電壓為110V。注意口訣「CT不得開路、PT不得短路」：CT二次開路會感應極高電壓，PT二次短路會燒毀。題目把兩者講反了，所以「CT不得短路」與「PT不得開路」是錯的。"},{"c":9,"n":28,"a":[1,2,3],"q":"有關3E 電驛用於三相感應電動機之保護作用時，下列哪些正確？","o":["過載","逆相","欠相","接地"],"x":"3E電驛的三個E是過載（Overload）、欠相（Open phase）、逆相（Reverse phase）三種保護，常用於三相感應電動機。接地保護不屬於3E功能，需要另裝接地電驛或漏電斷路器。"},{"c":9,"n":29,"a":[1,3],"q":"有關貫穿型CT，下列哪些項目是可變的？","o":["一次側匝數","二次側匝數","變流比","一次側電流"],"x":"貫穿型CT本身沒有一次繞組，一次導線穿過鐵心幾次就是幾匝，所以一次側匝數可改變，變流比也就跟著改變。二次側匝數在出廠時就已固定；一次側電流是由負載決定，不是CT可以調整的項目。"},{"c":9,"n":30,"a":[1,2,3],"q":"下列哪些電驛不宜在3ψ4W 11.4kV 多重接地配電系統中作為接地保護？","o":["CO","OV","UV","LCO"],"x":"三相四線11.4kV多重接地系統中，接地故障電流較小且有中性線不平衡電流，接地保護一般採用低值過流電驛LCO（接在殘餘電流迴路）。CO用於相間過電流保護，OV、UV是過壓、欠壓電驛，都不適合當接地保護，所以這三項是答案。"},{"c":9,"n":31,"a":[2,3,4],"q":"下列哪些開關具有啟斷故障電流能力，且可在有載情形下操作？","o":["隔離開關（DS）","負載啟斷開關（LBS）","真空斷路器（VCB）","六氟化硫斷路器（GCB）"],"x":"隔離開關（DS）沒有啟斷負載電流的能力，只能無載操作，不選。負載啟斷開關（LBS）可有載操作，實務上多附裝電力熔絲，由熔絲啟斷故障電流；真空斷路器、六氟化硫斷路器本身就能啟斷故障電流，所以題庫選這三種。註：依用戶用電設備裝置規則，LBS本體只能啟斷負載電流，須與熔線或斷路器組合才能啟斷故障電流。","f":"爭議"},{"c":9,"n":32,"a":[2,3,4],"q":"下列哪些不是使用零相比流器（ZCT）之目的？","o":["檢出接地電流","量測高電壓","量測功率","量測大電流"],"x":"零相比流器（ZCT）是讓三相導線一起穿過鐵心，正常時三相電流相量和為零；發生接地時出現零相電流，ZCT就能檢出接地電流。題目問「不是」的目的：量測高電壓要用PT，量測功率要用功率計，量測大電流要用一般CT，都不是ZCT的用途。"},{"c":10,"n":1,"a":[4],"q":"開路電壓超過多少伏特之放電管燈系統不得裝設於住宅場所？","o":["300","600","750","1000"],"x":"依「用戶用電設備裝置規則」，開路電壓超過1000伏特的放電管燈系統（如霓虹燈）不得裝設於住宅場所。住宅中使用者多為一般民眾，高壓放電管系統危險性高，所以禁止。記法：住宅放電管燈，開路電壓以1000伏為界。"},{"c":10,"n":2,"a":[3],"q":"開路電壓超過1000 伏特放電管燈照明系統之變壓器，其開路電壓超過額定7500 伏特者，其二次側短路電流不得大於多少毫安培？","o":["100","200","300","400"],"del":1},{"c":10,"n":3,"a":[3],"q":"一般型手捺開關控制電感性負載（如日光燈、放電管燈）時，不得大於手捺開關安培額定百分之多少？","o":["60","70","80","90"],"x":"依「用戶用電設備裝置規則」，一般型手捺開關控制日光燈、放電管燈等電感性負載時，負載不得大於開關安培額定的80%。電感性負載開閉時會產生較大的電弧與突波，開關接點容易損耗，所以要打八折使用。"},{"c":10,"n":4,"a":[3],"q":"開路電壓超過1000 伏特放電管燈系統之變壓器裝設位置，應使鄰近之可燃物所承受溫度不超過攝氏多少度？","o":["70","80","90","100"],"x":"依「用戶用電設備裝置規則」，開路電壓超過1000伏特放電管燈系統的變壓器，裝設位置應使鄰近可燃物承受的溫度不超過攝氏90度，以免長期受熱碳化起火。照明相關的可燃物溫度上限，記住90度即可。"},{"c":10,"n":5,"a":[2],"q":"分路額定大於多少安培之燈用軌道，其照明燈具應有個別之過電流保護？","o":["15","20","30","40"],"x":"依「用戶用電設備裝置規則」，燈用軌道的分路額定大於20安培時，其上的照明燈具應有個別的過電流保護。因為軌道上的燈具引線較細，分路保護額定太大時無法保護個別燈具。"},{"c":10,"n":6,"a":[4],"q":"螺旋燈座之照明燈具，其下列何者應確實連接至螺旋套筒上？","o":["非接地導線","設備接地導線","搭接導線","被接地導線"],"x":"依「用戶用電設備裝置規則」，螺旋燈座的被接地導線（中性線）應接到螺旋套筒，非接地導線（火線）接到中心接點。因為換燈泡時手容易碰到螺紋套筒，接中性線比較安全。記法：「火線進中心，地線上螺紋」。"},{"c":10,"n":7,"a":[4],"q":"照明燈具及燈座應牢固於裝設位置，但燈具尺寸超過多少毫米者，不得利用燈座支持？","o":["100","200","300","400"],"x":"依「用戶用電設備裝置規則」，照明燈具尺寸超過400毫米者，不得只利用燈座支持，必須另以吊鉤、螺栓等方式固定在建築結構上。燈具太大太重時，燈座本身的強度撐不住。"},{"c":10,"n":8,"a":[2],"q":"屋外照明之配線，在不妨礙交通或無危險之處，得裝設於距離地面高度多少米以上？","o":["2","3","4","5"],"x":"依「用戶用電設備裝置規則」，屋外照明配線在不妨礙交通或無危險之處，得裝設於距地面3米以上。高度是為了避免行人碰觸及外力損傷，有車輛通行處則要求更高。"},{"c":10,"n":9,"a":[4],"q":"燈用軌道分路負載應按每300 毫米軌道長度以多少伏安計算？","o":["30","50","60","90"],"x":"依「用戶用電設備裝置規則」，燈用軌道分路負載的計算，以每300毫米軌道長度90伏安計算。軌道上可隨時加裝燈具，所以要用長度估算負載，不能只算現有燈具。"},{"c":10,"n":10,"a":[2],"q":"燈用軌道之銅導體應採用多少平方毫米以上，其軌道末端應有絕緣及加蓋？","o":["3.5","5.5","8","14"],"x":"依「用戶用電設備裝置規則」，燈用軌道的銅導體應採用5.5平方毫米以上，軌道末端應有絕緣並加蓋，防止人員碰觸帶電導體。"},{"c":10,"n":11,"a":[3],"q":"照明燈具及燈座應牢固於裝設位置，但燈具重量超過多少公斤者，不得利用燈座支持？","o":["1","2","3","4"],"x":"依「用戶用電設備裝置規則」，照明燈具重量超過3公斤者，不得利用燈座支持，必須直接固定在建築結構或吊架上。和10-7題一起記：尺寸超過400毫米、重量超過3公斤，都不能只靠燈座。"},{"c":10,"n":12,"a":[4],"q":"裝設於可燃物附近之照明燈具應有防護裝置，使可燃物遭受之溫度不超過攝氏多少度？","o":["60","70","80","90"],"x":"依「用戶用電設備裝置規則」，裝在可燃物附近的照明燈具應有防護裝置，使可燃物所受溫度不超過攝氏90度。照明章節中與可燃物有關的溫度限制，幾乎都是90度。"},{"c":10,"n":13,"a":[1],"q":"幹線及分路距離安定器、 LED 驅動元件、電源供應器或變壓器在七十五毫米以內者，其導線絕緣溫度額定不得小於攝氏多少度？","o":["90","80","70","60"],"x":"依「用戶用電設備裝置規則」，幹線及分路距離安定器、LED驅動元件、電源供應器或變壓器75毫米以內者，導線絕緣溫度額定不得小於攝氏90度。這些元件會發熱，靠太近的導線要用耐熱等級較高的絕緣。"},{"c":10,"n":14,"a":[2],"q":"室外臨時照明燈具應採用無開關之防水燈頭，每一照明分路之總負載電流不得大於多少安培，並應裝設分路過電流保護裝置？","o":["15","20","30","40"],"x":"依「用戶用電設備裝置規則」，室外臨時照明燈具應採用無開關的防水燈頭，每一照明分路總負載電流不得大於20安培，並裝設分路過電流保護裝置。無開關是為了避免雨天操作開關觸電。"},{"c":10,"n":15,"a":[3],"q":"以金屬或非金屬燈桿支撐照明燈具，且當作供電導線之管槽者，於燈桿或燈桿基座，應有面積不小於多少毫米乘以多少毫米之手孔及防雨罩，以作為燈桿或燈桿基座內導線之終端處理？","o":["30 乘以600","30 乘以1000","50 乘以1000","50 乘以600"],"x":"依「用戶用電設備裝置規則」第154條，以金屬或非金屬燈桿支撐燈具，且燈桿兼作電源導線之管槽時，燈桿或燈桿基座應設手孔及防雨罩，供燈桿內導線作終端處理。題庫答案為50毫米乘以1000毫米。註：現行條文寫的是「五十毫米乘以一百毫米以上」，題庫的1000應是100的誤植，四個選項中沒有正確數值。","f":"誤植"},{"c":10,"n":16,"a":[2],"q":"變壓器開路電壓超過7500 伏特者，其二次側短路電流不得大於多少毫安培？","o":["100","150","200","300"],"del":1},{"c":10,"n":17,"a":[4],"q":"將100 燭光的燈泡垂直於桌子正上方2 米處，該2 米水平面照度為多少Lx？","o":["200","100","50","25"],"x":"點光源照度 E = I / d²（垂直照射時）。E = 100 cd ÷ 2² = 100 ÷ 4 = 25 Lx。距離加倍，照度變為四分之一，這就是距離平方反比定律。"},{"c":10,"n":18,"a":[2],"q":"一住宅樓板面積為150 平方米，若其照明負載以每平方米20 伏安計算，如以110 伏特15 安培的過電流保護開關配置，照明負載需要多少個分路？","o":["1","2","3","4"],"x":"總照明負載 = 150 × 20 = 3000 VA。每一分路容量 = 110 V × 15 A = 1650 VA。分路數 = 3000 ÷ 1650 ≈ 1.82，無條件進位為2個分路。分路數算出小數時一律進位，不能四捨五入。"},{"c":10,"n":19,"a":[4],"q":"照度與光源距離","o":["成正比","成反比","平方成正比","平方成反比"],"x":"點光源照度 E = I / d²，照度與光源距離的平方成反比。距離變為2倍，照度變為1/4；距離變為3倍，照度變為1/9。這就是照度的平方反比定律。"},{"c":10,"n":20,"a":[2],"q":"有一間教室面積為80 平方米，裝置40W 日光燈20 支，每支日光燈為2800 流明，若所有光通量全部照射到教室桌面上，其平均照度為多少Lx？","o":["500","700","1200","1400"],"x":"總光通量 = 20支 × 2800 lm = 56000 lm。平均照度 E = 光通量 ÷ 面積 = 56000 ÷ 80 = 700 Lx。照度單位勒克斯就是每平方米的流明數（lm/m²）。"},{"c":10,"n":21,"a":[4],"q":"下列何種光源必須搭配電子式安定器才能啟動？","o":["白熾燈","複金屬燈","高壓鈉燈","T5 螢光燈管"],"x":"T5螢光燈管管徑細、設計上必須搭配電子式安定器才能啟動與穩定點燈。白熾燈直接通電即亮不需安定器；複金屬燈和高壓鈉燈可使用傳統電磁式安定器搭配觸發器啟動，不一定要電子式。"},{"c":10,"n":22,"a":[4],"q":"對地電壓300 伏特以下供公眾使用之路燈，裝設於人行道距離地面高度應不低於多少米以上？","o":["2","2.5","3","3.5"],"x":"依「用戶用電設備裝置規則」，對地電壓300伏特以下供公眾使用的路燈，裝在人行道上距地面不得低於3.5米，避免行人碰觸。車道則要4米以上，兩題可對照記：人行3.5、車行4。"},{"c":10,"n":23,"a":[4],"q":"對地電壓300 伏特以下供公眾使用之路燈，裝設於車輛通行道距離地面高度應不低於多少米以上？","o":["2","2.5","3.5","4"],"x":"依「用戶用電設備裝置規則」，對地電壓300伏特以下供公眾使用的路燈，裝在車輛通行道上距地面不得低於4米，以免被車輛碰撞。人行道只要3.5米，車道因有車輛高度考量要更高。"},{"c":10,"n":24,"a":[1,2,3],"q":"屋外照明配線之架空個別導線線徑及支撐，下列哪些正確？","o":["架空跨距15 米以下：導線線徑不得小於5.5 平方毫米","架空跨距15 公米至50米：導線線徑不得小於8 平方毫米","架空跨距超過50 米：導線線徑不得小於14 平方毫米","附有吊線裝置時，兩支撐點距離不限制，得採用5.5平方毫米以上之絕緣導線"],"x":"依「用戶用電設備裝置規則」第171條，屋外照明架空導線線徑依跨距決定：15米以下不得小於5.5平方毫米，超過15至50米不得小於8平方毫米，超過50米不得小於14平方毫米。附有吊線裝置時兩支撐點距離不限，但規定得採用3.5平方毫米以上絕緣導線，不是5.5平方毫米，所以該敘述不選。"},{"c":10,"n":25,"a":[2,3,4],"q":"各類場所其他照明負載計算應符合下列哪些規定？","o":["供重責務型燈座用之出線口以每一出線口至少180 伏安計算","供重責務型燈座用之出線口以每一出線口至少600 伏安計算","供招牌廣告燈及造型照明用之出線口以至少600 伏安計算","供展示窗照明用出線口以每300 毫米水平距離至少200 伏安計算"],"x":"依「用戶用電設備裝置規則」，重責務型燈座出線口每一出線口至少600伏安，招牌廣告燈及造型照明出線口至少600伏安，展示窗照明每300毫米水平距離至少200伏安。180伏安是一般插座出線口的計算值，不是重責務型燈座。"},{"c":10,"n":26,"a":[1,2,4],"q":"照明燈具電源導線之裝設及絕緣保護，依下列哪些規定辦理？","o":["導線應加以固定，並使其絕緣不致遭受割傷或磨損","導線通過金屬物體時，應有保護使其絕緣不致遭受磨損","燈具之燈串及其可移動或可撓部分之配線，應採用單線","在燈具支架或吊桿內，導線不得接續或分接"],"x":"依「用戶用電設備裝置規則」，燈具電源導線應固定，使絕緣不致割傷磨損；通過金屬物體時要有保護；燈具支架或吊桿內不得接續或分接。燈串及可移動、可撓部分的配線，應採用絞線而不是單線，因為單線反覆彎曲容易斷裂。"},{"c":10,"n":27,"a":[1,2,3],"q":"屋外照明採用多芯電纜配線，並以架空方式跨越者，其距離地面高度應符合下列哪些規定？","o":["電纜對地電壓150 伏特以下，跨越行人可到達之地面及人行道3 米以上","電纜對地電壓300 伏特以下，跨越住宅區及其車道，或卡車不得通行之商業區3.7 米以上","電纜對地電壓超過300 伏特，跨越住宅區及其車道，或卡車不得通行之商業區4.5 米以上","電纜跨越非住宅區巷道、道路、卡車停車區域、農地、牧場、森林或果園之車道，或有車輛通行之其他區域6 米以上"],"x":"依「用戶用電設備裝置規則」第172條，屋外照明多芯電纜架空跨越時：對地150伏以下跨越行人可到之地面及人行道3米以上；對地300伏以下跨越住宅區車道或卡車不得通行之商業區3.7米以上；超過300伏時為4.5米以上。跨越非住宅區巷道、道路等有車輛通行區域規定為5.5米以上，不是6米，所以不選。"},{"c":10,"n":28,"a":[1,2,3],"q":"有關螢光燈的動作原理，下列哪些正確？","o":["安定器的主要功能為限制燈管電流","起動器短路後，恢復開路的瞬間燈管開始點亮","弧光放電期間燈管電流會越來越高","點亮後燈管呈現高阻抗"],"x":"螢光燈中安定器的主要功能是限制燈管電流；起動器先短路預熱燈絲，恢復開路瞬間安定器產生高壓使燈管點亮；弧光放電具負電阻特性，電流會越來越高，所以需要安定器限流。點亮後燈管呈現低阻抗，不是高阻抗。"},{"c":10,"n":29,"a":[1,2,4],"q":"下列哪些為日光燈安定器之功能？","o":["產生日光燈起動時所需之高壓電","發光後抑制電流變化，保護燈管","在電極間並聯一電容，以抑制輝光放電之高諧波","發光後使啟動器中的電壓降低，不會再啟動"],"x":"日光燈安定器的功能：起動器開路瞬間產生起動所需的高壓；點亮後限制電流，保護燈管；點亮後安定器分擔電壓，使燈管（及並聯的啟動器）兩端電壓降低，啟動器不會再動作。電極間並聯電容抑制雜訊是啟動器內的電容，不是安定器的功能。"},{"c":10,"n":30,"a":[1,2,3],"q":"關於照明用語的單位，下列哪些正確？","o":["光通量：流明（lm）","光強度：燭光（cd）","照度：勒克斯（lx）","輝度：流明（lm）"],"x":"光通量單位流明（lm）、光強度單位燭光（cd）、照度單位勒克斯（lx），三者正確。輝度（亮度）的單位是燭光每平方米（cd/m²，也稱nit），不是流明。記法：輝度看的是「單位面積的光強度」。"},{"c":10,"n":31,"a":[1,2,3],"q":"照明燈具之配線在選用絕緣導線時，應考慮下列哪些因素？","o":["電壓","電流","溫度","體積"],"x":"選用照明燈具配線的絕緣導線，要考慮使用電壓（絕緣等級）、通過的電流（安培容量）以及燈具附近的溫度（絕緣耐熱等級）。導線本身的體積不是選用絕緣導線的考量因素。"},{"c":10,"n":32,"a":[1,2,3],"q":"開路電壓超過1000 伏特放電管燈系統二次側電路之裝設，下列哪些正確？","o":["配線應採用金屬導線管或金屬被覆電纜","導線應採用有絕緣者","導線應避免過分曲折，以免損傷導線之絕緣","以金屬導線管配裝單芯導線者，其長度不得超過8 米"],"x":"依「用戶用電設備裝置規則」第165條，開路電壓超過1000伏特放電管燈系統的二次側電路，配線應採用金屬導線管或金屬被覆電纜，導線應採用有絕緣者，並避免過分曲折以免損傷絕緣。以金屬導線管配裝單芯導線者，長度規定不得超過6米，不是8米，所以不選。"},{"c":10,"n":33,"a":[1,2,3],"q":"屋外照明之配線，下列哪些正確？","o":["應儘量避免與配電線路、電信線路跨越交叉","電桿、鐵塔、水泥壁等處所裝置者，應按導線管或電纜裝置法施工","在易受外力損傷之處所，以採用金屬導線管裝置法施工為原則","距離地面高度應保持2 米以上"],"x":"依「用戶用電設備裝置規則」，屋外照明配線應避免與配電、電信線路跨越交叉；在電桿、鐵塔、水泥壁等處所應按導線管或電纜裝置法施工；易受外力損傷處以金屬導線管施工為原則。距地面只要2米太低，規定在不妨礙交通處至少3米，所以不選。"},{"c":11,"n":1,"a":[1],"q":"三相220V、60Hz、6P、20HP 感應電動機，在額定電流及頻率下，滿載轉差率為5％，其滿載轉子速度為多少rpm？","o":["1140","1152","1164","1200"],"x":"先求同步轉速 Ns＝120f／P＝120×60／6＝1200 rpm。轉子轉速 Nr＝Ns×(1－S)＝1200×(1－0.05)＝1140 rpm。記住：轉子永遠比同步轉速慢一點，慢多少就看轉差率。"},{"c":11,"n":2,"a":[2],"q":"有一△接線之三相感應電動機，滿載運轉時線電流為40 安培，若以額定電壓起動，起動電流為滿載之6 倍，今改接為Y 接線，仍以額定電壓起動，起動電流為多少安培？","o":["40","80","120","240"],"x":"△接全壓起動電流＝40×6＝240 A。同電壓下改成Y接，每相繞組電壓降為1／√3，線電流變為△接的1／3，所以起動電流＝240×1／3＝80 A。口訣：Y接起動，電流、轉矩都剩三分之一。"},{"c":11,"n":3,"a":[1],"q":"感應電動機的轉子若停止不轉，其轉差率為","o":["1","-1","0","0.5"],"x":"轉差率 S＝(Ns－Nr)／Ns。轉子停止時 Nr＝0，代入得 S＝Ns／Ns＝1。所以 S＝1 代表轉子靜止（起動瞬間或堵轉），S＝0 才是同步轉速。"},{"c":11,"n":4,"a":[3],"q":"一般鼠籠型感應電動機之特性為","o":["低起動電流，高起動轉矩","低起動電流，低起動轉矩","高起動電流，低起動轉矩","高起動電流，高起動轉矩"],"x":"鼠籠式轉子電阻小、無法外加電阻，起動時轉子電流大但功率因數很低，所以起動電流可達額定的數倍，而起動轉矩卻不大。記法：鼠籠式「電流大、轉矩小」，要改善就得用降壓起動或改用繞線式。"},{"c":11,"n":5,"a":[3],"q":"三相感應電動機欲改變旋轉方向，可用下列何種方法？","o":["改變電壓大小","改變頻率大小","對調三條電源線之任意兩條","改變磁極大小"],"x":"旋轉磁場方向由三相相序決定，只要把三條電源線中任意兩條對調，相序反過來，旋轉磁場跟著反向，電動機就反轉。改電壓、頻率只影響轉矩或轉速，不會改變轉向。"},{"c":11,"n":6,"a":[4],"q":"有關三相感應電動機在定電壓時之敘述，下列何者不正確？","o":["S 為0 時機械輸出功率為零","S 為0 時電磁轉矩為零","S 為1 時機械輸出功率為零","S 為1 時電磁轉矩為零"],"x":"S＝0 表示轉子與磁場同速，轉子沒有感應電流，所以電磁轉矩與機械輸出皆為零。S＝1 表示轉子靜止，轉速為零故機械輸出為零，但此時仍有起動轉矩，並非零。因此「S為1時電磁轉矩為零」是錯的。"},{"c":11,"n":7,"a":[3],"q":"三相感應電動機採Y－△降壓起動開關，於起動時，下列何者錯誤？","o":["繞組為Y 接","繞組所加的電壓小於額定電壓","可提高起動轉矩","可降低起動電流"],"x":"Y－△起動時繞組先接成Y，每相電壓只有額定的1／√3，起動電流降為全壓△起動的1／3，但起動轉矩也同樣降為1／3。所以它是降低起動電流的方法，代價是轉矩變小，「可提高起動轉矩」是錯的。"},{"c":11,"n":8,"a":[3],"q":"單相110V、1HP 之電動機，其效率為0.65，功率因數為0.65，則其滿載電流約為多少安培？","o":["24","20","16","7"],"x":"輸出1 HP＝746 W。單相輸入功率＝輸出／效率，I＝P／(V×cosθ×η)＝746／(110×0.65×0.65)＝746／46.475≒16.05 A，約16 A。計算重點：效率與功率因數都要放在分母。"},{"c":11,"n":9,"a":[1],"q":"三相220V、60Hz 感應電動機，極數為4，測得轉速為1710rpm，則其轉差率為多少％？","o":["5","8","10","15"],"x":"4極、60Hz 的同步轉速 Ns＝120×60／4＝1800 rpm。轉差率 S＝(1800－1710)／1800＝90／1800＝0.05，即5％。"},{"c":11,"n":10,"a":[3],"q":"三相感應電動機若轉子達到同步速率時","o":["產生最大電流","產生最大轉矩","不能感應電勢","感應最大電勢"],"x":"感應電動機靠轉子導體切割旋轉磁場產生感應電勢。若轉子達到同步速率，兩者沒有相對運動，轉子不切割磁力線，就無法感應電勢，也就沒有電流與轉矩。這也是感應電動機永遠追不上同步轉速的原因。"},{"c":11,"n":11,"a":[1],"q":"一部6 極、60Hz 三相感應電動機，轉差率為4％，轉子銅損為80W，則電動機內部之電磁轉矩約為多少N-m？","o":["15.9","22.6","12.7","21.4"],"x":"氣隙功率 Pg＝轉子銅損／S＝80／0.04＝2000 W。同步角速度 ωs＝2π×Ns／60，Ns＝120×60／6＝1200 rpm，ωs＝2π×1200／60≒125.7 rad/s。電磁轉矩 T＝Pg／ωs＝2000／125.7≒15.9 N-m。"},{"c":11,"n":12,"a":[1],"q":"某1 馬力單相交流電動機，電源電壓為220V，若滿載電流為8A，功率因數為0.7 滯後，滿載效率約為多少％？","o":["60.5","75.4","84.6","94.4"],"x":"輸入功率 Pi＝V×I×cosθ＝220×8×0.7＝1232 W，輸出1 HP＝746 W。效率 η＝746／1232≒0.605，即約60.5％。"},{"c":11,"n":13,"a":[3],"q":"採用感應電動機之電風扇，欲增加其轉速時，可以用下列何種方法達成？","o":["增加磁極數","減小電源頻率","調高繞組電壓","增大轉子電阻"],"x":"電風扇用的小型感應電動機，調高繞組電壓可使轉矩增大、轉差率變小，轉速就上升，這就是電扇段速切換的原理。增加極數、降低頻率會使同步轉速下降，增大轉子電阻則使轉差率增大，都會讓轉速變慢。"},{"c":11,"n":14,"a":[2],"q":"三相220V、4P、20HP 感應電動機，滿載時轉速1760rpm，若此時負載減半，其轉速約為多少rpm？","o":["1800","1780","1760","1740"],"x":"同步轉速 Ns＝120×60／4＝1800 rpm，滿載轉差速度＝1800－1760＝40 rpm。在正常運轉範圍內轉差與負載約成正比，負載減半時轉差約剩20 rpm，轉速約為1800－20＝1780 rpm。"},{"c":11,"n":15,"a":[3],"q":"三相感應電動機運轉中，若電源線其中一條斷路時，電動機的情形為","o":["繼續原速運轉","速度變快且發出噪音","負載電流增大","立即停止"],"x":"運轉中斷一條電源線即成單相運轉，電動機通常仍會繼續轉，但剩下兩線要負擔原來的負載，電流明顯增大，轉速略降並發熱，時間久了繞組會燒毀。這就是為什麼需要欠相保護。"},{"c":11,"n":16,"a":[2],"q":"三相感應電動機使用動力計作負載實驗時，若電動機之電源保持在定電壓及定頻率下，當所加負載變大時，其轉差率","o":["變小","變大","不變","不一定"],"x":"負載加大時，電動機需要更大轉矩，轉子必須轉得慢一點，以增加切割磁場的相對速度、感應出更大的轉子電流。轉速下降即轉差率變大。記法：負載越重，轉差越大。"},{"c":11,"n":17,"a":[3],"q":"必須用分相法產生旋轉磁場以起動之電動機為","o":["三相感應電動機","同步電動機","單相感應電動機","伺服電動機"],"x":"單相繞組只產生交變的脈動磁場，本身沒有旋轉磁場，無法自行起動，必須加一組起動繞組（配合電阻或電容）做分相，產生近似旋轉磁場才能起動。三相電源本身就能產生旋轉磁場，不需分相。"},{"c":11,"n":18,"a":[3],"q":"感應電動機的轉矩與電源電壓","o":["成正比","成反比","平方成正比","平方成反比"],"x":"感應電動機的轉矩與電源電壓的平方成正比（T∝V²）。例如電壓降為原來的0.9倍，轉矩只剩約0.81倍，所以電壓不足時電動機很容易起動困難或過載。"},{"c":11,"n":19,"a":[4],"q":"永久電容式單相感應電動機的故障為「無法起動，但用手轉動轉軸時，便可使其起動」，下列何者最不可能故障之原因？","o":["起動繞阻斷線","行駛繞組斷線","電容器損壞","離心開關之接線脫落"],"x":"永久電容式電動機的電容器與起動繞組一直接在電路中，構造上根本沒有離心開關，所以「離心開關接線脫落」最不可能是原因。起動繞組斷線、電容器損壞都會失去分相作用，出現推一下才會轉的情形。"},{"c":11,"n":20,"a":[1],"q":"三相感應電動機的無載試驗可以得知感應電動機之","o":["無載電流及相角","銅損","堵住時之定子電流及其相角","極數"],"x":"無載試驗是讓電動機在額定電壓下空轉，量測無載電流、輸入功率，可求得無載電流與功率因數角，並推算鐵損加機械損（旋轉損）與激磁參數。銅損與堵住時的定子電流則要靠堵住試驗求得。"},{"c":11,"n":21,"a":[2],"q":"六極60Hz 三相感應電動機，滿載時之轉差率為5％，則其轉差速率為多少rpm？","o":["36","60","18","1200"],"x":"同步轉速 Ns＝120×60／6＝1200 rpm。轉差速率＝S×Ns＝0.05×1200＝60 rpm，也就是同步轉速和轉子轉速相差60 rpm。"},{"c":11,"n":22,"a":[4],"q":"一部6P、60Hz、5HP 之三相感應電動機，已知其滿載轉子銅損為120W，無載旋轉損為150W，試問該電動機在滿載時，其轉子的速度約為多少rpm？","o":["1193","1182","1178","1164"],"x":"輸出5 HP＝5×746＝3730 W，內部機械功率 Pm＝3730＋150＝3880 W。氣隙功率 Pg＝Pm＋轉子銅損＝3880＋120＝4000 W，S＝120／4000＝0.03。Ns＝120×60／6＝1200 rpm，Nr＝1200×(1－0.03)＝1164 rpm。"},{"c":11,"n":23,"a":[3],"q":"一部6 極三相感應電動機以變頻器驅動，當轉速為280rpm，其轉差率為4％，變頻器輸出頻率約為多少Hz？","o":["11.6","12.3","14.6","18.7"],"x":"先由轉速回推同步轉速：Ns＝Nr／(1－S)＝280／0.96≒291.7 rpm。再由 Ns＝120f／P 得 f＝Ns×P／120＝291.7×6／120≒14.6 Hz。"},{"c":11,"n":24,"a":[3],"q":"下列對單相感應電動機之敘述何者正確？","o":["雙值電容式電動機常用於需變速低功因之場合","雙值電容式電動機之永久電容器容量較起動電容器大","蔽極電動機中蔽極部分之磁通較主磁通滯後","蔽極電動機起動轉矩比電容起動式電動機大"],"x":"蔽極電動機的蔽極線圈感應電流會阻礙磁通變化，使蔽極部分的磁通落後於主磁通，形成由未蔽極往蔽極方向移動的磁場而起動。其他敘述錯在：雙值電容式用於需高功因場合、運轉電容比起動電容小、蔽極式起動轉矩很小。"},{"c":11,"n":25,"a":[4],"q":"下列何項試驗可求得三相感應電動機之全部銅損？","o":["電阻測定","溫度試驗","無載試驗","堵住試驗"],"x":"堵住試驗是將轉子卡住，加低電壓使定子流入額定電流。此時電壓很低、鐵損可忽略，瓦特計讀值幾乎全為定子與轉子的銅損，因此可求得全部銅損。無載試驗則用來求鐵損與機械損。"},{"c":11,"n":26,"a":[2],"q":"蔽極式單相感應電動機的蔽極線圈之作用是","o":["減少起動電流","幫助起動","提高功率因數","提高效率"],"x":"蔽極線圈是套在部分磁極上的短路銅環，感應電流使該部分磁通落後，形成移動磁場，讓轉子產生起動轉矩。它的作用就是幫助起動，反而會造成損失，使效率與功率因數偏低。"},{"c":11,"n":27,"a":[3],"q":"單相感應電動機輕載時，雖接上電源而不能起動，若以手轉動轉子，可轉動並正常運動，其原因為","o":["主線圈燒燬","主線圈短路","起動線圈開路","轉軸彎曲並卡住"],"x":"單相電動機只靠主線圈只會產生脈動磁場，沒有起動轉矩，但一旦被推動就能沿著該方向繼續運轉。所以「通電不會轉、用手推一下就正常」，典型原因就是起動線圈開路（或離心開關、電容器故障）。主線圈燒燬則推了也不會轉。"},{"c":11,"n":28,"a":[4],"q":"下列何種單相感應電動機之起動和運轉特性最佳？","o":["分相式","電容起動式","永久電容分相式","起動和運轉雙值電容式"],"x":"雙值電容式起動時用大容量起動電容取得大起動轉矩，運轉時切換成小容量運轉電容，維持高功率因數與高效率，兼顧起動和運轉特性，所以最佳。分相式、電容起動式只顧起動，永久電容式則起動轉矩較小。"},{"c":11,"n":29,"a":[3],"q":"三相感應電動機全壓起動時起動電流為200 安培，若經自耦變壓器50％抽頭降壓起動，則線路之起動電流為多少安培？","o":["100","75","50","40"],"x":"自耦變壓器降壓起動時，電動機端電壓與電流都降為抽頭比倍，線路電流再乘一次抽頭比，所以線路起動電流為全壓起動的抽頭比平方倍：200×0.5²＝200×0.25＝50 A。起動轉矩也同樣降為0.25倍。"},{"c":11,"n":30,"a":[1],"q":"一部三相220V、7.5HP、cosθ為0.82、效率為0.86 之感應電動機，其滿載電流約為多少安培？","o":["21","30","40","50"],"x":"輸出 P＝7.5×746＝5595 W。三相電流 I＝P／(√3×V×cosθ×η)＝5595／(1.732×220×0.82×0.86)＝5595／268.7≒20.8 A，約21 A。"},{"c":11,"n":31,"a":[3],"q":"三相感應電動機，端子電壓220V 電流27A，功率因數85％，效率86％，此電動機之輸出約為多少kW？","o":["15","11","7.5","5.5"],"x":"三相輸出 P＝√3×V×I×cosθ×η＝1.732×220×27×0.85×0.86。先算 1.732×220≒381，×27≒10288，×0.85≒8745，×0.86≒7521 W，約7.5 kW。"},{"c":11,"n":32,"a":[4],"q":"繞線轉子型感應電動機之轉部電路電阻變為2 倍，最大轉矩將變為原來的幾倍？","o":["1/4","1/2","2","1"],"x":"感應電動機的最大轉矩大小與轉子電阻無關，轉子電阻只會改變發生最大轉矩時的轉差率。所以轉子電阻變為2倍，最大轉矩仍是原來的1倍，只是最大轉矩出現的位置往低轉速移動。"},{"c":11,"n":33,"a":[2],"q":"60Hz 的三相感應電動機使用於50Hz 同一電壓的電源時，下列何者錯誤？","o":["溫度增大","無載電流減小","轉速降低","最大轉矩將增大"],"x":"60Hz 電動機用在50Hz 同電壓下，磁通與 V／f 成正比會增加約1.2倍，激磁電流增加，所以無載電流是變大不是減小。同時同步轉速降低、鐵損與電流增加使溫度上升，最大轉矩約與(V／f)²成正比而增大。"},{"c":11,"n":34,"a":[4],"q":"三相感應電動機同步轉速為Ns，轉子轉速為Nr，其轉差率S 為何？","o":["(Ns +Nr)/ Nr","(Nr- Ns)/ Nr","Ns /(Ns-Nr)","(Ns-Nr)/ Ns"],"x":"轉差率定義為同步轉速與轉子轉速之差除以同步轉速，S＝(Ns－Nr)／Ns。分母一定是同步轉速 Ns，分子是兩者的差。"},{"c":11,"n":35,"a":[3],"q":"要使感應電動機變成感應發電機，須使其轉差率","o":["大於1","大於2","小於0","介於1 至0 之間"],"x":"S＝(Ns－Nr)／Ns，當轉子被外力帶動轉得比同步轉速快（Nr＞Ns）時，S 變成負值，電動機反過來把機械能送回電源，成為感應發電機。0＜S＜1 是電動機，S＞1 是逆轉制動。"},{"c":11,"n":36,"a":[3],"q":"三相電動機之銘牌標明額定功率為5.5kW 時，該電動機輸出約為多少HP？","o":["3","5","7.5","10"],"x":"1 HP 約為0.746 kW，所以5.5 kW÷0.746≒7.37 HP，對應標準規格即7.5 HP。常見對照：3.7 kW 約5 HP，5.5 kW 約7.5 HP，7.5 kW 約10 HP。"},{"c":11,"n":37,"a":[2],"q":"一般用感應電動機之起動電流","o":["等於滿載電流","數倍於滿載電流","小於滿載電流","等於無載電流"],"x":"起動瞬間轉子靜止（S＝1），轉子感應電勢最大，阻抗又小，所以一般感應電動機的起動電流約為滿載電流的數倍（常見5～7倍）。因此大容量電動機常需降壓起動。"},{"c":11,"n":38,"a":[4],"q":"數具額定容量不超過一馬力之電動機，每具電動機之滿載電流不大於多少安培者，得連接於同一標稱電壓150 伏特以下，額定不大於20 安培之分路，或標稱電壓600 伏特以下，額定不大於15 安培之分路？","o":["1","2","3","6"],"x":"依用戶用電設備裝置規則，數具額定不超過1馬力的小型電動機，每具滿載電流不大於6安培者，得共同接在標稱電壓150伏以下、額定不大於20安培的分路，或600伏以下、額定不大於15安培的分路。記法：小馬達1馬力、6安培。"},{"c":11,"n":39,"a":[2],"q":"連續責務之單具電動機分路之導線安培容量，不得小於電動機滿載電流之多少倍？","o":["1.15","1.25","1.35","1.5"],"x":"依用戶用電設備裝置規則，連續責務的單具電動機分路，導線安培容量不得小於電動機滿載電流的1.25倍。這個1.25倍在電動機題中非常常考，幹線計算也用最大一台乘1.25。"},{"c":11,"n":40,"a":[2],"q":"額定容量2 馬力以下且300 伏特以下固定式電動機之操作器，得為安培額定不小於電動機滿載電流多少倍之一般型開關？","o":["1","2","3","4"],"x":"依用戶用電設備裝置規則，額定2馬力以下、300伏以下的固定式電動機，其操作器可使用一般型開關，但開關的安培額定不得小於電動機滿載電流的2倍。小馬達用普通開關，容量要給到2倍。"},{"c":11,"n":41,"a":[1],"q":"電動機幹線之過電流保護裝置，供電給固定式電動機，且符合導線安培容量之幹線應有過電流保護裝置，其安培額定不得大於任一電動機分路過電流保護裝置之最大安培額定，加上群組中下列何者？","o":["其他電動機滿載電流之總和","其他電動機滿載電流之總和的1.15 倍","其他電動機滿載電流之總和的1.25 倍","其他電動機滿載電流之總和的1.5 倍"],"x":"依用戶用電設備裝置規則，電動機幹線過電流保護裝置的額定，不得大於群組中最大一具電動機分路過電流保護裝置的額定，加上其他電動機滿載電流的總和。注意其他電動機是直接加滿載電流，不再乘倍數。"},{"c":11,"n":42,"a":[1],"q":"一部10HP 之三相同步電動機，原接於50Hz 電源，當改接於60Hz 電源時，其轉速","o":["增加20％","減少20％","不變","無法轉動"],"x":"同步電動機轉速等於同步轉速 Ns＝120f／P，與頻率成正比。由50Hz 改為60Hz，轉速變為60／50＝1.2倍，也就是增加20％。"},{"c":11,"n":43,"a":[3],"q":"鼠籠式感應電動機之優點為","o":["起動轉距大，起動電流小","改善功率因數，轉速容易變更","便宜，耐用","起動電流小，起動容易"],"x":"鼠籠式感應電動機轉子只有導條與端環，沒有滑環、電刷，構造簡單堅固，所以便宜、耐用、維護容易。缺點是起動電流大、起動轉矩小，且不易調速。"},{"c":11,"n":44,"a":[2],"q":"單相蔽極式感應電動機係靠下列何種原理來旋轉？","o":["旋轉磁場","移動磁場","排斥作用","吸引作用"],"x":"蔽極式電動機靠蔽極線圈使部分磁極的磁通落後，磁場由未蔽極部分往蔽極部分移動，形成移動磁場帶動轉子旋轉，並非真正的旋轉磁場。所以轉向固定由未蔽極往蔽極方向。"},{"c":11,"n":45,"a":[1],"q":"繞線轉子型感應電動機，若轉部開路時，其轉速","o":["接近於零","增加","降低","無關"],"x":"繞線轉子型感應電動機的轉子電流經滑環流過外部電路。若轉部開路，轉子無法形成電流，就不會產生轉矩，電動機轉不起來，轉速接近於零。"},{"c":11,"n":46,"a":[3],"q":"三相感應電動機若轉子達到同步速率時，將","o":["產生最大轉矩","產生最大電流","無法感應電勢","感應最大電勢"],"x":"感應電動機靠轉子與旋轉磁場的相對運動感應電勢。轉子若達同步速率，兩者相對靜止，轉子導體不切割磁力線，無法感應電勢，也就沒有轉子電流和轉矩，因此實際上只會接近而不會達到同步。"},{"c":11,"n":47,"a":[3],"q":"額定為220V、10HP、50Hz 之感應電動機，使用於220V、60Hz 電源時，若負載及轉差率皆不變，轉速為原轉速之多少倍？","o":["0.833","1","1.2","1.414"],"x":"轉速 N＝120f(1－S)／P，極數與轉差率不變時，轉速與頻率成正比。由50Hz 改接60Hz，轉速為60／50＝1.2倍。"},{"c":11,"n":48,"a":[1],"q":"10HP 之電磁接觸器，其10HP 一般指下列何者之容量？","o":["主接點","輔助接點","線圈","鐵心"],"x":"電磁接觸器標示的馬力或電流容量，是指主接點能開閉的負載容量，也就是能控制多大的電動機。輔助接點只用於控制電路，線圈則以電壓規格標示。"},{"c":11,"n":49,"a":[2],"q":"三相感應電動機各相繞組間之相位差為多少電工角度？","o":["90","120","150","180"],"x":"三相感應電動機三組繞組在空間上相隔120度電工角，通入相差120度的三相電流，才能合成大小固定的旋轉磁場。記法：三相平分360度，每相120度。"},{"c":11,"n":50,"a":[2],"q":"以11kV 級高壓供電用戶之高壓電動機，每具容量不超過多少馬力，不限制其起動電流？","o":["200","400","600","800"],"x":"依電動機起動電流限制的規定，高壓電動機不限制起動電流的容量，隨供電電壓等級而定：3kV 級每具200馬力、11kV 級400馬力、22kV 級600馬力。11kV 級對應400馬力。記法：3、11、22kV 對應200、400、600馬力。"},{"c":11,"n":51,"a":[4],"q":"高壓用戶之低壓電動機，每具容量不超過多少馬力者，起動電流不加限制？","o":["15","50","150","200"],"x":"依電動機起動電流限制的規定，高壓供電用戶的低壓電動機，每具容量不超過200馬力者，起動電流不加限制。因高壓用戶自備變壓器，對系統影響較小，所以放寬到200馬力。"},{"c":11,"n":52,"a":[3],"q":"連續責務電動機容量多少馬力以上，位於存在危險物質、可燃性粉塵或飛絮之場所者，應有低電壓保護？","o":["7.5","10","15","50"],"x":"依用戶用電設備裝置規則，位於存在危險物質、可燃性粉塵或飛絮場所的連續責務電動機，容量15馬力以上者應有低電壓保護，避免電壓恢復時電動機突然再起動而發生危險。"},{"c":11,"n":53,"a":[2],"q":"單相四極分相式感應電動機，其行駛繞組與起動繞組置於定部槽內時，應相間隔多少機械角度？","o":["30","45","60","90"],"x":"單相分相式電動機的起動繞組與行駛繞組應相隔90度電工角。機械角＝電工角÷極對數，四極有2對極，所以90÷2＝45度機械角。公式：電工角＝機械角×P／2。"},{"c":11,"n":54,"a":[2],"q":"三相220V△接線之感應電動機，如接到三相380V 之電源時，應改為下列何種接線？","o":["V","Y","雙△","雙Y"],"x":"原本220V△接，每相繞組承受220V。改接380V電源時改成Y接，每相電壓為380／√3≒220V，與原來相同，電動機就能正常運轉。這就是常見220／380V雙電壓電動機的接法。"},{"c":11,"n":55,"a":[3],"q":"以22kV 級高壓供電用戶之高壓電動機，每具容量不超過多少馬力時，不限制起動電流？","o":["200","400","600","800"],"x":"依電動機起動電流限制的規定，高壓電動機不限制起動電流的容量為：3kV 級200馬力、11kV 級400馬力、22kV 級600馬力。題目為22kV 級，所以是600馬力。"},{"c":11,"n":56,"a":[1],"q":"三相交流繞線轉子型感應電動機於轉子電路附加二次電阻起動之目的是","o":["增加起動轉矩，減少起動電流","增加起動電流，減少起動轉矩","增加起動電流，增加起動轉矩","減少起動電流，減少起動轉矩"],"x":"繞線轉子型在轉子電路串入外加電阻，可提高轉子電路的功率因數，使起動轉矩增加，同時轉子阻抗變大使起動電流減少，一舉兩得。起動完成後再逐段把電阻短路以免增加損失。"},{"c":11,"n":57,"a":[3],"q":"三相感應電動機之起動轉矩與下列何者成正比？","o":["電流","定子繞組電阻","外加電壓平方","功率因數"],"x":"感應電動機的轉矩與外加電壓平方成正比，起動轉矩也一樣。所以降壓起動時，電壓降為多少倍，起動轉矩就降為該倍數的平方，例如Y－△起動電壓1／√3，轉矩剩1／3。"},{"c":11,"n":58,"a":[3],"q":"工廠內裝有交流低壓感應電動機共5 台，並接在同一幹線，其中最大容量的1 台額定電流40 安培，其餘4 台額定電流合計為60 安培，該幹線之安培容量應為多少安培？","o":["90","100","110","150"],"x":"幹線安培容量＝最大一台滿載電流×1.25＋其餘電動機滿載電流總和＝40×1.25＋60＝50＋60＝110 A。只有最大那台要乘1.25，其餘直接相加。"},{"c":11,"n":59,"a":[2],"q":"一部三相四極60Hz 感應電動機，其轉子轉速為1728rpm，該電動機的轉差率多少％？","o":["3","4","5","6"],"x":"4極、60Hz 同步轉速 Ns＝120×60／4＝1800 rpm。轉差率 S＝(1800－1728)／1800＝72／1800＝0.04，即4％。"},{"c":11,"n":60,"a":[2],"q":"若三相電源之三接線端為R、S、T，而三相感應電動機之三接線端為U、V、W，當電動機正轉時，接法為R-U、S-V、T-W，則下列何種接法可使電動機仍保持正轉？","o":["R-V、S-U、T-W","R-V、S-W、T-U","R-W、S-V、T-U","R-U、S-W、T-V"],"x":"原接法 U、V、W 依序接 R、S、T。R-V、S-W、T-U 時，U、V、W 依序接到 T、R、S，相序 T→R→S 只是 R→S→T 的循環平移，相序不變，所以仍正轉。若只對調其中兩條，例如 R-V、S-U 或 S-W、T-V，相序反轉就會反轉。"},{"c":11,"n":61,"a":[4],"q":"三相感應電動機定子繞組為△接線時，測得任意兩線間的電阻為0.4Ω，若將其改接為Y 連接時，任意兩線間的電阻應為多少Ω？","o":["9","4","1.5","1.2"],"x":"△接時兩線間的電阻是一相繞組R與另兩相串聯2R並聯，R×2R／3R＝2R／3＝0.4Ω，得每相 R＝0.6Ω。改為Y接後兩線間是兩相繞組串聯，2R＝2×0.6＝1.2Ω。"},{"c":11,"n":62,"a":[2],"q":"某工廠有一般用電動機3ψ220V、3HP（8.6A）、5HP（14A）及15HP（40A）各一台之配電系統，採用PVC 管配線，若各電動機不同時起動時，幹線過電流保護器額定值最小應選擇多少A？","o":["75","100","125","150"],"x":"依第223條，幹線過電流保護額定不得大於表二二○所定最大一具電動機分路保護最大額定，加上其他電動機滿載電流之和。15HP滿載40A，反時限斷路器取250%得100A，上限＝100＋14＋8.6＝122.6A。標準額定125A已超過，只能取100A。註：題目寫「最小」，實際是依上限選取；若用延時性熔線175%，結果會不同。"},{"c":11,"n":63,"a":[3],"q":"某工廠有一般用電動機3ψ220V、3HP（8.6A）、5HP（14A）及15HP（40A）各一台 01"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACUAAAAgBAMAAABnfayDAAAAGFBMVEX///+pqamMjIxnZ2dNTU04ODgYGBgCAgL4PVeoAAAA1ElEQVR42rWPPQrCQBhEX2JS2GhEOxGCEmxULATBwkYPkEt4ACsv4WE8gGBqi+AF1HRWkoWU/qyF7pIlVoJTDY/9Zmbhd1na1X0AGYOj2TQCkOSZTJWzdUhCkYlimUvxnfzCqmC331b3tq72wnusjbyQwHNWvnEruIn7Zpi/tQQJnMvFKa7ZC0DTYBIgmBlsAFi1xlCxEVAB5P6g2DwLVd7O+7DtqaPYQ+fdMpxILVfqhp/prqd7j20LmPv0BEAJ4Nl/XqAx8Xe5/eNl/jfvzXHKH/UC8UUsPk97ic4AAAAASUVORK5CYII=",17,14],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABUAAAA2BAMAAADaAc89AAAAGFBMVEX///+dnZ1/f39zc3NwcHBYWFhEREQeHh4iLv7JAAAAg0lEQVR42rWQOwqDQBRFz4yfKoWEgIuwCW5CSJXsIVmlS1HBFchgYSHESeW8l1aZWx0e73cvnFTyBsAC2KvwhrBXTGS2ir89sWTA1ACD+/shhhKA22NxIdv5GTxObSq2vY5gVSsKqTeKx5dwl4db+Msgs6Xaue1soNo5u+NC96c45PEHycUV87OtNVIAAAAASUVORK5CYII=",9,24],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAA7BAMAAADhrjXlAAAAGFBMVEX///+pqamioqKRkZGAgIBiYmJDQ0McHBwl0HgdAAAA3UlEQVR42tWSsQ4BQRCGv3NWJBQrXgA1cpqrJRK9xINo8DLeQOEJJGqVRqK860QkLkphT+H27FmdSJhq9stk9p+ZH74ark76tyjJchrVJa8owkL8N7JmFKrKL4UDjjTecfRRryR8D1AzyKfzl+ZAjIni0+u+3vzu2ltt26jyDonpyD7N1DqaCqSJ8jJ1Ys7s+XBw5trHTJWKQMgMagIdP0Vi/HDEOvQ0GjjgASxqetptubUrBoAr9rrXspZIeopQQmxA0g6e6NwAhr2rIWLVBcLKxpBdmFhevRy+5K87QmIuaEZ3PaIAAAAASUVORK5CYII=",16,27]],"x":"端電壓固定，△接時每相繞組承受線電壓V；改接Y後每相電壓只剩 V／√3。轉矩與每相電壓平方成正比，最大轉矩變為(1／√3)²＝1／3倍。不是√3分之一，也不是√3或3倍，記得電壓要再平方。"},{"c":11,"n":69,"a":[3],"q":"三相感應電動機採用Y－△降壓起動開關起動的目的為","o":["增加起動轉矩","增加起動電流","減少起動電流","減少起動時間"],"x":"Y－△起動時先以Y接起動，每相電壓降為1／√3，起動電流降為全壓△起動的1／3，目的就是減少起動電流，避免電壓驟降影響其他設備。代價是起動轉矩也降為1／3，起動時間反而可能變長。"},{"c":11,"n":70,"a":[3],"q":"三相感應電動機作堵轉試驗可求得","o":["鐵損與銅損","鐵損與激磁電流","銅損與漏磁電抗","鐵損與漏磁電抗"],"x":"堵轉試驗將轉子卡住，外加低電壓使電流達額定值。此時鐵損可忽略，輸入功率主要是銅損，再由電壓、電流與功率可算出等效電阻與漏磁電抗。鐵損與激磁電流則由無載試驗求得。"},{"c":11,"n":71,"a":[4],"q":"三相感應電動機之無載試驗中，以兩瓦特計測量功率時，會造成瓦特計反轉的原因，乃是由於","o":["電流小","電壓低","功率因數高於0.5","功率因數低於0.5"],"x":"兩瓦特計法中，功率因數高於0.5時兩表都是正讀；功率因數低於0.5（相角大於60度）時，其中一具瓦特計會反轉成負值。無載時電動機功率因數很低，通常低於0.5，所以會反轉，須將該表電流線圈或電壓線圈反接再讀並取負值。"},{"c":11,"n":72,"a":[4],"q":"電動機操作器負載側個別裝設電容器者，其容量以能提高該電動機之無負載功率因數達百分之多少為最大值？","o":["85","90","95","100"],"x":"依用戶用電設備裝置規則，電容器個別裝在電動機操作器負載側時，其容量以能將該電動機無負載功率因數提高到100％為最大值，不可再大，否則會過度補償，切離電源時也可能造成自激過電壓。"},{"c":11,"n":73,"a":[3],"q":"三相四極220 伏特5 馬力之鼠籠式感應電動機，其額定電流為多少安培？","o":["25","20","14","10"],"x":"5 HP＝3730 W，三相220V 中小型電動機效率、功率因數約各0.85左右，I≒3730／(1.732×220×0.85×0.85)≒13.6 A，約14 A。也可記經驗值：220V 三相每馬力約2.8～3 A。"},{"c":11,"n":74,"a":[1],"q":"以3kV 級高壓供電用戶之高壓電動機，每具容量不超過多少馬力時，不限制起動電流？","o":["200","400","600","800"],"x":"依電動機起動電流限制的規定，高壓電動機不限制起動電流的容量為：3kV 級每具200馬力、11kV 級400馬力、22kV 級600馬力。題目是3kV 級，所以為200馬力。"},{"c":11,"n":75,"a":[4],"q":"能將電能轉換為機械能之電工機械稱為","o":["變壓器","變頻器","發電機","電動機"],"x":"電動機的功能是把電能轉換成機械能。發電機剛好相反，是機械能轉電能；變壓器只改變交流電壓大小；變頻器則是改變電源頻率以控制電動機轉速。"},{"c":11,"n":76,"a":[4],"q":"相同容量下，若以高效率、體積小、保養容易等因素為主要考量時，下列電動機何者最適宜？","o":["直流無刷電動機","直流串激電動機","直流分激電動機","感應電動機"],"x":"感應電動機（尤其鼠籠式）沒有換向器與電刷，構造簡單堅固、保養容易，相同容量下體積比直流機小，效率也高，是一般動力最常用的電動機，考試選感應電動機。直流串激、分激機有電刷與換向器，需定期維護。註：現代直流無刷馬達效率與體積更優，但需搭配驅動器，本題依傳統教材觀點作答。"},{"c":11,"n":77,"a":[4],"q":"有一台抽水馬達輸入功率為500 瓦特，若其效率為80%，其損失為多少瓦特？","o":["400","300","200","100"],"x":"輸出＝輸入×效率＝500×0.8＝400 W，損失＝輸入－輸出＝500－400＝100 W。也可直接算：500×(1－0.8)＝100 W。"},{"c":11,"n":78,"a":[1],"q":"有關單相電容起動式感應電動機之電容器，下列何者正確？","o":["電容器串接於起動繞組","電容器串接於運轉繞組","電容器並接於起動繞組","電容器並接於運轉繞組"],"x":"電容起動式是把起動電容器串接在起動繞組上，使起動繞組電流超前主繞組約90度，產生旋轉磁場。轉速達約75％額定時，再由離心開關把電容器與起動繞組一起切離。"},{"c":11,"n":79,"a":[4],"q":"三相感應電動機在運轉時，若在電源側並接電力電容器，其主要目的為何？","o":["降低電動機轉軸之轉速","增加起動電阻","減少電動機電磁轉矩","改善電源側之功率因數"],"x":"感應電動機是電感性負載，功率因數偏低。在電源側並接電力電容器，可提供電動機所需的無效功率，使電源側功率因數提高、線路電流與損失減少。電容器不會改變電動機轉速或轉矩。"},{"c":11,"n":80,"a":[1],"q":"關於三相感應電動機之定子與轉子分別所產生之旋轉磁場，下列何者正確？","o":["兩者同步","兩者不同步，會隨電源頻率而變","兩者不同步，會隨負載而變","兩者不同步，會隨起動方式而變"],"x":"定子旋轉磁場以同步轉速旋轉；轉子電流頻率為 S×f，其磁場相對轉子轉速為 S×Ns，加上轉子本身轉速(1－S)Ns，合計對定子而言也是 Ns。所以兩個旋轉磁場同步，才能產生穩定轉矩。"},{"c":11,"n":81,"a":[1],"q":"三相感應電動機無載運轉時，如欲增加其轉速，可選用下列何種方法？","o":["增加電源頻率","減少電源頻率","減少電源電壓","增加電動機極數"],"x":"感應電動機轉速約接近同步轉速 Ns＝120f／P。增加電源頻率可提高同步轉速，轉速隨之增加，這也是變頻器調速原理。減少頻率、增加極數會降速，降低電壓則轉矩下降、轉差變大，轉速反而變慢。"},{"c":11,"n":82,"a":[4],"q":"如要使單相電容式感應電動機之旋轉方向改變，可選用下列何種方法？","o":["調換電容器兩端的接線即可","運轉繞組兩端的接線相互對調，而且起動繞組兩端的接線也要相互對調","運轉繞組與起動繞組的接線不變，由電源線兩端接線相互對調","運轉繞組兩端的接線維持不變，起動繞組兩端的接線相互對調"],"x":"單相電容式電動機的轉向由主繞組與起動繞組電流的相位關係決定。只要運轉繞組不變、把起動繞組兩端對調（或反之），相位關係反過來就會反轉。兩組都對調等於沒換；對調電源兩端則兩組同時反向，轉向不變。"},{"c":11,"n":83,"a":[2],"q":"一台3ψ、220V、15HP、60Hz 感應電動機，若滿載電流為40A，以Y-Δ降壓起動，並於線電流線路上裝置一積熱電驛（TH-RY），若負載係數為1.15，積熱電驛（TH-RY）跳脫值應設於多少A？","o":["40","46","50","60"],"x":"積熱電驛裝在線電流線路上，就以電動機滿載線電流設定：跳脫值＝滿載電流×負載係數＝40×1.15＝46 A。"},{"c":11,"n":84,"a":[2],"q":"一台3ψ、220V、15HP、60Hz 感應電動機，若滿載電流為40A，以Y-Δ降壓起動，並於相電流線路上裝置一積熱電驛（TH-RY），若負載係數為1.15，積熱電驛（TH-RY）跳脫值應設於多少A？","o":["23","27","40","46"],"x":"Y－△起動運轉時繞組為△接，若積熱電驛裝在相電流線路上，相電流＝線電流／√3＝40／1.732≒23.1 A。跳脫值＝23.1×1.15≒26.6 A，約27 A。重點：裝在相電流側要先除以√3。"},{"c":11,"n":85,"a":[1,2],"q":"感應電動機負載增加時","o":["轉差率增大","運轉電流增大","轉矩減小","轉速增加"],"x":"負載增加時，電動機需要更大轉矩，轉速略降使轉差率增大，轉子感應電流變大，定子運轉電流也隨之增大。錯誤選項：轉矩會隨負載增加而增大，不是減小；轉速是下降，不是增加。"},{"c":11,"n":86,"a":[3,4],"q":"感應電動機之運轉公式\u00010\u0001中","o":["n 係指轉動轉速","f 係指轉動頻率","p 係指該機極數","rps 係指每秒鐘轉速"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAH0AAABYBAMAAAAqz+WTAAAAGFBMVEX///+ampp+fn5lZWVLS0syMjIdHR0GBga4ozkPAAAC+ElEQVR42u2YTWsTQRjHf7sbD+JLZzdRQbDdbopgQUxs9KAHmxrxqlbwG3j3Y4jfwIN30S+gpi8nRftiPAgF03axh4omm7EiFs3OemhS29RsdAdFpHPIZfLLM/N//s8zM4Hd8Y8Pw46ZtHriZmn4iN99tidfyNsj3WdTvXDrVHmtqMHbtXljgOTr9yCa0ODdKF7dXurbRrw8PfjsabH+ZT15fAfTExrrX6I+52vwAcGyjn6R1NO/Z3Xs8n+YN7R4R+jxHmlXp/72rq6urv/Dh0OX9Q+VzgUyOX/8Ks7w08S8Of56/uvRQwu/wP+0/xvvJ1jKu4njRwtAc+CZln8rv6R/Chiqpq4y48ev89jKtdqUdfJVSQQTQKbIh+lWfG9wvM8b6yTEtsZneiPeIKY3lDMLOTAu1v2Rdnyj8O3h4StACYD6SwBy2xtntvFAQfrCg7eX8hVS++9T3dy/OymrH12wbdu27dZxkdu+Iae25INT9dVUGpw6NDbzV5Uo6fqUN9RvCTv9o/SieVQFQE2DsjrzvwxI0frF1sgoieP94EMJEAIhQkZOp3/k3u3yFd9AtbbFE5ufkYTgkOvH3j+sgbsQNX4+KWSzcuPFVJx/CrX48nvM2Ss74t8EoHkPzNHnMbCE6PblU0J28HO0NSo0p3s594m7I/7cptvyE93LxeqTAEoK2W3/Q80u1WO5YKle9WcUG90Ok4uQD8EBs092y19KhCVgdmcKwk9ja6OPIJPzMwfavJRAY4t/lEynN2zdOdTkuKhWICieUU/a+lVDoP5+y7dmAdhaQOHUhv9qZbEI1MpCVX6/2++5tXv/0HpKib90/rbjlQ6+S5/ve5f4/WOOrVwXalkmvb/45zKfl/ft8ZPGj8z+O6ycSJy/yKhr5d9Qk1q8pXwt3gkAjfeTiMBwZXJegtlfScy7PmRV4vjGABj5eZL61zDSXubAI5K//9PZaEYmjx+WB+Pfn/G8vRgEOv7JRpr9z9bjozW9/rUere7+//Zfj+89lPAH3nZZogAAAABJRU5ErkJggg==",56,40]],"x":"公式 n＝2f／p（rps）中，p 為電動機極數，rps 為每秒轉數，乘60即為每分鐘轉數。錯誤在於：n 指的是旋轉磁場的同步轉速，不是轉子實際轉速；f 是電源頻率，不是轉動頻率。"},{"c":11,"n":87,"a":[2,3,4],"q":"繪製三相感應電動機之圓線圖，須藉下列哪些試驗之數據始可完成？","o":["極性試驗","無載試驗","堵住試驗","定部繞組電阻測定"],"x":"圓線圖需要無載試驗（無載電流、相角、鐵損）、堵住試驗（短路電流、相角、銅損）及定部繞組電阻測定（用以分開定子與轉子銅損），三者數據才能繪出。極性試驗是變壓器判斷極性用的，與圓線圖無關。"},{"c":11,"n":88,"a":[2,3,4],"q":"有關三相感應電動機之最大轉矩，下列哪些正確？","o":["與轉子電阻成反比","與定子電阻、電抗成反比","與轉子電抗成反比","與線路電壓平方成正比"],"x":"最大轉矩約與電壓平方成正比，並與定子電阻、定子電抗及轉子電抗成反比。轉子電阻只改變發生最大轉矩時的轉差率，不影響最大轉矩大小，所以「與轉子電阻成反比」是錯的。"},{"c":11,"n":89,"a":[1,3],"q":"繞線式感應電動機起動時，下列哪些是轉部加入起動電阻之目的？","o":["降低起動電流，增加起動轉矩","增加起動電流，增加起動轉距","提高起動時之功率因數","提高電動機之效率"],"x":"轉部串入起動電阻後，轉子阻抗增加使起動電流下降，同時轉子電路電阻比例變大，功率因數提高，因此起動轉矩反而增加。錯誤選項：起動電流是減少不是增加；外加電阻會增加損失，不能提高效率。"},{"c":11,"n":90,"a":[2,3],"q":"三相感應電動機以滿載來和無載運轉比較，則滿載","o":["轉差率小","功率因數高","效率高","轉速高"],"x":"滿載時有效功率比例大，功率因數高；輸出大而鐵損、機械損等固定損失比例變小，效率也較高。錯誤選項：滿載時轉速較低、轉差率較大，所以「轉差率小」與「轉速高」都是無載的特性。"},{"c":11,"n":91,"a":[1,2,3,4],"q":"感應電動機負載增加，則","o":["轉差率增加","轉速降低","轉矩增加","轉子銅損增加"],"x":"負載增加，電動機要產生更大轉矩來平衡，轉速下降、轉差率增加，轉子感應電流加大，轉子銅損（I²R）也隨之增加。四項敘述因果相連，全部正確。記法：負載重，轉速掉、轉差大、電流大、損失大。"},{"c":11,"n":92,"a":[1,2,3],"q":"設計為50Hz 之感應電動機，使用於60Hz 電源，下列哪些正確？","o":["同步轉速增加","容量略為增加","鐵損減少","阻抗減少"],"x":"50Hz 電動機用於60Hz：同步轉速隨頻率增加為1.2倍；轉速提高，在相同轉矩下輸出容量略增；磁通約降為5／6，鐵損減少。錯誤在阻抗：電抗 X＝2πfL 隨頻率升高而增加，所以阻抗是增加不是減少。"},{"c":11,"n":93,"a":[2,3,4],"q":"繞線式感應電動機，轉部電阻增加，下列哪些正確？","o":["轉速增加","起動電流降低","起動轉矩增加","轉差率增加"],"x":"轉部電阻增加，轉子阻抗變大使起動電流降低，同時轉子功因提高使起動轉矩增加；運轉時相同轉矩需更大轉差，轉差率增加。錯誤選項：轉差率增加代表轉速下降，所以「轉速增加」是錯的。"},{"c":11,"n":94,"a":[1,2,4],"q":"電動機Y-△起動時，下列哪些正確？","o":["Y 起動電流較小","Y 起動轉矩較小","△起動轉矩為Y 的1/3 倍","Y 起動電流為△起動的1/3 倍"],"x":"Y接起動時每相電壓為1／√3，起動電流與起動轉矩都降為△接全壓起動的1／3，所以Y起動電流較小、轉矩較小，Y起動電流為△的1／3倍。錯誤在於倍數講反了，應是△起動轉矩為Y的3倍。"},{"c":11,"n":95,"a":[2,3,4],"q":"有關轉差率S，下列哪些正確？","o":["S=1 表示起動狀態","S=0 表示同步狀態","S＞1 表示反轉制動","S＜1 表示運轉狀態"],"x":"轉差率S＝(Ns−N)/Ns。S＝0表示轉子與磁場同速（同步）；S＞1表示轉子反向旋轉，屬逆轉（插塞）制動；S＜1為電動機運轉狀態。題庫不選「S＝1表示起動狀態」，視S＝1只是轉子靜止的瞬間。註：多數教材寫「起動（靜止）時S＝1」，且運轉區嚴格應為0＜S＜1（S＜0為發電機），本題答案有爭議。","f":"爭議"},{"c":11,"n":96,"a":[1,2,4],"q":"下列哪些是單相感應電動機主繞組的特點？","o":["匝數多、線徑粗","電阻小、電感大","電阻大、電感小","通過電流較起動繞組滯後"],"x":"主繞組（運轉繞組）匝數多、線徑粗，所以電阻小、電感大，電流相位較起動繞組滯後，兩者形成相位差才能起動。錯誤選項「電阻大、電感小」是起動繞組的特點。記法：主繞組粗又多，起動繞組細又少。"},{"c":11,"n":97,"a":[1,3,4],"q":"下列哪些是單相感應電動機起動繞組的特點？","o":["導線繞於槽的外層","導線繞於槽的內槽","圈數少","電感小、電阻大"],"x":"起動繞組繞在槽的外層（靠近槽口），匝數少、線徑細，所以電感小、電阻大，電流相位較主繞組超前。錯誤選項：繞在槽內層（槽底）的是主繞組，因主繞組需要較大電感、先放入槽內。"},{"c":11,"n":98,"a":[1,2,3],"q":"下列有關蔽極式電動機之敘述哪些正確？","o":["採用移動磁場","起動轉矩小","構造簡單、價格廉","效率及功率因數高"],"x":"蔽極式靠蔽極線圈產生移動磁場起動，起動轉矩很小，構造簡單、價格便宜，常用於小風扇。錯誤選項：蔽極線圈本身有損失，所以效率和功率因數都很低，不是高。"},{"c":11,"n":99,"a":[2,4],"q":"有關單相電動機，下列哪些正確？","o":["蔽極式效率最佳","推斥式起動轉矩最大","電容起動式之起動電流最小","分相式之起動電流最大"],"x":"單相電動機中，推斥式利用電刷短路轉子，起動轉矩最大；分相式起動繞組電阻大、無電容輔助，起動電流最大。錯誤選項：蔽極式效率反而最差；電容起動式起動電流雖比分相式小，但不能說是各型中最小。"},{"c":11,"n":100,"a":[1,2,3],"q":"有起動線圈的單相電動機為","o":["分相式","永久電容式","電容起動式","推斥式"],"x":"分相式、永久電容式、電容起動式都有起動線圈（輔助繞組），靠與主線圈的電流相位差產生旋轉磁場。推斥式則是轉子經換向器與電刷短路，利用推斥作用起動，沒有起動線圈。"},{"c":11,"n":101,"a":[1,2],"q":"具有換向器與電刷之單相電動機為","o":["串激式","推斥式","電容式","蔽極式"],"x":"串激式（萬用電動機）與推斥式電動機的轉子都有換向器和電刷。電容式與蔽極式都是鼠籠轉子，沒有換向器和電刷，所以不需換碳刷、維護簡單。"},{"c":11,"n":102,"a":[1,2,3],"q":"下列哪些是交流單相串激電動機之特性？","o":["轉矩與電流平方成正比","高起動轉矩","重載時效率高","轉矩與電壓平方成正比"],"x":"單相串激電動機磁場與電樞串聯，磁通與電流成正比，轉矩約與電流平方成正比，所以起動轉矩高，重載時效率較佳，常用於電鑽、吸塵器。錯誤選項：轉矩與電壓平方成正比是感應電動機的特性，不適用於串激式。"},{"c":11,"n":103,"a":[1,2,4],"q":"電動機有載運轉時，下列哪些是保險絲燒斷之可能原因？","o":["欠相","短路","滿載使用過久","電壓降低"],"x":"欠相時其餘兩線電流大增；短路時電流暴增；電壓降低時為了維持負載轉矩電流也會變大，這三者都可能燒斷保險絲。錯誤選項：滿載是額定範圍內，保險絲依額定選用，滿載運轉再久也不應燒斷。"},{"c":11,"n":104,"a":[1,2,3],"q":"電動機繞組短路故障時，則有","o":["噪音發生","增加電流","溫度升高","速度變快"],"x":"繞組短路時，短路匝形成大環流，電流增加、溫度升高，磁場不平衡還會產生噪音與振動。錯誤選項：短路使有效磁場減弱、損失增加，轉速只會下降，不會變快。"},{"c":11,"n":105,"a":[2,4],"q":"三相感應電動機在輕載運轉中，若有一相電源線斷路，則該電動機會有下列哪些情形？","o":["立即停止","負載電流變大","負載電流變小","繼續轉動"],"x":"輕載運轉中斷一相，形成單相運轉，轉子已在轉動，所以電動機仍會繼續轉動；但負載由剩下兩線負擔，負載電流變大。錯誤選項：不會立即停止，電流也不會變小，長時間運轉恐燒毀繞組。"},{"c":11,"n":106,"a":[1,2,3],"q":"電動機無載起動後、加負載時，下列哪些是產生轉速降低或停止的可能原因？","o":["漏電","配電容量不足或電壓降過大","線圈發生不完全之層間短路","定子或轉子繞組斷線"],"x":"漏電、配電容量不足或電壓降過大、線圈不完全層間短路，都會使電動機輸出轉矩不足，無載尚能起動，一加負載就轉速下降甚至停止。錯誤選項：定子或轉子繞組斷線通常無載時就無法起動或明顯異常，不符題目情境。"},{"c":11,"n":107,"a":[3,4],"q":"感應電動機之功率因數很差，下列哪些是可能的原因？","o":["軸承不良","通風不良","氣隙大小不均勻","磁路容易飽和"],"x":"氣隙不均勻或過大會使磁阻增加，磁路容易飽和則激磁電流大增，兩者都使所需無效電流增加，功率因數變差。錯誤選項：軸承不良造成噪音、振動，通風不良造成溫升，都不是功率因數差的主因。"},{"c":11,"n":108,"a":[2,3,4],"q":"感應電動機之電氣制動有下列哪些方式？","o":["電磁制動","再生制動","逆向電壓動力制動","單相制動"],"x":"電氣制動是利用電動機本身的電磁作用產生制動轉矩，包括再生制動（回送電能）、逆向電壓動力制動（逆相或直流制動）以及單相制動。錯誤選項：電磁制動是以電磁鐵帶動煞車片摩擦的機械式制動，不屬電氣制動。"},{"c":11,"n":109,"a":[1,2,3],"q":"電風扇轉部轉動，但有嗡嗡聲，下列哪些是其原因？","o":["電容器短路或開路","起動繞組短路或開路","軸承太緊","主線圈開路"],"x":"轉部會轉但有嗡嗡聲，表示主磁場存在但起動或運轉不順：電容器短路或開路、起動繞組短路或開路會失去分相作用，軸承太緊則轉動受阻，都會發出嗡嗡聲。錯誤選項：主線圈開路就沒有主磁場，不會轉也不會有嗡聲。"},{"c":11,"n":110,"a":[2,3,4],"q":"下列哪些電動機可自行起動？","o":["單繞組單相感應電動機","單相串激電動機","蔽極式感應電動機","三相感應電動機"],"x":"單相串激電動機有換向器，通電即有轉矩；蔽極式靠移動磁場可自行起動；三相感應電動機本身就有旋轉磁場。錯誤選項：單繞組單相感應電動機只有脈動磁場，起動轉矩為零，需外力推動才會轉。"},{"c":11,"n":111,"a":[1,2,3],"q":"下列哪些為步進電動機之特性？","o":["旋轉總角度與輸入脈波總數成正比","轉速與輸入脈波頻率成正比","靜止時有較高之保持轉矩","需要碳刷，不易維護"],"x":"步進電動機每輸入一個脈波轉一個固定步進角，所以總角度與脈波數成正比，轉速與脈波頻率成正比，靜止激磁時有很高的保持轉矩，適合定位控制。錯誤選項：步進電動機沒有碳刷，構造簡單、易維護。"},{"c":11,"n":112,"a":[2,3,4],"q":"下列敘述哪些正確？","o":["欲使三相感應電動機反轉，必須考慮電動機接線為Y 接或Δ接，Y 接時變換電源任兩相，Δ接時必須三相換位方可反轉","欲使三相感應電動機反轉，只須變換三相電源的任兩條線即可","欲使單相感應電動機反轉，可將起動繞組的兩端點對調，運轉繞組保持不變","欲使單相感應電動機反轉，可將運轉繞組的兩端點對調，起動繞組保持不變"],"x":"三相感應電動機不論Y接或△接，只要對調任意兩條電源線即可反轉。單相感應電動機則對調起動繞組或運轉繞組其中一組的兩端即可反轉，另一組保持不變。錯誤選項：△接並不需要三相換位，三相輪換反而相序不變、不會反轉。"},{"c":11,"n":113,"a":[1,2,4],"q":"在低壓三相感應電動機正反轉控制配線中，若三相電源之接線端為R、S、T，電動機之接線端為U、V、W，當電動機正轉時接法為R - U、S - V、T - W，下列敘述哪些正確？","o":["接法改為R-W、S-U、T-V 仍保持電動機正轉","接法改為R-W、S-V、T-U 可使電動機反轉","接法改為R-V、S-U、T-W 仍保持電動機正轉","接法改為R-U、S-W、T-V 可使電動機反轉"],"x":"判斷原則：電源三線循環平移相序不變仍正轉，任兩線對調則反轉。R-W、S-U、T-V 為循環平移，仍正轉；R-W、S-V、T-U 是 R、T 對調，反轉；R-U、S-W、T-V 是 S、T 對調，反轉。錯誤選項：R-V、S-U、T-W 是 R、S 對調，會反轉而非保持正轉。"},{"c":11,"n":114,"a":[1,2,4],"q":"下列哪些起動方法適用於三相鼠籠式感應電動機？","o":["Y–△降壓起動法","一次電抗降壓起動法","轉子加入電阻法","補償器降壓起動法"],"x":"鼠籠式感應電動機可用Y－△降壓起動、一次電抗降壓起動、補償器（自耦變壓器）降壓起動，都是從定子側降低電壓來減少起動電流。錯誤選項：轉子加入電阻法必須有滑環引出轉子電路，只適用繞線式感應電動機。"},{"c":12,"n":1,"a":[2],"q":"電極式液面控制器不適用於下列何種場所？","o":["儲水槽","絕緣油槽","地下水池","水塔"],"x":"電極式液面控制器是靠液體「導電」讓電極間形成通路來檢知液位。水（儲水槽、地下水池、水塔）可導電，所以適用；絕緣油不導電，電極間永遠不通，根本無法偵測，故不適用於絕緣油槽。記法：電極式只認「會導電的水」。"},{"c":12,"n":2,"a":[3],"q":"下圖控制電路若用布林代數（Boolean Algebra）式表示，則可寫成 \u00010\u0001","o":["F=（AB+CD）+E","F=（A+B）（C+D）E","F=（AB+CD）E","F=（A+B）（C+D）+E"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcIAAAC5BAMAAABJpCLAAAAAGFBMVEX///+jo6OBgYFZWVlEREQmJiYFBQUAAAA9husFAAAKKElEQVR42u2dz28bxxWAv11SaI0Y1pKS4qB17RUluyhQxJRkKQjgIJStH8ihhS2Z8dV2W/saNEn9N6Ro/4CicexbgUqWdenBrSoRRi+ppYhOgyI2LXJj9JDWkrhyijapSG4PpCSSWu7OUqS0S+y7WOYuZ+fjvHnz5r2ZWfDFF1988WWvIllfVjXBckYVIHdP+LmDx5ePPLqUyySbThiwvvrm54LlZH54YjrQ+6pwhb8e7O8YOPTSsaUDbuHgO8K3fusdCLwdE77/+z8HGG8+g2x5tSPoqLD8rCp8byYNsHDQhG+8cFZarsPh43P7oIeWV5/+V9jUoNt36wrpBigccBvKSjoqXFISd4olYTBhiHesqEOty7qBEPLiaqcAAQfV1m37yD4QnsWQHRU2seCMUOaALU07PFB0wZLa4oQfa+JPjiSGO8O/qbPWP55xSCgZpk1igB5NCJZUWAoO6w5q2XUdSamLLzKo8t7Muu6EsO07Zj9+YBbSrwsP92nS15SEcD3/dRvG6vEzJyJAIL6+aucFB/I7/TAUremVO+kquVtnxG/OAAnHfD033osU/wqfen/A2tKPlPdD01v7ToN0WPTZGpB36AM5HfDlnxYVe/WzGCCPZHMfiVoa0+H69JMEwatOCNmIJpvptMVDgJF5qPFxPKxAyLD3ueSy4bpaSTcTkPtU1KtRaboMqUB+ekoDpn57D5DiexkPgxmArNokwm7HgF3DsHL/V+mShj/59ZKOPLkHQimxZRDEtRSnXttFB+GICXg+XdYLcnN3dXpj9RN+DwAj4sBrk9uTjnyaGgNxzUBJtWFZ/QgG1boJo848UwUIODAdKs4c05N9FG5Vf7iZQT4vRGiiYm09KkCXLKRI0gU5FDp1bV68G3aEFKnjmnCbB85BarcbMw2dFwQiUYfzX+66cv7ro5+D/FZW/rtABQbbX0QirzwTrvBo9H9n+19669t/EP3C26/w/He7Pzb++jrh/3xp+pXelZ1o4tEfOPcu9jinOUIYCsL2aTxK/kNTT/TURXK3TK+M3y/rCNo+A1LQceKmB6MU5sy/kNKV4MXbdc+A3SIdGKkaPcD4ELrwPGGM1dmak5oZpKjnCRXDwkqnNGLO5/injqkzOsBQTheYa0YwSs5PWCnYd2pZpVio1E1aZKhQ8laFJq5Izgn7VC7cAZBG+djW0EpxjF8W6/Kzrb8sPcw4j2cBhmL8845IdsXS91mz8hzkxueyJCfaV/SF7EvNW4YXdFlxcT8UGaguWN9l6BYd0RuEdhH1BcIuJhSYV8qqYW3s1l1NKJTGLeg20ZCA4u02tA3oJLngXkJdxKOxu2m5tppaRKL2SZIizZy0DYkEbEZ8zc3dUFaMHcKe/uK/U5VzfeRaCRZZWFUO0tCUeTQrj7rn5ubmQ7s0IeZhWypVGJoVI5vNr ZgW18ZOsLIkNC62XVOytM8v4Ysvvvjiiy9elP8DcaO3xWxfrbYAAAAASUVORK5CYII=",202,83]],"x":"看圖：A、B 串聯（AB），C、D 串聯（CD），兩條支路並聯後成為 AB+CD，再與 E 串聯接到線圈 F。串聯寫成相乘、並聯寫成相加，所以 F=（AB+CD）E。口訣：串聯用乘、並聯用加，先括號內並聯再整體乘上 E。"},{"c":12,"n":3,"a":[2],"q":"可程式控制器之高速計數輸入模組通常與下列何項輸入元件連接，以達到精密定位控制之要求？","o":["熱電偶","編碼器","液面控制器接點","按鈕開關"],"x":"精密定位需要計算大量且高速的脈波數，編碼器（Encoder）隨轉軸轉動會送出脈波，脈波頻率高，一般輸入點掃描來不及，必須接高速計數模組才能準確計數定位。熱電偶是類比溫度信號，液面接點與按鈕屬一般開關量，不需高速計數。"},{"c":12,"n":4,"a":[1],"q":"當數位輸入信號從OFF（0）到ON（1）觸發時，能使可程式控制器內部邏輯信號作動，則該輸入信號係屬何種觸發？","o":["正緣（Lead）","負緣（Trailing）","脈動","殘留"],"x":"信號由 OFF（0）變為 ON（1）的瞬間稱為上升緣，也就是正緣（Lead）觸發；反之由 ON 變 OFF 才是負緣。記法：0 往上跳到 1 是「正」，1 往下掉到 0 是「負」。"},{"c":12,"n":5,"a":[1],"q":"下列哪一項週邊裝置可與可程式控制器類比模組連結使用？","o":["溫度感測器","接點式壓力開關","按鈕開關","印表機"],"x":"類比模組處理的是連續變化的量，如溫度、壓力、流量等。溫度感測器輸出隨溫度連續變化的電壓或電流，必須接類比輸入模組轉成數位值。接點式壓力開關、按鈕開關只有通斷兩種狀態，屬數位輸入；印表機是通訊周邊，不接類比模組。"},{"c":12,"n":6,"a":[2],"q":"在十六進位數字系統中之數值A5，若轉換為十進位，則其數值為","o":["155","165","205","215"],"x":"十六進位每位權值為 16 的次方，A 代表 10。A5 = 10×16 + 5×1 = 160 + 5 = 165。記得 A=10、B=11、C=12、D=13、E=14、F=15。"},{"c":12,"n":7,"a":[1],"q":"設00100101 為BCD 碼，若將其轉換為十進位數值表示，則其值為","o":["25","45","111","211"],"x":"BCD 碼是每 4 個位元代表一個十進位數字。00100101 分成 0010 與 0101，0010=2、0101=5，所以為 25。注意不要整串當二進位換算（那樣會得 37），BCD 是「四位一組各自翻譯」。"},{"c":12,"n":8,"a":[3],"q":"一個位元（bit），若以鮑率（Baud Rate）為9600 的傳送速率連續傳送10 秒的資料，則共可傳送多少位元組（Bytes）的資料？","o":["1200","2400","12000","24000"],"x":"鮑率 9600 表示每秒傳送 9600 個位元。10 秒共傳 9600×10 = 96000 位元，1 位元組 = 8 位元，所以 96000 ÷ 8 = 12000 位元組。"},{"c":12,"n":9,"a":[4],"q":"可程式控制器與電腦利用Modbus 作非同步傳輸連線時，下列何項非為設定參數之一？","o":["資料位元（Data Bits）","結束位元（Stop Bits）","通訊埠（COM Port）","緩衝器（Buffer）"],"x":"Modbus 非同步串列傳輸要雙方一致設定的參數有：通訊埠（COM Port）、鮑率、資料位元、同位元檢查、停止（結束）位元等。緩衝器是設備內部暫存資料的記憶區，不是連線時需要設定的通訊參數。"},{"c":12,"n":10,"a":[3],"q":"電磁開關所用之積熱電驛（TH-RY），其主要過載動作元件是","o":["電磁線圈","彈簧","雙金屬片","熱敏電阻"],"x":"積熱電驛利用過載電流流經加熱元件產生熱量，使雙金屬片因兩種金屬膨脹係數不同而彎曲，推動接點跳脫。所以主要的過載動作元件是雙金屬片。記法：積熱電驛靠「熱」，熱讓雙金屬「彎」。"},{"c":12,"n":11,"a":[1],"q":"二進位數目系統中的每一位數稱為位元（Bit），而8 個位元等於多少個位元組（Byte）？","o":["1","2","3","4"],"x":"資料單位的基本換算：8 個位元（bit）= 1 個位元組（Byte）。這是數位系統最基礎的定義，一個位元組剛好可表示 0～255 共 256 種狀態。"},{"c":12,"n":12,"a":[3],"q":"二進位的1011 相當於十進位的","o":["9","10","11","12"],"x":"二進位 1011 由左至右權值為 8、4、2、1，所以 1×8 + 0×4 + 1×2 + 1×1 = 8 + 2 + 1 = 11。"},{"c":12,"n":13,"a":[4],"q":"下列何種開關，能不接觸物體即可檢測出位置？","o":["浮球開關","極限開關","按鈕開關","光電開關"],"x":"光電開關利用投光器發射光線、受光器接收，物體遮斷或反射光線即可檢知，屬非接觸式檢測。浮球開關要接觸液體、極限開關要被物體碰觸撞擊、按鈕開關要人手按壓，都屬接觸式。"},{"c":12,"n":14,"a":[2],"q":"當數位輸入信號從ON（1）到OFF（0）觸發時，能使可程式控制器內部邏輯信號作動，該輸入信號屬於何種觸發？","o":["正緣（Lead）","負緣（Trailing）","脈動","殘留"],"x":"信號由 ON（1）變為 OFF（0）的瞬間是下降緣，稱為負緣（Trailing）觸發。記法：從 1 掉到 0 往下走，就是「負」緣。"},{"c":12,"n":15,"a":[2],"q":"有關D/A 轉換器之敘述，下列何者正確？","o":["類比信號轉換為數位信號","數位信號轉換為類比信號","電流信號轉換為電壓信號","電壓信號轉換為電流信號"],"x":"D/A 是 Digital to Analog，即「數位轉類比」，例如 PLC 內的數值轉成 4～20mA 或 0～10V 去控制變頻器、閥門。記法：看英文字母順序，D 在前就是從數位出發轉成類比。"},{"c":12,"n":16,"a":[1],"q":"有關A/D 轉換器之敘述，下列何者正確？","o":["類比信號轉換為數位信號","數位信號轉換為類比信號","電壓信號轉換為電流信號","電流信號轉換為電壓信號"],"x":"A/D 是 Analog to Digital，即「類比轉數位」，例如溫度感測器的連續電壓信號轉成 PLC 可運算的數值。記法：字母前面是來源、後面是結果，A 到 D 就是類比轉數位。"},{"c":12,"n":17,"a":[1,2,4],"q":"使用Modbus 通訊標準中，它規範了資料通訊設備（DCE）以及資料終端設備（DTE），下列哪些是屬於DTE 設備？","o":["個人電腦","印表機","數據機（Modem）","掃描器"],"x":"DTE（資料終端設備）是產生或使用資料的終端，如個人電腦、印表機、掃描器；DCE（資料通訊設備）負責信號轉換傳送，如數據機（Modem）。所以數據機屬 DCE，不屬 DTE。記法：終端就是使用者會直接用的機器。"},{"c":12,"n":18,"a":[1,2,4],"q":"下列哪些不是無線電傳輸特性？","o":["Duplex","Full Duplex","Half Duplex","Simplex"],"x":"依題庫觀點，傳統無線電（如對講機）同一頻道同一時間只能一方發話、另一方收聽，輪流收發，屬半雙工（Half Duplex），所以半雙工是無線電的傳輸特性；單工（Simplex）、全雙工（Full Duplex）及泛稱的Duplex不列入。註：實務上廣播屬單工、手機屬全雙工，無線電三種方式都有，本題屬題庫觀點。","f":"爭議"},{"c":12,"n":19,"a":[1,3],"q":"可程式控制器與電腦間利用Modbus 作非同步傳輸連線時，下列哪些是設定參數之一？","o":["資料位元（Data Bits）","通訊線徑大小","通訊埠（COM Port）","緩衝器（Buffer）"],"x":"Modbus 非同步傳輸需設定的參數包括通訊埠（COM Port）、資料位元、鮑率、同位元、停止位元等。通訊線徑大小是配線施工規格，不是軟體設定參數；緩衝器是設備內部記憶區，也不需設定。"},{"c":12,"n":20,"a":[1,3],"q":"工業控制中，下列哪些場所之特性適合使用電極式液位控制器？","o":["地下水池","絕緣油槽","家庭用儲水塔","工業用污水池"],"x":"電極式液位控制器靠液體導電檢知液位，適合乾淨、會導電的水，如地下水池與家庭用儲水塔。絕緣油不導電，無法使用；工業用污水池雜質多且具腐蝕性，電極容易附著污垢或被腐蝕而誤動作，也不適合。"},{"c":12,"n":21,"a":[1,2,3],"q":"下列哪些是使用可程式控制器（PLC）的主要特點？","o":["高可靠性","採用模組化結構","安裝簡單，維修方便","佔空間、不易學習"],"x":"PLC 的主要特點是高可靠性、模組化結構（I/O 可依需要擴充）、安裝簡單且維修方便、程式修改容易。「佔空間、不易學習」恰好相反，PLC 體積小、取代大量繼電器配線，階梯圖也容易學。"},{"c":12,"n":22,"a":[1,2,3],"q":"下列哪些是使用可程式控制器（PLC）的主要應用範圍？","o":["邏輯控制","計數控制","PID 控制","大數據分析"],"x":"PLC 主要應用在邏輯（順序）控制、計時計數控制、類比量與 PID 閉迴路控制、運動定位及通訊連線等工業控制。大數據分析需要大量儲存與運算，是電腦或雲端伺服器的工作，不是 PLC 的主要應用。"},{"c":12,"n":23,"a":[1,2],"q":"下列哪些裝置（元件）可連接於可程式控制器（PLC）的繼電器輸出模組？","o":["電磁接觸器","指示燈","熱電偶","近接開關"],"x":"繼電器輸出模組的接點是用來驅動負載，可接電磁接觸器線圈、指示燈、電磁閥等輸出元件。熱電偶是溫度感測元件，要接類比（溫度）輸入模組；近接開關是檢知元件，要接輸入模組，兩者都不是輸出負載。"},{"c":12,"n":24,"a":[1,2,3,4],"q":"為了滿足工業控制的需求，可程式控制器廠商開發了下列哪些專門用途I/O 模組？","o":["高速計數器模組","定位控制模組","網路模組","PID 模組"],"x":"為滿足工業需求，PLC 廠商開發了各種特殊功能模組：高速計數器模組（接編碼器計數）、定位控制模組（驅動伺服或步進馬達）、網路通訊模組（連上位電腦或其他設備）、PID 模組（溫度、壓力等閉迴路控制）。四項都是。"},{"c":12,"n":25,"a":[1,2,4],"q":"可程式控制器所用之PID 介面模組，通常應用於任何需要連續性閉路控制的程序控制系統中，其提供下列哪些控制的作動？","o":["積分","比例","數位訊號","微分"],"x":"PID 就是比例（P，Proportional）、積分（I，Integral）、微分（D，Derivative）三種控制動作的組合：比例反應誤差大小、積分消除穩態誤差、微分預測變化抑制過衝。數位訊號只是資料型態，不是 PID 的控制動作。"},{"c":12,"n":26,"a":[2,3,4],"q":"下列哪些是無線電的特點？","o":["無法穿透物體","容易製造安裝","容易互相干擾","發訊端無須對準收訊端"],"x":"無線電的特點：設備容易製造安裝、多個發射源頻率相近時容易互相干擾、電波向四面擴散所以發訊端不必對準收訊端。「無法穿透物體」是錯的，無線電波可穿透牆壁等障礙物，需要對準且不能穿透的是紅外線。"},{"c":12,"n":27,"a":[1,4],"q":"為了增強可程式控制器（PLC）抗干擾能力，提高其可靠性，PLC 在輸入端電路都採用下列哪些技術？","o":["光電隔離","運算放大電路","正反器","R-C 濾波"],"x":"PLC 輸入端常用光電隔離（光耦合器）把外部電路與內部電路在電氣上隔開，阻斷雜訊與高壓竄入；再用 R-C 濾波電路濾除高頻雜訊與接點彈跳。運算放大電路與正反器不是輸入端抗干擾的主要技術。"},{"c":12,"n":28,"a":[2,3],"q":"在電力監控系統中，若進行變壓器油溫信號監控傳遞，為正確傳輸資料至電腦，必須經過下列哪些感測與轉換技術？","o":["DAC","ADC","溫度感測器","濾波器"],"x":"變壓器油溫要先經溫度感測器把溫度轉成電壓或電流的類比信號，再經 ADC（類比轉數位）轉成數位資料，電腦才能讀取。DAC 是數位轉類比，方向相反，用在輸出端；濾波器依本題不列為必要的轉換技術。"},{"c":12,"n":29,"a":[1,2,3],"q":"國際電工協會（National Electrical Manufacturers Association）為整合各廠家可程式控制器（PLC）語法與硬體架構，在1993 年制訂了IEC1131 的標準，而第三部分IEC1131-3 為語法規範，下列哪些是其定義的規範？","o":["階梯圖（LD）","功能方塊圖（FBD）","順序功能圖（SFC）","C 語言"],"x":"IEC 1131-3（現稱 IEC 61131-3）定義的 PLC 程式語言有：階梯圖（LD）、功能方塊圖（FBD）、順序功能圖（SFC）、指令表（IL）、結構化文字（ST）。C 語言不在其規範之列。記法：三種圖 LD、FBD、SFC 加兩種文字 IL、ST。"},{"c":12,"n":30,"a":[2,4],"q":"下列哪些週邊裝置無法提供訊號給可程式控制器類比模組使用？","o":["壓力感測器","近接開關","溫度感測器","切換開關"],"x":"類比模組需要連續變化的信號，壓力感測器、溫度感測器輸出連續的電壓或電流，可接類比模組。近接開關與切換開關只有 ON/OFF 兩種狀態，屬數位（開關量）信號，要接數位輸入模組，無法提供類比模組使用。"},{"c":12,"n":31,"a":[1,3,4],"q":"為讀取並計算輸入脈波信號，下列哪些輸入裝置不可以與可程式控制器之高速計數輸入模組連接？","o":["熱電偶","編碼器","極限開關","按鈕開關"],"x":"高速計數模組是用來讀取高頻脈波，適合接編碼器。熱電偶輸出的是隨溫度變化的類比微小電壓，不是脈波；極限開關、按鈕開關雖是開關信號，但屬機械接點、動作頻率低且有彈跳，不適合也不需要接高速計數模組。"},{"c":12,"n":32,"a":[1,2,4],"q":"如下圖所示，若用邏輯式表示，下列哪些錯誤？ \u00010\u0001","o":["F=（AB+CD）+E","F=（A+B）（C+D）E","F=（AB+CD ）E","F=（A+B）（C+D）+E"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcAAAAC7BAMAAAAAmVP2AAAAGFBMVEX///+rq6uLi4tra2s4ODgNDQ0BAQEAAACg1FRNAAAJBElEQVR42u2dTY/bxhnH/3xRjaQJTEq7yKFNTYlSgBRFTEm7ziEoKu1LeunB2V37XKCBv4K/RD9B0fQDtI2RXLNaW7cCtSXxlALdlUSfmsaiRCdAEcB86UEv0UoiOaOVshxlnpOWnB3Ob16e55lnhkOACxcuXLisSwT2EaTIu7JPWhP5j//36nfv/ou45j6sDoTXfl3+8prxCwpx0hMA+SPi5PJHALCtrB1BjLyraVSZXXxLnDQAAPSvG7BPB4jnBl1637leQKkt0uXWpWyR4JoBBecb5rVoJOBNPN9swLdh0Q0qzaJ7unbNgAoCukF121qhhluNyFHPd+CrxKY7B+gX5A9O5wDpp8sVOm10LDpA+VfmojKb8MkrOYfM1yZ5IbfuAcEXS7VJRVfKrV7ss+SfWxPAcIeNWI0GNYjlvcfExew9AcQ36PHKWwYAsYxyIwYxM4Umb3+1IEV2AMhvEpqqX36J4D87P/mKdPj94h+DgXOD0g4KhX19rJhez/3sxnffRSR+I+XEjMFbHaD7AYXeCOofmDTl9SlbTzrRAPitnrlVzCliLmf/+UpKZvsBgK9pSjDQ6UpMaVXKGjCwGxbQO83lswoydz+7AqD0TwsQP6Jqkpfr1PjbRfiti1GldDpyRVcKhrk8oGCtvch0A3BPOX88NWjdWmO3uG8ub2tvDtUojakXlJXOty9LXvMfXVZKg8eQKssDvgcAaNG4U8KAEvAWhfk7Ck5nr7l/EXa1pQGHc9KABjBnUwK+R+7W7cOe744vLLG8LKB0yV7Gtp0KQLxNbCWENABskVfFjuE1Flz+1MlXllQyufTQ2qeJpghb6gEgvCDW+6X0AYDMf4kbsIhni2rPbVV36vGBwRvvmgt8y74DiBqCLsHzNQDwifnEUcfvkP7D/Wzvk8U5HRohd956zYpsweGzfbIi+B26sUebPpX1z0JyOjMyUcbwh5iSrUCOgnZY73CbQnlJVy05Imveo9CbtfQtsN6CWTyLMGePhQrrgCKiNOUAKj2gcDjSc8IJiftVqI5/7RpEXsnYupAF+w0v6q7r6PSAhdLJ8Mcd/ZikwGOPKbV3SGDljwvDTiWOf8R4rEo/8r4p0QNmx0tnGgjiTurEzS6RdHpJGwUMRYXQh48GbKJCDWjMWOS4gBNoIp0C5WRCgBOzkqOyrWT2/EhvDK6lsw2oBDEJHMlgGVCMBTwLHxpsALZj1xl1lgGl2Oibb4ks+6LG1DqpWFICB4IyE7k3jbAZBQstqE3NM/1mtt1oNK0ZA2rDYLeLip ,3,4],"q":"有關唯讀記憶體（Read Only Memory，ROM），下列哪些錯誤？","o":["能隨時讀寫或更改記憶內容","內部資料經設定儲存後，即無法更改","可以用紫外線消除記憶體內容","供應電源斷電後，內部資料會消失"],"x":"ROM（唯讀記憶體）資料寫入後即無法更改，且斷電不會消失，所以「內部資料經設定儲存後即無法更改」正確。錯誤者：能隨時讀寫更改是 RAM 的特性；可用紫外線消除是 EPROM 的特性；斷電資料消失也是 RAM 的特性。"},{"c":12,"n":34,"a":[1,2,4],"q":"可程式控制器通訊模組與區域網路連接時，使用雙絞線RJ-45 接頭連接，下列哪些正確？","o":["UTP 線的接頭有八個腳位（凹槽），其金屬接點有8 個","用在10-BaseT 與100-Base 系列網路，只使用1、2、3、6 腳位","必須加裝終端電阻","必要時可施作網路線跳線（cross-over）"],"x":"RJ-45 接頭有 8 個腳位與 8 個金屬接點；10BaseT 與 100BaseTX 只用 1、2（傳送）與 3、6（接收）四個腳位；設備直連時可做交叉（cross-over）跳線。「必須加裝終端電阻」錯誤，乙太網路雙絞線為點對點連接，不需終端電阻，需要終端電阻的是 RS-485 等匯流排配線。"},{"c":12,"n":35,"a":[1,3,4],"q":"Modbus 通信規約基本上是遵循 Master and Slave 的通信步驟，有一方扮演 Master 角色採取主動詢問方式，送出 Query Message 給Slave 方，然後由Slave 方依據接到的Query Message 內容準備Response Message 回傳給Master。下列哪些裝置可當作Slave 方？","o":["量測用儀表","人機界面（監控系統HMI）","熱電偶","可程式控制器"],"x":"Modbus中被動等待詢問、再回覆資料的是Slave，現場量測儀表、熱電偶溫度量測、PLC都可擔任Slave；人機界面（HMI監控系統）是主動向各設備詢問資料的一方，通常擔任Master，不選。註：熱電偶本身只是產生微伏級電壓的感溫元件，沒有通訊能力，實務上須經溫度模組或傳送器才能當Slave。","f":"爭議"},{"c":12,"n":36,"a":[1,3,4],"q":"可程式控制器與Modbus 裝置做連接通訊時，通信傳送資料因考慮信號可能受外界干擾，下列哪些不是通訊協定所採取措施？","o":["必須加上Device Address","必須做Error Check","必須考慮Function Code","資料長度（Bit）必須正確"],"x":"Modbus 為對抗傳輸中受外界干擾造成資料錯誤，採取的措施是錯誤檢查（Error Check），如 RTU 模式用 CRC、ASCII 模式用 LRC，接收端比對檢查碼即可發現錯誤。裝置位址、功能碼、資料長度是訊框的基本格式內容，並非針對干擾而設的措施。"},{"c":12,"n":37,"a":[1,2,3,4],"q":"下列哪些項目是可程式控制器可以處理之信號控制資料型態？","o":["DI:Digital Input","DO:Digital Output","AI:Analog Input","AO:Analog Output"],"x":"PLC 可處理四種基本信號型態：數位輸入 DI（按鈕、極限開關）、數位輸出 DO（接觸器、指示燈）、類比輸入 AI（溫度、壓力感測器）、類比輸出 AO（控制閥開度、變頻器頻率命令）。四項都正確。"},{"c":12,"n":38,"a":[1,2,3],"q":"下列哪些控制信號數值型態屬於AO:Analog Output？","o":["溫度","流量","轉速","啟動電動機"],"x":"類比輸出 AO 是 PLC 送出連續變化的命令值，例如設定溫度控制量、調整流量閥開度、送給變頻器的轉速命令，都屬連續量。啟動電動機只有啟動、停止兩種狀態，是數位輸出 DO。"},{"c":12,"n":39,"a":[2,3],"q":"下列哪些控制信號數值型態屬於DI:Digital Input？","o":["溫度","開關","接觸點","流量"],"x":"數位輸入 DI 只有 ON/OFF 兩種狀態，開關、接觸點（如按鈕、極限開關、繼電器接點）送進 PLC 都屬 DI。溫度與流量是連續變化量，屬類比輸入 AI。"},{"c":12,"n":40,"a":[1,2],"q":"下列哪些控制信號數值型態屬於AI:Analog Input？","o":["液位","重量","極限開關點","警鈴"],"x":"類比輸入 AI 是連續變化的量測值，液位（液位傳送器）、重量（荷重元）都是連續量，屬 AI。極限開關點只有通斷，屬數位輸入 DI；警鈴是 PLC 驅動的負載，屬數位輸出 DO。"},{"c":12,"n":41,"a":[1,4],"q":"下列哪些控制信號數值型態屬於DO:Digital Output？","o":["電動機啟動或停止","污水混濁度","轉速","警鈴"],"x":"數位輸出 DO 是 PLC 送出 ON/OFF 命令去驅動負載，電動機啟動或停止、警鈴響或不響都屬 DO。污水混濁度、轉速是連續變化的量，屬類比信號，不是 DO。"},{"c":12,"n":42,"a":[1,2,4],"q":"在工廠自動化控制通訊協定中，使用乙太網路（Ethernet）與Modbus，下列哪些正確？","o":["於同一Ethernet 網路系統上 IP Address 必須是唯一的","串列式通信上只有一個Modbus Master 設備","串列式通信上不可以連上多台Modbus Slave 設備","Modbus Address 是由通信規約內所制定的"],"x":"同一乙太網路上每台設備的 IP 位址必須唯一，否則衝突；Modbus 串列通信只能有一個 Master；Modbus Address（站號）範圍由通信規約制定。錯誤者為「不可以連上多台 Slave」，事實上一條串列線可連接多台 Slave，以站號區分。"},{"c":12,"n":43,"a":[1,3],"q":"可程式控制器掃描一週的時間（scan time）為15ms，現有兩個輸入信號，其中一個輸入信號的動作時間為10ms，另一個是30ms，若依照下列輸入信號與掃描時間的關係圖所示，下列哪些正確？ \u00010\u0001","o":["A 點輸入信號不能正確被PLC 讀取","A 點輸入信號可以正確被PLC 讀取","B、C 點輸入信號可以正確被PLC 讀取","B、C 點輸入信號不能正確被PLC 讀取"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAk4AAAFkBAMAAAAkqKkLAAAAGFBMVEX///+ioqKJiYlxcXFPT08mJiYICAgAAADesHY4AAAd70lEQVR42u2dz3cj15XfP68KtI8jiawqoD0zUqtZKLJ9csaSCBBsn5PoF3+1N04sdavl7JKZsUdZJznJX5G/ILG9yNKSWlq7STbPeLKIGyAhx0nGIglUS6NJrCZQj92aZKwmqrKoAlAgARA/CIJk1VuQIFEFVH3rvvvuve/e+4V4xCMe8YhHPOIRD3+Ii3CRitv3KTMagFeSp3QJ6kXAKfd3/UOby2nf0pO56f8VIZy+6/YtFv/vb55/fPd//o/Hr337b05HpC/CtNPN/k+qSYCdj5JaZHAS3uD3uvfYjA5OTnKAs/ypWhPRkSdza4irdIzI4DRdPRj8ZCkig5OLnRn4ZM+LCk6qx8PBlbEeGZwUm2p6iEUgMvNO4g5sDiuTdlRwmpO4AyvjnHs6OCXOP07X8ngPzf5vN7UKmGtEBCfhAnIAnAxFaN6uHRWcFAkUXx3AZbERljDtiOgnpQg41gCecKGQX1dXiQhOmgS8AS3yyl11MSI4zQG4g7r9h/ZsNPSTMN4D0D8d8PzSK5qMBE6TJYBkujjY+WXMYhRwUnY3Aa6/MTDQWiT0k+6v62V90HhBRNa7aR8n78Ac68bbecdJTPm/3UFxwpNRwEmZDO72oF81ExyvY0dCnurhIznglWadSMhTtn6XzsxAy1wivRsJ/WTUp5su+ouRq1oSSN1+rkgE7PEFs+I7/LOmWJB9aJrZtFZdRejT78so5KvMaFTsev5JpQ+ckv7y6FVt4hGPeMQjHvE4v+vdbJucTK984mkr5YFOu7BDGSzzYlaLmJxbA52lpiMGk2IOpESsiMHEzGBCOLpZdz79YOW5Qc5KujJi4jTQntsp7WheJO00yB2LZWLt1MPIjfbRXRbtNLMXOXEaZHVPmkRNngaoIju1NMzLrp1mRv7wLoV2StaiF8EYwHZSM9GDaQDbSYme5TSQplmJIEwDTKHIxZwA5vtH1oyiOPV90yJaoTlhDuiknVFoTjlX8XCl1n 為100、50或10歐姆以下，用來在絕緣破壞時讓故障電流流入大地，防止感電。特種與第一種接地用於高壓用電設備等，第二種用於三相三線非接地系統地區用戶變壓器低壓電源系統接地。"},{"c":13,"n":4,"a":[3],"q":"三相感應電動機使用變頻器作減速控制時，為了避免電動機因產生再生電壓而造成變頻器過電壓失速，除了設定加長減速時間外，還可在變頻器中加裝","o":["交流電抗器","電磁接觸器","煞車電阻器","雜訊濾波器"],"x":"電動機減速時轉子轉速高於同步速度，變成發電機，回生能量灌回變頻器直流匯流排使電壓升高而跳脫。加裝煞車電阻器可把這些回生能量轉成熱消耗掉，抑制過電壓。交流電抗器抑制諧波、接觸器作開閉、雜訊濾波器濾除雜訊，都無法消耗回生能量。"},{"c":13,"n":5,"a":[1],"q":"為改善變頻器因連接交流電動機所產生的金屬噪音，通常需要","o":["外加交流電抗器","在變頻器電源端加電磁接觸器","加煞車電阻器","降低變頻器內部電力元件切換的速度"],"x":"變頻器輸出為 PWM 切換波形，含大量諧波，使電動機產生金屬噪音。在輸出側外加交流電抗器可平滑電流波形、降低諧波，改善噪音。電磁接觸器只是開關，煞車電阻器處理回生能量，降低元件切換速度反而會讓噪音落在可聽頻帶更明顯。"},{"c":13,"n":6,"a":[3],"q":"V/f 轉換器可將輸入電壓轉換為","o":["電流","時間","頻率","電阻"],"x":"V/f 轉換器（Voltage to Frequency Converter）是把輸入電壓轉換成與電壓大小成正比的頻率（脈波）輸出。看名稱就知道：V 轉成 f，f 就是頻率。"},{"c":13,"n":7,"a":[2],"q":"當安培計用切換開關（AS）切至OFF 時，其所連接的比流器（CT）二次側應該","o":["全部開路","全部短路","部分開路","部分短路"],"x":"比流器二次側絕對不可開路。開路時一次電流全部變成激磁電流，鐵心飽和，二次側感應出極高電壓，危及人員並燒毀 CT。所以安培計切換開關切到 OFF 時，要讓連接的 CT 二次側全部短路。口訣：PT 二次不可短路，CT 二次不可開路。"},{"c":13,"n":8,"a":[2],"q":"控制系統中，輸出信號與輸入信號之比率稱為","o":["倍率函數","轉移函數","位移函數","負載函數"],"x":"控制系統中輸出信號與輸入信號之比（通常以拉氏轉換表示，初始條件為零）稱為轉移函數，用來描述系統的動態特性。其他選項不是自動控制的標準名詞。"},{"c":13,"n":9,"a":[2],"q":"交流同步電動機在起動時，其主磁場繞組","o":["應加交流電激磁","不可加直流電激磁且應短路","應開路","應降低電源電壓"],"x":"同步電動機本身沒有起動轉矩，起動時靠阻尼繞組以感應電動機方式加速。此時主磁場繞組不可加直流激磁，且應短路（或經電阻短路），以免被旋轉磁場切割感應高電壓損壞絕緣。接近同步速度時才加入直流激磁拉入同步。"},{"c":13,"n":10,"a":[1],"q":"單相蔽極式感應電動機係靠下列何種原理來旋轉？","o":["移動磁場","旋轉磁場","推斥磁場","固定磁場"],"x":"蔽極式電動機在磁極一部分套上短路銅環（蔽極線圈），使被遮蔽部分的磁通相位落後，磁通由未遮蔽部分移向遮蔽部分，形成移動磁場帶動轉子旋轉。它沒有真正的旋轉磁場，所以轉向固定、起動轉矩小。"},{"c":13,"n":11,"a":[4],"q":"電動機銘牌上所註明的電流係指","o":["半載電流","無載電流","\u00010\u0001滿載電流","滿載電流"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAA2BAMAAAAxNnQ+AAAAGFBMVEX///+rq6uenp5+fn5fX19DQ0M0NDQQEBCwbY6iAAAAiklEQVR42mNgIAMwpzIwMDAwMDEwMDD8F0BiMyDYDAPERhZgFBRgoBFgZGBwU2BgYGD4M4+B1oCZgYGBIdyb9QHUeyxvDprA5AQZGNJh3n7PwPAAKQg+ILF5kdh/4GYyMP3/ALeFBSk8ddAsh4rzIlSyGH9g/HMBwnY2YGCYCQkTBiUGBoZ7ZPgRAPLFE7BQ20N9AAAAAElFTkSuQmCC",10,24]],"x":"電動機銘牌上標示的額定電流，是指電動機在額定電壓、額定頻率下輸出額定功率（滿載）時的電流，也就是滿載電流。配線與過載保護設定都以此為依據，不是無載電流、半載電流或二分之一滿載電流。"},{"c":13,"n":12,"a":[2],"q":"三相5HP 交流感應電動機，原接於頻率為50Hz 之電源，若改接於60Hz，則其轉速將","o":["減少百分之二○","增加百分之二○","轉速保持不變","無法起動"],"x":"感應電動機轉速與電源頻率成正比（Ns=120f/P）。頻率由 50Hz 改為 60Hz，轉速變為 60 ÷ 50 = 1.2 倍，即增加百分之二十。"},{"c":13,"n":13,"a":[3],"q":"有一低壓三相鼠籠式感應電動機，如採全壓起動時，起動電流為120 安培，若採用Ｙ-△降壓起動開關起動，起動電流約為多少安培？","o":["120","100","40","20"],"x":"Y-△ 起動時，每相繞組電壓降為全壓的 1/√3，線路起動電流為全壓（△）起動的 1/3。所以 120 × 1/3 = 40 安培。記法：Y-△ 起動電流、起動轉矩都變三分之一。"},{"c":13,"n":14,"a":[3],"q":"比流器（CT）的主要作用可","o":["減少線路損失","增加線路壓降","擴大交流安培計測定範圍","改變線路功率因數"],"x":"比流器把大電流按比例降為小電流（通常 5A），讓小量程交流安培計可以量測大電流，作用是擴大交流安培計的測定範圍，同時與高壓隔離。它不會減少線路損失或改變功率因數。"},{"c":13,"n":15,"a":[2],"q":"貫穿型比流器規格為150/5，基本貫穿匝數1 匝，若與刻度為50A，表頭滿刻度電流為5A 之電流表連接使用時，該比流器一次側應貫穿幾匝？","o":["2","3","4","10"],"x":"CT 一次安匝固定：150 安 × 1 匝 = 150 安匝。要讓 50A 一次電流產生同樣的滿刻度 5A 二次電流，所需匝數 = 150 ÷ 50 = 3 匝。貫穿匝數越多，等效一次額定越小。"},{"c":13,"n":16,"a":[3],"q":"絕緣電阻計可用來測量感應電動機的","o":["輸出功率","滿載電流","絕緣電阻","運轉轉速"],"x":"絕緣電阻計（俗稱高阻計、搖表）是以高直流電壓測量繞組對地或相間的絕緣電阻，判斷絕緣是否劣化。輸出功率、滿載電流、轉速要用功率表、電流表、轉速計量測。"},{"c":13,"n":17,"a":[1],"q":"若交流電動機的轉速由變頻器來作控制，電動機轉速與變頻器輸出頻率的關係為下列何者？","o":["正比","反比","平方正比","平方反比"],"x":"感應電動機同步轉速 Ns = 120f/P，極數 P 固定時，轉速與頻率成正比。這就是變頻器調速的原理：調高輸出頻率轉速上升，調低頻率轉速下降。"},{"c":13,"n":18,"a":[1,2,4],"q":"在目前的節能設備中，變頻器（Inverter）為最直接之節能控制方法之一，下列哪些是其應用案例？","o":["空調冷卻風扇","家電洗衣機","家電電熱器","抽排煙機"],"x":"變頻器節能適用於電動機負載，尤其是風扇、泵浦類負載（耗功率約與轉速三次方成正比），如空調冷卻風扇、抽排煙機，降速即可大幅省電；變頻洗衣機也是常見例子。電熱器是純電阻發熱負載，沒有電動機轉速可調，不是變頻器應用。"},{"c":13,"n":19,"a":[1,2],"q":"下列哪些項目是變頻器與可程式控制器（PLC）連接後的控制應用案例？","o":["恆壓式供水系統","電動機轉速控制","屋內採光窗簾控制","溫度調節控制"],"x":"PLC 接變頻器的典型應用：恆壓式供水系統（依壓力信號調整泵浦轉速）、電動機轉速控制。屋內採光窗簾控制屬簡單開閉控制，不必用變頻器；溫度調節控制依本題不列為變頻器與 PLC 連接的典型案例。"},{"c":13,"n":20,"a":[1,3,4],"q":"變頻器與相關的周邊設備配線時，下列哪些項目是正確作法？","o":["嚴禁電源輸入線直接接在變頻器的電動機接線端子（U-V-W）","可以直接使用電源線上的「無熔線開關」來啟動與停止電動機","變頻器及電動機請確實實施機殼接地，以避免人員感電","變頻器電源側與負載側的接線需使用「絕緣套筒壓接端子」"],"x":"正確作法：電源線絕不可接到輸出端 U、V、W，否則會燒毀變頻器；變頻器與電動機機殼要確實接地；主電路接線使用絕緣套筒壓接端子。錯誤者：不可用電源側無熔線開關頻繁啟停電動機，應以變頻器的運轉、停止指令控制。"},{"c":13,"n":21,"a":[1,2,3,4],"q":"下列哪些項目是變頻器本身事故防止機能？","o":["過電流保護","回生過電壓保護","電動機過熱保護","漏電或低電壓保護"],"x":"變頻器內建多種保護機能：過電流保護（防加速或短路時電流過大）、回生過電壓保護（減速時直流電壓升高）、電動機過熱（電子積熱）保護、漏電（接地）或低電壓保護。四項都屬於變頻器本身的事故防止機能。"},{"c":13,"n":22,"a":[1,2,3,4],"q":"下列哪些項目是目前市售變頻器驅動控制方法之一？","o":["電壓/頻率控制（V/F Control）技術","向量控制（Vector Control）技術","直接轉矩控制 （Direct Torque Control， DTC）","無轉軸量測器控制（Sensorless Control）"],"x":"市售變頻器驅動控制方式有：V/F 控制（電壓與頻率等比調整，最基本）、向量控制（分解磁通與轉矩電流分別控制）、直接轉矩控制 DTC、無轉軸量測器（無感測器）控制。四項都是。"},{"c":13,"n":23,"a":[1,2,3,4],"q":"下列哪些是一般變頻器故障的原因？","o":["參數設置類故障","溫度過高","過電流故障","過電壓故障"],"x":"變頻器常見故障原因：參數設定錯誤（如加減速時間、電動機參數）、散熱不良溫度過高、過電流（加速太快、負載過大、短路）、過電壓（減速太快回生能量過大、電源電壓過高）。四項都是。"},{"c":13,"n":24,"a":[3,4],"q":"下列哪些不是變頻器日常維護保養與點檢項目？","o":["絕緣電阻","冷卻系統","電動機極性","配線線徑大小與負載容量"],"x":"變頻器日常維護點檢包括：絕緣電阻量測、冷卻系統（風扇、散熱片）清潔運轉、端子鬆動、異音異味等。電動機極性、配線線徑與負載容量是設計與施工階段就確定的項目，不屬日常維護點檢。"},{"c":13,"n":25,"a":[1,2,4],"q":"下列哪些不是三相感應電動機使用變頻器作減速控制時，為了避免電動機因產生再生電壓而造成變頻器過電壓失速，除了設定加長減速時間外，還可在變頻器中加裝的裝置？","o":["交流電抗器","電磁接觸器","煞車電阻器","雜訊濾波器"],"x":"減速時抑制回生過電壓的方法，除加長減速時間外，就是加裝煞車電阻器（或煞車單元）消耗回生能量。交流電抗器用於抑制諧波與突波、電磁接觸器用於電源開閉、雜訊濾波器用於抑制電磁干擾，都無法消耗回生能量，所以都「不是」。"},{"c":13,"n":26,"a":[2,3],"q":"下列哪些是Modbus 通訊協定，所採用的串列通訊方式？","o":["TCP/IP","RTU","ASCII","ProfiBus"],"x":"Modbus 串列通訊有兩種傳輸模式：RTU（二進位編碼，效率高，用 CRC 檢查）與 ASCII（字元編碼，用 LRC 檢查）。TCP/IP 是 Modbus TCP 所用的乙太網路傳輸，不是串列方式；ProfiBus 是另一套工業現場匯流排協定。"},{"c":13,"n":27,"a":[1,2,3],"q":"下列哪些是一般變頻器上的轉速控制？","o":["直接從變頻器面板上的可變電阻調整","外接類比電壓或電流信號來調整","變頻器支援Modbus 通訊，可利用上位控制器以通訊的方式改變變頻器轉速","可外接電磁接觸器直接控制主電路"],"x":"變頻器調速方式有：面板上的可變電阻（旋鈕）直接調整、外接類比電壓（如 0～10V）或電流（如 4～20mA）信號、透過 Modbus 通訊由 PLC 等上位控制器下達頻率命令。電磁接觸器只能開閉主電路，無法改變轉速，也不建議用來直接啟停變頻器主電路。"},{"c":14,"n":1,"a":[4],"q":"進屋線為單相三線式，計得之負載大於10 千瓦或分路在六路以上者，其用戶總開關安培額定應不得低於多少安培？","o":["20","30","40","50"],"x":"依「用戶用電設備裝置規則」，進屋線為單相三線式，計得負載大於 10 千瓦或分路在六路以上者，用戶總開關額定不得低於 50 安培。負載大、分路多，總開關容量自然要提高。"},{"c":14,"n":2,"a":[4],"q":"分路供應重責務型燈座之出線口時，每一出線口以多少伏安來計算？","o":["180","300","500","600"],"x":"依「用戶用電設備裝置規則」的負載計算，供應重責務型燈座的出線口，每一出線口以 600 伏安計算；一般出線口則以較小值計。重責務型燈座用於大功率燈具，所以計算值也最大。"},{"c":14,"n":3,"a":[2],"q":"啟斷容量為500MVA 之12kV 斷路器，能通過之最大故障電流約為多少kA？","o":["15","24","50","100"],"x":"三相啟斷容量 P = √3 × V × I，所以 I = P ÷（√3 × V）= 500MVA ÷（1.732 × 12kV）= 500 ÷ 20.78 ≈ 24.06kA，約 24kA。"},{"c":14,"n":4,"a":[3],"q":"高壓電氣設備如有活電部分露出者，其屬開放式裝置者，應裝於變電室內，或設置高度多少米以上之圍牆或圍籬加以隔離？","o":["1.5","2.0","2.5","3.0"],"x":"依「用戶用電設備裝置規則」，高壓電氣設備有活電部分露出的開放式裝置，應裝於變電室內，或以高度 2.5 公尺以上的圍牆或圍籬隔離，防止非工作人員接近感電。"},{"c":14,"n":5,"a":[3],"q":"過流接地電驛（LCO）之主要功能為","o":["過載保護","低電壓保護","接地保護","過電壓保護"],"x":"LCO 是接地過流電驛（Ground Over Current Relay），接於 CT 的剩餘電流迴路或零相電流迴路，檢出接地故障時的零相電流而動作，主要功能是接地保護。一般過載保護用的是 CO（過流電驛）。記法：多一個 L（接地）就是接地保護。"},{"c":14,"n":6,"a":[1],"q":"斷路器之IC 值係表示","o":["短路啟斷容量","跳脫容量","框架容量","積體電路"],"x":"斷路器的 IC 是 Interrupting Capacity，即短路啟斷容量，表示斷路器能安全啟斷的最大短路電流（kA）。跳脫容量（AT）、框架容量（AF）是另外的標示。記法：AT 跳脫、AF 框架、IC 啟斷。"},{"c":14,"n":7,"a":[2],"q":"裝於住宅處所20 安培以下分路之斷路器及栓形熔線應屬下列何種保護特性？","o":["高速","反時限","低速","定時限"],"x":"住宅 20 安培以下分路的斷路器及栓形熔線，應具反時限特性：電流越大，跳脫時間越短；輕微過載容許短時間通過，嚴重過載或短路則迅速跳脫，兼顧不誤跳與保護。"},{"c":14,"n":8,"a":[1],"q":"積熱型熔斷器及積熱電驛可作為電氣設備之何種事故之保護？","o":["過載","短路","漏電","感電"],"x":"積熱型熔斷器及積熱電驛是利用電流熱效應累積動作，反應較慢，適合保護持續性的過載。短路電流極大、需瞬間切斷，必須靠熔線或斷路器；漏電、感電則要靠漏電斷路器。"},{"c":14,"n":9,"a":[2],"q":"刀型開關其電壓在250 伏特以下，額定電流在多少安培以上者，僅可作為隔離開關之用，不得在有負載之下啟斷電路？","o":["100","150","200","400"],"x":"刀型開關沒有良好的滅弧能力，額定電流大時帶負載啟斷會產生強烈電弧，所以電壓 250 伏特以下、額定電流 150 安培以上者，僅能作隔離開關，不得帶負載啟斷。對照另一題：600 伏特以下則門檻降為 75 安培，電壓越高門檻越低。"},{"c":14,"n":10,"a":[3],"q":"一般低壓三相220V 供電用戶，主保護器之額定電流75A，其用戶總開關選用過電流保護器之最低額定極限短路啟斷容量為多少kA？","o":["5","7.5","10","15"],"x":"依「用戶用電設備裝置規則」低壓用戶總開關最低短路啟斷容量的規定，三相 220V 供電、主保護器額定電流 75A 的用戶，其過電流保護器的額定極限短路啟斷容量最低為 10kA。主保護器額定越大，要求的啟斷容量越高。"},{"c":14,"n":11,"a":[3],"q":"過流電驛（CO）在設定時，若在同樣的負載電流下，要加速其跳脫時間，選擇下列何種方式較佳？","o":["設定較高的始動電流，選用較大的時間標置","設定較低的始動電流，選用較大的時間標置","設定較低的始動電流，選用較小的時間標置","設定較高的始動電流，選用較小的時間標置"],"x":"要在同樣負載電流下加快跳脫：始動電流（TAP）設低，同樣電流就代表更高倍數，反時限曲線動作更快；時間標置（Time Lever）選小，整條曲線往下移，時間更短。所以「低始動電流、小時間標置」最快。"},{"c":14,"n":12,"a":[3],"q":"某比壓器（PT）之二次側線路阻抗為10Ω，二次側線電壓為50V，此PT 之負擔為多少VA？","o":["10","100","250","1000"],"x":"PT 負擔就是二次側所接負載消耗的視在功率：VA = V² ÷ Z = 50² ÷ 10 = 2500 ÷ 10 = 250VA。"},{"c":14,"n":13,"a":[1],"q":"浴室之插座有裝設額定靈敏度電流多少毫安培以下，且動作時間 0.1 秒以下之漏電啟斷裝置，該插座分路得免裝設漏電斷路器？","o":["6","12","15","30"],"x":"依「用戶用電設備裝置規則」，浴室插座若裝有額定靈敏度電流 6 毫安培以下、動作時間 0.1 秒以下的漏電啟斷裝置（如附漏電保護的插座），該插座分路得免再裝設漏電斷路器。6mA 比一般高靈敏度的 30mA 更嚴格，所以可抵免。"},{"c":14,"n":14,"a":[2],"q":"漏電斷路器之額定電流容量，應不小於該電路之","o":["漏電電流","負載電流","短路電流","靈敏度電流"],"x":"漏電斷路器同時要承載電路的正常電流，所以其額定電流容量不得小於該電路的負載電流，否則會過熱或誤跳。漏電電流、靈敏度電流是另外的漏電動作參數，短路電流則要看啟斷容量。"},{"c":14,"n":15,"a":[3],"q":"變比器之二次線應採下列何種接地？","o":["第一種","第二種","第三種","特種"],"x":"比壓器、比流器等變比器的二次線，依「用戶用電設備裝置規則」應施行第三種接地，防止一、二次間絕緣破壞時高壓竄入二次側儀表電路，危及人員與儀表。"},{"c":14,"n":16,"a":[2],"q":"保護低壓進屋線之斷路器或熔線之標準額定不能配合導線之安培容量時，得選用高一級之額定值，但額定值超過多少安培時，不得作高一級之選用？","o":["600","800","1000","1200"],"x":"依「用戶用電設備裝置規則」，進屋線保護用斷路器或熔線的標準額定無法配合導線安培容量時，可選高一級的額定，但額定值超過 800 安培時不得選用高一級，以免大電流時導線保護不足。"},{"c":14,"n":17,"a":[2],"q":"刀型開關其電壓在600 伏特以下，額定電流在多少安培以上者，僅可作為隔離開關之用，不得在有負載之下啟斷電路？","o":["50","75","100","150"],"x":"刀型開關滅弧能力差，電壓 600 伏特以下、額定電流 75 安培以上者，僅能作隔離開關，不得在有負載時啟斷電路。對照 250 伏特以下的門檻是 150 安培：電壓越高，電弧越難熄，容許的電流門檻就越低。"},{"c":14,"n":18,"a":[2],"q":"每一戶應設置用戶總開關，能同時啟斷進屋之各非接地導線，但用戶過電流保護裝置在多少具以下者，得免設置用戶總開關？","o":["2","3","5","6"],"x":"依「用戶用電設備裝置規則」，每戶應設用戶總開關以同時啟斷各非接地導線，但用戶過電流保護裝置在 3 具以下時，操作數量少，得免設置用戶總開關。"},{"c":14,"n":19,"a":[3],"q":"用戶總開關僅供電單相二線式分路二路者，其用戶總開關額定不得小於多少安培？","o":["15","20","30","50"],"x":"依「用戶用電設備裝置規則」，用戶總開關僅供電單相二線式分路二路者，總開關額定不得小於 30 安培（只供一路者要求較低）。"},{"c":14,"n":20,"a":[1],"q":"以防止感電事故為目的裝置漏電斷路器者，應採用","o":["高靈敏度高速型","高靈敏度延時型","中靈敏度延時型","低靈敏度延時型"],"x":"防止感電要在人體受傷害前迅速切斷，所以應採高靈敏度（30mA 以下）、高速型（0.1 秒以內動作）的漏電斷路器。延時型或中、低靈敏度型多用於防火災或協調保護，不適合防感電。"},{"c":14,"n":21,"a":[1],"q":"高速型漏電斷路器在額定靈敏度電流之動作時間多少秒以內？","o":["0.1","0.5","1","2"],"x":"高速型漏電斷路器在額定靈敏度電流下，動作時間在 0.1 秒以內。記法：防感電用的就是「30mA、0.1 秒」這組高靈敏度高速型。"},{"c":14,"n":22,"a":[1],"q":"單相110V 的日光燈分路，若採用單極模殼式斷路器保護，則正確配線方式為","o":["選擇非接地導線經過模殼式斷路器","選擇被接地導線經過模殼式斷路器","選擇接地線經過模殼式斷路器","非接地導線、被接地導線或接地線任意選擇其中一條經過模殼式斷路器"],"x":"單極斷路器只能切斷一條線，必須接在非接地導線（火線）上，跳脫後負載才不帶電。若接在被接地導線（中性線），跳脫後燈具仍帶電，維修有感電危險；接地線更不可串接任何開關。"},{"c":14,"n":23,"a":[4],"q":"通常在電熱水器或飲水機分路加裝漏電斷路器，是因為它具有下列何種主要功能？","o":["檢出斷線故障，完成跳脫以隔離故障點","檢出短路故障，完成跳脫以隔離故障點","檢出過電流故障，完成跳脫以隔離故障點","檢出接地故障，完成跳脫以隔離故障點"],"x":"電熱水器、飲水機與水接觸，絕緣劣化時容易使外殼帶電，加裝漏電斷路器是為了檢出接地（漏電）故障並迅速跳脫隔離，防止感電。短路與過電流由一般斷路器保護，漏電斷路器的主要功能是接地故障檢出。"},{"c":14,"n":24,"a":[2,3,4],"q":"幹線之分接導線長度不超過8 米，導線之過電流保護有下列哪些情形得免裝於分接點？","o":["分接導線之安培容量不低於幹線之1/4 者","分接導線之安培容量不低於幹線之1/3 者","妥加保護不易為外力所損傷者","分接導線終端所裝一具斷路器或一組熔線，其額定容量不超過該分接導線之安培容量"],"x":"依「用戶用電設備裝置規則」，幹線分接導線長度不超過 8 公尺，且符合：分接導線安培容量不低於幹線的三分之一、妥加保護不易受外力損傷、終端所裝一具斷路器或一組熔線額定不超過分接導線安培容量，則過電流保護可免裝於分接點。錯誤者是四分之一，要求太低。"},{"c":14,"n":25,"a":[2,3,4],"q":"熔絲鏈開關原則上不得裝用於下列哪些場所？","o":["屋外電桿上","屋內","地下室","金屬封閉箱內"],"x":"熔絲鏈開關（俗稱 Cut Out）啟斷時熔絲會噴出電弧與熔融物，原則上只能裝在屋外電桿等開放空間，不得裝於屋內、地下室及金屬封閉箱內，以免引起火災或傷人。"},{"c":14,"n":26,"a":[1,3,4],"q":"過電流保護裝置於屋內者，其位置除有特殊情形外，應裝於下列哪些處所？","o":["容易接近之處","不容易接近之處","不暴露於可能為外物損傷之處","不與易燃物接近之處"],"x":"屋內過電流保護裝置應裝在容易接近之處（方便操作與更換）、不暴露於可能受外物損傷之處、不與易燃物接近之處（動作時可能產生電弧）。裝在不容易接近之處顯然錯誤。"},{"c":14,"n":27,"a":[1,2],"q":"下列哪些漏電斷路器之額定靈敏度電流屬於高靈敏度型？","o":["15 毫安","30 毫安","50 毫安","100 毫安"],"x":"漏電斷路器依額定靈敏度電流分類：30 毫安以下為高靈敏度型，所以 15mA、30mA 屬高靈敏度。50mA、100mA 屬中靈敏度型（超過 30mA 至 1000mA）。"},{"c":14,"n":28,"a":[1,2,3,4],"q":"下列哪些項目，斷路器應有耐久而明顯之標示？","o":["額定電壓","額定電流","額定極限短路啟斷容量（Icu）","廠家名稱或其代號"],"x":"斷路器應有耐久而明顯的標示，包括額定電壓、額定電流、額定極限短路啟斷容量（Icu）、廠家名稱或代號等，讓使用者能正確選用與追溯。四項都要標示。"},{"c":14,"n":29,"a":[2,3,4],"q":"接戶開關之接線端子應用下列哪些方法裝接？","o":["採用焊錫焊接","採用有壓力之接頭","採用有壓力之夾子","採用其他安全方法"],"x":"接戶開關接線端子應採用有壓力的接頭、有壓力的夾子或其他安全方法裝接，確保接觸良好。不得採用焊錫焊接，因為大電流或故障時發熱會使焊錫軟化熔化，造成接觸不良甚至脫落。"},{"c":14,"n":30,"a":[1,2,4],"q":"下列哪些用電設備或線路，應按規定施行接地外，並在電路上或該等設備之適當處所裝設漏電斷路器？","o":["建築或工程興建之臨時用電設備","公共場所之飲水機分路","住宅場所離廚房水槽超過1.8 米以外之插座分路","商場之沈水式用電設備"],"x":"依「用戶用電設備裝置規則」，應裝漏電斷路器的包括：建築或工程興建的臨時用電設備、公共場所的飲水機分路、商場等場所的沈水式用電設備。住宅離廚房水槽 1.8 公尺以內的插座分路才需裝設，超過 1.8 公尺以外者不在規定之列。"},{"c":14,"n":31,"a":[1,3],"q":"為防止感電事故裝置漏電斷路器，用電器具外殼施行接地，其接地電阻值符合規定，可採用下列哪些類別的漏電斷路器？","o":["高靈敏度高速型","高靈敏度延時型","中靈敏度高速型","中靈敏度延時型"],"x":"防感電一定要「高速型」（0.1 秒內動作）。若用電器具外殼已確實接地且接地電阻符合規定，接觸電壓較低，靈敏度可放寬為中靈敏度，所以高靈敏度高速型、中靈敏度高速型皆可。延時型動作太慢，不適合防感電。"},{"c":14,"n":32,"a":[1,2,3,4],"q":"下列哪些基本原理能加速滅弧？","o":["拉長電弧","冷卻弧根","施壓力於弧極及弧道","氣體吹過弧道"],"x":"加速滅弧的基本原理：拉長電弧使電阻增大、冷卻弧根降低游離、施壓力於弧極及弧道抑制游離、氣體吹過弧道帶走熱與游離粒子。斷路器的各種滅弧室設計就是運用這些原理，四項都對。"},{"c":14,"n":33,"a":[3,4],"q":"下列哪些裝置不得作為導線之短路保護？","o":["栓型熔線","筒型熔線","積熱型熔斷器","積熱電驛"],"x":"積熱型熔斷器與積熱電驛靠熱量累積動作，反應慢，短路電流瞬間極大，等它動作導線早已損壞，所以不得作為短路保護，只適合過載保護。栓型熔線、筒型熔線能快速熔斷，可作短路保護。"},{"c":14,"n":34,"a":[2,3,4],"q":"下列哪些是真空斷路器的優點？","o":["消弧慢","維護簡單","壽命長","無油而無引起火災的危險"],"x":"真空斷路器在真空中啟斷，絕緣強度高、電弧極易熄滅，優點有：維護簡單、接點損耗小壽命長、不用絕緣油而無火災危險。「消弧慢」錯誤，真空中消弧非常快，這正是它的優點。"},{"c":14,"n":35,"a":[1,2,3,4],"q":"下列哪些項目是斷路器必須具備之額定？","o":["額定電壓","額定電流","額定極限短路啟斷容量（Icu）","額定使用短路啟斷容量（Ics）"],"x":"斷路器必須具備的額定包括：額定電壓、額定電流、額定極限短路啟斷容量 Icu（能啟斷的最大短路電流）、額定使用短路啟斷容量 Ics（啟斷後仍能繼續使用的短路電流值）。四項都是。"},{"c":15,"n":1,"a":[2],"q":"220V 2000W 之電阻性電熱爐如改接於110V 電源時，其消耗之功率為多少W？","o":["100","500","1000","2000"],"x":"電阻性電熱爐電阻固定，功率與電壓平方成正比：P2 = P1 ×（V2 ÷ V1）² = 2000 ×（110 ÷ 220）² = 2000 × 1/4 = 500W。也可先求 R = 220² ÷ 2000 = 24.2Ω，再算 110² ÷ 24.2 = 500W。記法：電壓減半，功率剩四分之一。"},{"c":15,"n":2,"a":[2],"q":"工業用紅外線燈電熱設備之裝設分路，其對地電壓不得超過多少伏特為原則？","o":["110","150","220","300"],"x":"依「用戶用電設備裝置規則」，工業用紅外線燈電熱設備的分路，對地電壓以不超過 150 伏特為原則；超過 150 伏特時另有附加限制（如燈具不附手操作開關）。"},{"c":15,"n":3,"a":[4],"q":"個別電阻電銲機供電給自動點銲機者，其電源導線安培容量不得小於電銲機一次側額定電流百分之多少？","o":["30","40","50","70"],"x":"依「用戶用電設備裝置規則」，個別電阻電銲機的電源導線安培容量：供電給自動點銲機者，不得小於電銲機一次側額定電流的百分之七十；人工點銲機則為百分之五十。記法：自動的工作率高，要求七成；人工的五成。"},{"c":15,"n":4,"a":[3],"q":"工業用紅外線電熱燈具容量超過多少瓦特，不得採用螺旋型燈座？","o":["100","200","300","400"],"x":"依「用戶用電設備裝置規則」，工業用紅外線電熱燈具容量超過 300 瓦特者，不得採用螺旋型燈座，應採用耐熱、接觸可靠的其他型式燈座，以免高溫使螺旋燈座接觸不良過熱。"},{"c":15,"n":5,"a":[3],"q":"在一定電壓下，兩只400W 之電阻性電熱器接成串接，每一個電熱器之消耗功率為多少W？","o":["300","150","100","75"],"x":"設每只電阻為 R，額定 400W 時 400 = V² ÷ R。兩只串接後總電阻 2R，總功率 = V² ÷ 2R = 200W，每只平分各 100W。也可這樣想：每只分得電壓一半，功率 =（1/2）² × 400 = 100W。"},{"c":15,"n":6,"a":[2],"q":"每台電弧電銲機應有過電流保護裝置，其安培額定不得大於該電銲機一次側最大額定電流多少倍？","o":["1","2","3","4"],"x":"依「用戶用電設備裝置規則」，每台電弧電銲機應有過電流保護裝置，其安培額定不得大於該電銲機一次側最大額定電流的 2 倍（百分之二百）。"},{"c":15,"n":7,"a":[3],"q":"工業用紅外線燈電熱設備之裝設，分路對地電壓超過150 伏特，且在多少伏特以下時，燈具應不附裝以手操作之開關？","o":["200","250","300","400"],"x":"依「用戶用電設備裝置規則」，工業用紅外線燈電熱設備的分路對地電壓超過 150 伏特、在 300 伏特以下時，燈具不得附裝以手操作的開關，避免人員在較高電壓下操作感電。"},{"c":15,"n":8,"a":[2],"q":"工業用紅外線燈電熱設備之裝設，內部配線之接續應採用溫升在攝氏多少度以下之接續端子？","o":["30","40","50","60"],"x":"依「用戶用電設備裝置規則」，工業用紅外線燈電熱設備內部配線的接續，應採用溫升在攝氏 40 度以下的接續端子，因為燈具本身溫度高，端子溫升須受限制以防過熱劣化。"},{"c":15,"n":9,"a":[4],"q":"工業用紅外線燈電熱設備之裝設，分路最大電流額定應在多少安培以下？","o":["20","30","40","50"],"x":"依「用戶用電設備裝置規則」，工業用紅外線燈電熱設備的分路，最大電流額定應在 50 安培以下。"},{"c":15,"n":10,"a":[3],"q":"個別電阻電銲機供電給人工點銲機者，其電源導線安培容量不得小於電銲機一次側額定電流百分之多少？","o":["30","40","50","70"],"x":"依「用戶用電設備裝置規則」，個別電阻電銲機供電給人工點銲機者，電源導線安培容量不得小於電銲機一次側額定電流的百分之五十；自動點銲機則為百分之七十。人工操作間歇時間長，所以要求較低。"},{"c":15,"n":11,"a":[4],"q":"電熱器之電阻為100 歐姆，通過5 安培的電流，若使用1 分鐘，該電熱器產生之熱量為多少卡？","o":["21340","24000","25920","36000"],"x":"焦耳定律以卡計：H = 0.24 I²Rt。代入 I = 5A、R = 100Ω、t = 60 秒：H = 0.24 × 5² × 100 × 60 = 0.24 × 25 × 6000 = 0.24 × 150000 = 36000 卡。注意時間要換成秒。"},{"c":15,"n":12,"a":[1],"q":"兩只完全相同之額定容量為220V、2000W 之電阻性電熱器串接在220V電源時，其消耗之總功率為多少W？","o":["1000","750","500","250"],"x":"每只電阻 R = 220² ÷ 2000 = 24.2Ω，串接總電阻 48.4Ω，接 220V 時總功率 = 220² ÷ 48.4 = 48400 ÷ 48.4 = 1000W。記法：兩只相同電熱器串接在額定電壓下，總功率剩單只的一半。"},{"c":15,"n":13,"a":[3],"q":"工業用紅外線燈電熱設備之裝設，內部配線之導線應採用多少毫米以上石棉、玻璃纖維等耐熱性絕緣導線？","o":["1.0","1.2","1.6","2.0"],"x":"依「用戶用電設備裝置規則」，工業用紅外線燈電熱設備內部配線，應採用 1.6 毫米以上的石棉、玻璃纖維等耐熱性絕緣導線，以承受燈具的高溫。"},{"c":15,"n":14,"a":[2],"q":"有一電熱器之電阻為100Ω，若使用20 分鐘，產生之熱量為30000 焦耳，通過電熱器之電流為多少A？","o":["0.25","0.5","2.5","5"],"x":"W = I²Rt，t 換算為秒：20 分 = 1200 秒。I² = W ÷（R × t）= 30000 ÷（100 × 1200）= 30000 ÷ 120000 = 0.25，所以 I = √0.25 = 0.5A。"},{"c":15,"n":15,"a":[4],"q":"在純電阻電路中，電壓與電流相位關係為何？","o":["電壓落後電流90 度","電壓落後電流45 度","電壓超前電流90 度","電壓與電流同相位"],"x":"純電阻電路沒有儲能元件，電流隨電壓同步變化，兩者同相位，相角差為 0 度，功率因數為 1。電感性電路才是電壓超前電流，電容性電路則是電壓落後電流。"},{"c":15,"n":16,"a":[1,2,3],"q":"下列哪些單位換算正確？","o":["1cal=4.2joule","1joule=0.24cal","1BTU=1055joule","1BTU=2520cal"],"x":"熱功當量：1 卡 ≈ 4.2 焦耳（精確約 4.186），1 焦耳 ≈ 0.24 卡；1BTU ≈ 1055 焦耳。錯誤者：1BTU ≈ 1055 × 0.24 ≈ 252 卡，不是 2520 卡，多了一個 0。"},{"c":15,"n":17,"a":[2,4],"q":"間接加熱煮飯用電鍋，其電壓為 110 V，煮飯用加熱元件的功率為 800 W，保溫用加熱元件的功率為 40 W，下列哪些正確？","o":["煮飯時電流約為 3.6 A","保溫時電流約為 0.36 A","煮飯用加熱元件的電阻值大於保溫用加熱元件的電阻值","煮飯用加熱元件的電阻值小於保溫用加熱元件的電阻值"],"x":"煮飯電流 I = P ÷ V = 800 ÷ 110 ≈ 7.27A，不是 3.6A；保溫電流 = 40 ÷ 110 ≈ 0.36A，正確。電阻 R = V² ÷ P：煮飯元件 = 12100 ÷ 800 ≈ 15.1Ω，保溫元件 = 12100 ÷ 40 = 302.5Ω，所以煮飯元件電阻較小。記法：同電壓下功率大的電阻小。"},{"c":15,"n":18,"a":[1,2],"q":"假設電熱器效率為75%，使用600W 的電熱器，在一大氣壓之下，將2 公升的水由15℃加熱至沸點，需要多少時間？","o":["1574.1 秒","26.2 分","6000 秒","100 分"],"x":"所需熱量 H = m × s × Δt = 2000g × 1 ×（100 − 15）= 170000 卡。電熱器有效產熱 = 0.24 × P × η × t = 0.24 × 600 × 0.75 × t = 108t 卡。t = 170000 ÷ 108 ≈ 1574.1 秒，換算 1574.1 ÷ 60 ≈ 26.2 分。兩種表示都正確。"},{"c":15,"n":19,"a":[2,4],"q":"電阻為330Ω之電熱器，接於110V 電源上，浸入600g20℃之水中，盛水容器每秒散熱0.8cal，需加熱多久才能使水之溫度上升至100℃？","o":["3288秒","6000 秒","54.8 分","100 分"],"x":"電熱器功率 P = V² ÷ R = 110² ÷ 330 ≈ 36.67W，每秒產熱 0.24 × 36.67 = 8.8 卡，扣除散熱 0.8 卡，每秒淨得 8 卡。所需熱量 = 600 ×（100 − 20）= 48000 卡。t = 48000 ÷ 8 = 6000 秒 = 100 分。"},{"c":15,"n":20,"a":[1,2,3],"q":"如果太陽能照射於每平方毫米面積每分鐘之熱量是1.8 卡（1 卡=4.2 焦耳），照射於面積1 平方米的熱能是多少千瓦，下列哪些結果錯誤？","o":["4.2","2.33","1.8","1.26"],"x":"依題庫答案，熱量應以每平方公分每分鐘1.8卡計算：1平方米＝10000平方公分，每分鐘熱量＝18000卡＝75600焦耳，功率＝75600÷60＝1260W＝1.26千瓦，所以1.26正確，其餘為錯誤結果。註：題目「每平方毫米」應為「每平方公分」之誤植，照字面計算會得126千瓦；太陽常數約為每平方公分每分鐘1.94卡。","f":"誤植"},{"c":15,"n":21,"a":[1,2,4],"q":"下列敘述哪些正確？","o":["1 卡是使1 克的水升高1℃所需的熱量","1BTU 是使1 磅的水升高1℉所需的熱量","比熱是指物體上升1℃所需的之熱量","1 焦耳是使1 公升的水上升0.24×10\u0002-3\u0002℃的熱量"],"x":"1 卡是使 1 克水升高 1℃ 的熱量；1BTU 是使 1 磅水升高 1℉ 的熱量；1 焦耳 = 0.24 卡，1 公升水為 1000 克，可升溫 0.24 ÷ 1000 = 0.24×10⁻³℃，三者正確。錯誤者：比熱是「單位質量（1 克）」物質升高 1℃ 所需熱量，漏了單位質量就變成熱容量。"},{"c":16,"n":1,"a":[1],"q":"第一種接地之接地電阻應保持在多少Ω以下？","o":["25","50","75","100"],"x":"依「用戶用電設備裝置規則」，第一種接地用於非接地系統之高壓用電設備接地，接地電阻應保持在25Ω以下。把四種接地電阻一起背：特種10Ω、第一種25Ω、第二種50Ω、第三種依對地電壓為100、50、10Ω。"},{"c":16,"n":2,"a":[2],"q":"高壓電動機外殼之接地屬","o":["設備與系統共同接地","設備接地","高壓電源系統接地","內線系統接地"],"x":"高壓電動機外殼是用電設備的非帶電金屬部分，把它接地是為了防止漏電時外殼帶電造成感電，所以屬於「設備接地」。電源系統接地、內線系統接地指的是電路導線（中性線、被接地導線）的接地，不是外殼。"},{"c":16,"n":3,"a":[4],"q":"12kV/120V 比壓器二次側引線接地屬何種接地？","o":["特種","第一種","第二種","第三種"],"x":"比壓器（PT）、比流器（CT）這類變比器的二次側引線接地，依「用戶用電設備裝置規則」歸類為第三種接地，接地線用3.5平方毫米以上絕緣線即可。記法：二次側是低壓量測回路，和低壓設備接地同屬第三種。"},{"c":16,"n":4,"a":[1],"q":"單相三線用戶，接戶線為30 平方毫米時，其內線系統單獨接地，銅接地導線應採用多少平方毫米？","o":["8","5.5","3.5","2.0"],"x":"內線系統單獨接地的接地導線線徑，是依接戶線線徑查表決定：接戶線30平方毫米以下，銅接地導線應採用8平方毫米。接戶線越粗，可能的故障電流越大，接地線也要跟著加粗，例如60至80平方毫米就要22平方毫米。"},{"c":16,"n":5,"a":[4],"q":"電源系統若經接地後，其對地電壓超過多少伏特者不得接地？","o":["110","150","208","300"],"x":"依「用戶用電設備裝置規則」，電源系統經接地後，若對地電壓超過300V就不得接地。例如三相三線380V若把一相接地，另兩相對地即達380V，超過300V；而三相四線380/220V中性點接地後對地僅220V，所以應接地。"},{"c":16,"n":6,"a":[1],"q":"鋼板接地電極，其厚度應在6.4 毫米以上，且任一面與土壤接觸之總面積不得小於多少平方米？","o":["0.186","0.286","0.386","0.486"],"x":"依用戶用電設備裝置規則第98條，板狀接地電極任一面與土壤接觸面積應達0.186平方米以上（約2平方英尺）；鐵板或鋼板厚度6.4毫米以上，銅板厚度1.5毫米以上。記住0.186這個數字，是由英制2平方英尺換算而來。"},{"c":16,"n":7,"a":[3],"q":"埋設棒狀或管狀接地電極者，與土壤接觸長度應為2.4 米以上，並垂直釘設於施工地面下多少米以上？","o":["0.3","0.6","1","1.5"],"x":"棒狀或管狀接地電極，與土壤接觸長度應在2.4米以上，並應垂直釘設於施工地面下1米以上。打太淺容易受地表乾濕變化影響，接地電阻不穩定，所以頂端也要埋到地面下1米。"},{"c":16,"n":8,"a":[4],"q":"特種接地及第二種接地裝設於人員可輕易觸及之場所者，自地面下0.6米起至地面上多少米範圍，應以絕緣管或板掩蔽？","o":["3","2.5","2","1.8"],"x":"特種及第二種接地若裝在人員容易碰觸的地方，接地線自地面下0.6米起至地面上1.8米的範圍，要用絕緣管或絕緣板掩蔽，避免故障電流流經接地線時人員觸碰而感電。口訣：下0.6、上1.8。"},{"c":16,"n":9,"a":[4],"q":"高壓系統及電路之用電設備接地，其設備接地導線非屬整體電纜組合之一部分者，線徑不得小於多少平方毫米？","o":["3.5","5.5","8.0","14"],"x":"依「用戶用電設備裝置規則」，高壓系統及電路的用電設備接地，若設備接地導線不是整體電纜組合的一部分（單獨另拉的接地線），線徑不得小於14平方毫米，以確保足夠的機械強度與故障電流容量。"},{"c":16,"n":10,"a":[1],"q":"接地電極採用兩管或兩板以上時，為求有效降低接地電阻，管或板之距離不得小於多少米？","o":["1.8","1.5","1.2","1"],"x":"接地電極用兩管或兩板以上並聯時，彼此距離不得小於1.8米。電極靠太近，周圍電位互相干擾（電阻區重疊），並聯後的接地電阻降不下來，拉開距離才能有效降低接地電阻。"},{"c":16,"n":11,"a":[4],"q":"非接地系統之高壓用電設備接地應使用多少平方毫米以上之絕緣線？","o":["38","22","8","5.5"],"x":"非接地系統的高壓用電設備接地屬第一種接地，依「用戶用電設備裝置規則」，其接地線應使用5.5平方毫米以上的絕緣線，接地電阻25Ω以下。可把第一種接地記成「25Ω、5.5平方毫米」一組。"},{"c":16,"n":12,"a":[2],"q":"用電設備單獨接地之接地線或用電設備與內線系統共同接地之連接線，若過電流保護器之額定或標置在100A 時，其銅接地導線之最小線徑為多少平方毫米？","o":["14","8","5.5","3.5"],"x":"設備接地線線徑是依過電流保護器的額定或標置查表：60A以下用5.5平方毫米，100A以下用8平方毫米，200A以下用14平方毫米。本題100A，對應銅接地導線最小8平方毫米。"},{"c":16,"n":13,"a":[1],"q":"低壓配電系統之金屬導線管及其連接之金屬箱應採用何種接地？","o":["第三種","第二種","第一種","特種"],"x":"低壓配電系統的金屬導線管及與其連接的金屬箱，屬於低壓用電設備的非帶電金屬部分，依「用戶用電設備裝置規則」應採第三種接地。凡是低壓設備外殼、管、箱的接地，都歸第三種。"},{"c":16,"n":14,"a":[4],"q":"多少平方毫米以上絕緣被覆線於接地線系統施工時，在露出部分之絕緣或被覆上以綠色膠帶做為永久識別時，可做為接地線？","o":["3.5","5.5","8.0","14"],"x":"接地線原則上要用綠色或綠色加黃色條紋的絕緣線。但14平方毫米以上的較粗絕緣線，可以在施工時於露出部分的絕緣被覆上纏綠色膠帶做永久識別，當作接地線使用。粗線才有這個例外，細線不行。"},{"c":16,"n":15,"a":[2],"q":"特種及第二種接地裝設於人員可輕易觸及之場所時，自地面下0.6 米起至地面上多少米範圍，應以絕緣管或板掩蔽？","o":["1.5","1.8","2","2.5"],"x":"特種及第二種接地裝在人員可輕易觸及處時，接地線自地面下0.6米起至地面上1.8米範圍，應以絕緣管或板掩蔽，防止接地線帶故障電流時人員感電。和另一題相同，口訣：下0.6、上1.8。"},{"c":16,"n":16,"a":[2],"q":"以接地銅棒作接地電極時，其直徑不得小於多少毫米，且長度不得短於2.4 米？","o":["10","15","20","25"],"x":"以接地銅棒（鋼心包銅棒）作接地電極時，直徑不得小於15毫米，長度不得短於2.4米。若改用管狀電極，外徑則要19毫米以上，兩者別搞混：棒15、管19。"},{"c":16,"n":17,"a":[1],"q":"用電設備單獨接地之接地線或用電設備與內線系統共同接地之連接線，若過電流保護器之額定或標置在150A 時，其銅接地導線之最小線徑為多少平方毫米？","o":["14","8","5.5","3.5"],"x":"設備接地線線徑依過電流保護器額定查表：100A以下用8平方毫米，超過100A至200A用14平方毫米。本題150A落在200A以下這一級，所以銅接地導線最小線徑為14平方毫米。"},{"c":16,"n":18,"a":[2],"q":"非接地系統之高壓用電設備接地，其接地電阻應在多少Ω以下？","o":["10","25","50","100"],"x":"非接地系統的高壓用電設備接地屬第一種接地，依「用戶用電設備裝置規則」，接地電阻應在25Ω以下。對照：特種10Ω、第一種25Ω、第二種50Ω。"},{"c":16,"n":19,"a":[4],"q":"被接地導線之絕緣皮應選用何種顏色來識別？","o":["綠","紅","黑","白"],"x":"被接地導線（例如中性線）的絕緣皮應以白色或灰色識別。綠色是保留給接地線（設備接地導線）使用的，紅、黑則是非接地的火線常用色。記法：中性白灰、接地綠。"},{"c":16,"n":20,"a":[2],"q":"電動機外殼接地的目的是在防止","o":["過載","感電","馬達發生過熱","電壓閃爍"],"x":"電動機外殼接地的目的是防止感電。當絕緣劣化漏電時，故障電流經接地線導入大地，外殼電位被壓低，並讓保護器動作，人碰到外殼才不會觸電。過載、過熱、電壓閃爍和外殼接地無關。"},{"c":16,"n":21,"a":[4],"q":"採60 平方公厘接戶線供電之用戶，其內線系統單獨接地或與設備共同接地之銅接地導線應採用多少平方毫米以上之銅導線？","o":["5.5","8","14","22"],"x":"內線系統接地或與設備共同接地的接地導線，依接戶線線徑查表：接戶線60至80平方毫米者，銅接地導線應採用22平方毫米以上。本題接戶線60平方毫米，所以是22平方毫米。"},{"c":16,"n":22,"a":[4],"q":"屋外供電線路交流多重接地系統，各接地線之電流容量應為其所引接導線電流容量之多少以上？","o":["二分之一","三分之一","四分之一","五分之一"],"x":"依輸配電相關規定，屋外供電線路交流多重接地系統中，各接地線的電流容量應為其所引接導線電流容量的五分之一以上。多重接地有許多接地點分攤電流，所以每一處只要求五分之一。"},{"c":16,"n":23,"a":[4],"q":"「輸配電設備裝置規則」規定多重接地系統之中性導體（線）應具有足夠之線徑及安培容量以滿足其責務，除各接戶設施之接地點不計外，使設置電極或既設電極於整條線路上每1.6 公里合計至少有多少個接地點？","o":["1","2","3","4"],"x":"「輸配電設備裝置規則」規定多重接地系統的中性導體，除各接戶設施的接地點不計外，整條線路每1.6公里合計至少要有4個接地點，確保中性線電位穩定、故障電流有足夠回路。記法：1.6公里4點。"},{"c":16,"n":24,"a":[4],"q":"600kVA 變壓器在施行特種接地時，其接地導線線徑應不小於多少平方毫米？","o":["5.5","8","22","38"],"del":1},{"c":16,"n":25,"a":[1],"q":"有一高壓感應電動機，接於3.3kV 非接地系統之電源上，該電動機之外殼應採何種接地？","o":["第一種","第二種","第三種","特種"],"x":"3.3kV非接地系統屬高壓，接在其上的高壓感應電動機外殼接地，就是「非接地系統之高壓用電設備接地」，依「用戶用電設備裝置規則」應採第一種接地，接地電阻25Ω以下。"},{"c":16,"n":26,"a":[1],"q":"3ψ4W 11.4kV 多重接地系統供電地區用戶變壓器之低壓電源系統接地之接地電阻應在多少歐姆以下？","o":["10","25","50","100"],"x":"三相四線11.4kV多重接地系統供電地區，用戶變壓器的低壓電源系統接地屬特種接地，接地電阻應在10Ω以下。多重接地系統要求較嚴，所以是四種接地中最低的10Ω。"},{"c":16,"n":27,"a":[1],"q":"配電變壓器之二次側低壓線或中性線之接地稱為","o":["低壓電源系統接地","設備接地","內線系統接地","設備與系統共同接地"],"x":"配電變壓器二次側的低壓線或中性線接地，是電源端的系統接地，稱為「低壓電源系統接地」。若是在用戶端將被接地導線再接地，才叫內線系統接地；設備外殼接地叫設備接地。"},{"c":16,"n":28,"a":[1],"q":"三相四線多重接地系統供電地區用戶變壓器之低壓電源系統接地應採用何種接地？","o":["特種","第一種","第二種","第三種"],"x":"依「用戶用電設備裝置規則」，三相四線多重接地系統供電地區，用戶變壓器的低壓電源系統接地採特種接地（10Ω以下）；若是三相三線非接地系統供電地區，才採第二種接地（50Ω以下）。"},{"c":16,"n":29,"a":[1],"q":"用戶用電設備裝置規則之特種接地，其接地電阻應保持在多少Ω以下？","o":["10","25","50","100"],"x":"「用戶用電設備裝置規則」中特種接地的接地電阻應保持在10Ω以下，是四種接地中要求最嚴的。對照記：特種10、第一種25、第二種50。"},{"c":16,"n":30,"a":[3],"q":"特種接地如沿金屬物體（鐵塔或鐵柱等）設施時，除依規定加以掩蔽外，其接地電極導線應與金屬物體絕緣，且接地電極埋設位置應距離金屬物體多少米以上？","o":["0.5","0.8","1","1.8"],"x":"特種接地若沿鐵塔、鐵柱等金屬物體施設，除了依規定掩蔽外，接地導線要與金屬物體絕緣，接地電極埋設位置也要距離金屬物體1米以上，避免故障電流經金屬物體擴散造成危險電位。"},{"c":16,"n":31,"a":[2],"q":"停電工作掛接地線時應","o":["手戴棉紗手套","手戴絕緣手套","手戴任何材質手套均可","不得戴手套"],"x":"停電工作掛接地線前，線路可能仍有殘留電荷或被誤送電、感應電壓，所以必須戴絕緣手套操作，並先驗電再掛接地。棉紗手套不絕緣，不戴手套更危險。"},{"c":16,"n":32,"a":[2],"q":"第三種接地對地電壓151V 至300V，其接地電阻應在多少Ω以下？","o":["100","50","25","10"],"x":"第三種接地的接地電阻依對地電壓分級：150V以下100Ω以下，151V至300V為50Ω以下，301V以上為10Ω以下。本題151V至300V，所以是50Ω以下。電壓越高，要求的電阻越小。"},{"c":16,"n":33,"a":[4],"q":"第三種接地對地電壓301V 以上，其接地電阻應在多少Ω以下？","o":["100","50","25","10"],"x":"第三種接地依對地電壓分級：150V以下100Ω、151V至300V為50Ω、301V以上為10Ω。本題對地電壓301V以上，要求最嚴，接地電阻應在10Ω以下。"},{"c":16,"n":34,"a":[2],"q":"用戶用電線路屬於被接地導線之再行接地者，稱為","o":["設備接地","內線系統接地","低壓電源系統接地","設備與系統共用接地"],"x":"在用戶端將用電線路中的被接地導線（如中性線）再行接地，稱為「內線系統接地」。若是變壓器二次側的接地叫低壓電源系統接地；設備外殼接地則叫設備接地。"},{"c":16,"n":35,"a":[1],"q":"變比器二次側接地應選用多少平方毫米以上絕緣導線？","o":["3.5","5.5","8","22"],"x":"變比器（比壓器、比流器）二次側接地屬第三種接地，依「用戶用電設備裝置規則」，接地線應選用3.5平方毫米以上的絕緣導線。二次側是量測用小電流回路，所以線徑要求不大。"},{"c":16,"n":36,"a":[4],"q":"內線系統接地屬何種接地？","o":["特種","第一種","第二種","第三種"],"x":"內線系統接地是用戶端將低壓被接地導線再行接地，依「用戶用電設備裝置規則」屬第三種接地。第三種接地涵蓋低壓設備接地、內線系統接地及變比器二次側接地。"},{"c":16,"n":37,"a":[4],"q":"內線系統接地與設備接地共用一條接地電極導線或同一接地電極，稱為","o":["設備接地","內線系統接地","低壓電源系統接地","設備與系統共用接地"],"x":"內線系統接地與設備接地共用同一條接地電極導線或同一個接地電極，稱為「設備與系統共同接地」。單獨把被接地導線接地叫內線系統接地，單獨把外殼接地叫設備接地。"},{"c":16,"n":38,"a":[1,2,3,4],"q":"接地方式有下列哪些？","o":["設備接地","內線系統接地","低壓電源系統接地","設備與系統共同接地"],"x":"依「用戶用電設備裝置規則」，接地方式分為四類：設備接地（外殼等非帶電金屬）、內線系統接地（用戶端被接地導線再接地）、低壓電源系統接地（變壓器二次側接地）、設備與系統共同接地（兩者共用接地線或電極）。四項都對。"},{"c":16,"n":39,"a":[1,2,3,4],"q":"接地種類有下列哪些？","o":["特種接地","第一種接地","第二種接地","第三種接地"],"x":"依「用戶用電設備裝置規則」，接地種類分四種：特種接地（10Ω以下）、第一種接地（25Ω以下）、第二種接地（50Ω以下）、第三種接地（依對地電壓100、50、10Ω）。四項都正確，別和接地方式（設備、內線系統等）搞混。"},{"c":16,"n":40,"a":[1,2,3],"q":"下列哪些處所之接地屬第三種接地？","o":["低壓用電設備接地","內線系統接地","變比器二次線接地","高壓用電設備接地"],"x":"第三種接地適用於低壓用電設備接地、內線系統接地、變比器二次線接地，這三項正確。高壓用電設備接地錯在等級不對：非接地系統要用第一種接地，多重接地系統則用特種接地，不屬第三種。"},{"c":16,"n":41,"a":[2,3],"q":"被接地導線之絕緣皮應使用下列哪些顏色以資識別？","o":["綠色","白色","灰色","綠色加一條以上黃色條紋者"],"x":"被接地導線（中性線）的絕緣皮應以白色或灰色識別。綠色、綠色加黃色條紋則是保留給接地線使用的識別色，不可用於被接地導線。記法：中性白灰、接地綠黃。"},{"c":16,"n":42,"a":[1,4],"q":"個別被覆或絕緣之接地線，其外觀應為下列哪些顏色以資識別？","o":["綠色","白色","灰色","綠色加一條以上之黃色條紋者"],"x":"個別被覆或絕緣的接地線，外觀應為綠色，或綠色加一條以上黃色條紋，以資識別。白色、灰色是被接地導線（中性線）的識別色，不能拿來標示接地線。記法：接地綠黃、中性白灰。"},{"c":16,"n":43,"a":[2,3],"q":"50 伏特以上、低於600 伏特之交流電源系統，下列何者得免接地？","o":["電容器","專用於供電給熔解用途之工業電爐","存在可燃性粉塵之危險場所運轉之電動起重機","電熱裝置"],"x":"50V以上、低於600V的交流系統原則上應接地，但有例外得免接地：專供熔解等用途的工業電爐，以及在可燃性粉塵危險場所運轉的電動起重機，這兩項是規定中的免接地情形。電容器、電熱裝置則不在免接地之列。"},{"c":16,"n":44,"a":[1,3],"q":"下列哪些低壓電源系統除另有規定外應加以接地？","o":["3ψ4W 380/220V","3ψ3W 380V","3ψ4W 440/254V","3ψ3W 440V"],"x":"低壓電源系統接地後對地電壓不超過300V者應加以接地。3ψ4W 380/220V中性點接地後對地220V、3ψ4W 440/254V對地254V，都在300V以內，應接地。3ψ3W 380V與440V沒有中性點，若一相接地則對地電壓超過300V，不在應接地之列。"},{"c":16,"n":45,"a":[1,2,3,4],"q":"下列哪些低壓用電器具應加接地？","o":["低壓電動機之外殼","電纜之金屬被覆","金屬導線管及其連接之金屬封閉箱體","X 光設備及其鄰近金屬部分"],"x":"低壓電動機外殼、電纜的金屬被覆、金屬導線管及連接的金屬封閉箱體、X光設備及其鄰近金屬部分，都是可能因絕緣劣化而帶電的非帶電金屬部分，依「用戶用電設備裝置規則」均應加接地以防感電，四項都對。"},{"c":16,"n":46,"a":[1,4],"q":"棒狀及管狀電極，長度不得小於2.4 米，另應符合下列哪些規定？","o":["鋼心包銅之棒狀接地電極直徑不得小於15 毫米","鋼心包銅之棒狀接地電極直徑不得小於19 毫米","管狀接地電極之外徑不得小於15 毫米","管狀接地電極之外徑不得小於19 毫米"],"x":"棒狀及管狀電極長度不得小於2.4米。鋼心包銅的棒狀電極直徑不得小於15毫米，管狀電極外徑不得小於19毫米。錯誤選項把數字對調了：棒狀寫成19毫米、管狀寫成15毫米都不對。口訣：棒15、管19。"},{"c":16,"n":47,"a":[1,2,3,4],"q":"下列哪些項目是工業配電系統中性點接地之優點？","o":["降低暫態過電壓","改善雷擊保護","容易檢出故障","降低線路及設備絕緣等級"],"x":"工業配電系統中性點接地的優點包括：抑制間歇性接地故障造成的暫態過電壓、改善雷擊保護效果、發生接地故障時容易檢出並讓保護電驛動作，以及因對地電壓被固定而能降低線路及設備的絕緣等級。四項都正確。"},{"c":16,"n":48,"a":[1,2,3],"q":"下列哪些項目和接地銅棒之接地電阻有關？","o":["大地的電阻係數","接地銅棒直徑","接地銅棒長度","接地銅棒的導電率"],"x":"接地棒的接地電阻約為R＝ρ／(2πL)×〔ln(4L／d)－1〕，與大地電阻係數ρ、接地棒長度L、直徑d有關。長度影響最大，打越深電阻越小。接地銅棒本身的導電率很高，其電阻相對大地可忽略，故與接地電阻無關。"},{"c":17,"n":1,"a":[4],"q":"特別低壓設施係指電壓在多少伏特以下，並使用隔離變壓器者？","o":["600","300","150","30"],"x":"依「用戶用電設備裝置規則」，特別低壓設施是指電壓在30V以下，並使用隔離變壓器供電者，常見如電鈴、對講機、遙控電路等。重點兩個：30V以下、隔離變壓器，二次側與一次側電氣隔離才安全。"},{"c":17,"n":2,"a":[1],"q":"特別低壓線路與其他用電線路、水管、煤氣管等應距離多少毫米以上？","o":["150","300","500","600"],"x":"特別低壓線路與其他用電線路、水管、煤氣管等應保持150毫米以上距離，避免其他線路的高電壓串入特別低壓回路，或因接觸金屬管路造成危險。"},{"c":17,"n":3,"a":[1],"q":"供給特別低壓的隔離變壓器，應以最大電流多少安培以下之分路供電？","o":["20","30","50","100"],"x":"供給特別低壓的隔離變壓器，其一次側應由最大電流20A以下的分路供電，限制故障時的能量，確保特別低壓設施的安全。記法：特別低壓一次側，分路20A封頂。"},{"c":17,"n":4,"a":[1],"q":"在麻醉區域中，經常與人體碰觸或有暴露帶電部分之特別低壓設備，其運轉電壓應該在多少伏特以下？","o":["10","20","30","40"],"x":"麻醉區域內常有易燃麻醉氣體，人體又常直接接觸設備，所以要求更嚴：經常與人體碰觸或有暴露帶電部分的特別低壓設備，運轉電壓應在10V以下，比一般特別低壓的30V更低。"},{"c":17,"n":5,"a":[2],"q":"特別低壓設施之電路裝設，其暴露二次側導線線徑不得小於多少平方毫米？","o":["0.8","1.0","1.2","1.6"],"x":"特別低壓設施的暴露二次側導線，線徑不得小於1.0平方毫米，以維持足夠的機械強度，避免因拉扯、碰撞而斷線。"},{"c":17,"n":6,"a":[1],"q":"特別低壓設施之變壓器，其二次側電壓應在多少伏特以下？","o":["30","150","250","300"],"x":"特別低壓設施使用的隔離變壓器，二次側電壓應在30V以下，這正是「特別低壓」的定義。配合記一次側250V以下：一次250、二次30。"},{"c":17,"n":7,"a":[1],"q":"特別低壓設施之變壓器，其一次側電壓應在多少伏特以下？","o":["250","300","380","440"],"x":"特別低壓設施隔離變壓器的一次側電壓應在250V以下，二次側則在30V以下。記法：一次250、二次30，一次側接一般低壓單相電源即可。"},{"c":17,"n":8,"a":[1],"q":"特別低壓設施之分路，其二次側電路應如何？","o":["不得接地","接地電阻10Ω以下","接地電阻50Ω以下","接地電阻100Ω以下"],"x":"特別低壓設施的二次側電路不得接地。隔離變壓器的用意就是讓二次側與大地浮接，人只碰到一線時沒有經大地回流的路徑，不會形成觸電回路；若二次側接地反而失去隔離保護效果。"},{"c":17,"n":9,"a":[4],"q":"特別低壓設施裝置二具以上隔離變壓器同時使用，其二次側應如何處理？","o":["得串聯連接","不得串聯連接","得並聯連接","不得並聯連接"],"x":"裝置二具以上隔離變壓器同時使用時，其二次側不得並聯連接。並聯會使短路時可供給的故障電流加大，超出單一變壓器限制電流的設計，也可能因電壓不一致產生環流。"},{"c":17,"n":10,"a":[3],"q":"三個電阻並聯，其電阻值分別為3Ω、6Ω、9Ω，已知流經9Ω電阻的電流為2A，則流經3Ω電阻的電流為多少A？","o":["2","4","6","8"],"x":"並聯電阻電壓相同。先求電壓：V＝I×R＝2A×9Ω＝18V。流經3Ω的電流I＝V／R＝18÷3＝6A。並聯時電流與電阻成反比，3Ω是9Ω的三分之一，電流就是三倍。"},{"c":17,"n":11,"a":[4],"q":"R\u00031\u0003 與R\u00032\u0003 兩電阻並聯，已知流過兩電阻之電流分別為I\u0003R1\u0003=6A，I\u0003R2\u0003=2A，且R\u00031\u0003=5Ω，則R\u00032\u0003 消耗功率為多少W？","o":["120","100","80","60"],"x":"並聯電壓相同，先由R1求電壓：V＝I1×R1＝6A×5Ω＝30V。R2消耗功率P＝V×I2＝30V×2A＝60W。（也可求R2＝30÷2＝15Ω，P＝I²R＝2²×15＝60W，兩法一致。）"},{"c":17,"n":12,"a":[4],"q":"在一電路中，有5A 電流流過一個4Ω電阻，其電阻消耗的電功率為多少W？","o":["20","60","80","100"],"x":"已知電流與電阻，用P＝I²R：P＝5²×4＝25×4＝100W。記住功率三公式：P＝VI＝I²R＝V²／R，已知哪兩個量就挑哪個公式。"},{"c":17,"n":13,"a":[2],"q":"有三個電阻並聯，其電阻值分別為20Ω、10Ω、5Ω，如果流經5Ω電阻的電流為4A，則此電路總電流為多少A？","o":["9","7","5","3"],"x":"並聯電壓相同：V＝4A×5Ω＝20V。各支路電流：20÷20＝1A，20÷10＝2A，20÷5＝4A。總電流＝1＋2＋4＝7A。"},{"c":17,"n":14,"a":[2],"q":"在RLC 串聯電路中，已知R＝8Ω、X\u0003L\u0003＝8Ω、X\u0003C\u0003＝2Ω，則此電路總阻抗為多少Ω？","o":["2","10","16","18"],"x":"RLC串聯阻抗Z＝√〔R²＋(XL－XC)²〕。代入：XL－XC＝8－2＝6Ω，Z＝√(8²＋6²)＝√(64＋36)＝√100＝10Ω。注意電抗要先相減，不能和電阻直接相加。"},{"c":17,"n":15,"a":[1],"q":"如下圖所示之電路，若\u00010\u0001為6V，則8Ω電阻所消耗之功率為多少W？ \u00011\u0001","o":["2","4","8","12"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB8AAAAdBAMAAACgSKoBAAAAGFBMVEX///+rq6ugoKCVlZWOjo5tbW1HR0clJSW0WJrHAAAAoElEQVR42q3RsQ3CMBBA0Q9OegsKGoQyAiJMkAmQWIEB2QA2gAEoIiRax2UkEh+FceykznV+urPvzjBLqPIAqNKfluCOO0CqAcRqwH0H4AaAjWAAqCO4HFD3BBbAKrwJkH2glaSTzQkKYgmmQO1T6ECeQBZAclwNnPUfeFOFVjxcaUjvgMtjDP1aj6ETOykxTOAV90cy+7a3IcNHo+f5pR/YribzwPY7OgAAAABJRU5ErkJggg==",14,13],["data:image/png;base64,iVBOR
