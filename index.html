,["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAABPBAMAAAB49tpIAAAAGFBMVEX///+ioqKRkZF6enpmZmZAQEAaGhoDAwPx5MUEAAAAt0lEQVR42uWTsQ3CMBBFn+OIEmxHdAgptAiloqLKBoj5WIUJaOgp4g3sCRKKECJfQxEa4Jqzn76Lu/8N00v3rTi0sT9lfVMbQwKCJQUd7wD/DRRihQ6bCsclf3Ep0PVw6S6Qg30N2pnIT5Y+CfeLUoBa5EOLOJA1Amx9CrIoImV8CtRchG588QSVBK3I6ewmwEokWa1Ts1keI7hFc/VADuAcQHkfFFhgX50DgyIAfhcmf7EQPufgAwwkHxkL51oaAAAAAElFTkSuQmCC",14,36]],"x":"設每具電熱器 P、每線電阻 R。單相二線 110V：電流 2P/110，壓降＝2×(2P/110)×R＝4PR/110。單相三線平衡時中性線無電流，每邊壓降＝(P/110)×R＝PR/110。比值為 1/4 倍。"},{"c":3,"n":24,"a":[1,4],"q":"有關導線之敘述，下列哪些正確？","o":["絕緣軟銅線適用於建築物內配線","絕緣軟銅線適用於建築物外配線","絕緣硬銅線適用於建築物內配線","絕緣硬銅線適用於建築物外配線"],"x":"軟銅線柔軟好彎、施工方便，適用於建築物內配線；硬銅線抗拉強度大，適合要承受張力的建築物外（架空）配線。軟銅用於屋外、硬銅用於屋內這兩項說反了。"},{"c":3,"n":25,"a":[2,3,4],"q":"選擇導線線徑大小之條件，下列哪些正確？","o":["相序","周溫","電壓降","安培容量"],"x":"選線徑要看安培容量（能否承載負載電流）、電壓降（是否在允許範圍內）以及周溫（周溫高安培容量要打折）。相序只關係到接線與電動機轉向，與線徑大小無關。"},{"c":3,"n":26,"a":[1,2,3],"q":"有關低壓電纜之安培容量，會隨下列哪些因素改變？","o":["絕緣物材質","周溫","線徑大小","導線長短"],"x":"安培容量取決於導線的發熱與散熱：絕緣物材質決定容許溫度、周溫影響散熱裕度、線徑決定電阻大小。導線長短影響的是電壓降，不會改變安培容量。"},{"c":3,"n":27,"a":[1,2,4],"q":"下列哪些配線得用裸銅線？","o":["電氣爐所用之導線","乾燥室所用之導線","屋內配線所用之導線","電動起重機所用之滑接導線或類似性質者"],"x":"依用戶用電設備裝置規則，電氣爐所用導線、乾燥室所用導線，以及電動起重機的滑接導線或類似性質者，得使用裸銅線。一般屋內配線必須使用絕緣導線，不可用裸銅線。"},{"c":3,"n":28,"a":[2,3,4],"q":"有關被接地導線之敘述，下列哪些正確？","o":["單相二線之幹線或分路若對地電壓超過220 伏特時，其被接地導線應整條加以識別","多線式幹線電路或分路之中性線應加以識別","14 平方毫米以下之絕緣導線作為電路中之被接地導線者，其外皮應加以識別","可撓軟線作為被接地導線用之絕緣導線，其外皮應加以識別"],"x":"依用戶用電設備裝置規則第27條，被接地導線應以白色或淺灰色識別：多線式幹線或分路的中性線、14平方毫米以下作為被接地導線的絕緣導線外皮、作為被接地導線的可撓軟線外皮，都應識別。單相二線之幹線或分路要整條識別的條件是對地電壓超過150伏特，不是220伏特，所以該項錯誤。"},{"c":3,"n":29,"a":[1,2,3,4],"q":"導線在下列哪些情形下不得連接？","o":["導線管之內部","磁管之內部","木槽板之內部","被紮縛於磁珠或磁夾板之部分或其他類似情形"],"x":"導線連接處容易發熱、鬆脫，必須在可檢查維修的地方（如出線盒）進行。導線管內部、磁管內部、木槽板內部，以及紮縛於磁珠或磁夾板的部分，都不得連接導線，四項全選。"},{"c":3,"n":30,"a":[1,2,4],"q":"低壓絕緣電線之最高容許溫度為","o":["PVC 電線60℃","耐熱PVC 電線75℃","PE 電線80℃","交連PE 電線90℃"],"x":"依用戶用電設備裝置規則表二五～一「導線絕緣物之最高容許溫度」：PVC導線60℃、耐熱PVC導線75℃、交連PE導線90℃，這三項正確。PE（聚乙烯）導線與耐熱PVC導線同屬75℃一級，並不是80℃，所以該項錯誤。"},{"c":3,"n":31,"a":[1,2,4],"q":"PVC 管配線（導線絕緣物溫度60℃）安培容量表之導線數選用，不包括下列哪些導線？","o":["信號線","被接地導線","非接地導線","控制線"],"x":"安培容量表的導線數只計入實際載流、會發熱的非接地導線。信號線與控制線電流很小，被接地導線在平衡時電流也很小，這三種都不計入導線數。"},{"c":3,"n":32,"a":[2,3,4],"q":"金屬導線管配線（導線絕緣物溫度60℃）安培容量表適用於下列哪些配線？","o":["非金屬管配線","電纜","金屬管配線","金屬可撓導線管配線"],"x":"金屬導線管配線的安培容量表，適用於金屬管配線、金屬可撓導線管配線以及電纜。非金屬管（PVC 管）配線另有專用的安培容量表，不適用這張表。"},{"c":3,"n":33,"a":[1,3],"q":"14 平方毫米以下之絕緣導線作為電路中之識別導線者，其外皮應為下列哪些顏色以資識別？","o":["白色","紅色","淺灰色","綠色"],"x":"依用戶用電設備裝置規則，14 平方毫米以下的絕緣導線作為識別導線（被接地導線）時，外皮應為白色或淺灰色。綠色是接地線專用色，紅色則不是識別導線的顏色。記法：白、灰是中性線。"},{"c":3,"n":34,"a":[2,4],"q":"電路供應放電管燈者，因中性線有第三諧波電流存在，下列哪些供電方式仍應計入？","o":["單相二線式","單相三線式","三相三線式","三相四線式"],"x":"放電管燈（如日光燈）會產生第三諧波電流，在中性線上不會互相抵消反而疊加。所以單相三線式與三相四線式的中性線，即使負載平衡仍應計入導線數。單相二線與三相三線不涉及多線式中性線是否計入的問題。"},{"c":3,"n":35,"a":[1,2,4],"q":"有關銅的特性，下列哪些錯誤？","o":["半導體材料","絕緣材料","非磁性材料","磁性材料"],"x":"本題問「錯誤」的敘述。銅是良導體，也是非磁性材料，所以說銅是半導體材料、絕緣材料、磁性材料都錯。「非磁性材料」這項是正確敘述，不選。"},{"c":3,"n":36,"a":[1,2,4],"q":"有關電氣爐內配線，下列哪些導線不得選用？","o":["PVC 絞線","PVC 花線","裸銅線","電纜線"],"x":"電氣爐內溫度極高，PVC 絞線、PVC 花線、電纜的絕緣物都會熔化劣化，不得選用。依用戶用電設備裝置規則，電氣爐所用導線得使用裸銅線，所以裸銅線不在禁用之列。"},{"c":3,"n":37,"a":[1,3,4],"q":"有關銅導線使用，下列哪些正確？","o":["周溫愈高時，導線安培容量愈小","溫度上升，電路的電壓降減少","交流頻率愈高，集膚效應愈顯著","於直流電情況下，無集膚效應"],"x":"周溫愈高散熱愈差，安培容量愈小；交流頻率愈高集膚效應愈顯著，直流則沒有集膚效應，這三項正確。溫度上升時銅的電阻變大，電壓降會增加而不是減少，所以該項錯誤。"},{"c":4,"n":1,"a":[3],"q":"水平裝置之金屬導線槽應於每一終端處及距終端處多少米內，應予固定及支撐？","o":["0.5","1","1.5","2"],"x":"依用戶用電設備裝置規則，水平裝置的金屬導線槽要在每一終端處，以及距終端1.5米以內固定及支撐。記法：水平金屬導線槽「1.5米」一個單位；垂直裝置則放寬到每隔4.5米。"},{"c":4,"n":2,"a":[2],"q":"自匯流排槽引出之分岐匯流排槽如其長度不超過多少公尺時，其安培容量為其前端過電流保護額定值三分之一以上，且不與可燃性物質接觸者，得免在分岐點處另設過電流保護設備？","o":["10","15","20","25"],"x":"分歧匯流排槽長度不超過15公尺、安培容量達前端過電流保護額定值三分之一以上，且不與可燃物接觸，就可免在分歧點另設過電流保護。口訣：「15米、三分之一」一起記。"},{"c":4,"n":3,"a":[1],"q":"匯流排槽配置若垂直穿過乾燥樓地板，該樓地板上方多少米內應有避免外力損傷之保護，且穿過處應採用全密閉型匯流排槽？","o":["1.8","2.8","3.8","4.8"],"x":"匯流排槽垂直穿過乾燥樓地板時，樓地板上方1.8米以內要有防外力損傷的保護，穿越處採全密閉型。1.8米大約就是人手、推車容易碰撞到的高度。"},{"c":4,"n":4,"a":[4],"q":"在導線槽內接線或分歧時，該連接及分歧處各導線（包含接線及分接頭）所佔截面積不得超過該處導線槽內截面積之多少％？","o":["40","50","60","75"],"x":"導線槽內做接線或分歧時，接頭處較擁擠，規則容許各導線（含接線及分接頭）所佔截面積可到該處槽內截面積的75%。一般敷設是20%，接續處才放寬到75%，兩者別搞混。"},{"c":4,"n":5,"a":[4],"q":"MI 電纜彎曲時，不得使電纜受到損傷，電纜外徑19 毫米以下者，其彎曲處內側半徑，應為電纜外徑之幾倍以上？","o":["2","3","4","5"],"x":"MI電纜（礦物絕緣電纜）彎曲時不可傷及電纜，外徑19毫米以下者，彎曲內側半徑應為電纜外徑5倍以上；外徑更大者要求更大的倍數。"},{"c":4,"n":6,"a":[3],"q":"PVC 管以明管敷設時應予以支撐，且距配管之兩端多少毫米內，應裝設護管鐵、管夾或類似配件加以固定？","o":["150","200","300","350"],"x":"PVC管明管敷設時，距配管兩端300毫米以內要裝護管鐵或管夾固定。對照記：PVC管端300毫米、金屬管端900毫米，塑膠管較軟所以固定點要靠近管端。"},{"c":4,"n":7,"a":[2],"q":"交連PE 電纜其內部的交連PE 是做","o":["導電用","絕緣用","複合用","遮蔽用"],"x":"交連PE（XLPE）是將聚乙烯分子交聯處理後的材料，耐熱性與電氣性能佳，在電纜中是包在導體外的絕緣層，用途是絕緣，不是導電或遮蔽。"},{"c":4,"n":8,"a":[3],"q":"8 平方毫米以下低壓非金屬被覆電纜，沿建築物暴露以水平裝設其側面或下面者，其支撐最大間隔為多少米？","o":["0.3","0.5","1","1.2"],"x":"8平方毫米以下的非金屬被覆電纜，沿建築物側面或下面水平暴露裝設時，支撐間隔最大為1米，避免電纜下垂受力。"},{"c":4,"n":9,"a":[3],"q":"高壓電力電纜之外層遮蔽之主要用途為","o":["增強電纜扯斷強度","電纜外傷保護","保持絕緣體之零電位","增加耐電壓強度"],"x":"高壓電纜的外層遮蔽接地後，可使絕緣體外表面維持零電位，讓電場均勻分布在絕緣層內，避免局部電場集中造成絕緣劣化，並兼顧人員安全。它不是用來增加機械強度。"},{"c":4,"n":10,"a":[3],"q":"電纜若其通過電流無法保持電磁平衡時，應採用何種導線管？","o":["薄鋼導線管","厚鋼導線管","PVC 管","EMT 管"],"x":"電流無法保持電磁平衡時，若穿在金屬管內，管壁會因交變磁通產生渦流與磁滯損失而發熱。因此應改用不導磁的PVC管，就不會有感應發熱的問題。"},{"c":4,"n":11,"a":[2],"q":"在鋼筋混凝土內配管時，不得減損建築物之強度，集中配置時，不得超過混凝土厚度？","o":["1/2","1/3","2/3","3/4"],"x":"在鋼筋混凝土內集中配管時，不得減損建築物強度，管路所佔不得超過混凝土厚度的1/3。記法：埋管只能吃掉「三分之一」的厚度。"},{"c":4,"n":12,"a":[2],"q":"金屬導線槽不得裝設於下列情形或場所？","o":["公共場所","發散腐蝕性物質場所","乾燥場所","電梯之配線"],"x":"金屬導線槽怕腐蝕，所以不得裝設於發散腐蝕性物質的場所。公共場所、乾燥場所以及電梯配線並非禁止之列。"},{"c":4,"n":13,"a":[1],"q":"除另有規定外，裝於導線槽內之有載導線數不得超過三十條，且各導線截面積之和不得超過該導線槽內部截面積之多少％？","o":["20","25","30","50"],"x":"導線槽內有載導線不得超過三十條，且導線截面積總和不得超過槽內截面積的20%。記法：「30條、20%」；接續處才放寬到75%。"},{"c":4,"n":14,"a":[4],"q":"垂直裝置之金屬導線槽，每隔多少米內應予固定及支撐，且兩支撐點間不得有超過一處之連接？","o":["2.5","3","4","4.5"],"x":"垂直裝置的金屬導線槽，每隔4.5米以內要固定及支撐，且兩支撐點間不得有超過一處連接。水平是1.5米，垂直是4.5米，剛好三倍。"},{"c":4,"n":15,"a":[3],"q":"由匯流排槽引接之分路得依下列哪一種配線方法裝設？","o":["非金屬可撓導線管","非金屬導線槽","金屬導線管","燈用軌道"],"x":"由匯流排槽引接的分路，須採用具機械強度與接地連續性的配線方法，如金屬導線管、金屬可撓導線管、金屬導線槽等。題目選項中只有金屬導線管符合，非金屬類與燈用軌道都不行。"},{"c":4,"n":16,"a":[4],"q":"設計水平裝置之匯流排槽應每隔1.5 米內應予固定及支撐，若裝置法確實牢固者，其最大距離得放寬至多少米？","o":["1.5","2","2.5","3"],"x":"水平裝置的匯流排槽原則上每1.5米內固定支撐，若裝置方法確實牢固，最大距離可放寬到3米。"},{"c":4,"n":17,"a":[2],"q":"匯流排槽垂直裝設者，應於各樓地板處予以固定及支撐，其最大距離不得超過多少米？","o":["4","5","6","7"],"x":"垂直裝設的匯流排槽要在各樓地板處固定及支撐，最大距離不得超過5米。一般樓層高度約3至4米，5米為上限。"},{"c":4,"n":18,"a":[4],"q":"匯流排槽配置除在工業廠區外，若垂直上升匯流排槽貫穿兩個以上乾燥樓地板者，應在樓地板所有貫穿之開口周圍裝設至少多少毫米高之止水墩（curb），以防止液體流入開口？","o":["400","300","200","100"],"x":"垂直上升的匯流排槽貫穿兩個以上乾燥樓地板時（工業廠區除外），開口周圍要做至少100毫米高的止水墩，防止液體流入開口沿匯流排槽往下灌。"},{"c":4,"n":19,"a":[2],"q":"金屬可撓導線管厚度應在多少毫米以上？","o":["0.6","0.8","1.0","1.2"],"x":"金屬可撓導線管的管壁厚度應在0.8毫米以上，確保足夠的機械強度保護管內導線，彎折時也不易破裂。"},{"c":4,"n":20,"a":[2],"q":"非金屬導線槽水平裝設時，應於每一終端或接續處900 毫米以內，且每隔多少米以內應加以固定及支撐？","o":["3.5","3","2","2.5"],"x":"非金屬導線槽水平裝設時，於每一終端或接續處900毫米以內，且每隔3米以內要固定及支撐；垂直裝設則每隔1.2米以內。"},{"c":4,"n":21,"a":[4],"q":"從工業機器或固定式設備延伸之暴露垂直金屬導線管，若中間為絞牙連接，導線管最頂端及底端有支撐及固定，且無其他有效之中間支撐方法者，得每隔多少米以內作支撐？","o":["3","4","5","6"],"x":"工業機器或固定設備延伸出的暴露垂直金屬導線管，若中間為絞牙連接、頂端與底端已固定，又無其他有效的中間支撐方法時，可放寬為每隔6米以內支撐一次。"},{"c":4,"n":22,"a":[1],"q":"低壓屋內配線所使用之薄金屬導線管，其管徑不得小於多少毫米？","o":["15","19","25","31"],"x":"低壓屋內配線使用的薄金屬導線管，管徑不得小於15毫米，太細的管子穿線困難且容易傷及絕緣。"},{"c":4,"n":23,"a":[3],"q":"3ψ 220V 10HP 一般用電動機，若使用PVC 電線敷設於厚金屬管，含設備接地線時，應選用之最小管徑為多少毫米？","o":["16","22","28","36"],"x":"查表二五八～三，三相220V 10HP電動機滿載電流27A；分路導線安培容量不得小於1.25倍，即33.75A。查表二五～二（金屬管、PVC線、載流導線3條以下），8平方毫米為36A即足夠。設備接地線不算載流導線，但仍佔管內空間，共4條8平方毫米線，查表三二八～一厚金屬導線管，最小管徑為28毫米。"},{"c":4,"n":24,"a":[2],"q":"有一照明線路，使用2.0mmPVC 導線6 條，欲穿過一厚金屬管時，應選用最小管徑為多少毫米？","o":["16","22","28","36"],"x":"依導線管容許穿線數表，2.0毫米PVC線6條穿厚金屬管時，16毫米管容納不下，最小應選22毫米管徑。"},{"c":4,"n":25,"a":[1],"q":"金屬導線管彎曲時，彎曲處內側半徑不得小於導線管內徑之多少倍？","o":["6","8","10","12"],"x":"金屬導線管彎曲時，彎曲處內側半徑不得小於導線管內徑的6倍，避免管子壓扁變形，也讓導線好穿。"},{"c":4,"n":26,"a":[4],"q":"金屬導線管於兩線盒或管匣間之轉彎不得超過","o":["90°","180°","270°","360°"],"x":"兩線盒或管匣間的轉彎角度總和不得超過360度，也就是最多相當於四個90度彎。彎太多會使穿線時摩擦太大，容易刮傷導線。"},{"c":4,"n":27,"a":[4],"q":"金屬導線管以明管敷設時，於每一個線盒、管匣、配電箱或其他導線管終端多少毫米內，應以護管鐵、管夾或類似配件加以固定？","o":["600","700","800","900"],"x":"金屬導線管明管敷設時，每一個線盒、管匣、配電箱或導線管終端900毫米以內要以護管鐵或管夾固定，且每隔2米以內支撐。記法：「900毫米、2米」。"},{"c":4,"n":28,"a":[2],"q":"金屬可撓導線管以明管敷設時，於每一個線盒、管匣、配電箱或其他導線管終端300 毫米內，應以護管鐵、管夾或類似配件加以固定，且每隔多少米以內，應以護管鐵支撐？","o":["1","1.5","2","3"],"x":"金屬可撓導線管明管敷設時，終端300毫米內固定，且每隔1.5米以內以護管鐵支撐。可撓管較軟，支撐間距比硬金屬管的2米短。"},{"c":4,"n":29,"a":[2],"q":"電動機分路之導線安培容量應不低於電動機額定電流之多少倍？","o":["1.15","1.25","1.35","1.5"],"x":"電動機起動及運轉時可能有短暫過載，因此電動機分路導線的安培容量應不低於電動機額定電流的1.25倍。這個1.25倍是電動機配線最常考的數字。"},{"c":4,"n":30,"a":[2],"q":"5 條2.0mm PVC 導線欲穿在10 米長非金屬（PVC）管時，應選用最小管徑為多少公厘？","o":["16","20","28","35"],"x":"導線管超過6米或有彎曲時，容許穿線數要減少。依PVC管穿線數表，10米長管內穿5條2.0毫米PVC線，16毫米管不足，最小應選20毫米。"},{"c":4,"n":31,"a":[1],"q":"線徑不同之導線穿在同一非金屬管內時，其絞線與絕緣皮截面積之總和以不超過導線管截面積之多少％為原則？","o":["40","50","60","70"],"x":"線徑不同的導線穿在同一導線管內時，導線（含絕緣皮）截面積總和以不超過導線管截面積的40%為原則，保留空間散熱及方便穿線。"},{"c":4,"n":32,"a":[1],"q":"PVC 管互相間，及管與配件相接之長度，使用粘劑者，得降低至管徑多少倍，且其連接處應裝設牢固？","o":["0.8","1","1.2","1.5"],"x":"PVC管相互及與配件相接，有使用粘劑時接合較牢靠，插入長度可降低到管徑的0.8倍；未使用粘劑時則需1.2倍以上。"},{"c":4,"n":33,"a":[3],"q":"PVC 管互相間，及管與配件相接之長度，未使用粘劑者，應為管徑之多少倍以上，且其連接處應裝設牢固？","o":["0.8","1","1.2","1.5"],"x":"PVC管連接若未使用粘劑，只靠插入摩擦固定，插入長度應為管徑的1.2倍以上；有粘劑才可降到0.8倍。"},{"c":4,"n":34,"a":[3],"q":"電纜穿入金屬接線盒時，應使用護套或下列何種裝置以防止損傷電纜？","o":["護管鐵","電纜固定夾","電纜固定頭","分接頭"],"x":"電纜穿入金屬接線盒時，盒子開孔邊緣銳利，應使用護套或電纜固定頭（電纜接頭）保護並固定電纜，避免外皮被割傷。護管鐵是固定管子用的，不是這個用途。"},{"c":4,"n":35,"a":[2],"q":"在暴露場所，沿建築物佈設導線線徑8 平方毫米以下之非金屬被覆電纜，裝設處所為人員可觸及處所，其支撐最大間隔應為多少米？","o":["0.5","1","1.5","2"],"x":"暴露場所沿建築物佈設8平方毫米以下的非金屬被覆電纜，在人員可觸及處所，支撐最大間隔為1米，避免被人拉扯或碰撞。"},{"c":4,"n":36,"a":[2],"q":"若電纜不沿建築物施工，而建築物間隔多少 米以上者，應以木板等物將電纜固定或用吊線架設？","o":["1","2","3","4"],"x":"電纜不沿建築物施工時，若建築物間隔2米以上，電纜會懸空過長，應以木板等物固定電纜或用吊線架設，避免電纜自重拉扯受損。"},{"c":4,"n":37,"a":[4],"q":"裝甲電纜彎曲時，不得損壞電纜，金屬線被覆或金屬編織被覆之單芯電纜彎曲處內側半徑，應為電纜外徑之多少倍以上？","o":["6","8","10","12"],"x":"金屬線被覆或金屬編織被覆的單芯裝甲電纜較硬，彎曲時內側半徑應為電纜外徑的12倍以上，以免損壞被覆與絕緣。"},{"c":4,"n":38,"a":[3],"q":"PVC 絕緣膠帶纏繞連接處之裸露部分，應掩護原導線之絕緣外皮多少公厘以上？","o":["5","10","15","20"],"x":"以PVC絕緣膠帶纏繞接續處時，除包覆裸露部分外，還要掩護原導線絕緣外皮15公厘以上，確保接頭兩端絕緣完整、不留縫隙。"},{"c":4,"n":39,"a":[1],"q":"非金屬管與金屬管比較，前者具有何優點？","o":["耐腐蝕性","耐熱性","耐衝擊性","耐壓性"],"x":"非金屬管（PVC管）不生鏽、不受酸鹼侵蝕，最大優點是耐腐蝕性。耐熱、耐衝擊、耐壓等機械性能反而是金屬管較好。"},{"c":4,"n":40,"a":[3],"q":"長度6 米以下之16mmPVC 管，無顯著彎曲及導線容易更換者，可放置2.0 毫米PVC 電線最多為多少條？","o":["4","5","7","10"],"x":"依PVC管穿線數表，長度6米以下、無顯著彎曲且導線容易更換時，16毫米PVC管最多可穿2.0毫米PVC電線7條。"},{"c":4,"n":41,"a":[2],"q":"長度6 米以下之16mmPVC 管，無顯著彎曲及導線容易更換者，可放置5.5 平方毫米PVC 電線最多為多少條？","o":["10","5","7","4"],"x":"依PVC管穿線數表，長度6米以下、無顯著彎曲且導線容易更換時，16毫米PVC管最多可穿5.5平方毫米PVC電線5條；線越粗，可穿條數越少。"},{"c":4,"n":42,"a":[1,3],"q":"金屬導線管以明管敷設時之固定及支撐，應符合下列哪些規定？","o":["於每一個線盒、管匣、配電箱或其他導線管終端900 毫米內，應以護管鐵固定","於每一個線盒、管匣、配電箱或其他導線管終端1000 毫米內，應以護管鐵固定","金屬導線管每隔2 米內，應以護管鐵或其他有效方法支撐","金屬導線管每隔3 米內，應以護管鐵或其他有效方法支撐"],"x":"金屬導線管明管敷設的規定是：線盒、管匣、配電箱或導線管終端900毫米內以護管鐵固定，且每隔2米內支撐。寫1000毫米與每隔3米的敘述數字都不對。"},{"c":4,"n":43,"a":[2,3],"q":"有關EMT 管之敘述，下列哪些正確？","o":["是屬於厚導線管之一種","是屬於薄導線管之一種","不得配裝於600V 以上之高壓配管工程","可配裝於600V 以上之高壓配管工程"],"x":"EMT管是無螺紋的電氣金屬管，屬薄導線管的一種，管壁薄，不得配裝於600V以上的高壓配管工程。說它是厚導線管或可用於高壓配管都是錯的。"},{"c":4,"n":44,"a":[1,2],"q":"厚金屬導線管不得配裝於下列哪些場所？","o":["有發散腐蝕性物質之場所","含有酸性或鹼性之泥土中","灌水泥或直埋之地下管路","長度超過1.8 米者"],"x":"厚金屬導線管怕腐蝕，不得配裝於發散腐蝕性物質的場所，以及含酸性或鹼性的泥土中（除非有防蝕保護）。灌水泥或直埋正是厚金屬管的適用場合；長度超過1.8米並非限制條件。"},{"c":4,"n":45,"a":[1,2,4],"q":"EMT 管及薄導線管不得配裝於下列哪些場所？","o":["有危險物質存在場所","有重機械碰傷場所","灌水泥或直埋之地下管路","600V 以上之高壓配管工程"],"x":"EMT管及薄導線管管壁較薄，不得用於有危險物質存在場所、有重機械碰傷場所，也不得用於600V以上的高壓配管工程。灌水泥或直埋地下管路並不在此題的禁止之列。"},{"c":4,"n":46,"a":[1,2,3],"q":"一般型金屬可撓導線管不得使用於下列哪些場所？","o":["隱蔽場所","蓄電池室","潮濕場所","連接發電機、電動機等旋轉機具有可撓必要之接線部分"],"x":"一般型金屬可撓導線管不得使用於隱蔽場所、蓄電池室及潮濕場所，這些場所需採用防水型或其他配線方法。連接發電機、電動機等旋轉機具需要可撓的接線部分，正是可撓管的用途。"},{"c":4,"n":47,"a":[1,3,4],"q":"有關交流電源在相同負載功率與距離條件下，下列哪些正確？","o":["提高配電電壓可提高配電效率","將1ψ2 W 電源配線改為1ψ3 W 電源配線將增加線路損失","將1ψ2 W 電源配線改為1ψ3 W 電源配線可減少線路壓降","改善負載端之功率因數可降低配電損失"],"x":"相同功率下提高電壓，電流變小，線路損失I平方R下降，效率提高；功率因數改善也使電流減小、損失降低。1ψ2W改為1ψ3W，配電電壓提高且中性線電流相抵，壓降與損失都減少，所以說會增加損失是錯的。"},{"c":4,"n":48,"a":[1,2,3],"q":"金屬導線管常用其形式及管壁厚度可分為下列哪些種類？","o":["厚金屬導線管","薄金屬導線管","無螺紋金屬導線管","PVC 管"],"x":"金屬導線管依形式與管壁厚度分為厚金屬導線管、薄金屬導線管及無螺紋金屬導線管（EMT）。PVC管是非金屬管，不屬於金屬導線管。"},{"c":4,"n":49,"a":[1,2,3],"q":"匯流排槽不得裝設於下列哪些場所？","o":["易遭受重機械外力損傷之處","發散腐蝕性物質場所","電動起重機或升降機之升降路","屋內場所"],"x":"匯流排槽不得裝設於易受重機械外力損傷處、發散腐蝕性物質場所，以及電動起重機或升降機的升降路。屋內場所正是匯流排槽的一般裝設處所。"},{"c":4,"n":50,"a":[1,3],"q":"非金屬導線槽之固定及支撐，應符合下列哪些規定？","o":["水平裝設時，於終端處或連接處900 毫米內，及每隔3 米內，應予固定及支撐","水平裝設時，於終端處或連接處1000 毫米內，及每隔3 米內，應予固定及支撐","垂直裝設時，每隔1.2 米內，應予固定及支撐，且兩支撐點間不得有超過一處之連接","垂直裝設時、每隔1.5 米內，應予固定及支撐，且兩支撐點間不得有超過一處之連接"],"x":"非金屬導線槽水平裝設：終端或連接處900毫米內及每隔3米內固定支撐；垂直裝設：每隔1.2米內固定支撐，兩支撐點間不得超過一處連接。1000毫米與1.5米的敘述數字不對。"},{"c":4,"n":51,"a":[1,3,4],"q":"燈用軌道不得裝設於下列情形或場所？","o":["易受外力損傷","距離地面高度1.5 米以上","存放電池場所","潮濕場所或濕氣場所"],"x":"燈用軌道不得裝設於易受外力損傷處、存放電池場所及潮濕或濕氣場所。距地面1.5米以上反而是正常裝法，規定是太低（1.5米以下）才需另有保護。"},{"c":4,"n":52,"a":[1,4],"q":"地板管槽上方之混凝土覆蓋，應符合下列哪些規定？","o":["平頂型管槽寬度超過100 毫米，且小於200 毫米，管槽間之間隔為25 毫米以上者，管槽上面混凝土覆蓋厚度，應為25 毫米以上","平頂型管槽寬度超過100 毫米，且小於200 毫米，管槽間之間隔為25 毫米以上者，管槽上面混凝土覆蓋厚度，應為35 毫米以上","管槽間隔小於25 毫米者，混凝土覆蓋厚度應為58 毫米以上","管槽間隔小於25 毫米者，混凝土覆蓋厚度應為38毫米以上"],"x":"地板管槽上方混凝土覆蓋：平頂型管槽寬度超過100毫米且小於200毫米、間隔25毫米以上者，覆蓋厚度25毫米以上；管槽間隔小於25毫米者，覆蓋厚度38毫米以上。35毫米與58毫米都是錯誤數字。"},{"c":4,"n":53,"a":[2,3,4],"q":"有關導線管，下列哪些正確？","o":["非金屬管可作為燈具之支持物","交流回路，同一回路之全部導線原則上應穿在同一金屬管內，以維持電磁平衡","金屬管為鐵、銅、鋼、鋁及合金等製成品","低壓屋內配線所用的薄金屬導線管，其最小管徑不得小於15 毫米"],"x":"交流同一回路導線應穿同一金屬管以維持電磁平衡；金屬管由鐵、銅、鋼、鋁及合金製成；薄金屬管最小管徑15毫米，以上皆正確。非金屬管強度不足，不可作為燈具支持物。"},{"c":4,"n":54,"a":[2,3],"q":"有關EMT 導線管裝設，下列哪些正確？","o":["屬於厚導線管","屬於薄導線管","不得配裝於超過600 伏之配管工程","得配裝於超過600 伏之配管工程"],"x":"EMT管是無螺紋的電氣金屬管，屬薄導線管，管壁薄，不得配裝於超過600伏的配管工程。說它屬厚導線管或可用於超過600伏的敘述都錯。"},{"c":4,"n":55,"a":[1,4],"q":"有關電纜架之裝設，下列哪些正確？","o":["600 伏特以下之電纜，得敷設於同一電纜架","超過600 伏特之電纜，得敷設於同一電纜架","電纜不得在電纜架內連接，其連接位置為可觸及，且不易受外力損傷，惟不得凸出電纜架之邊欄","電纜得在電纜架內連接，其連接位置為可觸及，且不易受外力損傷，惟不得凸出電纜架之邊欄"],"x":"600伏以下的電纜可敷設於同一電纜架；電纜也可在電纜架內連接，只要連接處可觸及、不易受外力損傷，且不凸出邊欄。超過600伏的高壓電纜不可任意與其他電纜混敷，說電纜不得在架內連接也錯。"},{"c":4,"n":56,"a":[1,3],"q":"非金屬被覆電纜暴露裝設時，對於外力損傷保護，下列哪些正確？","o":["採用導線管保護時，其內徑應大於電纜外徑1.5 倍","採用導線管保護時，其內徑應大於電纜外徑1.2 倍","若導線管很短且無彎曲，電纜之更換施工容易者，其外徑得小於電纜外徑1.5 倍","若導線管很短且無彎曲，電纜之更換施工容易者，其外徑得小於電纜外徑1.2 倍"],"x":"非金屬被覆電纜暴露裝設以導線管保護時，管內徑應大於電纜外徑1.5倍；若導線管很短、無彎曲且電纜更換容易，可小於1.5倍。寫1.2倍的兩項數字不對。"},{"c":5,"n":1,"a":[4],"q":"11.4kV 架空線路跨越一般道路時其離地面應有多少公尺以上？","o":["4.0","4.5","5.0","5.6"],"x":"11.4kV架空線路跨越一般道路時，導線離地面應有5.6公尺以上，讓大型車輛通過時不致碰觸高壓線。高壓跨越道路的高度要求比低壓更高。"},{"c":5,"n":2,"a":[2],"q":"9 公尺之架空線路電桿在泥地埋設時，埋入地中之最小深度應為多少公尺？","o":["1","1.5","1.8","2"],"x":"9公尺電桿埋設於泥地時，最小埋入深度為1.5公尺，約為桿長的六分之一，才足以抵抗導線張力與風壓不致傾倒。"},{"c":5,"n":3,"a":[3],"q":"永久設置於支持物之腳踏釘，距地面或其他可踏觸之表面，不得小於多少公尺？","o":["1.5","1.8","2.45","3"],"x":"支持物上永久設置的腳踏釘，距地面或可踏觸表面不得小於2.45公尺，防止一般民眾隨意攀爬電桿。"},{"c":5,"n":4,"a":[3],"q":"高壓線路與低壓線路在建築物內應保持多少毫米以上之間隔？","o":["100","200","350","400"],"x":"高壓線路與低壓線路在建築物內，應保持350毫米以上的間隔，以防高壓電侵入低壓系統。建築物外則要求500毫米以上，兩者對照記。"},{"c":5,"n":5,"a":[4],"q":"低壓架空連接接戶線之長度，自第一支持點起以多少公尺為限，其中每一架空線段之跨距不得超過20 公尺？","o":["20","35","40","60"],"x":"低壓架空連接接戶線自第一支持點起，總長度以60公尺為限，其中每一架空線段跨距不得超過20公尺。記法：「總長60、每段20」。"},{"c":5,"n":6,"a":[3],"q":"低壓單獨接戶線電壓降不得超過超過百分之多少？","o":["0.1","0.2","1","2"],"x":"低壓單獨接戶線的電壓降不得超過1%，讓大部分允許壓降留給屋內幹線與分路使用；臨時用電接戶線則放寬為2%。"},{"c":5,"n":7,"a":[2],"q":"低壓架空接戶線與鄰近樹木及其他線路之電桿間，其水平及垂直間隔應維持多少毫米以上？","o":["100","200","300","400"],"x":"低壓架空接戶線與鄰近樹木及其他線路電桿間，水平及垂直間隔應維持200毫米以上，避免樹枝摩擦或碰觸造成絕緣損傷。"},{"c":5,"n":8,"a":[4],"q":"低壓接戶線之接戶支持物離地高度應為多少公尺以上？","o":["1.5","1.8","2.0","2.5"],"x":"低壓接戶線的接戶支持物離地高度應在2.5公尺以上，確保線路高度足夠，人員不易觸及。"},{"c":5,"n":9,"a":[3],"q":"高壓架空接戶線之銅導線線徑不得小於多少平方毫米？","o":["8","14","22","30"],"x":"高壓架空接戶線需承受跨距張力與高壓電流，銅導線線徑不得小於22平方毫米，與高壓進屋線架空導線的要求相同。"},{"c":5,"n":10,"a":[3],"q":"依用戶用電設備裝置規則，高壓地下配線導線裝設於電桿時，應採用金屬導線管、硬質非金屬導線管或具有同等強度之導線管，且該導線管之高度由地面起算應為多少米以上？","o":["1.2","2","2.5","3"],"x":"依用戶用電設備裝置規則，高壓地下配線沿電桿引上時，應以金屬導線管、硬質非金屬導線管或同等強度的管子保護，高度由地面起算2.5米以上，防止外力碰傷。"},{"c":5,"n":11,"a":[1],"q":"多雨及鹽害嚴重地區，裝置二年以上照明線路絕緣電阻不得小於多少MΩ？","o":["0.05","0.1","0.5","1"],"x":"多雨及鹽害嚴重地區，絕緣容易受潮劣化，因此裝置二年以上的照明線路絕緣電阻要求較寬，不得小於0.05MΩ。"},{"c":5,"n":12,"a":[3],"q":"高壓線路與電信線路、水管、燃氣供給管路及其他金屬物間，應保持多少毫米以上之間隔？","o":["150","300","500","600"],"x":"高壓線路與電信線路、水管、燃氣管路及其他金屬物間，應保持500毫米以上的間隔；低壓線路則為150毫米。高壓距離要大得多。"},{"c":5,"n":13,"a":[3],"q":"標稱電壓13.8kV 高壓用電設備之配線及保護於現場組裝者，其屋內場所暴露帶電部分，在空氣中相對相之最小間隔不得小於多少毫米？","o":["130","180","195","255"],"x":"標稱電壓13.8kV屬15kV級，現場組裝設備在屋內場所暴露帶電部分，空氣中相對相最小間隔為195毫米；相對地為130毫米。相間距離較大。"},{"c":5,"n":14,"a":[1],"q":"標稱電壓13.8kV 高壓用電設備之配線及保護於現場組裝者，其屋內場所暴露帶電部分，在空氣中相對地之最小間隔不得小於多少毫米？","o":["130","180","195","255"],"x":"標稱電壓13.8kV屬15kV級，屋內暴露帶電部分在空氣中相對地最小間隔為130毫米；相對相則為195毫米。記法：對地小、相間大。"},{"c":5,"n":15,"a":[3],"q":"標稱電壓23kV 高壓用電設備之配線及保護於現場組裝者，其屋內場所暴露帶電部分，在空氣中相對相之最小間隔不得小於多少毫米？","o":["130","180","195","255"],"del":1},{"c":5,"n":16,"a":[1],"q":"標稱電壓23kV 高壓用電設備之配線及保護於現場組裝者，其屋內場所暴露帶電部分，在空氣中相對地之最小間隔不得小於多少毫米？","o":["130","180","195","255"],"del":1},{"c":5,"n":17,"a":[3],"q":"高壓用電設備若有帶電部分露出者，其屬開放式裝置，設備應裝設於變電室內，或設置高度多少米以上之圍牆或圍籬加以隔離？","o":["1.5","2","2.5","3"],"x":"高壓開放式裝置有帶電部分露出，應裝於變電室內，或設置2.5米以上高的圍牆或圍籬隔離，防止非相關人員接近。"},{"c":5,"n":18,"a":[4],"q":"額定電壓25kV 以下之交流電力電纜者，得採用系統對地最大電壓之多少倍直流試驗電壓加壓，並耐壓15 分鐘之試驗方式？","o":["1","2","3","4"],"x":"額定電壓25kV以下的交流電力電纜，可用系統對地最大電壓4倍的直流試驗電壓加壓，耐壓15分鐘來做耐壓試驗。"},{"c":5,"n":19,"a":[3],"q":"高壓進屋線架空導線不得小於多少平方毫米？","o":["38","30","22","14"],"x":"高壓進屋線採架空導線時，線徑不得小於22平方毫米，與高壓架空接戶線的22平方毫米要求相同。"},{"c":5,"n":20,"a":[4],"q":"在地面式游泳池或其輔助設備水平距離多少公尺以內，不得埋設供電電纜？","o":["3","2.5","2","1.5"],"x":"地面式游泳池或其輔助設備水平距離1.5公尺以內，不得埋設供電電纜，避免漏電時危及池中人員。"},{"c":5,"n":21,"a":[1],"q":"地下接戶線採用電纜時，其電壓降符合規定者，長度","o":["不受限制","不得超過20 米","不得超過35 米","不得超過40 米"],"x":"地下接戶線採用電纜時，只要電壓降符合規定，長度不受限制。架空接戶線才有長度限制，因為要考慮跨距與張力。"},{"c":5,"n":22,"a":[2],"q":"高壓線路與低壓線路在建築物外應保持多少毫米以上之間隔？","o":["600","500","350","200"],"x":"高壓線路與低壓線路在建築物外應保持500毫米以上的間隔；在建築物內則為350毫米。屋外環境較複雜，間隔要求較大。"},{"c":5,"n":23,"a":[4],"q":"建築物外之地下配線採用MI 電纜由地下引出地面時，應以配電箱或導線管保護，保護範圍至少為地面以上達2.5 米及地面以下達多少毫米？","o":["150","230","300","460"],"x":"建築物外的MI電纜由地下引出地面時，應以配電箱或導線管保護，範圍至少地面以上2.5米、地面以下460毫米，防止外力損傷。"},{"c":5,"n":24,"a":[3],"q":"高壓進屋線之電力電纜如屬於25kV 級者，其最小線徑應為多少平方毫米？","o":["14","30","38","60"],"x":"高壓進屋線的電力電纜，25kV級最小線徑為38平方毫米；15kV級為30平方毫米。電壓級越高，最小線徑越大。"},{"c":5,"n":25,"a":[4],"q":"高壓地下配線採用非金屬導線管配線者，35kV 以下電纜最小埋設深度應為多少毫米以上？","o":["160","300","460","600"],"x":"高壓地下配線採非金屬導線管時，35kV以下電纜最小埋設深度為600毫米以上，非金屬管強度較低，需埋深一點避免地面荷重及開挖損傷。"},{"c":5,"n":26,"a":[4],"q":"低壓線路與電信線路及其他金屬物間，如未適當隔離或未採用導線管、電纜配線者，應保持多少毫米以上之間隔？","o":["50","80","100","150"],"x":"低壓線路與電信線路及其他金屬物間，若未適當隔離或未採導線管、電纜配線，應保持150毫米以上間隔，避免感應干擾或碰觸漏電。"},{"c":5,"n":27,"a":[4],"q":"低壓線路與水管及其他金屬物間，如未適當隔離或未採用導線管、電纜配線者，應保持多少毫米以上之間隔？","o":["50","80","100","150"],"x":"低壓線路與水管及其他金屬物間，若未適當隔離或未採導線管、電纜配線，應保持150毫米以上間隔。電信線、水管、瓦斯管一律都是150毫米。"},{"c":5,"n":28,"a":[4],"q":"低壓線路與燃氣供給管路及其他金屬物間，如未適當隔離或未採用導線管、電纜配線者，應保持多少毫米以上之間隔？","o":["50","80","100","150"],"x":"低壓線路與燃氣供給管路及其他金屬物間，若未適當隔離或未採導線管、電纜配線，應保持150毫米以上間隔。低壓對金屬物一律記150毫米。"},{"c":5,"n":29,"a":[3],"q":"高壓配線採用裝設地下電纜時，使用無遮蔽電纜或非金屬被覆電纜應採用非金屬導線管或適用於潮濕場所之厚金屬導線管配線，並包覆混凝土厚度多少毫米以上？","o":["50","60","75","90"],"x":"高壓地下配線使用無遮蔽電纜或非金屬被覆電纜時，應穿非金屬導線管或適用潮濕場所的厚金屬管，並包覆75毫米以上混凝土加強保護。"},{"c":5,"n":30,"a":[4],"q":"低壓線路與煙囟、熱水管或其他發散熱氣物體間，如未適當隔離者，應保持多少毫米以上之間隔？","o":["150","250","300","500"],"x":"低壓線路與煙囪、熱水管或其他發散熱氣物體間，若未適當隔離，應保持500毫米以上間隔，避免導線絕緣受熱劣化。熱源要求比一般金屬物的150毫米大得多。"},{"c":5,"n":31,"a":[3],"q":"車輛保養、維修及停放場所經劃分為第一類場所或0 區、1 區、2 區，裝設於車輛通行路線上方之固定式照明設備，距地面高度應為多少米以上，以免車輛進出時碰損？","o":["1.6","2.6","3.6","4.6"],"x":"車輛保養、維修及停放場所的危險區域內，裝於車輛通行路線上方的固定式照明設備，距地面應在3.6米以上，避免車輛進出碰損。"},{"c":5,"n":32,"a":[2],"q":"住宅場所陽台之插座及離廚房水槽外緣多少米以內之插座分路應裝設漏電斷路器？","o":["0.8","1.8","2.8","3.8"],"x":"住宅陽台插座，以及離廚房水槽外緣1.8米以內的插座分路，因接近水源易觸電，應裝設漏電斷路器。"},{"c":5,"n":33,"a":[4],"q":"依用戶用電設備裝置規則，高壓配線單芯電纜之彎曲內側半徑，有遮蔽層者，應為電纜外徑多少倍以上？","o":["6","8","10","12"],"x":"依用戶用電設備裝置規則，高壓單芯電纜有遮蔽層者，彎曲內側半徑應為電纜外徑12倍以上；無遮蔽層者為8倍。有遮蔽層怕遮蔽帶受損，要求較大。"},{"c":5,"n":34,"a":[2],"q":"低壓架空單獨及共同接戶線之長度以35 米為限，但如架設配電線路有困難時，得延長至多少米？","o":["40","45","50","55"],"x":"低壓架空單獨及共同接戶線長度以35米為限，如架設配電線路確有困難，得延長至45米。"},{"c":5,"n":35,"a":[3],"q":"除特殊長桿距外，通常一般線路桿距之導線終端裝置採用何種方式固定？","o":["活線線夾","拉線環","拉線夾板","裝腳礙子"],"x":"一般桿距的導線終端，是用拉線夾板（耐張線夾）把導線夾緊並拉在礙子上固定，承受導線張力。活線線夾是用於分歧接線，不是終端拉緊用。"},{"c":5,"n":36,"a":[2],"q":"低壓電路新設線路之絕緣電阻應在多少MΩ以上？","o":["0.1","1","5","10"],"x":"低壓電路新設線路絕緣電阻應在1MΩ以上。新設線路絕緣狀況最好，要求標準最高；使用多年後的線路標準才會放寬。"},{"c":5,"n":37,"a":[1],"q":"屋外架供配電線路，220V 低壓裸導線與房屋之水平間隔應保持在多少公尺以上？","o":["1.2","1.5","1.8","2"],"x":"屋外架空220V低壓裸導線與房屋的水平間隔應保持1.2公尺以上；11.4kV高壓裸導線則為1.5公尺以上。"},{"c":5,"n":38,"a":[1],"q":"屋外架空供電線路，11.4kV 高壓裸導線與房屋之水平間隔應保持在多少公尺以上？","o":["1.5","2","2.5","3"],"x":"屋外架空11.4kV高壓裸導線與房屋的水平間隔應保持1.5公尺以上，比低壓裸導線的1.2公尺稍大。"},{"c":5,"n":39,"a":[2],"q":"高壓地下配線採用非金屬導線管配線者，35kV 以下電纜最小埋設深度應為少毫米以上？","o":["750","660","460","160"],"del":1},{"c":5,"n":40,"a":[2],"q":"低壓電度表接線箱箱體若採用鋼板者，其表面處理前厚度應在多少毫米以上？","o":["1.2","1.6","2.0","2.6"],"x":"低壓電度表接線箱箱體若採鋼板，表面處理前厚度應在1.6毫米以上，確保箱體強度足以保護電表與接線。"},{"c":5,"n":41,"a":[2],"q":"已知幹線電壓降為標稱電壓之3％，則其分路電壓降不得超過標稱電壓多少％？","o":["1","2","3","4"],"x":"依用戶用電設備裝置規則，幹線加分路的總電壓降不得超過標稱電壓的5%。幹線已用掉3%，則分路最多剩5%減3%等於2%。"},{"c":5,"n":42,"a":[2],"q":"臨時用電工程之低壓接戶線，電壓降不得超過百分之多少？","o":["1","2","3","5"],"x":"臨時用電工程的低壓接戶線，電壓降不得超過2%；一般低壓單獨接戶線則為1%，臨時用電較寬鬆。"},{"c":5,"n":43,"a":[3],"q":"高壓架空接戶線之長度以多少公尺為限，且不得使用連接接戶線？","o":["10","20","30","50"],"x":"高壓架空接戶線長度以30公尺為限，且不得使用連接接戶線，高壓線路要盡量單純，以策安全。"},{"c":5,"n":44,"a":[2],"q":"依用戶用電設備裝置規則，高壓配線單芯電纜之彎曲內側半徑，無遮蔽層者，應為電纜外徑多少倍以上？","o":["6","8","10","12"],"x":"依用戶用電設備裝置規則，高壓單芯電纜無遮蔽層者，彎曲內側半徑應為電纜外徑8倍以上；有遮蔽層者為12倍。"},{"c":5,"n":45,"a":[3],"q":"非載流之所有支線礙子或跨距吊線礙子之裝設，應使支線或跨距吊線斷落到礙子下方時，礙子底部離地面不小於多少公尺？","o":["1.5","2","2.45","3.45"],"x":"非載流的支線礙子或跨距吊線礙子，要裝在即使支線或吊線斷落到礙子下方時，礙子底部離地仍不小於2.45公尺的位置，避免路人碰觸帶電的上段。"},{"c":5,"n":46,"a":[1],"q":"架空線路之支持物與消防栓之間隔不得小於多少公尺？","o":["1.2","2.0","3","3.5"],"x":"架空線路的支持物與消防栓間隔不得小於1.2公尺，以免妨礙消防車輛及人員取用消防栓。"},{"c":5,"n":47,"a":[2],"q":"高壓進屋線之電力電纜如屬於15kV 級者，其最小線徑應為多少平方毫米？","o":["14","30","38","60"],"x":"高壓進屋線的電力電纜屬15kV級者，最小線徑為30平方毫米；25kV級則為38平方毫米。"},{"c":5,"n":48,"a":[2],"q":"低壓地下接戶線之最小線徑，銅導線應為多少平方毫米？","o":["5.5","8","14","22"],"x":"低壓地下接戶線採銅導線時，最小線徑為8平方毫米，地下線路散熱較差且更換不易，要求較粗。"},{"c":5,"n":49,"a":[2],"q":"屋簷下或接戶引出之線路與瓦斯管之間隔，應維持多少公尺以上？","o":["0.8","1","1.5","2"],"x":"屋簷下或接戶引出的線路與瓦斯管之間，應維持1公尺以上的間隔，防止電氣火花引燃外洩的瓦斯。"},{"c":5,"n":50,"a":[2],"q":"直埋供電及通訊之電纜或導線相互間，及與排水管、自來水管、瓦斯、輸送易燃性物質之其他管線、建築物基礎及蒸汽管等其他地下構造物之隔距，應維持多少毫米以上？","o":["200","300","400","500"],"x":"直埋的供電與通訊電纜相互之間，及與排水管、自來水管、瓦斯管、建築物基礎、蒸汽管等地下構造物間，隔距應維持300毫米以上，方便維修並避免相互影響。"},{"c":5,"n":51,"a":[2],"q":"12 公尺之架空線路電桿在泥地埋設時，埋入地中之深度應為多少公尺？","o":["1.5","1.8","3","6"],"x":"依電桿埋設深度標準，12公尺電桿埋設於泥地時，埋入深度為1.8公尺；9公尺桿則為1.5公尺。桿越長，埋入越深。"},{"c":5,"n":52,"a":[4],"q":"下列何種導線適用於長距離高壓輸電線路？","o":["鋁線","絕緣軟銅線","絕緣硬銅線","鋼心鋁線"],"x":"鋼心鋁線（ACSR）以鋼線為芯提供抗拉強度，外層鋁線負責導電，重量輕、強度高、成本低，最適合跨距大的長距離高壓輸電線路。"},{"c":5,"n":53,"a":[2,3,4],"q":"進屋線路與電信線路、水管及其它金屬物間，若無法保持150 毫米以上距離，可採用下列哪些保護措施？","o":["磁珠配線","非金屬導線管配線","金屬導線管配線","加裝絕緣物隔離"],"x":"無法保持150毫米間隔時，可改用非金屬導線管、金屬導線管配線，或加裝絕緣物隔離，使線路與金屬物確實隔開。磁珠配線屬於露出的明線配線，無法達到保護效果。"},{"c":5,"n":54,"a":[1,4],"q":"於發散腐蝕性物質場所用電設備或器具之配線，應依下列哪些規定辦理？","o":["配線應採用非金屬導線管或非金屬被覆電纜","配線應採用金屬導線管或金屬被覆電纜","採用非金屬導線管或非金屬被覆電纜者，應全部埋入建築物內部或地下","採用金屬導線管或金屬被覆電纜者，應全部埋入建築物內部或地下"],"x":"腐蝕性場所應採用非金屬導線管或非金屬被覆電纜，因為不怕腐蝕；若採金屬導線管或金屬被覆電纜，必須全部埋入建築物內部或地下避開腐蝕。說金屬配線應採用，或非金屬配線須全埋入，都是錯的。"},{"c":5,"n":55,"a":[1,3,4],"q":"單相三線式110V/220V 配電線路維持負載平衡之目的，下列哪些錯誤？","o":["防止異常電壓之發生","減少線路損失","改善功率因數","減輕負載"],"x":"負載平衡可使中性線電流趨近於零，減少線路損失與電壓降，所以「減少線路損失」是正確目的。功率因數由負載性質決定，平衡無法改善；平衡只是分配負載，也不會減輕總負載。官方也把防止異常電壓之發生列為錯誤敘述。註：負載不平衡時中性線一旦斷線，輕載側電壓會異常升高，維持平衡其實可減輕此風險，此項有爭議。","f":"爭議"},{"c":5,"n":56,"a":[1,2,3],"q":"潮濕場所內之用電設備或器具得採用下列哪些施工方式？","o":["金屬導線管","非金屬導線管","電纜配線","金屬導線槽"],"x":"潮濕場所可採用金屬導線管、非金屬導線管及電纜配線（需適用潮濕場所者）。金屬導線槽易積水鏽蝕，不適用於潮濕場所。"},{"c":6,"n":1,"a":[4],"q":"下列何者不是單相變壓器並聯運轉時之必要條件？","o":["一次及二次額定電壓相等","極性相同","匝數比相同","容量相同"],"x":"單相變壓器並聯的必要條件是：極性相同、匝數比相同、一次及二次額定電壓相等（再加上百分比阻抗相近較理想）。容量不必相同，大小不同的變壓器照樣能並聯，只是負載按容量與阻抗比例分配。記法：並聯看「極、比、壓」，不看「容量」。"},{"c":6,"n":2,"a":[4],"q":"單相變壓器匝數比為32，全載時二次側電壓為102V，電壓調整率為2％，則一次側電壓約為多少V？","o":["3300","3310","3320","3330"],"x":"電壓調整率 = (無載電壓 − 滿載電壓) ÷ 滿載電壓。二次無載電壓 = 102 × (1 + 0.02) = 104.04 V。一次側電壓 = 匝數比 × 二次無載電壓 = 32 × 104.04 ≈ 3329 V，約 3330 V。注意要先把滿載電壓換回無載電壓再乘匝數比。"},{"c":6,"n":3,"a":[3],"q":"下列何者無法利用變壓器之開路試驗求得？","o":["鐵損","激磁導納","銅損","無載電流"],"x":"開路（無載）試驗是二次開路、一次加額定電壓，此時電流很小，量到的功率幾乎全是鐵損，並可求出無載電流與激磁導納。銅損需要額定電流流過繞組，必須用短路試驗量測。口訣：開路量鐵、短路量銅。"},{"c":6,"n":4,"a":[2],"q":"測量變壓器鐵損的方法是","o":["溫升試驗","開路試驗","短路試驗","耐壓試驗"],"x":"鐵損只和電壓、頻率有關，與負載無關。開路試驗在額定電壓下進行，二次無負載、一次電流很小，銅損可忽略，所以瓦特表讀值就是鐵損。短路試驗是量銅損，溫升與耐壓試驗則與損失量測無關。口訣：開路量鐵、短路量銅。"},{"c":6,"n":5,"a":[1],"q":"低壓變壓器一次側之過電流保護器，除另有規定外，應不超過變壓器一次側額定電流之多少倍？","o":["1.25","1.5","2","2.5"],"x":"依「用戶用電設備裝置規則」，低壓變壓器一次側裝設的過電流保護器，除另有規定外，額定值不得超過變壓器一次額定電流的 1.25 倍。1.25 倍是電工法規常見的保護倍數，搭配記憶：連續負載、變壓器一次側保護都用 1.25。"},{"c":6,"n":6,"a":[2],"q":"二具10kVA 之單相變壓器接成V-V 接線，增加一具相同容量之變壓器，將其接成△－△接線，則變壓器的輸出容量約可增加多少kVA？","o":["9.6","12.7","16.8","22.4"],"x":"V-V 接線輸出 = √3 × 10 ≈ 17.32 kVA；加一具改成 △-△，輸出 = 3 × 10 = 30 kVA。增加量 = 30 − 17.32 ≈ 12.7 kVA。重點：V 接只能發揮兩具容量的 86.6%，不是 20 kVA。"},{"c":6,"n":7,"a":[1],"q":"變壓器之一次線圈為2400 匝，電壓為3300 伏特，二次線圈為80 匝，則二次電壓為多少伏特？","o":["110","220","330","440"],"x":"理想變壓器電壓與匝數成正比：V2 = V1 × N2 ÷ N1 = 3300 × 80 ÷ 2400 = 110 V。匝數比 2400：80 = 30：1，3300 ÷ 30 = 110，也可這樣快速心算。"},{"c":6,"n":8,"a":[2],"q":"單相50kVA 變壓器二台，接成V 接線，供應功率因數為0.8 之三相平衡負載，則可供之三相滿載容量（kVA）約為","o":["100","86","80","57"],"x":"V 接線可供三相容量 = √3 × 單台容量 = 1.732 × 50 ≈ 86.6 kVA，約 86 kVA。題目給的功率因數 0.8 是干擾條件，容量以 kVA 計，與功率因數無關；若問 kW 才需要乘 0.8。"},{"c":6,"n":9,"a":[2],"q":"3300/110V 之變壓器二次側實測電壓為99V，欲調整為107V 則分接頭應改在多少V？","o":["2850","3000","3150","3300"],"x":"分接頭位置與二次電壓成反比：新分接頭 = 原分接頭 × 實測電壓 ÷ 希望電壓 = 3300 × 99 ÷ 107 ≈ 3053 V，取最接近的標準分接頭 3000 V（此時二次約 108.9 V）。記法：二次電壓偏低，就把分接頭往低的方向調。"},{"c":6,"n":10,"a":[2],"q":"某V-V 接線一燈力併用變壓器組，如欲供應單相負載75kVA，三相負載40kVA，則該兩具變壓器之最小組合容量（kVA）為","o":["75/40","100/25","100/40","100/75"],"x":"燈力併用 V-V 接線中，三相負載每具分擔 40 ÷ √3 ≈ 23.1 kVA。電力用變壓器只負擔三相 23.1 kVA，選 25 kVA；燈力共用變壓器還要加單相 75 kVA，75 + 23.1 ≈ 98.1 kVA，選 100 kVA。所以最小組合為 100/25 kVA。"},{"c":6,"n":11,"a":[2],"q":"V－V 連接與△－△連接之變壓器比較，每具發揮之容量百分比為多少％？","o":["57.7","86.6","95","100"],"x":"V-V 接線輸出 = √3 × P，兩具總額定為 2P，每具利用率 = √3P ÷ 2P = √3/2 ≈ 86.6%。要和另一個數字分清楚：V-V 輸出只有 △-△ 的 57.7%，但每一具本身的利用率是 86.6%。"},{"c":6,"n":12,"a":[3],"q":"V－V 連接之變壓器組，其輸出總容量為△－△連接之多少％？","o":["40","50","57.7","86.6"],"x":"V-V 輸出 = √3 × P，△-△ 輸出 = 3 × P，兩者比 = √3 ÷ 3 = 1/√3 ≈ 57.7%。易混淆：86.6% 是 V 接每具的利用率，57.7% 是 V 接對 △ 接的總容量比。"},{"c":6,"n":13,"a":[3],"q":"200/100V 2kVA 之單相變壓器，若改接成200/300V 之升壓自耦變壓器，則其輸出容量為多少kVA？","o":["2","4","6","8"],"x":"改成升壓自耦變壓器時，100 V 繞組當串聯繞組，其額定電流 = 2000 ÷ 100 = 20 A，輸出側電壓為 300 V，輸出容量 = 300 × 20 = 6000 VA = 6 kVA。公式：自耦容量 = 自感容量 × 高壓 ÷ (高壓 − 低壓) = 2 × 300 ÷ 100 = 6 kVA。"},{"c":6,"n":14,"a":[1],"q":"50Hz 之變壓器，若用於相同電壓60Hz 之電源時，磁化電流變為原來之多少倍？","o":["5/6","6/5","36/25","25/36"],"x":"由 E = 4.44Nfφm，電壓不變時磁通 φm 與頻率成反比。頻率由 50 Hz 變為 60 Hz，磁通變為 50/60 = 5/6 倍；磁化電流與磁通成正比（未飽和時），所以也變為原來的 5/6 倍。頻率升高，磁化電流反而減少。"},{"c":6,"n":15,"a":[3],"q":"發電廠內發電機之升壓變壓器組，通常採用下列何種連接？","o":["Y－Y","Y－△","△－Y","△－△"],"x":"發電機端電壓較低、電流大，一次側採 △ 接可讓三次諧波在 △ 內環流，不流出系統；二次高壓側採 Y 接，繞組只承受線電壓的 1/√3，絕緣較省，且中性點可接地。所以升壓用 △-Y，降壓常用 Y-△。"},{"c":6,"n":16,"a":[4],"q":"在連接比流器（CT）時，必須注意","o":["應與電路並聯","二次側不能接地","二次側須與瓦特計電壓線圈串聯","不可使二次側開路"],"x":"比流器二次側絕對不可開路：開路時一次電流全部變成激磁電流，鐵心嚴重飽和，二次側感應出極高電壓，危及人員與絕緣。其他說法錯在：CT 應與電路串聯、二次側一端要接地、應接瓦特計的電流線圈而非電壓線圈。拆電表前要先把 CT 二次短路。"},{"c":6,"n":17,"a":[2],"q":"二次電流為5A 之CT，二次側接有0.4Ω阻抗負載時，其負擔（VA）為","o":["2.5","10","12.5","25"],"x":"CT 負擔 = I² × Z = 5² × 0.4 = 25 × 0.4 = 10 VA。CT 是定電流源，二次額定電流固定 5 A，所以負擔以 I²Z 計算，不是 V²/Z。"},{"c":6,"n":18,"a":[2],"q":"比流器（CT）二次側\u00010\u0001端接地之主要目的為","o":["防止二次諧波","人員安全","穩定電壓","穩定電流"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAA4BAMAAABJf2bZAAAAGFBMVEX///+ioqKJiYlkZGRDQ0MvLy8eHh4KCgqJxMj6AAABS0lEQVR42tXTsU7DMBAG4P8uSBVL44QJBkgcJhZU2idAPHaBjalQXqCpxy7EpiOiOYY0oa79AvX0x5/Od4p0wEmdxP+sUteFJx9YjzZd2vLhPU1Fqy7axLtP386le4vZg1Zon8WD1A7Zg7IxUFGoHalhwINZxx9ADAgOEBNCKQC1YQVpC2gJgQsLZCaEC+VAhQtBiQMQgaxx4DQELtaAtiFQ2oDKFQLIxgacmhC0dZj+t6gGKBrwpBkKbntgZZGreoDXHkg5lO3wEn560AIu5gZB80ycbpeIAChvEAKBqvt1BAAuaxMFyApR2M1NDEiJf98DF/XRfpwBAPLZvlD8ilxn7RoAtPKAZxPYTwBc+T3ka/Hc/bCd83pIbZPvwiAvf4+msmi3j0hmN8vjqSDIH5LrdxeuM19dXjUvkT13dDdabA73bgglapzu+QOOY2mu0rlzLQAAAABJRU5ErkJggg==",22,25]],"x":"CT 二次側的 ℓ 端接地，是為了萬一一次、二次間絕緣破壞或靜電感應時，高壓不會出現在二次電表回路上，保護操作與維修人員安全。接地與抑制諧波、穩定電壓或電流都無關，重點是人員安全。"},{"c":6,"n":19,"a":[1],"q":"某變壓器無載時變壓比為20.5:1，滿載時為21:1 則其電壓調整率為多少％？","o":["2.43","-2.38","-2.43","2.38"],"x":"電壓調整率 = (無載二次電壓 − 滿載二次電壓) ÷ 滿載二次電壓。一次電壓固定時二次電壓與變壓比成反比，所以 VR = (1/20.5 − 1/21) ÷ (1/21) = 21/20.5 − 1 = 0.5/20.5 ≈ 0.0243，約 2.43%。滿載電壓下降，調整率為正值。"},{"c":6,"n":20,"a":[1],"q":"變壓器的效率為","o":["輸出功率與輸入功率之比","輸入電能與輸出電能之比","輸入功率與損失之比","輸出功率與損失之比"],"x":"效率 η = 輸出功率 ÷ 輸入功率 × 100%，也可寫成 輸出 ÷ (輸出 + 損失)。比值必小於 1。把輸入放分子、或拿損失來比，都不是效率的定義。"},{"c":6,"n":21,"a":[4],"q":"3300/110V 單相變壓器，當分接頭置於3450V 位置時，二次側電壓為105V，此時一次側電源電壓約為多少V？","o":["3615","3555","3450","3295"],"x":"分接頭在 3450 V 時，匝數比 = 3450 ÷ 110。一次電源電壓 = 二次電壓 × 匝數比 = 105 × 3450 ÷ 110 ≈ 3293 V，約 3295 V。記法：分接頭代表「若一次加這個電壓，二次就是 110 V」，按比例換算即可。"},{"c":6,"n":22,"a":[4],"q":"單相變壓器，一次與二次匝數比為4：1，滿載時二次側之電壓為105V，已知電壓調整率為5％，一次側端電壓約為多少V？","o":["399","400","420","441"],"x":"先求二次無載電壓 = 105 × (1 + 0.05) = 110.25 V，再乘匝數比：一次電壓 = 4 × 110.25 = 441 V。常見錯誤是直接 105 × 4 = 420 V，忘了電壓調整率要先把滿載電壓換回無載電壓。"},{"c":6,"n":23,"a":[1],"q":"比流器（CT）若二次側短路時，一次側電流","o":["不變","增加","減少","先增加後減小"],"x":"CT 一次側串接在線路中，一次電流由線路負載決定，與 CT 二次側狀況無關。CT 正常使用時二次側本來就接近短路狀態（電流表阻抗極小），所以二次短路時一次電流不變。這也是拆表前要先短路 CT 二次的原因。"},{"c":6,"n":24,"a":[1],"q":"配電系統配電變壓器之二次側中性線接地，係屬於","o":["低壓電源系統接地","設備接地","內線系統接地","高壓電源系統接地"],"x":"配電變壓器二次側中性線接地，是為了穩定低壓系統對地電壓，屬於低壓電源系統接地。設備接地是指用電器具金屬外殼的接地；內線系統接地是用戶端屋內線路的接地，不是變壓器側。"},{"c":6,"n":25,"a":[4],"q":"變壓器負載增加時，下列何者錯誤？","o":["一次電流增加","匝數比不變","變壓比會增加","鐵損增加"],"x":"鐵損只與電壓及頻率有關，與負載大小無關，負載增加時鐵損大致不變，所以「鐵損增加」是錯的。負載增加時一次電流跟著增加，匝數比不變，但二次端電壓因內部壓降而下降，變壓比（電壓比）會增加。"},{"c":6,"n":26,"a":[4],"q":"變壓器滿載銅損為半載銅損之多少倍？","o":["1/4","1/2","2","4"],"x":"銅損與負載電流平方成正比。滿載電流是半載的 2 倍，銅損 = 2² = 4 倍。反過來，半載銅損只有滿載的 1/4。"},{"c":6,"n":27,"a":[1],"q":"變壓器若一次側繞組之匝數減少20％，則二次繞組之感應電勢將","o":["升高25％","降低25％","升高20％","降低20％"],"x":"二次感應電勢 E2 = V1 × N2 ÷ N1。一次匝數減少 20% 變為 0.8 N1，E2 變為原來的 1 ÷ 0.8 = 1.25 倍，即升高 25%。注意不是升高 20%，因為匝數在分母。"},{"c":6,"n":28,"a":[3],"q":"額定600V、30A、阻抗為1.2Ω之變壓器，則其百分比阻抗為多少％？","o":["4","5","6","20"],"x":"基準阻抗 = 額定電壓 ÷ 額定電流 = 600 ÷ 30 = 20 Ω。百分比阻抗 = 實際阻抗 ÷ 基準阻抗 × 100% = 1.2 ÷ 20 × 100% = 6%。也可用 %Z = I × Z ÷ V = 30 × 1.2 ÷ 600 = 6%。"},{"c":6,"n":29,"a":[4],"q":"電源電壓維持不變時，變壓器之渦流損失與頻率之關係為","o":["成正比","平方成正比","成反比","無關"],"x":"渦流損 Pe ∝ (f × Bm)²，而電壓不變時 Bm ∝ V ÷ f，代入得 Pe ∝ V²，頻率被消掉了。所以電源電壓固定時，渦流損與頻率無關；磁滯損則會隨頻率改變。"},{"c":6,"n":30,"a":[3],"q":"在變壓器中，鐵損是由下列何者所構成？","o":["磁滯損","渦流損","磁滯損與渦流損","線圈電阻功率損失"],"x":"變壓器鐵損由磁滯損與渦流損兩部分組成，鐵損又稱無載損失。線圈電阻造成的功率損失是銅損，屬於負載損失，不屬於鐵損。"},{"c":6,"n":31,"a":[3],"q":"若變壓器一次側外加純正弦波，主磁通及反電勢皆須為正弦波，激磁電流必為","o":["方波","正弦波","含有高奇數諧波","餘弦波"],"x":"鐵心磁化曲線是非線性的（有飽和與磁滯），要讓磁通與反電勢維持正弦波，激磁電流就必須是尖頭的非正弦波，含有以三次為主的奇次諧波。所以激磁電流不是正弦波、方波或餘弦波。"},{"c":6,"n":32,"a":[2],"q":"變壓器無載時，磁化電流為6A，鐵損電流為8A，則其無載電流為多少A？","o":["2","10","14","48"],"x":"無載電流由磁化電流與鐵損電流組成，兩者相位差 90°，要用向量和：I0 = √(6² + 8²) = √100 = 10 A。不能直接相加成 14 A，3-4-5 直角三角形一看就知道。"},{"c":6,"n":33,"a":[1],"q":"假設電源不變，則三相Y－Y 連接之變壓器改為△－Y 連接時，二次側電壓變為原來的多少倍？","o":["\u00010\u0001","1/3","\u00011\u0001","1"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEYAAAA3BAMAAABDfiHTAAAAGFBMVEX///+bm5t/f39paWlBQUElJSUKCgoAAAAfr5H+AAABqklEQVR42tWVPUvDUBSG39ybKqEgqaEExcEPEKxLJaAgDrF+jKIguEboIrhWf4P+BAXbpYM4mMlJoYuoKCVTcZLgpFJoB4W2mtahtM3HbZOhg57t3PvknnvPOe8J8LeM86zImt07KQG8h9Eu7F6EyeDFvUAC3MfL1P2ZwW/0J1YA2wlwjoi+3IeE/Rnemx5WLQBgQMPPWcuhrk0afQYg7wlCeOGuC5PMttuDfr11j0W1Dx3TKpaN7gz/ngEeoPLsd4UEABsZAHgskx45bDZi3QiSZ4vNTOj+zJxpcy59Y5GYyWYsxjEuJjTWEWfCt3/oupL0qfuqNA66qbNqupZtabUQEyDdsmJ1mrlxmgcn2pjhw5QnWuMG0NoMVZI6UT3N7KjX9sqxiUkAIEP2k8q2d50DVUTjhjvak+rMjwERAGf00tc1FACJnHMz52AsEIaIDWd+MmTLTUzVXPUqIQI640xo2sXUzJDYmsNyCgDoaNmtwWLcep2/BwDsc0tyVdr1armyOFLNN78sKJBmP68qnjnPHQBHPvOnkQ4wo4qOZmYzdcMK8AsS8T/sF8MSXVfMBKhgAAAAAElFTkSuQmCC",32,25],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADMAAAA3BAMAAABTHm8PAAAAGFBMVEX///+hoaF7e3tdXV0+Pj4cHBwHBwcAAADXcCAYAAABUklEQVR42tWTsU7DMBCGPyfpVtGkVUdohJghQAUjgUo8QIV4BJ4AxDvBwhNAHqCAd6riHanN3jZhSFLsJkGCCbzY58935zv/hr8+hGE5YTYnj4Cjk6N9N1ukJeSN4xyVgl8bpqUbST2iFjmT33h9g7brjx279QFjQHhVyAfsy6tBBdoELnz6QRml4PjAaV6m+T728kkMGiUvewrB6HmkRFAVcCuCh/puzMtIKHirLrktQf64va7RMAOdxIUO1DoqlGEltbnsErKb+SJ8XUeFxMVepKHujX7nsXZ5MbRCEHm5O1MNNVocQFvlqSINpXfqK2VjrndjrqTtFxtnL2ajJgT0soC70kQLPHoAdD+AjobSuJ0fHUbAUC9ZOrQAHNfzOrcbuqLew34T4JBzYKl7zRisBLz6btm0iF0JWMkECoXkKFVBDCT3FQKQ9dqYpZJ/Nz4Bj7VPHR3JnYsAAAAASUVORK5CYII=",23,25]],"x":"Y-Y 時一次繞組只承受線電壓的 1/√3；改為 △-Y 後一次繞組承受全部線電壓，繞組電壓提高 √3 倍。匝數比不變，二次側電壓也跟著變為原來的 √3 倍。"},{"c":6,"n":34,"a":[3],"q":"下列何種三相變壓器之連接，會產生變壓器內部環流？","o":["V－V","Y－Y","△－△","T－T"],"x":"△-△ 接線形成閉合迴路，激磁電流中的三次諧波會在 △ 繞組內部環流；若三具變壓器變壓比稍有差異，也會在 △ 內產生循環電流。V-V、Y-Y 與 T-T 都沒有閉合的繞組迴路，不會形成內部環流。"},{"c":6,"n":35,"a":[2],"q":"下列三相變壓器組何者不可並聯運用？","o":["Y－Y 與△－△","Y－△與Y－Y","△－Y 與Y－△","△－△與△－△"],"x":"Y-△ 一、二次間有 30° 相位移，Y-Y 則沒有相位移，兩組並聯時二次電壓相位不同，會產生很大的循環電流，所以不可並聯。Y-Y 與 △-△ 相位移都是 0°、△-Y 與 Y-△ 都是 30°，可以並聯。口訣：△ 的數目為偶數才能並聯。"},{"c":6,"n":36,"a":[3],"q":"量測變壓器銅損的方法是","o":["溫昇試驗","開路試驗","短路試驗","耐壓試驗"],"x":"短路試驗是將低壓側短路，在高壓側加低電壓使額定電流流過，因電壓很低鐵損可忽略，瓦特表讀值即為銅損。開路試驗量的是鐵損，溫昇、耐壓試驗不量損失。口訣：開路量鐵、短路量銅。"},{"c":6,"n":37,"a":[2],"q":"欲求變壓器之線圈阻抗應作下列何種試驗？","o":["溫升試驗","短路試驗","變壓比試驗","無載試驗"],"x":"短路試驗時加入的電壓（阻抗電壓）除以額定電流就是等效阻抗，配合瓦特表讀值可再算出等效電阻與漏電抗。無載（開路）試驗求的是激磁導納與鐵損，變壓比試驗只求匝數比。"},{"c":6,"n":38,"a":[1],"q":"變壓器接成Y 接時，下列何者正確？","o":["線電流＝相電流","線電壓＝相電壓","相電壓＝\u00010\u0001線電壓","相電流＝\u00011\u0001線電流"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADYAAAAwBAMAAACoMpTzAAAAGFBMVEX///+VlZVoaGg8PDwfHx8NDQ0DAwMAAABIxlVuAAABVElEQVR42sWTu0oDQRiFv50RUgU3kViIlxgigohENyIoSERbRfAJLHwAK19GfQUfQCHbWmXLSCBuFxESthR0dyzM3jLZICl0qpn/zH/mzJkz8LfDSK3mL8PZ1503stNKrcQEzl9jxtKUfV72xtyUWvITsK00NqMx1U2/OQYLgPVjULbGKYDSYfeV+njOs0dX7DZMD0Am6nLwIYI26m0/3x7lnPMIHMB3s3QC3oumZSPS62pYLQqE7kv4CqKlnSLLw0lR9zOMXOnqPEOnsVOlOiSKq5UuAL2eJUrx3SvlZOfglkLs79oFgIpArxhie4u2AXAaYsqNdD63PmUjpcdO3CFwtkHY47PUlCDduNpPYL6sJRtMJ4lxxGwc6s0kxoNkBYATQPRTfnal+WOhdbNauHZSnqkD03eB4D23sHyfzq5yaj4AnY6e+acJf0V5dvaHqvDv4xuBCFFSGjUvtAAAAABJRU5ErkJggg==",24,22],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADYAAAAwBAMAAACoMpTzAAAAGFBMVEX///+VlZVoaGg8PDwfHx8NDQ0DAwMAAABIxlVuAAABVElEQVR42sWTu0oDQRiFv50RUgU3kViIlxgigohENyIoSERbRfAJLHwAK19GfQUfQCHbWmXLSCBuFxESthR0dyzM3jLZICl0qpn/zH/mzJkz8LfDSK3mL8PZ1503stNKrcQEzl9jxtKUfV72xtyUWvITsK00NqMx1U2/OQYLgPVjULbGKYDSYfeV+njOs0dX7DZMD0Am6nLwIYI26m0/3x7lnPMIHMB3s3QC3oumZSPS62pYLQqE7kv4CqKlnSLLw0lR9zOMXOnqPEOnsVOlOiSKq5UuAL2eJUrx3SvlZOfglkLs79oFgIpArxhie4u2AXAaYsqNdD63PmUjpcdO3CFwtkHY47PUlCDduNpPYL6sJRtMJ4lxxGwc6s0kxoNkBYATQPRTfnal+WOhdbNauHZSnqkD03eB4D23sHyfzq5yaj4AnY6e+acJf0V5dvaHqvDv4xuBCFFSGjUvtAAAAABJRU5ErkJggg==",24,22]],"x":"Y 接線中線路直接串接各相繞組，所以線電流＝相電流；電壓則是線電壓＝√3 × 相電壓。錯誤說法在於：線電壓不等於相電壓、相電壓應是線電壓的 1/√3 而非 √3 倍、相電流與線電流相等而非 √3 倍。記法：Y 接電流相等，△ 接電壓相等。"},{"c":6,"n":39,"a":[1],"q":"變壓器一次側電壓維持不變，而二次側接線由Y 接改成△接，則二次側電壓為原來的多少倍？","o":["\u00010\u0001","\u00011\u0001","\u00012\u0001","\u00013\u0001"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACcAAAA7BAMAAAAKmY7mAAAAGFBMVEX///+kpKSJiYlwcHBaWlpEREQ2NjYJCQkppToIAAAA5klEQVR42t2SMU8CMRiGn7aei0TrcLAi0TgKF3/AObEDP4DN1X8kv4TfwOiGDiYmGu82yB1UB8Br7xoHA4T4Tm+efv2+9m3hUNTcGPmD5FWvCkWLKlyOPdDSf4HCWyn3/lgC1J0NPibb6LmW6msgf3Tg8QnAV+rsOfeFcOOD+i9xKct3B+GTuxoitRiu/FGBTUq9NCgBWJR6ns6B2ZubQRNQ2nPOy7YLhQamUQHFfYyZAFlQ7LpoPKzddVE5fQ+IKh/MbDpn9qBRDEjkmQ2T20+gY55tmKsUzAupc83a6xxmv8S6G30DDtAokUQDgn0AAAAASUVORK5CYII=",18,27],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAgBAMAAACIv8e9AAAAGFBMVEX///+rq6uPj490dHRcXFxMTEw3NzcNDQ2IzG3RAAAAzUlEQVR42rWPLQ7CQBCFv25pcU0T8DQYFBVoREUPgCA4DAJNFWfgCATDUXqEcgOQJASa4PhpEdtul6wjYdTsm2/fvIEfy1JdDMAlo1Ur4p0B3DRcBIaD0wxNeyV5ptQzpRDsEUATIsdNCPc6lTPfpF19jaTXupc87GrmeuqPToPW1BBgNtFD+IDwvZqKK6nYCV9K03uESAGK3K8+uQm27AdB5fVwsHN5wrneeIhKyY9VKHfVB2uBHahcLzeE0lmGR5WrOAXA9uu2dsR/6gNl1CLRw2qmnwAAAABJRU5ErkJggg==",16,14],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACYAAAA5BAMAAACok0TTAAAAGFBMVEX///+jo6OMjIx8fHx1dXViYmJEREQdHR38EsSqAAAA4ElEQVR42s2SMQrCQBREX9ZsbFNpmyD2egR7CwNiWq3E0mtYeAPBI3gAC08g3kAtFdGUgsZYRDYbk0KQQKb6zP6dGYYPBcHw1CjU0MhyGhQX8dte2bmKyHIdY0QJYYBo60S0/Vfvg1oPIFzoXPMCEAX6Dzunv5xORbKnnsXrnhvC/c4CvvOYp/Q8OM2knfrnAdSd7E3e0r73AKiEurkEwExljv27ydIALAAcpee7zV0IIK/JnjWNWxlqHTwlPUAsNe51bNmxmpO4ryaA7AecD4p7mmuI9rDRIo9zmqsWeWtv1VQoJ5fCypwAAAAASUVORK5CYII=",17,26],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAiBAMAAADfS4Y4AAAAGFBMVEX///+dnZ14eHhcXFw8PDwcHBwLCwsCAgI+GOIzAAAA1UlEQVR42r2Rvw4BQRCHv709SrY5lT8XoiE6pUJ0EgWhVHsCidfSewGFYh9A5CQqBdvbOIVk7zY5rWn2l28m85uZhT+FcCqcxAD3fT7dzWTgVFoEB0VQFUDxzGDosgYxbJ0SrzJIiCadpT9wWbEi3MVepTLCYrXyYIV0D8Z3b1IwUuv7aA9+t2x4lVIDSOtayI0ijAGirGf7OidIADHLuZW2lAFqKudupWoCom9yMNXjKhBV6SwAJAC3aeOIWNdHPavd6V7yDByAR3bPd2Igvfz86b/GB/gZKmnIdQphAAAAAElFTkSuQmCC",18,15]],"x":"繞組電壓不變。二次 Y 接時線電壓 = √3 × 相電壓；改成 △ 接後線電壓 = 相電壓，所以二次側（線）電壓變為原來的 1/√3 倍。記法：Y 改 △ 電壓變小 √3 倍，△ 改 Y 電壓變大 √3 倍。"},{"c":6,"n":40,"a":[1],"q":"三具均為10kVA、11400/220V、60Hz 的單相變壓器，擬接成11400/380V 以供給三相負載使用，請問其連接方法應為","o":["△－Y","Y－△","△－△","Y－Y"],"x":"一次側 11400 V 要直接加在 11400 V 的繞組上，所以一次接 △；二次每相 220 V，要得到 380 V 線電壓，220 × √3 ≈ 381 V，所以二次接 Y。故為 △-Y 接線，同時二次 Y 接也能引出中性線。"},{"c":6,"n":41,"a":[1],"q":"10kVA 單相變壓器三具以Y－△連接時，可供三相容量為多少kVA？","o":["30","26","17.3","8.66"],"x":"三具單相變壓器不論接成 Y-△、△-Y、△-△ 或 Y-Y，三相總容量都等於三具容量相加：3 × 10 = 30 kVA。只有 V 接（兩具）才會打折為 √3 倍單台容量。"},{"c":6,"n":42,"a":[2],"q":"若兩具單相變壓器額定均為10kVA，採V－V 連接，則其三相總輸出容量為多少kVA？","o":["10","17.32","20","30"],"x":"V-V 接線三相輸出容量 = √3 × 單台容量 = 1.732 × 10 ≈ 17.32 kVA。不是兩台相加的 20 kVA，因為 V 接每具只能發揮 86.6% 的容量。"},{"c":6,"n":43,"a":[3],"q":"三具單相變壓器，每具容量為10kVA，接成△－△接線供給20kVA 三相平衡負載，今若其中一具故障，其餘二具繼續負擔全部負載時，則此兩變壓器之總過載量為多少kVA？","o":["10","8.66","2.68","1.34"],"x":"一具故障後剩兩具成 V-V 接線，可供容量 = √3 × 10 ≈ 17.32 kVA。負載仍為 20 kVA，總過載量 = 20 − 17.32 ≈ 2.68 kVA。"},{"c":6,"n":44,"a":[1],"q":"將電阻與電抗之比不相等的兩具變壓器作並聯運轉時，則此兩具變壓器所分擔的電流大小之和","o":["大於兩具單獨運轉之電流和","等於兩具單獨運轉之電流和","小於兩具單獨運轉之電流和","可大於也可小於兩具單獨運轉之電流和"],"x":"兩具變壓器電阻與電抗比不同時，各自分擔的電流相位不一致，負載電流是兩者的向量和。向量相加小於數值相加，所以兩具分擔電流的大小（數值）之和，會大於只有相位一致時的電流和，造成多餘的損失。這也是並聯最好 R/X 比要相等的原因。"},{"c":6,"n":45,"a":[3],"q":"將匝數比為a 之雙繞組變壓器，改接成升壓自耦變壓器，則自耦變壓器與原雙繞組變壓組之負載容量比為多少倍？","o":["1/（1+a）","1/（1-a）","1+a","1-a"],"x":"改成升壓自耦變壓器後，輸出容量 = 自感容量 × 高壓 ÷ 串聯繞組電壓。設一次電壓為 aV、二次為 V，接成升壓後輸出電壓 (a+1)V，串聯繞組電流不變，容量比 = (a+1)V ÷ V = 1 + a 倍。驗算：200/100 V（a=2）改成 200/300 V，容量變 3 倍。"},{"c":6,"n":46,"a":[2],"q":"關於變壓器銅損之敘述，下列何者正確？","o":["與頻率平方成正比","與負載電流平方成正比","與負載電流成正比","與頻率成正比"],"x":"銅損 Pc = I²R，與負載電流的平方成正比，與頻率無關（與頻率有關的是鐵損）。例如負載變為一半，銅損只剩 1/4。"},{"c":6,"n":47,"a":[1],"q":"有一50kVA、6600/220V 之單相變壓器經由開路及短路試驗測得其鐵損及銅損分別為300W 及500W，若變壓器在滿載時功率因數為0.8，則滿載效率為多少％？","o":["98","90","85","80"],"x":"輸出功率 = 50 kVA × 0.8 = 40 kW = 40000 W。滿載效率 = 輸出 ÷ (輸出 + 鐵損 + 銅損) = 40000 ÷ (40000 + 300 + 500) = 40000 ÷ 40800 ≈ 98%。"},{"c":6,"n":48,"a":[3],"q":"變壓器若為220/110V，高壓繞組之等值電阻約為低壓繞組之等值電阻的幾倍？","o":["2","1/2","4","1/4"],"x":"阻抗換算與匝數比平方成正比。匝數比 a = 220 ÷ 110 = 2，高壓側等值電阻 = a² × 低壓側等值電阻 = 4 倍。記法：電壓比一倍，阻抗比平方倍。"},{"c":6,"n":49,"a":[2],"q":"變壓器的激磁電流中，含諧波振幅最大者為","o":["二次諧波","三次諧波","四次諧波","五次諧波"],"x":"鐵心磁化曲線對稱，激磁電流波形正負半週對稱，只含奇次諧波，其中以三次諧波振幅最大。偶次諧波（二次、四次）不會出現，五次諧波雖存在但比三次小。"},{"c":6,"n":50,"a":[3],"q":"正弦波加於變壓器一次側時，由鐵心的磁滯影響造成激磁電流成為","o":["正弦波","含偶次諧波","含奇次諧波","鋸齒波"],"x":"鐵心磁滯與飽和使激磁電流成為尖頭的非正弦波，但正負半週對稱，所以只含奇次諧波（以三次最大），不含偶次諧波。也不是單純的正弦波或鋸齒波。"},{"c":6,"n":51,"a":[3],"q":"下列何者試驗主要在量測變壓器之效率及電壓調整率？","o":["短路試驗","開路試驗","負載試驗","溫升試驗"],"x":"負載試驗是讓變壓器實際帶負載，直接量測輸入、輸出功率與二次電壓變化，可求效率及電壓調整率。開路試驗求鐵損，短路試驗求銅損與阻抗，溫升試驗則檢查溫度。"},{"c":6,"n":52,"a":[3],"q":"變壓器於二次側接有負載時，其鐵心內之公共磁通ψm 係由","o":["一次安匝單獨產生","二次安匝單獨產生","一次及二次安匝聯合產生","無法判定"],"x":"變壓器帶負載時，二次電流產生的安匝會抵消部分磁通，一次側隨即增加電流補回。鐵心中的公共磁通是一次安匝與二次安匝合成的結果，大小近似不變（由電源電壓決定）。所以是一次及二次安匝聯合產生。"},{"c":6,"n":53,"a":[1],"q":"比流器（CT）其額定為50/5A，15VA，則二次電路之最大阻抗為多少Ω？","o":["0.6","1","2","2.5"],"x":"CT 額定負擔 15 VA，二次額定電流 5 A，由 VA = I² × Z 得 Z = 15 ÷ 5² = 15 ÷ 25 = 0.6 Ω。二次回路總阻抗超過 0.6 Ω，準確度就無法保證。"},{"c":6,"n":54,"a":[2],"q":"配電盤上之CT，標示為0.5 級係表示","o":["絕緣等級","準確度","耐壓","形狀大小"],"x":"CT 標示 0.5 級是指準確度等級，表示在額定條件下比流誤差不超過 0.5%。數字越小越準確，計費用電表常用 0.5 級或更高等級。與絕緣、耐壓或尺寸無關。"},{"c":6,"n":55,"a":[1],"q":"變壓器之額定容量常以下列何種單位表示之？","o":["kVA","kW","kVAR","kWH"],"x":"變壓器的損失與溫升取決於電壓與電流，而非負載功率因數，所以額定容量以視在功率 kVA 表示。kW 是有效功率、kVAR 是無效功率、kWH 是電能，都不適合用來表示變壓器容量。"},{"c":6,"n":56,"a":[3],"q":"變壓器之一次側係指","o":["高壓側","低壓側","電源側","負載側"],"x":"變壓器的一次側是接電源的一側，二次側是接負載的一側，與電壓高低無關。降壓變壓器一次是高壓側，升壓變壓器一次反而是低壓側。"},{"c":6,"n":57,"a":[3],"q":"變壓器感應電勢E＝4.44Nψ\u0003m\u0003f，式中E 表示電壓之","o":["瞬時值","最大值","有效值","平均值"],"x":"E = 4.44Nfφm 是由最大值 2πfNφm 除以 √2 得到（2π ÷ √2 ≈ 4.44），所以 E 代表感應電勢的有效值，其中 φm 是磁通最大值。記法：4.44 已經除過 √2，結果就是有效值。"},{"c":6,"n":58,"a":[4],"q":"220/110V，10kVA 之變壓器，若改接成110/330V 之自耦變壓器，則可供給之容量為多少kVA？","o":["5","8.6","10","15"],"x":"改接 110/330 V 自耦變壓器時，110 V 繞組為共同繞組，220 V 繞組為串聯繞組，其額定電流 = 10000 ÷ 220 ≈ 45.45 A。輸出容量 = 330 × 45.45 ≈ 15000 VA = 15 kVA。公式：10 × 330 ÷ 220 = 15 kVA。"},{"c":6,"n":59,"a":[2],"q":"匝數比為2：1 之單相變壓器三具，連接成△－Ｙ時，當二次側線電流為10A 時，則一次側線電流約為多少A？","o":["5","5 \u00010\u0001","10 \u00011\u0001","20"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACUAAAAgBAMAAABnfayDAAAAGFBMVEX///+pqamMjIxnZ2dNTU04ODgYGBgCAgL4PVeoAAAA1ElEQVR42rWPPQrCQBhEX2JS2GhEOxGCEmxULATBwkYPkEt4ACsv4WE8gGBqi+AF1HRWkoWU/qyF7pIlVoJTDY/9Zmbhd1na1X0AGYOj2TQCkOSZTJWzdUhCkYlimUvxnfzCqmC331b3tq72wnusjbyQwHNWvnEruIn7Zpi/tQQJnMvFKa7ZC0DTYBIgmBlsAFi1xlCxEVAB5P6g2DwLVd7O+7DtqaPYQ+fdMpxILVfqhp/prqd7j20LmPv0BEAJ4Nl/XqAx8Xe5/eNl/jfvzXHKH/UC8UUsPk97ic4AAAAASUVORK5CYII=",17,14],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAgBAMAAACIv8e9AAAAGFBMVEX///+rq6uPj490dHRcXFxMTEw3NzcNDQ2IzG3RAAAAzUlEQVR42rWPLQ7CQBCFv25pcU0T8DQYFBVoREUPgCA4DAJNFWfgCATDUXqEcgOQJASa4PhpEdtul6wjYdTsm2/fvIEfy1JdDMAlo1Ur4p0B3DRcBIaD0wxNeyV5ptQzpRDsEUATIsdNCPc6lTPfpF19jaTXupc87GrmeuqPToPW1BBgNtFD+IDwvZqKK6nYCV9K03uESAGK3K8+uQm27AdB5fVwsHN5wrneeIhKyY9VKHfVB2uBHahcLzeE0lmGR5WrOAXA9uu2dsR/6gNl1CLRw2qmnwAAAABJRU5ErkJggg==",16,14]],"x":"二次 Y 接，線電流＝相電流＝10 A。匝數比 2：1，一次相電流 = 10 ÷ 2 = 5 A。一次 △ 接，線電流 = √3 × 相電流 = 5√3 ≈ 8.66 A。重點是先在相上換算匝數比，再轉線值。"},{"c":6,"n":60,"a":[2],"q":"變壓器施行絕緣耐壓時，各繞組之間，應能耐壓1.5 倍最大使用電壓之試驗電壓多少分鐘？","o":["5","10","15","20"],"x":"依「用戶用電設備裝置規則」對變壓器絕緣耐壓的規定，各繞組之間及繞組與鐵心、外殼間，應能耐受 1.5 倍最大使用電壓的試驗電壓連續 10 分鐘。記法：耐壓試驗「一點五倍、十分鐘」。"},{"c":6,"n":61,"a":[1],"q":"用戶自備電源變壓器，其二次側對地電壓超過多少伏特時，應採用設備與系統共同接地？","o":["150","300","600","750"],"x":"依「用戶用電設備裝置規則」，用戶自備電源變壓器二次側對地電壓超過 150 V 時，應採用設備與系統共同接地，以確保故障時保護設備能可靠動作。150 V 是低壓接地規定中常見的對地電壓界線，要記牢。"},{"c":6,"n":62,"a":[3],"q":"某單相200kVA 變壓器於滿載時，其功率因數為0.85 落後，則輸出為多少kW？","o":["85","100","170","200"],"x":"有效功率 P = S × cosθ = 200 × 0.85 = 170 kW。容量 200 kVA 是視在功率，乘上功率因數才是可輸出的 kW。"},{"c":6,"n":63,"a":[4],"q":"使用三台11.4kV/220V 之單相變壓器，若一次側電源電壓為三相三線式11.4kV，欲供給三相380V 電動機，變壓器應使用何種接線法？","o":["Y-Y","Δ-Δ","Y-Δ","Δ-Y"],"x":"一次三相三線 11.4 kV 要直接加在 11.4 kV 繞組上，所以一次接 Δ；二次每相 220 V，接成 Y 後線電壓 = 220 × √3 ≈ 380 V，可供 380 V 電動機。故採 Δ-Y 接線。"},{"c":6,"n":64,"a":[2],"q":"維修某變壓器，於繞紮線圈時，不慎將其一次線圈匝數增加，二次線圈端之電壓將何變化？","o":["升高","降低","不變","負載增加則電壓升高，反之降低"],"x":"二次電壓 V2 = V1 × N2 ÷ N1，一次匝數 N1 在分母。一次匝數增加，匝數比變大，二次電壓就降低，與負載大小無關。記法：一次匝數多，二次電壓少。"},{"c":6,"n":65,"a":[2],"q":"變壓比為30：1 之理想單相變壓器，若二次側伏特表指示為110 伏特，一次側之電壓為多少伏特？","o":["2200","3300","6600","11400"],"x":"理想變壓器 V1 = 變壓比 × V2 = 30 × 110 = 3300 V。3300/110 V 正是台灣常見的配電變壓器額定，順便記起來。"},{"c":6,"n":66,"a":[1],"q":"有一變壓器，滿載時銅損為180W，1/3 負載時銅損為多少W？","o":["20","30","60","90"],"x":"銅損與負載電流平方成正比：1/3 負載時銅損 = (1/3)² × 180 = 180 ÷ 9 = 20 W。不是 180 ÷ 3 = 60 W。"},{"c":6,"n":67,"a":[2],"q":"一電感性負載消耗之有效功率為600W，無效功率為800VAR，此負載之功率因數為何？","o":["0.6 超前","0.6 落後","0.8 超前","0.8 落後"],"x":"視在功率 S = √(600² + 800²) = 1000 VA，功率因數 = P ÷ S = 600 ÷ 1000 = 0.6。負載為電感性，電流落後電壓，所以是 0.6 落後。記法：電感落後、電容超前。"},{"c":6,"n":68,"a":[4],"q":"有甲和乙兩台容量皆為80kVA 之單相變壓器作並聯運轉供給100kVA，負載甲和乙之百分比阻抗壓降分別為4%與6%，則甲、乙分擔之負載分別為多少kVA？","o":["30、70","70、30","40、60","60、40"],"x":"並聯變壓器負載分配與百分比阻抗成反比（容量相同時）。甲：乙 = 1/4：1/6 = 6：4，所以甲分擔 100 × 6/10 = 60 kVA，乙分擔 100 × 4/10 = 40 kVA。阻抗小的分擔較多負載。"},{"c":6,"n":69,"a":[2],"q":"一般電力變壓器在最高效率運轉時，其條件為下列何者？","o":["銅損小於鐵損","銅損等於鐵損","銅損大於鐵損","效率與銅損及鐵損無關"],"x":"變壓器效率最高的條件是可變損失（銅損）等於固定損失（鐵損）。一般電力變壓器設計使最高效率出現在接近滿載附近。記法：銅鐵相等，效率最高。"},{"c":6,"n":70,"a":[4],"q":"下列何者不是變壓器的試驗項目之一？","o":["溫升試驗","開路試驗","衝擊電壓試驗","衝擊電流試驗"],"x":"變壓器常見試驗有開路、短路、溫升、極性、變壓比、絕緣耐壓及衝擊電壓試驗等。衝擊電壓試驗用來模擬雷擊突波，檢驗絕緣能力；「衝擊電流試驗」並不是變壓器的試驗項目。"},{"c":6,"n":71,"a":[1,2,3,4],"q":"內鐵式與外鐵式變壓器比較，則內鐵式","o":["磁路略長","易拆裝，修理簡便","絕緣特性佳","散熱能力較佳"],"x":"內鐵式是繞組包在鐵心外側：鐵心在內、磁路略長；線圈套在鐵心腳上，拆裝與修理簡便；高低壓繞組配置容易做絕緣，絕緣特性佳；線圈外露面積大，散熱能力較佳，適合高電壓。外鐵式則是鐵心包住線圈，機械強度較好。四項敘述皆正確。"},{"c":6,"n":72,"a":[2,4],"q":"有關變壓器之銅損，下列哪些正確？","o":["與電壓平方成正比","與電流平方成正比","可由開路試驗求得","可由短路試驗求得"],"x":"銅損 Pc = I²R，與電流平方成正比，可由短路試驗（加額定電流、低電壓）量得。與電壓平方成正比的是鐵損，而開路試驗求的也是鐵損，不是銅損。口訣：開路量鐵、短路量銅。"},{"c":6,"n":73,"a":[1,2,4],"q":"漏磁電抗在變壓器中，將使變壓器","o":["功率因數降低","體積變大","功率因數升高","電壓調整率變差"],"x":"漏磁電抗會造成電抗性壓降與無效功率：使功率因數降低，負載時二次電壓下降較多，電壓調整率變差；為了補償壓降並維持輸出，需加大設計，體積也隨之變大。漏磁電抗只會使功率因數降低，不會使其升高。"},{"c":6,"n":74,"a":[1,2,3],"q":"下列哪些是變壓器鐵心應具備之的條件？","o":["導磁性良好","成本低","鐵損小","激磁電流大"],"x":"鐵心要導磁性良好（導磁率高）、鐵損小（磁滯與渦流損少），並兼顧成本低。激磁電流應該越小越好，代表鐵心容易被磁化，「激磁電流大」是缺點不是條件。"},{"c":6,"n":75,"a":[1,2],"q":"變壓器無載損失包括下列哪些項目？","o":["鐵損","介質損","銅損","機械磨擦損"],"x":"無載損失是二次無負載、只加電壓時就存在的損失，主要是鐵損（磁滯損與渦流損），另有絕緣材料的介質損。銅損隨負載電流變化，屬於負載損失；變壓器是靜止電機，沒有機械摩擦損。"},{"c":6,"n":76,"a":[1,4],"q":"一般變壓器均將一次繞組與二次繞組分別作若干小繞組交互疊置，下列哪些是其目的？","o":["減少漏磁","減少渦流","工作容易","改善電壓調整率"],"x":"把一、二次繞組分成小繞組交互疊置，可讓兩繞組磁耦合更緊密，減少漏磁；漏磁少則漏電抗小，壓降小，電壓調整率因而改善。減少渦流靠的是鐵心疊片，與繞組疊置無關；交互疊置反而使施工較繁瑣，並非為了工作容易。"},{"c":6,"n":77,"a":[1,3],"q":"兩台變壓器在施行並聯運用時，必須滿足下列哪些條件？","o":["極性相同","容量相同","變壓比相同","阻抗相同"],"x":"並聯運用的必要條件是極性相同（否則形成短路環流）與變壓比相同（否則產生循環電流）。容量不必相同；阻抗只要百分比阻抗相近即可使負載依容量分配，不要求阻抗數值相同，所以不是必要條件。"},{"c":6,"n":78,"a":[2,3],"q":"下列哪些變壓器接線，其二次側可施行中性點接地？","o":["Y-Δ","Y-Y","Δ-Y","Δ-Δ"],"x":"中性點接地必須有 Y 接繞組才能引出中性點。Y-Y 與 Δ-Y 的二次側都是 Y 接，可施行中性點接地。Y-Δ 與 Δ-Δ 的二次側為 Δ 接，沒有中性點可接地。"},{"c":6,"n":79,"a":[1,2,4],"q":"下列哪些是自耦變壓器之優點？","o":["漏電抗可減少","成本較低","電壓比甚低","構造簡單"],"x":"自耦變壓器一、二次共用部分繞組，用銅、用鐵較少，所以成本較低、構造簡單，漏磁也少，漏電抗可減少。「電壓比甚低」不是優點，反而是它的使用限制：只有在電壓比接近 1 時才經濟，且一、二次沒有電氣隔離。"},{"c":6,"n":80,"a":[2,3,4],"q":"下列哪些是變壓器絕緣油應具備之條件？","o":["粘度高","介質強度高","比熱高","不碳化"],"x":"絕緣油要介質強度高（絕緣好）、比熱高（吸熱多、冷卻佳）、不易碳化與劣化，另需引火點高。粘度應該低，油才容易對流循環散熱，所以「粘度高」是錯的。"},{"c":6,"n":81,"a":[1,2,3],"q":"三具匝數比N1/N2＝20 之單相變壓器，接成Y–Y 接線，供應220 V、10 kW、功率因數為0.8 之負載，下列哪些正確？","o":["一次側相電壓為2540 V","二次側線電流為32.8 A","一次側線電流為1.64 A","一次側相電流為2.84 A"],"x":"二次線電流 = 10000 ÷ 0.8 ÷ (√3 × 220) = 12500 ÷ 381 ≈ 32.8 A。一次線電壓 = 220 × 20 = 4400 V，相電壓 = 4400 ÷ √3 ≈ 2540 V。一次線電流 = 32.8 ÷ 20 = 1.64 A。一次為 Y 接，相電流 = 線電流 = 1.64 A，2.84 A 是誤乘了 √3，所以錯。"},{"c":6,"n":82,"a":[2,3,4],"q":"利用三具單相變壓器連接成三相變壓器常用的接線方式中，哪些接線方式一次側不會產生三次諧波電流而干擾通訊線路？","o":["Y – Y 接線","Y–△接線","△–△接線","△–Y 接線"],"x":"激磁所需的三次諧波電流在 △ 繞組內形成環流，不必由線路供給，所以只要有一側是 △ 接（Y-△、△-△、△-Y），一次線路就不會有三次諧波電流。Y-Y 接線沒有 △ 迴路，中性點接地時三次諧波電流經線路與大地流通，會干擾通訊線路。"},{"c":6,"n":83,"a":[1,2,4],"q":"下列哪些是變壓器鐵心採用矽鋼片之原因？","o":["鐵損小","電阻係數大","磁性穩定","激磁電流小"],"x":"矽鋼片是在鐵中加入少量矽：電阻係數增大使渦流損減少，磁滯損也降低，所以鐵損小；導磁率高，所需激磁電流小。考試記三大理由：鐵損小、電阻係數大、激磁電流小，「磁性穩定」不選。註：材料文獻指出加矽幾乎可消除磁老化，「磁性穩定」並非錯誤敘述，只是題庫未列入。","f":"爭議"},{"c":6,"n":84,"a":[1,2,4],"q":"下列哪些是變壓器作極性試驗的目的？","o":["並聯運轉","三相連接","耐壓試驗","試驗用變壓器串聯運用"],"x":"極性試驗是確認繞組端子的加極性或減極性，凡是要把變壓器互相連接時都必須知道極性：單相並聯運轉、三具接成三相連接、試驗用變壓器串聯使用，接錯極性會造成短路或電壓相消。耐壓試驗是檢查絕緣，與極性無關。"},{"c":7,"n":1,"a":[2],"q":"電容器之配線，其安培容量應不低於電容器額定電流之多少倍？","o":["1.25","1.35","1.5","2.5"],"x":"依「用戶用電設備裝置規則」，電容器配線的安培容量不得低於電容器額定電流的1.35倍。因為電容器會受電壓變動、諧波及製造容許差影響，實際電流常比額定值大，所以要多留35%裕度。記法：電容器相關的倍數，配線、開關、隔離設備幾乎都是1.35。"},{"c":7,"n":2,"a":[3],"q":"兩具相同額定之電容器串聯，其合成電容值為單具電容器的多少倍？","o":["4","2","1/2","1/4"],"x":"電容器串聯的合成值算法和電阻並聯一樣：1/C總 = 1/C + 1/C = 2/C，所以C總 = C/2，是單具的1/2倍。記法：電容「串聯變小、並聯相加」，正好跟電阻相反。"},{"c":7,"n":3,"a":[3],"q":"低壓電容器之容量（kVAR），以改善功率因數至百分之多少為原則？","o":["八五","九○","九五","一○○"],"x":"依「用戶用電設備裝置規則」，低壓電容器容量（kVAR）以將功率因數改善到95%為原則。不追求100%，是因為負載變動時容易變成過度補償，反而造成超前功因及電壓上升，95%是兼顧效益與安全的設計值。"},{"c":7,"n":4,"a":[4],"q":"3ψ440V、60Hz、100kVAR 之電容器，使用在3ψ380V、60Hz 之供電系統中，其電容器容量約變為多少kVAR？","o":["37.3","43.2","50","74.6"],"x":"電容器無效功率 Q 與電壓平方成正比：Q' = Q × (V'/V)² = 100 × (380/440)² = 100 × 0.7459 ≈ 74.6 kVAR。頻率同為60Hz不變，只看電壓變化。重點：電壓降一些，容量會掉得更多，因為是平方關係。"},{"c":7,"n":5,"a":[2],"q":"某工廠負載為1000kVA，功率因數為0.8 滯後，若欲改善功率因數至1.0，需裝置多少kVAR 之電容器？","o":["800","600","400","200"],"x":"改善前：P = 1000 × 0.8 = 800 kW，Q = 1000 × sin θ = 1000 × 0.6 = 600 kVAR。功因改善到1.0代表無效功率要全部抵消，所以需要裝 600 kVAR 的電容器。口訣：功因0.8，sin就是0.6（3-4-5直角三角形）。"},{"c":7,"n":6,"a":[1],"q":"電容器額定電壓超過600 伏特者，其釋放能量之裝置應能於電源啟斷後5 分鐘內，將殘餘電壓降至多少伏特以下？","o":["50","60","70","80"],"x":"依「用戶用電設備裝置規則」，額定電壓超過600伏特的電容器，放電裝置須在電源啟斷後5分鐘內把殘餘電壓降到50伏特以下（600伏以下者為1分鐘內降到50伏）。目的是保護檢修人員不被殘留電荷電擊，50伏是一般認定的安全電壓。"},{"c":7,"n":7,"a":[4],"q":"高壓電容器之開關設備，其連續載流量不得小於電容器額定電流之多少倍？","o":["1.05","1.15","1.25","1.35"],"x":"依「用戶用電設備裝置規則」，高壓電容器開關設備的連續載流量不得小於電容器額定電流的1.35倍。理由同低壓：電壓偏高、諧波電流與容量誤差都會讓實際電流變大。記住電容器家族的共同數字就是1.35。"},{"c":7,"n":8,"a":[3],"q":"低壓電容器隔離設備之額定不得小於電容器額定電流之多少倍？","o":["1.1","1.25","1.35","1.5"],"x":"依「用戶用電設備裝置規則」，低壓電容器隔離設備的額定不得小於電容器額定電流的1.35倍。配線、隔離設備、開關設備都用同一個倍數，考試看到電容器加上「倍數」，先想1.35。"},{"c":7,"n":9,"a":[2],"q":"低壓電容器配裝於電動機分路之 導線，其安培容量不得小於電動機電路導線安培容量多少，且不小於電容器額定電流1.35 倍？","o":["1/4","1/3","1/2","2/3"],"x":"依「用戶用電設備裝置規則」，電容器裝在電動機分路時，接到電容器的導線安培容量不得小於電動機電路導線安培容量的1/3，同時也不得小於電容器額定電流的1.35倍，兩個條件都要滿足。"},{"c":7,"n":10,"a":[3],"q":"三相11.4kV 之受電用戶，未裝電容器改善功率因數時，電源側供應之負載電流為100 安培，功率因數0.8 滯後，如將功率因數改善至1.0 時，由電源側供應之負載電流變為多少安培？","o":["60","70","80","100"],"x":"加裝電容器後有效功率不變，只減少無效電流。有效電流分量 = 100 × 0.8 = 80 A；功因改善到1.0時，線路電流只剩有效分量，所以變為80 A。公式：I₂ = I₁ × cosθ₁ / cosθ₂ = 100 × 0.8 / 1.0 = 80 A。"},{"c":7,"n":11,"a":[4],"q":"相同的電容器n 個，其並聯時的電容量為串聯時的多少倍？","o":["1/n\u00022\u0002","1/n","n","n\u00022\u0002"],"x":"n個相同電容器並聯：C並 = nC；串聯：C串 = C/n。兩者相比 C並 / C串 = nC ÷ (C/n) = n²倍。小心別和7-20題（串聯是並聯的1/n²倍）搞混。"},{"c":7,"n":12,"a":[3],"q":"3ψ 380V 60Hz 50kVAR 之電容器，使用在3ψ 380V 50Hz 之供電系統時，其電容器容量（kVAR）","o":["不變","增加","減少","隨負載變動"],"x":"電容器無效功率 Q = V² × 2πfC，與頻率成正比。60Hz的電容器改接50Hz系統，容量變為原來的50/60，約41.7 kVAR，所以是減少。記法：電容抗 Xc = 1/(2πfC)，頻率降低容抗變大，電流變小，kVAR就跟著變小。"},{"c":7,"n":13,"a":[2],"q":"電容器串聯之目的在於使各電容器分擔","o":["電流","電壓","電阻","電抗"],"x":"電容器串聯時電荷量相同，總電壓會分配到各個電容器上，所以串聯的目的是讓各電容器分擔電壓，以適用較高的系統電壓。並聯則是增加總電容量，兩者用途要分清楚。"},{"c":7,"n":14,"a":[4],"q":"電力系統並接電容器之主要目的為","o":["保護線路","增加絕緣強度","增加機械強度","改善功率因數"],"x":"一般負載多為電感性（電動機、變壓器），電流落後電壓。並接電容器提供超前的無效電流，抵銷電感性無效功率，使功率因數提高，進而減少線路電流與損失。並聯電容器的主要目的就是改善功率因數。"},{"c":7,"n":15,"a":[1],"q":"純電容性之負載","o":["電流超前電壓相位90°","電壓超前電流相位90°","電流與電壓同相","電壓與電流相差30°"],"x":"純電容電路中，電流 i = C·dv/dt，電流相位超前電壓90°。記法口訣「ELI the ICE man」：ELI是電感，電壓E在電流I前面；ICE是電容，電流I在電壓E前面。"},{"c":7,"n":16,"a":[2],"q":"某工廠主變壓器之容量為1000kVA，漏磁電抗X \u00010\u0001為5%，激磁電抗X\u0003m\u0003為1％，在滿載時其消耗之無效電力為多少kVAR？","o":["70","60","50","40"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAAXBAMAAAD0LQLXAAAAGFBMVEX///+qqqqampqPj49/f39oaGhZWVlDQ0Na4IAlAAAATklEQVR42mNgoBQwCzAwMDEwMDCwCjtAWfpvH0BZNn8vQFhMDEVQ9eqMAVCWOTsDA0RWIBLKYpTfAGWx/PoAk33AZADVIaAGE2OTIsWNAFPWCjxJlIj4AAAAAElFTkSuQmCC",8,10]],"x":"變壓器滿載消耗的無效電力約等於漏磁電抗與激磁電抗兩部分之和（以百分比乘以額定容量）：Q = 1000 × (5% + 1%) = 50 + 10 = 60 kVAR。漏磁電抗部分在滿載時以額定kVA乘標么值計算。"},{"c":7,"n":17,"a":[2],"q":"高壓電容器之開關設備，其連續載流量，不得低於電容器額定電流多少倍？","o":["1.25","1.35","1.5","2.5"],"x":"依「用戶用電設備裝置規則」，高壓電容器開關設備的連續載流量不得低於電容器額定電流的1.35倍。與7-7題同一個觀念，換個選項排列而已，答案仍是1.35。"},{"c":7,"n":18,"a":[1],"q":"兩只電容器電容值與耐壓規格分別為50μF/50V、100μF/150V，若將其並聯後，此並聯電路的總電容值與總耐壓規格為何？","o":["150μF/50V","150μF/150V","75μF/50V","75μF/150V"],"x":"並聯時電容直接相加：50 + 100 = 150 μF。並聯時兩電容器承受同一電壓，耐壓要以較低的那一個為準，所以只能用50V。結論150μF/50V。記法：並聯「容量相加、耐壓取最小」。"},{"c":7,"n":19,"a":[4],"q":"三只電力電容器接成Y 接，並聯連接於三相感應電動機的電源側，主要目的為何？","o":["增加電動機輸出轉矩","增加電動機轉軸轉速","使電源側的有效功率增加","使電源側的無效功率減少"],"x":"電容器並接在電動機電源側，是由電容器就近供應電動機所需的無效電力，所以電源側要提供的無效功率減少，功率因數提高、線路電流下降。電容器不會增加電動機的轉矩、轉速，也不會增加有效功率。"},{"c":7,"n":20,"a":[1],"q":"相同的電容器n 個，其串聯時的電容量為並聯時的多少倍？","o":["1/n\u00022\u0002","1/n","n","n\u00022\u0002"],"x":"n個相同電容器串聯：C串 = C/n；並聯：C並 = nC。C串 / C並 = (C/n) ÷ (nC) = 1/n²倍。與7-11題互為倒數，串聯比較小所以是分數。"},{"c":7,"n":21,"a":[4],"q":"電容量為100μF 的電容器，其兩端電壓差穩定於100V 時，該電容器所儲存的能量為多少焦耳？","o":["2.0","1.5","1.0","0.5"],"x":"電容器儲存能量 W = ½CV² = ½ × 100×10⁻⁶ × 100² = ½ × 100×10⁻⁶ × 10000 = 0.5 焦耳。注意μF要先換成10⁻⁶法拉再代入。"},{"c":7,"n":22,"a":[2],"q":"有一電容器的電容值為10μF，其中英文字母μ代表的數值是","o":["10\u0002-3\u0002","10\u0002-6\u0002","10\u0002-9\u0002","10\u0002-12\u0002"],"x":"SI詞頭：m（毫）= 10⁻³、μ（微）= 10⁻⁶、n（奈）= 10⁻⁹、p（皮）= 10⁻¹²。所以10μF就是10×10⁻⁶法拉。記法：每往下一級除以一千。"},{"c":7,"n":23,"a":[1],"q":"有一電容器之容量為50kVAR，其中英文字母k 代表的數值是","o":["10\u00023\u0002","10\u00026\u0002","10\u00029\u0002","10\u000212\u0002"],"x":"SI詞頭：k（千）= 10³、M（百萬）= 10⁶、G（十億）= 10⁹、T（兆）= 10¹²。50kVAR就是50×10³乏。注意小寫k才是千，大寫M是百萬。"},{"c":7,"n":24,"a":[2],"q":"有一440V 電容器接於380V 電路中，其電容量變為多少%？","o":["86.36","74.59","115.79","134.07"],"x":"本題的「電容量」指電容器的無效電力容量kVAR，Q＝V²/Xc，與電壓平方成正比：(380/440)²＝0.8636²≈0.7459，即74.59%。86.36%只是電壓比沒有平方，115.79%與134.07%是比值倒過來算。註：電容值（μF）本身不隨電壓改變，題目的「電容量」應理解為kVAR容量。","f":"誤植"},{"c":7,"n":25,"a":[2],"q":"含有多少公升以上可燃性液體之低壓電容器，應裝設於變電室內或裝設於室外圍籬內？","o":["5","11","15","20"],"x":"依「用戶用電設備裝置規則」，含有11公升以上可燃性液體的低壓電容器，應裝在變電室內或室外圍籬內，以防絕緣油外洩起火時危及人員與建築物。11公升是由約3加侖換算來的數字。"},{"c":7,"n":26,"a":[1,3,4],"q":"高壓電容器隔離開關，應符合下列哪些規定？","o":["作為隔離電容器或電容器組之電源","具有自動跳脫且有適當容量的隔離開關","應於啟斷位置時有明顯可見之間隙","隔離或分段開關(未具啟斷額定電流能力者)應與負載啟斷開關有連鎖裝置或附有「有載之下不得開啟」等明顯之警告標識"],"x":"依「用戶用電設備裝置規則」，高壓電容器隔離開關的用途是隔離電容器或電容器組的電源，啟斷位置要有明顯可見間隙，未具啟斷負載電流能力者須與負載啟斷開關連鎖或標示「有載之下不得開啟」。「具自動跳脫功能」是斷路器的特性，不是隔離開關的要求。"},{"c":7,"n":27,"a":[1,3],"q":"低壓電容器容量之決定，應符合下列哪些規定？","o":["電容器之容量(kVAR)以改善功率因數至95%為原則","電容器之容量(kVAR)以改善功率因數至100%為原則","電容器以個別裝置於電動機操作器負載側為原則","電容器以個別裝置於電動機操作器電源側為原則"],"x":"依「用戶用電設備裝置規則」，低壓電容器容量以改善功率因數至95%為原則，並以個別裝置於電動機操作器的負載側為原則，讓電容器隨電動機一起投入與切離。改善到100%容易造成過度補償；裝在操作器電源側，電動機停機時電容器仍掛在線上，也會過度補償。"},{"c":7,"n":28,"a":[2,3,4],"q":"有關低壓電容器隔離設備，應符合下列哪些規定？","o":["電容器之隔離設備應能啟斷接地導線","電容器之隔離設備應能啟斷各非接地導線","低壓電容器之隔離設備得採用斷路器","低壓電容器之隔離設備得採用安全開關"],"x":"依「用戶用電設備裝置規則」，低壓電容器的隔離設備要能同時啟斷各非接地導線，可採用斷路器或安全開關。接地導線（被接地的中性線）原則上不得被單獨啟斷，所以「應能啟斷接地導線」是錯的。"},{"c":7,"n":29,"a":[1,3,4],"q":"有關低壓電容器過電流保護，應符合下列哪些規定？","o":["其安培額定不得大於電容器額定電流之1.35 倍","其安培額定不得大於電容器額定電流之1.5 倍","應裝設斷路器","應裝設安全開關配裝熔線"],"x":"依「用戶用電設備裝置規則」，低壓電容器的過電流保護可用斷路器或安全開關配熔線，其安培額定不得大於電容器額定電流的1.35倍。1.5倍不是規定值，電容器相關倍數記住1.35就對了。"},{"c":7,"n":30,"a":[2,3,4],"q":"高壓電容器開關設備作為電容器或電容器組啟閉之開關，應符合下列哪些規定？","o":["具有啟斷電容器或電容器組之最小連續負載電流能力","連續載流量不得小於電容器額定電流之1.35 倍","應能承受最大湧入電流","電容器側之故障電流"],"x":"依「用戶用電設備裝置規則」，高壓電容器開關設備的連續載流量不得小於電容器額定電流1.35倍，並應能承受最大湧入電流及電容器側的故障電流。錯誤處在於開關應能啟斷「最大」連續負載電流，而不是「最小」，能切最小電流沒有意義。"},{"c":7,"n":31,"a":[1,2,3,4],"q":"下列哪些為裝設電力電容器改善功率因數之效益？","o":["減少線路電流","減少線路電力損失","系統供電容量增大","節省電力費用"],"x":"電容器提供無效電力後，線路電流減少；電流變小，線路損失（I²R）也隨之減少；同樣的設備容量可以供應更多有效負載，等於系統供電容量增大；功因提高還能享有電費功因獎勵、避免罰款，達到節省電費。四項都是效益。"},{"c":7,"n":32,"a":[1,2,3,4],"q":"下列哪些是串聯電容器的主要應用？","o":["補償系統之電抗，以改善電壓調整率","對特定負載作功率因數改善","對於小型電力系統之起動大型電動機有助益","減低電焊機的kVA 需量"],"x":"串聯電容器是串接在線路上，用容抗抵銷線路感抗，因此能改善電壓調整率；對特定負載可改善功率因數；在小型系統中起動大型電動機時可減少電壓降；電焊機屬電感性大電流負載，串接電容可降低其kVA需量。四項都是串聯電容器的應用。"},{"c":7,"n":33,"a":[1,2,3],"q":"下列哪種電容器用於電路上，其兩個接腳能任意反接？","o":["陶質電容器","紙質電容器","雲母電容器","電解質電容器"],"x":"陶質、紙質、雲母電容器都是無極性電容器，兩接腳可以任意對調。電解質電容器有正負極性，接反會使氧化膜被破壞、漏電流大增，甚至發熱爆裂，所以不能反接。"},{"c":7,"n":34,"a":[1,2,4],"q":"電力電容器串聯電抗器主要目的，下列哪些錯誤？","o":["減少電流","加速充電","抑制投入時之突波(突入電流)","限制啟斷電流"],"x":"題目問「錯誤」的目的。串聯電抗器的真正目的是抑制電容器投入時的突入電流，並抑制諧波放大。至於減少電流、加速充電、限制啟斷電流都不是它的主要目的，所以這三項是本題要選的錯誤敘述。"},{"c":7,"n":35,"a":[3,4],"q":"台灣地區22.8kV 之一般高壓用戶，以斷路器保護時，總開關除裝置低電壓電驛（27）、過壓電驛（59）外，通常再配合下列哪些電驛保護？","o":["測距電驛(21)","頻率電驛(81)","過流電驛附瞬時過流元件(51/50)","接地過流電驛(51N)"],"x":"22.8kV一般高壓用戶以斷路器保護時，總開關除27、59電驛外，通常配合過流電驛附瞬時元件（51/50）保護相間短路與過載，以及接地過流電驛（51N）保護接地故障。測距電驛（21）用於輸電線路，頻率電驛（81）多用於汽電共生或併聯系統，不是一般用戶的標準配置。"},{"c":7,"n":36,"a":[2,3,4],"q":"保護電驛之工作電源應由下列哪些電源供電，以確保斷電時電驛尚能運作？","o":["交流電源","交流電源並聯專用之電容跳脫裝置（CTD）","不斷電系統（UPS）","直流電源系統"],"x":"保護電驛最需要動作的時候往往正是系統故障、電壓崩潰時，若只靠交流電源，停電時電驛和跳脫線圈就沒電可用。所以須使用交流電源並聯電容跳脫裝置（CTD）、不斷電系統（UPS）或直流電源（蓄電池）系統，確保斷電時仍能跳脫。"},{"c":7,"n":37,"a":[1,2,3,4],"q":"下列哪些高壓設備必須由指定之試驗單位，依有關標準試驗合格且附有試驗報告始得裝用？","o":["電力及配電變壓器","比壓器","比流器","熔絲"],"x":"依「用戶用電設備裝置規則」，高壓設備中的電力及配電變壓器、比壓器、比流器、熔絲等，都必須經指定試驗單位依相關標準試驗合格並附試驗報告才可裝用。這些設備一旦故障會直接影響供電安全，所以四項都要。"},{"c":7,"n":38,"a":[1,2,3],"q":"用戶電力電容器最理想的裝置位置，下列哪些錯誤？","o":["主幹線匯流排上","各分路線上","受電設備幹線上","接近各用電設備處"],"x":"題目問「錯誤」的位置。電容器最理想的位置是接近各用電設備處，就近供應無效電力，從電源到負載整段線路的電流與損失都能減少。裝在主幹線匯流排、各分路線或受電設備幹線上，下游線路仍流著無效電流，效益較差，所以這三項是本題答案。"},{"c":7,"n":39,"a":[2,4],"q":"功率因數100％時，如再增加電力電容器時，則","o":["功率因數變得更高","功率因數變得更差","變成電感性電路","線路電壓落後電流"],"x":"功因已達100%再加電容器，就變成過度補償，電路轉為電容性，功率因數反而變差（變成超前功因），電流超前電壓，也就是電壓落後電流。功因最高就是1，不可能更高；變成的是電容性而不是電感性。"},{"c":7,"n":40,"a":[1,4],"q":"電容器之容量與下列哪些之關係為正確？","o":["與頻率成正比","與頻率成反比","與電壓成正比","與電壓平方成正比"],"x":"電容器無效功率 Q = 2πfCV²，所以容量與頻率成正比，與電壓平方成正比。與頻率成反比的是容抗Xc；與電壓「成正比」少了平方，所以不對。記法：kVAR跟著f走一次方，跟著V走平方。"},{"c":8,"n":1,"a":[4],"q":"3ψ4W11.4kV 非有效接地系統之避雷器額定電壓宜採用多少kV？","o":["3","4.5","9","12"],"x":"避雷器額定電壓約等於系統最高電壓乘以接地係數。11.4kV系統最高電壓約12kV，非有效接地系統發生接地故障時健全相會升到接近線電壓，接地係數取1.0，所以選12kV。"},{"c":8,"n":2,"a":[2],"q":"下列何者為避雷器之特性？","o":["放電時間長","放電電流大","放電阻抗值高","不放電時阻抗低"],"x":"避雷器遇雷擊或開關突波時要迅速把巨大突波電流導入大地，所以必須能承受很大的放電電流。它放電時間短、放電時阻抗低，不放電時阻抗則很高。"},{"c":8,"n":3,"a":[3],"q":"3ψ4W11.4kV 中性點直接接地系統之避雷器額定電壓應採用多少kV？","o":["3","4.5","9","12"],"x":"中性點直接接地屬有效接地系統，接地故障時健全相電壓上升有限。11.4kV系統最高電壓約12kV，乘接地係數約0.75，得避雷器額定電壓9kV。"},{"c":8,"n":4,"a":[1],"q":"台電公司供應11.4kV 供電之高壓用戶，其裝設之避雷器規格應選用多少kV？","o":["9","12","18","24"],"x":"台電11.4kV配電系統為中性點多重接地的有效接地系統，最高電壓約12kV乘接地係數約0.75，得9kV，所以高壓用戶選用9kV避雷器。"},{"c":8,"n":5,"a":[1],"q":"依用戶用電設備裝置規則規定，避雷器之接地電阻應在多少Ω以下？","o":["10","25","50","100"],"x":"依用戶用電設備裝置規則，避雷器的接地電阻應在10Ω以下，接地電阻越低，突波電流越能順利洩放，殘留電壓也越低。"},{"c":8,"n":6,"a":[2],"q":"避雷器與大地間之引接線應使用銅線或銅電纜線，且應不小於多少平方毫米？","o":["8","14","22","38"],"x":"避雷器與大地間的引接線要能承受突波大電流，應使用14平方毫米以上的銅線或銅電纜線。"},{"c":8,"n":7,"a":[3],"q":"避雷器之瓷管外觀為波浪狀，其主要目的為增加","o":["放電電流","耐熱強度","洩漏距離","耐熱及放電電流"],"x":"瓷管做成波浪狀（裙邊），是為了拉長表面沿面路徑，增加洩漏距離（沿面距離），防止表面受汙染或潮濕時發生閃絡。這與放電電流或耐熱無關。"},{"c":8,"n":8,"a":[2],"q":"避雷器開始放電時之電壓稱為避雷器之臨界崩潰電壓，其值約為正常電壓之多少倍？","o":["1","1.5","2","2.5"],"x":"避雷器開始放電的電壓稱為臨界崩潰電壓，約為正常電壓的1.5倍；它必須高於正常運轉電壓，才不會在平時誤動作。"},{"c":8,"n":9,"a":[4],"q":"避雷器其主要功能作為下列何種事故之保護？","o":["防止接地故障","防止短路","防止過載","抑制線路異常電壓"],"x":"避雷器的主要功能是在雷擊或開關突波等異常電壓侵入時迅速放電，抑制線路異常電壓以保護設備絕緣。接地故障、短路、過載要靠斷路器、熔絲、電驛等保護。"},{"c":8,"n":10,"a":[3],"q":"架空線路防止直接雷擊最有效的辦法是裝置","o":["熔絲鍵開關","電力熔絲","架空地線","空斷開關"],"x":"架空地線架設在導線上方並接地，雷電會先擊中地線而導入大地，形成遮蔽，是防止直接雷擊導線最有效的方法。熔絲鍵開關、電力熔絲、空斷開關都不是防雷設備。"},{"c":8,"n":11,"a":[3],"q":"台電公司22.8kV 之配電系統，所選用之避雷器額定電壓為多少kV？","o":["9","12","18","24"],"x":"台電22.8kV為有效接地系統，最高電壓約24kV乘接地係數約0.75，得18kV。對照記：11.4kV系統用9kV，22.8kV系統用18kV，剛好兩倍。"},{"c":8,"n":12,"a":[4],"q":"責任分界點以下用戶自備線路採地下配線，且受電變壓器裝設於建築物外者，應於何處加裝避雷器？","o":["隔離開關之電源側","隔離開關之負載側","變壓器二次側","變壓器一次側"],"x":"用戶自備線路採地下配線、受電變壓器裝在建築物外時，變壓器直接暴露於雷擊突波威脅，應在變壓器一次側（高壓側）加裝避雷器，就近保護變壓器。"},{"c":8,"n":13,"a":[1],"q":"裝設避雷器時可不考慮","o":["相序","接地電阻","裝設地點","引接線長短"],"x":"避雷器是每相各自對地接一具，與相序無關，所以裝設時可不考慮相序。接地電阻、裝設地點、引接線長短都會影響保護效果，必須考慮。"},{"c":8,"n":14,"a":[2],"q":"避雷器截止放電時之電壓稱為避雷器臨界截止電壓，其值通常為線路正常電壓之多少倍？","o":["1.2","1.4","2","2.5"],"x":"避雷器停止放電時的電壓稱為臨界截止電壓，通常約為線路正常電壓的1.4倍。突波過去後電壓降到此值以下就截止續流，恢復絕緣狀態。"},{"c":8,"n":15,"a":[2,3,4],"q":"下列哪些用戶的變電站應裝置避雷器以保護其設備？","o":["3ψ4W 220/380V 供電","3ψ3W 11kV 供電","3ψ3W 69kV 供電","3ψ3W 161kV 供電"],"x":"高壓及特高壓受電的用戶變電站（如11kV、69kV、161kV）容易受雷擊與開關突波侵入，應裝置避雷器保護設備。3ψ4W 220/380V屬低壓供電，不在此列。"},{"c":8,"n":16,"a":[1,4],"q":"避雷器與電源線間之導線及避雷器與大地間之接地導線，下列哪些正確？","o":["儘量縮短","儘量彎曲","預留伸縮空間","避免彎曲"],"x":"避雷器的引接線與接地線應儘量縮短並避免彎曲，因為導線電感在突波大電流下會產生額外壓降，疊加在被保護設備上降低保護效果。預留伸縮或彎曲都會增加電感。"},{"c":8,"n":17,"a":[2,3],"q":"三相系統之避雷器額定電壓選擇與下列哪些項目有關？","o":["系統短路容量","系統公稱電壓","系統接地方式","系統電壓變動率"],"x":"避雷器額定電壓要依系統公稱電壓決定基準，再依系統接地方式決定接地係數（有效接地約0.75、非有效接地約1.0）。系統短路容量與電壓變動率不是選擇額定電壓的主要依據。"},{"c":8,"n":18,"a":[1,3,4],"q":"下列哪些是引起過電壓的原因？","o":["雷擊","短路故障","電流在其波形未達零點時的強制切斷","接地故障時中性點的移位"],"x":"雷擊會產生雷突波；電流未達零點即被強制切斷（截流）會由電感產生開關突波；接地故障時中性點移位會使健全相電壓上升，這些都會引起過電壓。短路故障本身主要是電流增大、電壓下降。"},{"c":8,"n":19,"a":[1,2,3],"q":"下列哪些設備可使用避雷器防止雷擊造成傷害？","o":["變壓器","交流迴轉機","架空電線","建築物"],"x":"變壓器、交流迴轉機（發電機、電動機）與架空電線都可用避雷器限制侵入的突波電壓。建築物防直擊雷要靠避雷針（避雷設備）及接地系統，不是用避雷器。"},{"c":8,"n":20,"a":[3,4],"q":"避雷器額定電壓為72kV 者，可供下列哪些避雷器型式選用？","o":["低壓級","配電級","中間級（中極）","變電所級（電廠級）"],"x":"72kV額定電壓屬於較高電壓等級，可選用中間級或變電所級（電廠級）避雷器。低壓級與配電級的額定電壓範圍較低，達不到72kV。"},{"c":8,"n":21,"a":[1,2,3,4],"q":"要使系統對雷擊有適當的保護，下列那些基本因素是應加以考慮的？","o":["被保護的配電設備對突波的基本耐壓基準（BIL）","保護突波耐壓基準所要的安全界限","雷擊電流的嚴重程度","雷擊保護與供電連續性間的關係"],"x":"雷擊保護要綜合考慮：被保護設備的基本衝擊絕緣強度BIL、保護所需的安全界限、雷擊電流的嚴重程度，以及保護與供電連續性的關係，四項都要列入考量。"},{"c":8,"n":22,"a":[1,2,3],"q":"下列哪些項目是避雷器應具有之特性？","o":["構造牢固","動作可靠","可多次重複使用","動作後需立刻更換動作元件"],"x":"避雷器應構造牢固、動作可靠，且放電後能自動恢復絕緣，可多次重複使用。若每次動作後都要立刻更換元件，就失去持續保護功能，不符合要求。"},{"c":8,"n":23,"a":[1,2,3,4],"q":"接地故障時中性點電壓的移位與下列哪些項目有關？","o":["中性點接地狀況","電源至故障點的系統阻抗","大地的電阻係數","系統接地方式"],"x":"接地故障時中性點電壓移位的程度，與中性點接地狀況、系統接地方式、電源至故障點的系統阻抗，以及大地電阻係數都有關，四項全都會影響。"},{"c":8,"n":24,"a":[1,3],"q":"避雷器裝於屋內者，其位置應符合下列哪些條件？","o":["遠離通道","靠近通道","遠離建築物之可燃部分","遠離建築物之非可燃部分"],"x":"屋內避雷器動作時可能有放電或故障爆裂的危險，所以應遠離通道以保護人員，並遠離建築物可燃部分以防火災。靠近通道是錯的，遠離非可燃部分也不是重點。"},{"c":9,"n":1,"a":[4],"q":"某11.4kV 供電之用戶，其電度表經由12kV/120V 之PT 及20/5A 之CT配裝後，其電度表讀數為6 度，該用戶實際用電度數應為多少度？","o":["500","1000","1500","2400"],"x":"實際度數 = 電度表讀數 × PT比 × CT比。PT比 = 12000/120 = 100，CT比 = 20/5 = 4，乘率 = 100 × 4 = 400。實際用電 = 6 × 400 = 2400度。記法：經過變比器的電表，讀數一定要乘上「PT比×CT比」。"},{"c":9,"n":2,"a":[4],"q":"配電箱之分路額定值如為30 安培以下者，其主過電流保護裝置應不超過多少安培？","o":["30","60","100","200"],"x":"依「用戶用電設備裝置規則」，照明及電器分路用的配電箱，若分路額定值在30安培以下，其主過電流保護裝置不得超過200安培。目的是避免小分路掛在過大的主保護之下，故障時保護協調不良。記法「30對200」。"},{"c":9,"n":3,"a":[1],"q":"配電箱之分路額定值如為多少安培以下者，其主過電流保護裝置應不超過200 安培？","o":["30","50","75","90"],"x":"與9-2題同一條規定反過來問：配電箱的分路額定值在30安培以下者，主過電流保護裝置不得超過200安培。記住「分路30、主保護200」這組數字即可。"},{"c":9,"n":4,"a":[2],"q":"電度表電源側之導線線徑在多少平方毫米以上者，其電源側非接地導線應加裝斷路器或隔離設備，且須裝於封印之箱體內？","o":["14","22","30","38"],"x":"依台電電度表裝置相關規定，電度表電源側導線線徑在22平方毫米以上者，電源側非接地導線應加裝斷路器或隔離設備，並裝在可封印的箱體內，方便換表時安全停電且防止竊電。"},{"c":9,"n":5,"a":[2],"q":"高壓電力斷路器''VCB''係指","o":["油斷路器","真空斷路器","六氟化硫斷路器","少油量斷路器"],"x":"VCB是Vacuum Circuit Breaker，即真空斷路器，利用真空的高絕緣強度消弧。油斷路器是OCB，六氟化硫斷路器是GCB，少油量斷路器是MOCB。看英文字首最好記：V就是Vacuum真空。"},{"c":9,"n":6,"a":[1],"q":"額定值為220V、50Hz 之電磁開關線圈，若使用於220V、60Hz 之電源時，其線圈激磁電流約較50Hz 時","o":["減少17％","減少31％","增加17％","增加31％"],"x":"電磁開關線圈的阻抗以電感抗為主，XL = 2πfL 與頻率成正比。50Hz改接60Hz，電抗變為1.2倍，電流變為 1/1.2 ≈ 0.833 倍，也就是減少約 (1 − 0.833) ≈ 16.7%，約17%。頻率升高，感抗變大、電流變小。"},{"c":9,"n":7,"a":[3],"q":"如下圖所示之線路，CT 之變流比為200/5，當I\u0003R\u0003、I\u0003S\u0003、I\u0003T\u0003 均為40\u00010\u0001安時，電流表Ａ之讀數為多少安培？ \u00013\u0001","o":["2","\u00011\u0001","3","\u00012\u0001"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADYAAAAvBAMAAABasiS9AAAAGFBMVEX///+Xl5dubm5JSUkkJCQLCwsCAgIAAAByq89FAAABWklEQVR42sVTMUvDQBT+cgkoSmtN0UHFalFBKBhR3Aq12FlFxdkf5uoiin+gNGtBSsY6WG4qAWuSRYi25hxqrrlckqGD3vSO7973vvfde8DfHkW4LZ+F0XeTxl4eCDeSwSliLB1T1qfjJDT94Qym41zLwEoipklEDWN060l5JABIw4B2nKxle/7+ETvjWI3mLdg4vXOdt90PO44tvYL0fMBZzXUTOAMPAPPkenkemRJWDYORl+oZeZdHpxbzKqJTC8ZUaj1vJ3sG/XJxYMXz9D4AYPZrc07qfcUBAPj9z3LOCuuS6xuBtYNiqGmrbhYBoMLNoVxv8DxQDQAbPNHiWM8LaA1QJkNGI32ylgZo5qSiE/HAJQVBjRvBhso5/xkA1aeody0de3zLlJHga+fXA/XkqqBcmILXrFJiFACG+4dHD74wn4waLwDA2m15rpsZ+xB4ZvrSlPHv5wej7loI+MAQVQAAAABJRU5ErkJggg==",24,21],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADkAAABdBAMAAADtU9P6AAAAGFBMVEX///+bm5t3d3dfX19OTk5BQUEmJiYICAjrMsWZAAAB2ElEQVR42u2WvVLbQBCAv5OcpImDImMaGKLYQ8tAeIAwIeEBgFTpmIEqqfMwFFDn5x3oMxmrpMjIKj2MI10DKcASBZLRyactUoQUXKM7fdrd0/7cHtzPULWlV85SgJZJ30/pFz1LF0/KmbbI5qmxdMyVlvb4KJDok9ra1Dwn0lWR8vea1QRgQ9C
