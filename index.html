目問「不得」，答電纜架與架空線路。"},{"c":17,"n":28,"a":[1,2,4],"q":"下列哪些項目應註明於特別低壓設施隔離變壓器之銘牌上？","o":["一次電壓","二次電壓","一次短路電流","二次短路電流"],"x":"特別低壓隔離變壓器的銘牌應註明一次電壓、二次電壓與二次短路電流，讓使用者知道輸入輸出電壓及二次側故障時的最大電流。一次短路電流不是銘牌規定項目。"},{"c":17,"n":29,"a":[1,2,4],"q":"有關電之敘述，下列哪些正確？","o":["使電荷移動而做功之動力稱為電動勢","導體中電子流動的方向就是傳統之電流的反方向","1 度電相當於1 千瓦之電功率","同性電荷相斥、異性電荷相吸"],"x":"電動勢是使電荷移動而做功的動力；電子帶負電，流動方向與傳統電流方向相反；同性電荷相斥、異性相吸，這三項正確。錯的是「1度電相當於1千瓦之電功率」：1度電是1千瓦小時的電能，不是功率。"},{"c":17,"n":30,"a":[2,3],"q":"有關理想狀況下平衡三相電壓，下列哪些正確？","o":["三相電壓的相位角均同相","三相電壓的瞬時值總和為零","三相電壓的大小均相同","三相電壓的波形可以不相同"],"x":"理想平衡三相電壓大小相同、彼此相差120度，任一瞬間三相瞬時值總和為零，所以這兩項正確。三相相位角若均同相就不是三相了；平衡三相波形也必須相同，不可不同。"},{"c":18,"n":1,"a":[4],"q":"桿上作業時，地面工作人員須保持離桿有多少米遠的距離？","o":["1","1.5","2","3"],"x":"桿上作業時工具、材料可能掉落，地面人員應離桿至少3公尺，站在落物可能波及的範圍外。記法：桿上一失手，地面退三步（3公尺）。"},{"c":18,"n":2,"a":[3],"q":"活線作業時常用來掩蔽線路懸垂礙子之工具是","o":["線管","礙子套","橡皮毯","跳線管"],"x":"活線作業要掩蔽懸垂礙子這類形狀不規則的部位，用的是可包覆披掛的橡皮毯。線管、跳線管用來套導線，礙子套則套在礙子上，都不適合包覆懸垂礙子整串。"},{"c":18,"n":3,"a":[3],"q":"下肢受傷流血者急救時，為預防休克須使傷者平躺，並將下列何部位抬高20～30 公分？","o":["頭部","胸部","下肢","手肘"],"x":"下肢受傷流血時，讓傷者平躺並把受傷的下肢抬高20～30公分，可減少出血並幫助血液回流心臟、預防休克。重點：哪裡流血，就把哪裡抬高。"},{"c":18,"n":4,"a":[1],"q":"進入人孔內作業應先通風測氣，其中硫化氫濃度不得超過多少ppm？","o":["10","18","30","35"],"x":"人孔屬侷限空間，進入前必須通風並測定氣體。硫化氫劇毒，作業環境濃度不得超過10ppm，超過就要繼續通風，不可貿然進入。"},{"c":18,"n":5,"a":[1],"q":"燙傷急救五步驟之順序是","o":["沖、脫、泡、蓋、送","脫、沖、泡、蓋、送","沖、泡、脫、蓋、送","脫、泡、沖、蓋、送"],"x":"燙傷急救口訣「沖、脫、泡、蓋、送」：先用冷水沖洗降溫，再於水中小心脫去衣物，接著浸泡冷水，然後用乾淨布巾覆蓋，最後送醫。先沖再脫，避免衣物黏皮造成二次傷害。"},{"c":18,"n":6,"a":[4],"q":"一般的急救原則，對於頭部受傷者，要使其","o":["平躺","側臥","下肢抬高","頭部抬高"],"x":"頭部受傷者應使其頭部稍抬高，可減輕頭部充血、降低顱內壓力。記法：傷在哪裡，就把那裡抬高——頭傷抬頭、腳傷抬腳。"},{"c":18,"n":7,"a":[3],"q":"一般的急救原則，對於下肢受傷者，要使其","o":["平躺","側臥","下肢抬高","頭部抬高"],"x":"下肢受傷者應將下肢抬高，以減少患部出血與腫脹，並幫助血液回流。和頭部受傷抬頭同一個原則：受傷部位要抬高。"},{"c":18,"n":8,"a":[2],"q":"依工業安全衛生標示設置準則，禁止標示之圖形係採用","o":["三角形","圓形","正方形","長方形"],"x":"依工業安全衛生標示設置準則，禁止標示採用圓形（加斜槓）的圖形；警告標示為尖端向上的正三角形；注意與一般說明標示多為方形。記法：圓圈加斜線，一看就是不准。"},{"c":18,"n":9,"a":[3],"q":"依工業安全衛生標示設置準則，尖端向上之正三角形係表示","o":["注意標示","禁止標示","警告標示","一般說明標示"],"x":"依工業安全衛生標示設置準則，尖端向上的正三角形是警告標示，提醒有危險存在；圓形為禁止標示。記法：三角形像警告牌，圓形是禁止。"},{"c":18,"n":10,"a":[1],"q":"利用止血帶止血時，須每隔多少分鐘緩解一次，以便血液循環周流患肢？","o":["15","30","45","60"],"x":"止血帶綁太久會讓肢體缺血壞死，所以每隔約15分鐘要放鬆一次，讓血液流通患肢後再綁緊。口訣：一刻鐘鬆一次。"},{"c":18,"n":11,"a":[4],"q":"工作中接近高壓活線，應保持多少公分之最小接近界限距離，否則應妥加掩蔽？","o":["30","40","50","60"],"x":"接近高壓活線作業時，人體與帶電部分應保持60公分以上的最小接近距離；若無法保持，就必須用絕緣防護具妥加掩蔽。這個60公分在設施規則的高壓防護題中也常出現。"},{"c":18,"n":12,"a":[2],"q":"從事活線作業時，應同時佩戴橡皮手套、棉手套與皮護套，由裡面算起第一層應佩戴","o":["橡皮手套","棉手套","皮護套","任一皆可"],"x":"活線作業手套由內到外依序為棉手套、橡皮手套、皮護套。最內層棉手套吸汗、保護皮膚，中間橡皮手套負責絕緣，最外層皮護套保護橡皮手套不被刮破。"},{"c":18,"n":13,"a":[1],"q":"心肺復甦術（C.P.R.）口訣「叫、叫、C、A、B、D」，其中A 係代表","o":["保持呼吸道通暢","恢復呼吸功能","恢復循環功能","趕緊送醫"],"x":"CPR口訣「叫、叫、C、A、B、D」：叫意識、叫求救，C是胸部按壓恢復循環，A是Airway暢通呼吸道，B是人工呼吸，D是使用AED去顫。A就是保持呼吸道通暢。"},{"c":18,"n":14,"a":[3],"q":"心肺復甦術（C.P.R.）口訣「叫、叫、C、A、B、D」，其中C 係代表","o":["保持呼吸道通暢","恢復呼吸功能","恢復循環功能","使其充分休息"],"x":"C是Compressions胸部按壓，目的在恢復血液循環功能。口訣「叫、叫、C、A、B、D」中，C循環、A呼吸道、B呼吸、D去顫，順序先壓胸再處理呼吸道。"},{"c":18,"n":15,"a":[4],"q":"以心臟按摩法施救感電患者，每分鐘按壓多少次最適宜？","o":["30～50","50～70","70～90","100～120"],"x":"現行CPR準則要求胸部按壓速率每分鐘100～120次，要「用力壓、快快壓、胸回彈、莫中斷」。太慢無法維持足夠血流。"},{"c":18,"n":16,"a":[3],"q":"對成年人患者施作心臟按摩法急救時，應將胸骨向下按壓多少公分最適宜？","o":["3","4","5","7"],"x":"成人胸部按壓深度約5公分（不超過6公分），太淺打不出足夠血流，太深易造成肋骨傷害。記法：成人壓5公分。"},{"c":18,"n":17,"a":[1],"q":"在桿上施行人工呼吸急救，每一分鐘約可進行多少次？","o":["10","20","30","40"],"x":"在桿上無法施行胸部按壓，只能先做人工呼吸，約每5至6秒吹氣一次，即每分鐘約10次，並盡快將傷者移至地面進行完整急救。"},{"c":18,"n":18,"a":[2],"q":"登桿時，腳踏釘每步之距離以多少公分最適宜？","o":["25","45","65","85"],"x":"腳踏釘間距約45公分最適宜，符合一般人登桿的跨步高度：太近浪費力氣，太遠跨不上去容易失足。"},{"c":18,"n":19,"a":[4],"q":"實施11.4kV 高壓線路活線礙子注水清掃時，噴嘴與活線帶電部分之距離須保持多少公分以上？","o":["10","30","50","100"],"x":"11.4kV活線礙子注水清掃時，水柱可能導電，噴嘴與帶電部分要保持100公分以上的距離，以確保作業人員安全。"},{"c":18,"n":20,"a":[4],"q":"高壓桿上停電工作所掛接之接地線線徑應使用多少平方毫米以上的絞線？","o":["5.5","8","14","22"],"x":"高壓停電作業掛接的接地線，必須能承受誤送電或感應電壓時的大電流而不熔斷，因此要使用22平方毫米以上的絞線。線徑太小，故障時會先燒斷而失去保護作用。"},{"c":18,"n":21,"a":[4],"q":"進入地下處所應先測定氧氣濃度在多少％以上方可進入？","o":["10","15","16","18"],"x":"進入地下處所等侷限空間前，要先測定氧氣濃度，必須在18%以上才可進入；未滿18%即屬缺氧，應持續通風。記法：氧氣18，低於就危險。"},{"c":18,"n":22,"a":[3],"q":"依職業安全衛生設施規則規定，雇主對於室內場所，各機械間或其他設備間通道不得小於幾公分？","o":["120","100","80","60"],"x":"依職業安全衛生設施規則，室內各機械間或其他設備間的通道不得小於80公分，讓勞工能安全通行與操作。"},{"c":18,"n":23,"a":[3],"q":"依據職業安全衛生設施規則規定，雇主使勞工於接近高壓電路或高壓電路支援物從事敷設、檢查修理、油漆等作業時，為防止勞工接觸高壓電路引起感電之危險，在距離頭上、身側及腳下多少公分以內之高壓電路者，應在該電路設置絕緣用防護裝備？","o":["三十","五十","六十","一百"],"x":"依職業安全衛生設施規則，接近高壓電路作業時，距離頭上、身側及腳下60公分以內的高壓電路，應設置絕緣用防護裝備，以防勞工接觸感電。"},{"c":18,"n":24,"a":[2],"q":"依據職業安全衛生設施規則規定，雇主對於使用對地電壓在多少伏特以上移動式或攜帶式電動機具，應於各該電動機具之連接電路上設置適合其規格，具有高敏感度、高速型，能確實動作之防止感電用漏電斷路器？","o":["一百一十","一百五十","二百二十","二百五十"],"x":"依職業安全衛生設施規則，使用對地電壓150伏特以上的移動式或攜帶式電動機具，應在其連接電路上裝設高敏感度、高速型的防止感電用漏電斷路器。記法：150伏以上要裝漏電。"},{"c":18,"n":25,"a":[3],"q":"依據職業安全衛生設施規則規定，雇主對於絕緣用防護裝備、防護具、活線作業用工具等，應每多少個月檢驗其性能一次？","o":["一","三","六","十二"],"x":"依職業安全衛生設施規則，絕緣用防護裝備、防護具及活線作業用工具，應每6個月檢驗其性能一次，確保絕緣良好。"},{"c":18,"n":26,"a":[2],"q":"依據職業安全衛生設施規則規定，雇主對於在高度多少米以上之高處作業，勞工有墜落之虞者，應使勞工確實使用安全帶、安全帽及其他必要之防護具？","o":["一","二","三","四"],"x":"依職業安全衛生設施規則，高度2公尺以上的高處作業，勞工有墜落之虞者，應使其確實使用安全帶、安全帽及其他必要防護具。記法：兩米以上就是高處。"},{"c":18,"n":27,"a":[3],"q":"依高架作業勞工保護措施標準規定，高架作業係指雇主使勞工從事作業未設置平台、護欄等設備而採取必要安全措施，其高度在多少米以上者？","o":["四","三","二","一"],"x":"依高架作業勞工保護措施標準，未設置平台、護欄等設備而已採取必要安全措施者，高度在2公尺以上即屬高架作業。"},{"c":18,"n":28,"a":[4],"q":"下列何者不是屬於感電防止對策？","o":["接地方式","安全電壓法","裝設漏電斷路器","增加線路之對地電壓"],"x":"接地、使用安全電壓、裝設漏電斷路器都能降低感電危險；增加線路對地電壓反而讓觸電時通過人體的電流變大，更危險，所以不是防止對策。"},{"c":18,"n":29,"a":[1],"q":"電流通過人體所引起之最嚴重傷害為","o":["呼吸及心臟停止","有感覺刺痛","肌肉無法自由活動","燒傷"],"x":"電流通過人體最嚴重的後果是心室顫動導致心跳停止及呼吸麻痺，可直接致命；刺痛、肌肉痙攣、燒傷雖然也是傷害，但嚴重性較低。"},{"c":18,"n":30,"a":[4],"q":"有關人體皮膚電阻，下列何者正確？","o":["與電壓成正比","與電壓成反比","隨皮膚濕度增加而增加","隨皮膚濕度增加而減少"],"x":"皮膚潮濕時，水分讓導電性變好，皮膚電阻隨濕度增加而降低，同樣電壓下流過人體的電流變大。所以濕手不要碰電器。"},{"c":18,"n":31,"a":[3],"q":"依勞工健康保護規則規定，在職勞工年齡在四十歲以上未滿六十五歲者，其一般健康檢查，應每幾年定期檢查一次？","o":["一","二","三","四"],"x":"依勞工健康保護規則，一般健康檢查：未滿40歲每5年一次，40歲以上未滿65歲每3年一次，65歲以上每年一次。記法：年紀越大檢查越勤，5、3、1。"},{"c":18,"n":32,"a":[2],"q":"依職業安全衛生設施規則規定，雇主對於良導體機器設備內之檢修工作所用之手提式照明燈，其使用電壓不得超過多少伏特？","o":["十二","二十四","三十","五十"],"x":"依職業安全衛生設施規則，在良導體機器設備內檢修所用的手提式照明燈，使用電壓不得超過24伏特，以免漏電時感電。"},{"c":18,"n":33,"a":[4],"q":"依勞工建康保護規則規定，在職勞工年齡在四十歲以下者，其一般健康檢查，應每幾年定期檢查一次？","o":["一","二","三","五"],"x":"依勞工健康保護規則，未滿40歲的在職勞工每5年做一次一般健康檢查；40至未滿65歲每3年，65歲以上每年。口訣：5、3、1。"},{"c":18,"n":34,"a":[2,3],"q":"發現人員感電時，正確的處理方式有哪些？","o":["直接用手拉開感電者","立即切斷電源","低壓電感電者以絕緣物將感電者移開","高壓電感電者以鐵棒將感電者移開"],"x":"發現感電者，第一步是立即切斷電源；低壓感電若無法立即斷電，可用乾燥木棒等絕緣物把人撥開。直接用手拉會連自己一起感電；鐵棒是導體，高壓時更是嚴禁。"},{"c":18,"n":35,"a":[1,2,3,4],"q":"下列哪些是防止感電技術？","o":["加強用電設備之絕緣","電源系統改為非接地之供電系統","改以直流電的方式供電","改以高頻率低電壓交流電的方式供電"],"x":"加強絕緣可隔離帶電體；非接地系統發生單點接觸時不易形成迴路；人體對直流電及高頻電流的感受與危害程度都比商用頻率交流電低，所以四項都是防止感電的技術手段。"},{"c":18,"n":36,"a":[1,2,3],"q":"高度二公尺以上之工作場所，勞工作業有墜落之虞者，應採取下列哪些適當墜落災害防止設施？","o":["限制作業人員進入管制區","張掛安全網","使勞工佩掛安全帶","催促勞工加速作業"],"x":"高度2公尺以上有墜落之虞時，可設管制區限制人員進入、張掛安全網、使勞工佩掛安全帶等。催促勞工加速作業只會讓人更容易出錯墜落，絕非防護措施。"},{"c":18,"n":37,"a":[3,4],"q":"為保障作業人員安全，下列哪些攜帶式電動機具應裝置防止感電用漏電斷路器？","o":["連接於非接地方式電路中使用之電動機具","雙重絕緣構造之電動機具","使用對地電壓在150 伏特以上之電動機具","潮濕場所使用之電動機具"],"x":"使用對地電壓150伏特以上，以及在潮濕場所使用的攜帶式電動機具，感電風險高，應裝漏電斷路器。非接地方式電路中使用者與雙重絕緣構造機具本身已具防護，屬可免裝的情形。"},{"c":18,"n":38,"a":[1,2,3],"q":"為防止電氣災害，應採取下列哪些處理方式？","o":["發電室、變電室或受電室，非工作人員不得任意進入","拔卸電氣插頭時，應確實自插頭處拉出","切斷開關應迅速確實","如遇電氣設備或電路著火，須用導電之滅火設備"],"x":"變電室等場所管制非工作人員進入、拔插頭要握住插頭本體拉出、開關操作要迅速確實，都是防止電氣災害的正確做法。電氣火災必須用不導電的滅火設備，用導電的會使救火者感電。"},{"c":18,"n":39,"a":[1,2,3,4],"q":"衛生福利部於2021 年起更新C.P.R.急救法施救程序「叫、叫、C、A、B、D」，下列哪些正確？","o":["D 為去顫","A 為暢通呼吸道","B 為人工呼吸","C 為胸部按壓"],"x":"「叫、叫、C、A、B、D」：叫意識、叫求救後，C胸部按壓、A暢通呼吸道、B人工呼吸、D使用AED去顫。四項對應全部正確。"},{"c":18,"n":40,"a":[1,2,3],"q":"有關感電急救，下列哪些正確？","o":["停止呼吸心跳施行心肺復甦術","把電源切斷或用絕緣棒、絕緣鉤將附著的電線移開","施以心臟按摩法施救","使用厚重保暖衣物覆蓋患者防止失溫"],"x":"感電急救先切斷電源，或用絕緣棒、絕緣鉤移開電線；患者若無呼吸心跳，應立即施行心肺復甦術與心臟按摩。用厚重衣物覆蓋不是感電急救的重點做法，故不選。"},{"c":18,"n":41,"a":[2,4],"q":"有關電弧灼傷急救，下列哪些正確？","o":["傷者仍有生命跡象應即施行心肺復甦術","沖水冷卻降溫後立即送醫","灼傷處塗醬油、牙膏防止發炎","切斷電源並以絕緣物移除引起觸電物體"],"x":"電弧灼傷先切斷電源、以絕緣物移開觸電物體，再沖水冷卻降溫後立即送醫。心肺復甦術是在沒有呼吸心跳時才做，傷者仍有生命跡象不需施行；塗醬油、牙膏會造成感染，是錯誤偏方。"},{"c":18,"n":42,"a":[1,4],"q":"有關急救ABC，下列哪些正確？","o":["A 為判斷傷者的氣道是否暢通","B為判斷傷者是否有脈搏","C 為判斷傷者是否有呼吸","C 為判斷傷者是否有脈搏"],"x":"急救ABC：A（Airway）判斷呼吸道是否暢通，B（Breathing）判斷是否有呼吸，C（Circulation）判斷是否有脈搏、循環。B對呼吸、C對脈搏，把兩者對調的選項就錯了。"},{"c":18,"n":43,"a":[1,2,3],"q":"事業單位勞動場所發生下列哪些類型之職業災害，雇主應於八小時內通報勞動檢查機構？","o":["死亡災害","罹災人數在三人以上","罹災人數在一人以上，且需住院治療","罹災人數在二人以下"],"x":"依職業安全衛生法，發生死亡災害、罹災人數3人以上、或罹災1人以上且需住院治療的職業災害，雇主應於8小時內通報勞動檢查機構。單純罹災2人以下不在法定通報條件內。"},{"c":18,"n":44,"a":[1,2,3],"q":"依職業安全衛生法，勞工有下列哪些義務？","o":["接受體格檢查或健康檢查","接受安全衛生教育及訓練","遵行安全衛生工作守則","訂定職業安全衛生管理計畫"],"x":"依職業安全衛生法，勞工應接受體格及健康檢查、接受安全衛生教育訓練、遵行安全衛生工作守則。訂定職業安全衛生管理計畫是雇主的責任，不是勞工義務。"},{"c":18,"n":45,"a":[1,2,3],"q":"雇主不得使妊娠中之女性勞工從事下列哪些危險性或有害性工作？","o":["異常氣壓之工作","礦坑工作","鉛及其化合物散布場所之工作","超過220伏特電力線之銜接"],"x":"依職業安全衛生法，雇主不得使妊娠中女性勞工從事異常氣壓、礦坑、鉛及其化合物散布場所等危險有害工作。超過220伏特電力線之銜接是未滿18歲勞工不得從事的工作，對象不同。"},{"c":18,"n":46,"a":[1,2,3],"q":"勞工發現下列哪些情形，得向主管機關或勞動檢查機構申訴？","o":["事業單位違反職業安全衛生法","疑似罹患職業病","身體或精神遭受侵害","被減薪資"],"x":"依職業安全衛生法，勞工發現事業單位違反本法、疑似罹患職業病、身體或精神遭受侵害時，得向主管機關或勞動檢查機構申訴。被減薪屬勞資爭議，應循勞動基準法等途徑處理。"},{"c":18,"n":47,"a":[1,2,3,4],"q":"使用之合梯，應符合下列哪些規定？","o":["具有堅固之構造","其材質不得有顯著之損傷、腐蝕等","梯腳與地面之角度應在75 度以內，且兩梯腳間有繫材扣牢","有安全之梯面"],"x":"依職業安全衛生設施規則，合梯應具堅固構造、材質無顯著損傷腐蝕、梯腳與地面角度在75度以內且兩梯腳間有繫材扣牢、並有安全之梯面。四項都是法定要求。"},{"c":19,"n":1,"a":[3],"q":"台灣電力公司與用戶所訂之需量契約容量，其需量時段為多少分鐘？","o":["5","10","15","30"],"x":"台電需量契約的最高需量，是以連續15分鐘內的平均用電量來計算，避免瞬間啟動電流被誤判為需量。記法：需量看15分鐘平均。"},{"c":19,"n":2,"a":[2],"q":"依據用電場所及專任電氣技術人員管理規則之規定，22.8kV 之高壓用戶須設置何級電氣技術人員？","o":["初級","中級","高級","不必設置"],"x":"依用電場所及專任電氣技術人員管理規則，22.8kV屬高壓受電，應設置中級電氣技術人員；特高壓才需要高級。記法：低壓初級、高壓中級、特高壓高級。"},{"c":19,"n":3,"a":[3],"q":"依據用電場所及專任電氣技術人員管理規則之規定，69kV 之特高壓用戶須設置何級電氣技術人員？","o":["初級","中級","高級","不必設置"],"x":"依用電場所及專任電氣技術人員管理規則，69kV屬特高壓受電，必須設置高級電氣技術人員。記法：電壓越高，等級越高。"},{"c":19,"n":4,"a":[4],"q":"依據用電場所及專任電氣技術人員管理規則之規定，用電場所負責人應督同專任電氣技術人員對所經管之電力設備，每幾個月至少應檢驗一次？","o":["1","2","3","6"],"x":"依用電場所及專任電氣技術人員管理規則，負責人應督同專任電氣技術人員對所經管的電力設備每6個月至少檢驗一次，另每年至少停電檢驗一次。記法：半年一般檢、一年停電檢。"},{"c":19,"n":5,"a":[1],"q":"依據用電場所及專任電氣技術人員管理規則之規定，用電場所負責人應督同專任電氣技術人員對所經管之電力設備，每幾年應至少停電檢驗一次？","o":["1","2","3","6"],"x":"依用電場所及專任電氣技術人員管理規則，電力設備除每6個月至少檢驗一次外，每年至少要停電檢驗一次，停電才能做完整的絕緣與接點檢查。"},{"c":19,"n":6,"a":[2],"q":"依據用電場所及專任電氣技術人員管理規則之規定，用電場所發生事故，致影響供電系統者，其專任電氣技術人員應於事故發生後多少日內填報電氣事故報告表送指定之機關？","o":["3","5","7","10"],"x":"依用電場所及專任電氣技術人員管理規則，用電場所事故影響供電系統時，專任電氣技術人員應於事故發生後5日內填報電氣事故報告表，送指定機關。"},{"c":19,"n":7,"a":[4],"q":"依據用電設備檢驗維護業管理規則之規定，檢驗維護業之登記維護範圍，以其所在地相連多少行政區域為限？","o":["1","2","3","4"],"x":"依用電設備檢驗維護業管理規則，檢驗維護業的登記維護範圍以其所在地相連4個行政區域為限，確保維護人員能及時到場處理。"},{"c":19,"n":8,"a":[1],"q":"依台灣電力公司營業規章，廢止用電之用電場所申請重新用電，應辦理","o":["新設","增設","併戶","復電"],"x":"依台電營業規章，已廢止用電的場所等於沒有既設用電，要重新用電就必須依新設辦理。復電是指停電後恢復供電，與已廢止的情況不同。"},{"c":19,"n":9,"a":[2],"q":"依台灣電力公司營業規章之規定，既設用戶申請增加用電設備或契約容量，應辦理","o":["新設","增設","併戶","分戶"],"x":"依台電營業規章，既設用戶要增加用電設備或契約容量，應辦理增設。新設是原本沒有用電，併戶、分戶則是戶數合併或分開。"},{"c":19,"n":10,"a":[2],"q":"依台灣電力公司營業規章之規定，既設用戶申請將原有用電設備拆裝或移裝，應辦理","o":["器具變更","裝置變更","種別變更","用途變更"],"x":"依台電營業規章，既設用戶將原有用電設備拆裝或移裝，屬裝置變更。器具變更是換器具，種別變更是換電價種類，用途變更是改行業分類。"},{"c":19,"n":11,"a":[4],"q":"依台灣電力公司營業規章之規定，既設用戶申請變更「行業分類」，應辦理","o":["器具變更","裝置變更","種別變更","用途變更"],"x":"依台電營業規章，變更「行業分類」屬用途變更。記法：用途就是拿電來做什麼行業，行業一改就是用途變更。"},{"c":19,"n":12,"a":[1],"q":"依台灣電力公司營業規章之規定，申請新增設用電合計契約容量達多少kW 以上者，須事先提出新增設用電計劃書？","o":["1000","2000","3000","4000"],"x":"依台電營業規章，新增設用電合計契約容量達1000kW以上者，須事先提出新增設用電計劃書，讓台電預先規劃供電設施。"},{"c":19,"n":13,"a":[4],"q":"依台灣電力公司營業規章之規定，申請新增設用電，建築總面積達多少平方公尺以上者，須事先提出新增設用電計劃書？","o":["1000","2000","5000","10000"],"x":"依台電營業規章，新增設用電的建築總面積達10000平方公尺以上者，也須事先提出新增設用電計劃書。可和契約容量1000kW一起記：千瓩、萬平方米。"},{"c":19,"n":14,"a":[1],"q":"依台灣電力公司營業規章之規定，在11.4kV 或22.8kV 供電地區，契約容量未滿多少kW 者，得以220/380V 供電？","o":["500","1000","1500","2000"],"x":"依台電營業規章，在11.4kV或22.8kV供電地區，契約容量未滿500kW者，得以220/380V低壓供電；達500kW以上原則上就要高壓供電。"},{"c":19,"n":15,"a":[2],"q":"依台灣電力公司營業規章之規定，三相低壓供電之用戶，如無特殊原因，其單相220 伏電動機，每具最大容量不得超過多少馬力？","o":["1","3","5","10"],"x":"依台電營業規章，三相低壓供電用戶的單相220伏電動機，每具最大以3馬力為限，避免單相大負載造成三相不平衡。記法：110伏1馬力，220伏3馬力。"},{"c":19,"n":16,"a":[1],"q":"依台灣電力公司營業規章之規定，三相低壓供電之用戶，如無特殊原因，其單相110 伏電動機，每具最大容量不得超過多少馬力？","o":["1","2","3","5"],"x":"依台電營業規章，三相低壓供電用戶的單相110伏電動機，每具最大以1馬力為限。口訣：110配1，220配3。"},{"c":19,"n":17,"a":[1],"q":"台灣電力公司公告實施地下配電系統之地區，新設建築物達六樓以上且其總樓地板面積在多少平方米以上者須設置適當之配電場所及通道？","o":["1000","1500","2000","2500"],"x":"依台電規定，公告實施地下配電系統的地區，新設建築物達六樓以上且總樓地板面積1000平方米以上者，須設置適當的配電場所及通道，供台電裝設配電設備。"},{"c":19,"n":18,"a":[3],"q":"依電器承裝業管理規則規定，甲級電器承裝業之資本額應在多少萬元以上？","o":["一千","五百","二百","一百"],"x":"依電器承裝業管理規則，甲級電器承裝業資本額應在新台幣二百萬元以上；等級越高，資本額門檻越高。"},{"c":19,"n":19,"a":[3],"q":"依台灣電力公司電價表之規定，採用需量契約容量計費之用戶，當月用電最高需量超出其契約容量者，其超出契約容量10％以上部分，按其適用電價多少倍計收基本電費？","o":["1","2","3","4"],"x":"依台電電價表，超約用電時，超出契約容量10%以下部分按2倍計收基本電費，超出10%以上部分按3倍計收。記法：小超2倍、大超3倍。"},{"c":19,"n":20,"a":[1],"q":"下列哪一等級之電器承裝業得承裝電壓二萬五千伏特以下之配電外線工程，且其工程金額在新台幣一億元以上？","o":["甲專","甲","乙","丙"],"x":"依電器承裝業管理規則，甲專承裝業專門承裝電壓25000伏特以下、工程金額在新台幣一億元以上的電業配電外線工程。看到「配電外線、一億元」就想到甲專。"},{"c":19,"n":21,"a":[2],"q":"依台電公司現行電價，高壓用戶其夏月電價係指每年","o":["5 月1 日至9 月30 日","5 月16 日至10 月15 日","6 月1 日至9 月30 日","5 月1 日至10 月31 日"],"x":"依台電現行電價，高壓用戶的夏月期間為每年5月16日至10月15日，其餘為非夏月。注意與表燈用戶的夏月期間不同，別混淆。"},{"c":19,"n":22,"a":[2],"q":"依據電器承裝業管理規則規定，承裝業僱用之人員解僱或離職時，應於幾個月內補足人數，並申請變更登記？","o":["一","三","五","六"],"x":"依電器承裝業管理規則，承裝業僱用的人員解僱或離職時，應於3個月內補足人數，並申請變更登記。"},{"c":19,"n":23,"a":[3],"q":"依據電器承裝業管理規則規定，承裝業得分包經辦工程予其他承裝業者，但其分包部分之金額，不得超過經辦工程總價百分之多少？","o":["二十","三十","四十","五十"],"x":"依電器承裝業管理規則，承裝業可分包工程給其他承裝業，但分包金額不得超過經辦工程總價的40%，避免轉包了事。"},{"c":19,"n":24,"a":[2],"q":"依台灣電力公司營業規章之規定，暫停用電期限最長以多少年為限？","o":["一","二","三","四"],"x":"依台電營業規章，用戶申請暫停用電，期限最長以2年為限，逾期未恢復用電則依規定處理。"},{"c":19,"n":25,"a":[1,2],"q":"依據電業供電電壓及頻率標準規定，下列哪些是台灣供電電壓之變動率？","o":["電燈電壓，高低各5％","電力及電熱之電壓，高低各10％","電燈電壓，高低各10％","電力及電熱之電壓，高低各5％"],"x":"依電業供電電壓及頻率標準，電燈電壓變動率為高低各5%，電力及電熱電壓為高低各10%。照明對電壓較敏感，所以範圍較嚴。記法：燈5、力10。"},{"c":19,"n":26,"a":[1,3,4],"q":"下列哪些情形電業得對用戶停止供電？","o":["有竊電行為者","用電裝置及設備未自行檢查","欠繳電費，經限期催繳仍不交付者","用電裝置，經電業檢驗不合規定，在指定期間未改善者"],"x":"依電業法，用戶竊電、欠繳電費經限期催繳仍不繳、用電裝置經電業檢驗不合規定且在指定期間未改善者，電業得停止供電。用戶未自行檢查並非電業可停電的事由。"},{"c":19,"n":27,"a":[1,2,3,4],"q":"下列哪些為台灣電業供電電壓？","o":["單相三線110 及220 伏","單相二線220 伏","三相四線220 及380 伏","三相三線380 伏"],"x":"台灣低壓供電型式有單相三線110/220伏、單相二線220伏、三相四線220/380伏及三相三線380伏，四項都是電業供電電壓。"},{"c":19,"n":28,"a":[1,2],"q":"下列哪些用電場所應依規定置專任電氣技術人員？","o":["低壓受電且契約容量達50 瓩以上之工廠","高壓 function fresh(){ return {v:1,t:0,xp:0,hist:[],dx:{},q:{},boss:{},ach:{},day:{d:'',streak:0,n:0,goal:''},best:{blitz:0,exam:0,sweep:0},tot:{a:0,c:0},opt:{shuffle:true,boost:1,examBoost:false}}; }
function adopt(d){ const f = fresh(); const s = Object.assign(f, JSON.parse(JSON.stringify(d||{})));
  ['day','best','tot','opt'].forEach(k => s[k] = Object.assign(fresh()[k], s[k]||{}));
  if (!d || !d.dx) s.dx = dxFromHist(s.hist); return s; }
// 每日積分（風雲榜 7 天累計用）；舊資料沒有這欄時，從回合紀錄推算最近 7 天
function dxFromHist(h){ const dx = {}, from = Date.now() - 7*864e5; (h||[]).forEach(r => { if (r.t >= from && r.xp > 0) { const k = dstr(new Date(r.t)); dx[k] = (dx[k]||0) + r.xp; } }); return dx; }
function addXP(n){ S.xp += n; const k = dstr(new Date()), dx = S.dx = S.dx || {}; dx[k] = (dx[k]||0) + n;
  const keep = new Set(Array.from({length:8}, (_, i) => dstr(new Date(Date.now() - i*864e5)))); Object.keys(dx).forEach(d => { if (!keep.has(d)) delete dx[d]; }); }
let S = fresh();
try { const r = localStorage.getItem(LS); if (r) S = adopt(JSON.parse(r)); } catch(e) {}
let dbRef = null, saving = false, again = false, saveT = null;
function save(){ S.t = Date.now(); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
async function flush(){
  saveT = null; if (!dbRef && !ACCT) return; if (saving) { again = true; return; }
  saving = true;
  if (dbRef) {
    try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('雲端同步'); }
    catch(e){ if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { dbRef = null; setSync('本機儲存'); } }
  } else await acctPush(!!R);
  saving = false; if (again) { again = false; flush(); }
}
function setSync(t){ const el = document.getElementById('sync'); if (el) { el.textContent = t; el.classList.toggle('on', !!(dbRef || ACCT)); } }

/* ---- 帳號同步：只用帳號名稱，不用密碼；30 天沒使用由伺服器自動刪除 ---- */
const LSA = 'yiji-acct', ACCT_DAYS = 30;
let ACCT = null, acctAt = 0;
try { ACCT = localStorage.getItem(LSA) || null; } catch(e) {}
async function api(op, body, keepalive){
  const payload = JSON.stringify(Object.assign({op}, body));
  try {
    const r = await fetch('/api/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body:payload, keepalive: !!keepalive && payload.length < 60000});
    let j = {}; try { j = await r.json(); } catch(e) {}
    return Object.assign({}, j, {status:r.status});
  } catch(e) { return {status:0, error:'連不上網路'}; }
}
function setAcct(n){ ACCT = n; LBV.at = 0; try { n ? localStorage.setItem(LSA, n) : localStorage.removeItem(LSA); } catch(e) {} }
function acctLabel(){ if (dbRef) return; setSync(ACCT ? '☁ ' + ACCT : '本機儲存'); }
function useRemote(d){
  S = adopt(d); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {}
  if (S.opt.skin) applySkin(S.opt.skin, false);
  if (!R) render(); header();
}
function lost(){ const n = ACCT; setAcct(null); acctLabel(); toast('帳號「' + n + '」已不存在（可能超過 ' + ACCT_DAYS + ' 天沒使用被刪除），進度改存在這個瀏覽器'); }
// force：雲端比較新也照樣覆蓋（作答中以這個瀏覽器為準）
async function acctPush(force, keepalive){
  if (!ACCT) return;
  const r = await api('push', {name:ACCT, data:S, force}, keepalive);
  if (r.status === 200) { acctAt = Date.now(); acctLabel(); }
  else if (r.status === 409 && r.data) { acctAt = Date.now(); useRemote(r.data); acctLabel(); toast('已載入其他瀏覽器較新的進度'); }
  else if (r.status === 404) lost();
  else setSync('☁ ' + ACCT + '（離線）');
}
async function acctPull(){
  if (!ACCT || dbRef) return;
  const r = await api('pull', {name:ACCT});
  if (r.status === 404) return lost();
  if (r.status !== 200) return setSync('☁ ' + ACCT + '（離線）');
  acctAt = Date.now();
  if (r.data && (r.t||0) > (S.t||0)) { if (!R) useRemote(r.data); }
  else if ((S.t||0) > (r.t||0)) await acctPush(false);
  acctLabel();
}
const seenN = d => d && d.q ? Object.keys(d.q).length : 0;
const whenTxt = t => t ? new Date(t).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
function acctSheet(msg, bad, cmp){
  let body;
  if (dbRef) body = '<p>進度已經同步在你的 Claude 帳號，換裝置會自動接續，不需要另外登入。</p><div class="actions"><button class="btn" data-close-sheet="1">完成</button></div>';
  else if (cmp) body = '<p>帳號「' + esc(cmp.name) + '」在雲端已經有進度，這個瀏覽器也有進度。要用哪一份？另一份會被取代。</p>' +
    '<div class="acct-cmp"><div><b>雲端</b><span>見過 ' + seenN(cmp.data) + ' 題・作答 ' + ((cmp.data && cmp.data.tot && cmp.data.tot.a) || 0) + ' 次</span><span class="muted">更新於 ' + whenTxt(cmp.t) + '</span></div>' +
    '<div><b>這個瀏覽器</b><span>見過 ' + seenN(S) + ' 題・作答 ' + S.tot.a + ' 次</span><span class="muted">更新於 ' + whenTxt(S.t) + '</span></div></div>' +
    '<div class="actions"><button class="btn primary" data-acct-use="cloud">使用雲端進度</button><button class="btn" data-acct-use="local">用這個瀏覽器的進度</button><button class="btn ghost" data-close-sheet="1">取消</button></div>';
  else if (ACCT) body = '<p>已登入帳號「<b>' + esc(ACCT) + '</b>」。在其他瀏覽器或手機輸入同一個帳號名稱就能接續進度。</p>' +
    '<p class="muted" style="font-size:14px">上次同步：' + whenTxt(acctAt) + '。超過 ' + ACCT_DAYS + ' 天沒有開啟練習，帳號和雲端進度會自動刪除。</p>' +
    '<div class="actions"><button class="btn primary" data-acct-sync="1">立即同步</button><button class="btn" data-acct-out="1">登出</button><button class="btn ghost" data-acct-del="1">刪除帳號</button></div>';
  else body = '<p>不用密碼：建立帳號後，在其他瀏覽器或手機輸入同一個帳號名稱，就能接續同一份進度。</p>' +
    '<p class="muted" style="font-size:14px">知道名稱的人也能讀寫這份進度，請取一個別人不容易想到的名稱（2–20 字）。超過 ' + ACCT_DAYS + ' 天沒有開啟練習，帳號會自動刪除。</p>' +
    '<input class="acct-in" id="acctName" maxlength="20" autocomplete="username" placeholder="帳號名稱" aria-label="帳號名稱">' +
    '<div class="actions"><button class="btn primary" data-acct-reg="1">建立新帳號</button><button class="btn" data-acct-in="1">登入</button><button class="btn ghost" data-close-sheet="1">取消</button></div>';
  $('#layer').innerHTML = '<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="帳號與同步"><h3>帳號與同步</h3>' + body +
    '<p class="acct-msg' + (bad ? ' bad' : '') + '" role="status">' + (msg ? esc(msg) : '') + '</p></div></div>';
  const f = $('#acctName'); if (f) f.focus();
}
let acctPending = null, acctBusy = false;
async function acctAction(d){
  if (acctBusy) return; acctBusy = true;
  try {
    if (d.acctReg || d.acctIn) {
      const el = $('#acctName'), name = el ? el.value.normalize('NFKC').trim().replace(/\s+/g, ' ') : '';
      if ([...name].length < 2) return acctSheet('帳號名稱需為 2–20 個字', true);
      if (d.acctReg) {
        const r = await api('register', {name, data:S});
        if (r.status === 409) return acctSheet('「' + name + '」已經有人使用。如果是你自己的帳號，請按「登入」。', true), $('#acctName').value = name;
        if (r.status !== 200) return acctSheet(r.error || '建立失敗，請稍後再試', true), $('#acctName').value = name;
        setAcct(r.name); acctAt = Date.now(); acctLabel(); acctSheet('帳號已建立，這個瀏覽器的進度已上傳。');
      } else {
        const r = await api('pull', {name});
        if (r.status === 404) return acctSheet('找不到「' + name + '」。可能打錯字，或超過 ' + ACCT_DAYS + ' 天沒使用已被刪除。', true), $('#acctName').value = name;
        if (r.status !== 200) return acctSheet(r.error || '登入失敗，請稍後再試', true), $('#acctName').value = name;
        const remote = seenN(r.data) || (r.data && r.data.tot && r.data.tot.a), local = seenN(S) || S.tot.a;
        if (remote && local && r.t !== S.t) { acctPending = r; return acctSheet('', false, r); }
        setAcct(r.name); acctAt = Date.now();
        if (remote) useRemote(r.data); else await acctPush(true);
        acctLabel(); acctSheet('已登入，進度已同步。');
      }
    } else if (d.acctUse && acctPending) {
      const r = acctPending; acctPending = null;
      setAcct(r.name); acctAt = Date.now();
      if (d.acctUse === 'cloud') useRemote(r.data); else { S.t = Date.now(); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} await acctPush(true); }
      acctLabel(); acctSheet('已登入，進度已同步。');
    } else if (d.acctSync) { await acctPull(); if (ACCT) acctSheet('已同步。'); else closeLayer(); }
    else if (d.acctOut) { setAcct(null); acctLabel(); acctSheet('已登出。這個瀏覽器的進度仍保留在本機。'); }
    else if (d.acctDel) {
      const b = $('[data-acct-del]');
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '再按一次確認刪除雲端帳號'; b.classList.add('warn'); return; }
      const r = await api('delete', {name:ACCT});
      if (r.status !== 200) return acctSheet(r.error || '刪除失敗，請稍後再試', true);
      setAcct(null); acctLabel(); acctSheet('雲端帳號已刪除。這個瀏覽器的進度仍保留在本機。');
    }
  } finally { acctBusy = false; }
}
document.addEventListener('visibilitychange', () => {
  if (!ACCT || dbRef) return;
  if (document.visibilityState === 'visible') { if (!R) acctPull(); }
  else if (saveT) { clearTimeout(saveT); saveT = null; acctPush(true, true); }
});
async function cloud(tries){
  const c = window.claude;
  if (!c || !c.use) { if (tries < 3) setTimeout(() => cloud(tries+1), 800); return; }
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    dbRef = ref; setSync('雲端同步');
    if (snap.exists) {
      const d = snap.data();
      if ((d.t||0) > (S.t||0)) { S = adopt(d); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} if (S.opt.skin) applySkin(S.opt.skin, false); if (!R) render(); header(); }
      else if ((S.t||0) > (d.t||0)) flush();
    } else if (S.t) flush();
  } catch(e) { dbRef = null; setSync('本機儲存'); }
}

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fig(m){ return '<img class="fig' + (m[1] > 110 || m[2] > 60 ? ' big' : '') + '" src="' + m[0] + '" width="' + m[1] + '" height="' + m[2] + '" alt="附圖">'; }
/* 題庫文字：\x01n\x01 附圖、\x02…\x02 上標（mm²）、\x03…\x03 下標（R₁） */
function supsub(s){ return s.replace(/\u0002([^\u0002]*)\u0002/g, '<sup>$1</sup>').replace(/\u0003([^\u0003]*)\u0003/g, '<sub>$1</sub>'); }
function rich(s, q){ return s.split('\u0001').map((p,i) => i % 2 ? fig(q.im[+p]) : supsub(esc(p))).join(''); }
function plain(s){ return s.replace(/\u0001\d+\u0001/g, '').replace(/[\u0002\u0003]/g, ''); }
const FLAGTXT = {'誤植':['題目疑似誤植','題目文字或數值疑似誤植'], '爭議':['答案有爭議','官方答案與教材或實務說法有出入'], '法規修正':['法規已修正','現行用戶用電設備裝置規則（114.05.09）的寫法與題庫不同，詳見數字速查']};
function flagChip(q){ const t = q.f && FLAGTXT[q.f]; return t ? '<span class="chip flag" title="已查證：' + t[1] + '，考試仍依官方答案作答">' + t[0] + '</span>' : ''; }

在對角，平衡時 R4 是多少？", "s": ["平衡條件：對角電阻乘積相等", "R1 × R4＝R2 × R3", "10 × R4＝20 × 30，R4＝600 ÷ 10"], "a": "60 Ω"}}, "ct-pt": {"easy": "高壓、大電流不能直接接到電表上。CT 把大電流縮成 5 A，PT 把高電壓降成 110 V，電表才量得到，人也比較安全。", "like": "CT／PT 像翻譯員，把工廠的「大聲量」翻成電表聽得懂的小聲量；讀數再乘回倍率，就是現場的真實數字。", "gl": [["CT（比流器）", "把大電流按比例縮小，二次側通常 5 A"], ["PT（比壓器）", "把高電壓按比例降低，二次側通常 110 V"], ["倍率", "一次值 ÷ 二次值；電度表讀數要乘倍率"], ["負擔（VA）", "CT／PT 二次側所接電表、電驛消耗的伏安"]], "ex": {"q": "PT 3300／110 V、CT 100／5 A，電度表走了 2 度，實際用電多少度？", "s": ["PT 比＝3300 ÷ 110＝30", "CT 比＝100 ÷ 5＝20", "倍率＝30 × 20＝600，實際用電＝2 × 600"], "a": "1200 度"}}, "voltage-drop": {"easy": "電流走在電線上會「掉電壓」：線越長、電流越大，送到用電器時電壓越低，所以規定不能掉太多。", "like": "像水管越長水壓越小，水龍頭離水塔很遠，水就變小。規定幹線、分路各自最多掉 3%，加起來最多 5%。", "gl": [["幹線", "從總開關到分電盤的主要線路"], ["分路", "從分電盤到插座、燈具的最後一段線路"], ["電壓降率", "掉的電壓 ÷ 標稱電壓 × 100%"]], "ex": {"q": "單相二線 110 V，電流 10 A、單程 50 m，導線每公尺 0.002 Ω，功因 1，電壓降多少？", "s": ["功因 1：cosθ＝1、sinθ＝0，只要算電阻", "e＝2 × I × L × R＝2 × 10 × 50 × 0.002＝2 V", "壓降率＝2 ÷ 110 ≈ 1.8%，在 3% 以內"], "a": "2 V（約 1.8%）"}}, "motor-conductor": {"easy": "電動機的導線要比它的滿載電流再大一點（乘 1.25），因為電動機長時間運轉，線會發熱。", "like": "像買褲子要留一點空間：剛剛好的尺寸穿久了會勒，多留 25% 才舒服。", "gl": [["滿載電流", "電動機在額定負載下的電流，查表二五八～三"], ["安培容量", "導線能長期安全通過的電流"], ["幹線", "同時供電給好幾台電動機的那條主線"]], "ex": {"q": "一條幹線供電給滿載 40 A、20 A、10 A 三台電動機，幹線安培容量至少多少？", "s": ["找出最大的一台：40 A，只有它乘 1.25", "40 × 1.25＝50 A", "其他兩台照加：50 ＋ 20 ＋ 10"], "a": "80 A 以上"}}, "conduit": {"easy": "導線管是保護電線的「外衣」：不同材質用在不同場所，還規定多遠要固定、能彎多少、可以穿幾條線。", "like": "像吸管：金屬吸管堅固但怕酸，塑膠吸管不怕酸；吸管彎太多次，東西就卡住穿不過去。", "gl": [["厚金屬管／薄金屬管／EMT", "金屬導線管的三種，EMT 是無螺紋的薄管"], ["可撓導線管", "可以彎曲的軟管"], ["電磁平衡", "同一回路的去線與回線穿同一根金屬管，磁場互相抵銷，管子才不會發熱"], ["佔積率", "管內電線截面積佔管截面積的比例"]], "ex": {"q": "金屬管明管配線，距線盒多遠內要固定？之後每隔多遠支撐一次？", "s": ["先分清管子種類：金屬導線管", "口訣「金屬九百兩米」", "終端 900 mm 內固定，之後每 2 m 支撐"], "a": "900 mm 內、每 2 m"}}, "raceway-busway": {"easy": "導線槽是放很多電線的長方形槽；匯流排槽是裡面裝銅排、專門送大電流的槽。兩者都規定支撐距離和能裝多滿。", "like": "導線槽像收電線的線槽盒；匯流排槽像大樓裡的「電力高速公路」，再從上面開匝道（分歧）出去。", "gl": [["導線槽", "可放多條導線的金屬或非金屬槽"], ["匯流排槽（busway）", "內裝銅或鋁匯流排的封閉槽，適合大電流"], ["分歧", "從主幹分出去的支線"], ["止水墩", "樓板開孔周圍墊高的水泥邊，防止水往下流"]], "ex": {"q": "一般敷設的導線槽，導線截面積最多可佔槽內多少？", "s": ["一般敷設：有載導線 30 條以內", "截面積合計不超過 20%", "只有接線或分歧處可放寬到 75%"], "a": "20%"}}, "cable-install": {"easy": "電纜不能彎得太急，否則裡面的絕緣會裂開；也要照規定距離固定，必要時穿管保護。", "like": "像手機充電線：硬折容易斷，彎的時候要留夠大的弧度，越粗越硬的線，弧度要留越大。", "gl": [["MI 電纜", "礦物絕緣電纜，用氧化鎂粉絕緣、外包銅管，耐高溫"], ["裝甲電纜", "外面有金屬鎧裝保護的電纜"], ["彎曲半徑", "彎曲處內側圓弧的半徑，常用電纜外徑的幾倍表示"], ["交連 PE（XLPE）", "常見的電纜絕緣材料"]], "ex": {"q": "外徑 20 mm 的單芯裝甲電纜，彎曲處內側半徑至少多少？", "s": ["單芯裝甲電纜：外徑的 12 倍以上", "20 × 12＝240", "內側半徑至少 240 mm"], "a": "240 mm"}}, "three-phase": {"easy": "三相電有兩種接法：Y 接是三個繞組接在同一個中心點，△ 接是三個繞組首尾相連成三角形。兩者的差別在電壓或電流差 √3 倍。", "like": "Y 接像三個人背靠背站在中心各自往外拉，兩人之間的距離（線電壓）比各自的手臂（相電壓）長 √3 倍；△ 接像三個人手牽手圍成三角形，每個路口匯集兩股人流，線電流大 √3 倍。", "gl": [["線值", "兩條火線之間（線電壓）或一條火線上（線電流）量到的值"], ["相值", "每一相繞組本身的電壓或電流"], ["√3", "約 1.732，三相計算最常出現的數字"]], "ex": {"q": "Y 接、相電壓 220 V，線電壓是多少？", "s": ["Y 接：線電壓＝√3 × 相電壓", "220 × 1.732 ≈ 381", "這就是台灣常見 220／380 V 的由來"], "a": "約 380 V"}}, "transformer-loss": {"easy": "變壓器會浪費兩種電：鐵心的「鐵損」只要通電就在耗，跟負載無關；線圈的「銅損」負載越大越多，而且跟電流平方成正比。", "like": "鐵損像冷氣待機的基本耗電，插著就有；銅損像貨車載貨耗油，載越重耗越多，而且是加倍地多。", "gl": [["鐵損", "鐵心的磁滯損加渦流損，幾乎固定"], ["銅損", "電流流過線圈電阻產生的熱，等於 I²R"], ["開路試驗", "二次側不接負載，量鐵損"], ["短路試驗", "二次側短路、一次加低電壓，量銅損"]], "ex": {"q": "滿載銅損 400 W，半載時銅損多少？", "s": ["銅損跟負載率的平方成正比", "半載：負載率 0.5，0.5²＝0.25", "400 × 0.25＝100 W"], "a": "100 W"}}, "transformer-connection": {"easy": "三台單相變壓器接成三相，壞了一台，剩下兩台接成 V 形還能繼續供電，只是容量打折。兩台變壓器並聯，條件要相同才能好好分擔負載。", "like": "V 接像三個人抬轎走了一個，兩個人還抬得動，但扛不了原本的重量；並聯像兩匹馬拉車，體型要差不多，不然一匹會被累垮。", "gl": [["V－V 接線", "只用兩台單相變壓器供應三相電"], ["利用率", "每台變壓器實際能用到的容量比例"], ["百分比阻抗（%Z）", "變壓器內部阻抗的大小，影響並聯時誰分擔較多"]], "ex": {"q": "三台 10 kVA 接成 △－△，壞一台改成 V－V，最多能供多少？", "s": ["V－V 容量＝√3 × 單台容量", "1.732 × 10 ≈ 17.3 kVA", "和原本 30 kVA 相比：17.3 ÷ 30 ≈ 57.7%"], "a": "約 17.3 kVA"}}, "transformer-ratio": {"easy": "變壓器靠線圈圈數決定電壓：圈數多的那邊電壓高、電流小；圈數少的那邊電壓低、電流大。", "like": "像腳踏車變速：一邊轉得慢但力氣大，一邊轉得快但力氣小，傳過去的功率差不多。", "gl": [["一次側", "接電源的那一側，不一定是高壓側"], ["二次側", "接負載的那一側"], ["匝數比 a", "一次匝數 ÷ 二次匝數"], ["E＝4.44 f N Φm", "計算感應電壓有效值的公式"]], "ex": {"q": "一次 3300 V、2400 匝，二次 80 匝，二次電壓多少？", "s": ["電壓跟匝數成正比", "V2＝V1 × N2 ÷ N1", "3300 × 80 ÷ 2400＝110 V"], "a": "110 V"}}, "transformer-tap-auto": {"easy": "分接頭是變壓器一次側的「微調檔位」，二次電壓偏低就換到較低的分接頭。自耦變壓器則是一次、二次共用一組線圈，省材料但沒有隔離。", "like": "分接頭像蓮蓬頭的水量微調；自耦變壓器像一條水管中途開一個出水口，共用同一條管子，便宜，但上下游是相通的。", "gl": [["分接頭（tap）", "一次線圈上幾個不同位置的接點，用來微調匝數比"], ["電壓調整率", "從無載到滿載，二次電壓掉了多少百分比"], ["自耦變壓器", "一次與二次共用部分線圈的變壓器"], ["串聯繞組", "自耦接法中沒有共用、串在輸出端的那段繞組"]], "ex": {"q": "分接頭在 3300 V，二次實測 99 V，希望變成 107 V，要換到哪個分接頭？", "s": ["新分接頭 ≈ 原分接頭 × 實測電壓 ÷ 希望電壓", "3300 × 99 ÷ 107 ≈ 3053 V", "選最接近、較低的分接頭"], "a": "3000 V"}}, "transformer-core": {"easy": "變壓器鐵心快要磁飽和時，激磁電流會變成尖尖的波形，裡面以三次諧波最多。鐵心和線圈的各種做法，都是為了減少損失和漏磁。", "like": "像海綿吸水：吸到快飽和時，再多吸一點都很吃力（電流變尖）；把鐵心做成一片片絕緣的薄片，就像把大海綿切成薄片，減少在裡面亂竄的渦流。", "gl": [["激磁電流", "變壓器沒接負載時，用來建立磁場的小電流"], ["諧波", "頻率是基本頻率整數倍的成分，60 Hz 的三次諧波是 180 Hz"], ["渦流", "在鐵心內部打轉、會發熱的感應電流"], ["漏磁", "沒有穿過另一側線圈、白白漏掉的磁通"]], "ex": {"q": "變壓器的激磁電流含哪一種諧波最多？", "s": ["鐵心飽和與磁滯讓電流變成尖頭波", "正負半週對稱，只含奇次諧波", "奇次諧波裡最大的是三次"], "a": "三次諧波"}}, "transformer-connection-grounding": {"easy": "三相變壓器的一次、二次可以各自接成 Y 或 △。中性點只有 Y 接才有，所以要二次側中性點接地，二次就必須是 Y 接。", "like": "Y 接像雨傘，中間有一根傘柄（中性點）可以插進地裡；△ 接像三角形鐵架，沒有中心點，找不到地方插。", "gl": [["中性點", "Y 接三個繞組共同相接的那一點"], ["Δ－Y", "一次 △ 接、二次 Y 接"], ["耐壓試驗", "加比平常高的電壓，確認絕緣不會被打穿"]], "ex": {"q": "三台 11.4 kV／220 V 變壓器，要供 380 V 電動機，該怎麼接？", "s": ["二次要從 220 V 變成 380 V", "Y 接線電壓＝√3 × 220 ≈ 380 V，所以二次接 Y", "一次是三相三線，接 △"], "a": "Δ－Y"}}, "capacitor-kvar": {"easy": "電容器的電容值（μF）是固定的，但它能提供的 kVAR 會隨電壓平方、頻率一次方改變。電壓用低了，容量會掉很多。", "like": "像打氣進泳池：池子大小（μF）不變，打氣的壓力（電壓）小一點，打進去的氣（kVAR）就少很多，而且是平方地少。", "gl": [["μF（微法拉）", "電容值，由電容器構造決定"], ["kVAR", "電容器能提供的無效功率"], ["放電裝置", "切離電源後，放掉電容器殘留電荷的電阻或線圈"]], "ex": {"q": "額定 440 V、50 kVAR 的電容器用在 380 V，剩多少 kVAR？", "s": ["kVAR 跟電壓平方成正比", "（380 ÷ 440）² ≈ 0.746", "50 × 0.746 ≈ 37.3"], "a": "約 37.3 kVAR"}}, "arrester-rating": {"easy": "避雷器平常不導電，遇到打雷造成的異常高壓才放電，把雷電導進大地。選額定電壓要看系統電壓和接地方式。", "like": "像水庫的洩洪道：水位正常時關著，水位暴漲才打開把水放掉，水位回落又自動關上。", "gl": [["避雷器", "遇到過電壓時放電、保護設備的裝置"], ["有效接地", "中性點直接接地的系統，例如台電 11.4 kV 配電"], ["臨界崩潰電壓", "避雷器開始放電的電壓"]], "ex": {"q": "台電 11.4 kV 中性點直接接地系統，避雷器要選幾 kV？", "s": ["直接接地屬於有效接地，打七五折", "系統最高電壓約 12 kV × 0.75", "＝9 kV"], "a": "9 kV"}}, "arrester-install": {"easy": "避雷器要接到很好的接地（10 Ω 以下），引接線要夠粗，而且越短、越直越好，雷電才能快速導走。", "like": "像緊急逃生梯：要直通地面、越短越好，轉太多彎大家就卡在樓梯間。", "gl": [["引接線", "把避雷器接到電源線和大地的導線"], ["電感壓降", "電流快速變化時，導線電感造成的電壓；線越長、越彎越大"], ["架空地線", "架在電線最上方、專門擋直擊雷的接地線"]], "ex": {"q": "避雷器的接地電阻和引接線線徑規定各是多少？", "s": ["接地電阻：10 Ω 以下", "引接線：銅線 14 mm² 以上", "口訣「十歐姆、十四平方」"], "a": "10 Ω 以下、14 mm² 以上"}}, "lighting-calc": {"easy": "燈發出的總光量叫流明，照到桌面上的亮度叫照度（勒克斯）。離燈越遠越暗，而且是隨距離平方變暗。", "like": "像噴霧器：噴出的總量固定（流明），離得越遠，噴到的面積越大，每一小塊分到的就越少（照度變小）。", "gl": [["流明（lm）", "光源發出的總光量"], ["燭光（cd）", "光源往某個方向的光強度"], ["勒克斯（lx）", "每平方公尺接收到的流明數，也就是照度"], ["安定器", "限制螢光燈管電流、幫助點亮的元件"]], "ex": {"q": "100 cd 的點光源，正下方 2 m 處照度多少？", "s": ["照度＝光強度 ÷ 距離²", "100 ÷ 2²＝100 ÷ 4", "＝25 lx"], "a": "25 lx"}}, "lighting-fixture": {"easy": "燈座和燈具的重點：接線方向要對、太重太大的燈不能只靠燈座支撐、靠近可燃物要注意溫度。", "like": "螺旋燈座像水龍頭：換燈泡時手會碰到的外圈螺紋，接比較安全的被接地導線；有電壓的火線藏在最裡面的中心接點。", "gl": [["螺旋燈座", "E27 這類要把燈泡轉進去的燈座"], ["被接地導線", "有接地的那條線，通常是中性線，外皮白色或淺灰色"], ["非接地導線", "對地有電壓的線，俗稱火線"]], "ex": {"q": "螺旋燈座的非接地導線（火線）要接在哪裡？", "s": ["換燈泡時手會碰到外圈的螺旋套筒", "螺旋套筒接被接地導線，比較安全", "火線接中心接點"], "a": "中心接點"}}, "outdoor-lighting": {"easy": "屋外的燈和線路會碰到行人、車輛和風雨，所以規定離地要多高、跨距多長要用多粗的線。", "like": "像在路邊拉晒衣繩：人走的地方要拉過頭，車子經過的地方要拉更高；繩子拉越長，就要越粗才不會斷。", "gl": [["放電管燈", "霓虹燈、高壓鈉燈這類靠氣體放電發光的燈"], ["跨距", "兩個支撐點之間的距離"], ["開路電壓", "放電管燈變壓器沒接燈管時的二次電壓"]], "ex": {"q": "屋外照明架空導線跨距 30 m，線徑至少多少？", "s": ["跨距 15 m 以下：5.5 mm²", "超過 15 m 到 50 m：8 mm²", "30 m 落在第二段"], "a": "8 mm²"}}, "motor-protection": {"easy": "電動機起動時電流很大，保護用的熔線或斷路器要選成滿載電流的好幾倍，才不會一起動就跳；但也有上限，太大就失去保護作用。", "like": "像大樓保全：小朋友（電動機）剛起床會大哭（起動電流），保全不能一聽到哭聲就報警；但真的出事（短路）要馬上處理。", "gl": [["非延時熔線", "一般熔線，電流一大就熔斷"], ["延時熔線", "能忍受短時間大電流的熔線"], ["反時限斷路器", "電流越大、跳得越快的斷路器"], ["積熱電驛（TH-RY）", "靠雙金屬片受熱彎曲來跳脫的過載保護"]], "ex": {"q": "鼠籠型電動機滿載 40 A，用反時限斷路器，分路過電流保護最大額定是多少？", "s": ["查表二二○：鼠籠型配反時限斷路器是 250%", "40 × 2.5＝100 A", "選不超過 100 A 的標準額定"], "a": "100 A"}}, "induction-speed": {"easy": "感應電動機的轉速由電源頻率和極數決定（同步轉速），轉子實際轉得比同步轉速慢一點，慢的比例叫轉差率。", "like": "像追公車：公車（旋轉磁場）一直往前開，你（轉子）一直追但總差一點；萬一真的追上，就沒有東西推你了，所以轉子永遠追不上。", "gl": [["同步轉速 Ns", "旋轉磁場的轉速，＝120 f ÷ P"], ["極數 P", "N 極加 S 極的總數，不是極對數"], ["轉差率 S", "轉子比磁場慢的比例"]], "ex": {"q": "60 Hz、4 極電動機，實際轉速 1746 rpm，轉差率是多少？", "s": ["Ns＝120 × 60 ÷ 4＝1800 rpm", "S＝（1800 － 1746）÷ 1800", "＝54 ÷ 1800＝0.03"], "a": "3%"}}, "motor-starting": {"easy": "大電動機直接全壓起動，電流會衝到滿載的好幾倍，讓整個電路電壓跟著下降，所以要先降壓起動；代價是起動轉矩也跟著變小。", "like": "像開車起步不要一腳油門踩到底：慢慢給油（降壓）比較平順，但起步的衝勁也比較小。", "gl": [["全壓起動", "直接接上額定電壓起動"], ["Y－△ 起動", "起動時先接成 Y，轉起來再切換成 △"], ["自耦變壓器起動", "用自耦變壓器的抽頭先降壓起動"], ["轉矩", "讓轉軸轉動的扭力"]], "ex": {"q": "全壓（△）起動電流 150 A，改用 Y－△ 起動，起動電流多少？", "s": ["Y－△ 起動：電流和轉矩都變成全壓的 1/3", "150 ÷ 3", "＝50 A，轉矩也只剩 1/3"], "a": "50 A"}}, "single-phase-motor": {"easy": "單相電只會產生「原地來回跳」的磁場，推不動靜止的轉子，所以要加起動繞組和電容器，造出旋轉磁場才轉得起來。", "like": "像推旋轉木馬：只在同一個位置前後推，它不會轉；要在旁邊錯開時間再推一把（起動繞組），才轉得起來。", "gl": [["運轉繞組", "主要的線圈，一直接著電"], ["起動繞組", "幫忙起動、和運轉繞組相差 90 度電工角的線圈"], ["離心開關", "轉速夠快時被甩開、切掉起動繞組的開關"], ["蔽極式", "用短路銅環造成移動磁場的小型電動機"]], "ex": {"q": "單相電容起動式電動機要反轉，該怎麼接？", "s": ["只對調其中一組繞組，磁場轉向才會相反", "運轉繞組保持不動", "對調起動繞組的兩端"], "a": "對調起動繞組兩端"}}, "motor-faults": {"easy": "三相電動機任意對調兩條電源線就會反轉。運轉中斷了一相（欠相），電動機多半還會轉，但電流變大、發熱，久了會燒毀。", "like": "像三個人輪流划船：其中兩個人交換順序，船就往反方向轉；少一個人，剩下兩人還划得動，但會累垮。", "gl": [["相序", "R、S、T 三相電壓到達最大值的先後順序"], ["欠相", "三相中有一相斷掉"], ["欠相保護", "偵測到欠相就跳脫的保護"]], "ex": {"q": "原本 R－U、S－V、T－W 正轉，改接成 R－W、S－V、T－U 會怎樣？", "s": ["S－V 沒變，U 和 W 對調了", "等於 R、T 兩條電源線對調", "兩線對調就反轉"], "a": "反轉"}}, "motor-tests": {"easy": "感應電動機做兩個試驗就能知道損失：無載試驗量鐵損和機械損，堵住轉子的堵轉試驗量銅損，剛好對應變壓器的開路、短路試驗。", "like": "像檢查汽車：打空檔踩油門，看引擎本身的耗損（無載）；拉著手煞車踩油門，看傳動系統的負荷（堵轉）。", "gl": [["無載試驗", "不接負載，讓電動機空轉"], ["堵轉試驗", "把轉子固定住，加低電壓測量"], ["最大轉矩", "電動機能產生的最大扭力"], ["再生制動", "讓電動機變成發電機，把能量送回電源來減速"]], "ex": {"q": "7.5 HP、220 V 三相電動機，功因 0.82、效率 0.86，滿載電流約多少？", "s": ["輸出＝7.5 × 746＝5595 W", "I＝P ÷（√3 × V × cosθ × η）", "5595 ÷（1.732 × 220 × 0.82 × 0.86）≈ 5595 ÷ 268.7 ≈ 20.8 A"], "a": "約 21 A"}}, "plc-io-signals": {"easy": "PLC 的訊號分四種：只有開與關的叫數位（DI 輸入、DO 輸出），會連續變化的叫類比（AI 輸入、AO 輸出）。", "like": "數位像電燈開關，只有開跟關；類比像調光旋鈕，可以停在任何亮度。", "gl": [["DI", "數位輸入，例如按鈕、極限開關"], ["DO", "數位輸出，例如啟動電動機、響警鈴"], ["AI", "類比輸入，例如溫度、壓力、液位量測值"], ["AO", "類比輸出，例如給變頻器的轉速命令"], ["A/D", "類比轉數位"]], "ex": {"q": "液位感測器把 4～20 mA 的液位值送給 PLC，屬於哪一種訊號？", "s": ["液位會連續變化，所以是類比", "是送進 PLC 的，所以是輸入", "類比輸入"], "a": "AI"}}, "plc-numbers-logic": {"easy": "PLC 和電腦用 0 與 1 記數，所以要會二進位、十六進位、BCD 互換；還要知道訊號從 0 變 1 叫正緣，從 1 變 0 叫負緣。", "like": "BCD 像填支票上的大寫金額：每一位數字各自寫成 4 格的 0／1，不是整串一起換算。", "gl": [["二進位", "只用 0 和 1 的記數法"], ["十六進位", "0～9 再加 A～F，A＝10、F＝15"], ["BCD", "每個十進位數字各用 4 個位元表示"], ["鮑率", "每秒傳送的位元數"]], "ex": {"q": "十六進位 A5 等於十進位多少？", "s": ["A 代表 10，在十六的位數", "10 × 16＝160", "160 ＋ 5＝165"], "a": "165"}}, "modbus-comm": {"easy": "Modbus 是設備之間「一問一答」的通訊規則：只有一個主站負責發問，從站只在被點名時回答。", "like": "像老師點名：老師（Master）點到幾號（站號），那位同學（Slave）才回答，其他人安靜。", "gl": [["Master／Slave", "主站（發問）／從站（回答）"], ["站號", "每台從站的編號"], ["RTU、ASCII", "Modbus 串列傳輸的兩種格式"], ["CRC、LRC", "檢查資料有沒有傳錯的檢查碼"]], "ex": {"q": "HMI 監控畫面輪流讀取 10 台電表，誰是 Master？", "s": ["誰主動發問，誰就是 Master", "HMI 輪流詢問每台電表", "電表只負責回答，是 Slave"], "a": "HMI"}}, "plc-features": {"easy": "PLC 是工廠用的小電腦，用程式取代一大堆繼電器配線，可靠、好修改、可以加裝模組擴充。", "like": "以前做一套控制要拉一大堆繼電器線，像用紙筆一張張重畫；PLC 像用電腦排版，要改只要改程式。", "gl": [["PLC", "可程式邏輯控制器"], ["階梯圖 LD", "畫成像梯子一樣的 PLC 程式語言"], ["PID", "比例、積分、微分三種動作組成的自動控制"], ["光耦合器", "用光傳遞訊號，讓輸入端與內部電路隔離的元件"]], "ex": {"q": "LD、SFC、ST、C 語言中，哪一個不是 IEC 61131-3 的 PLC 語言？", "s": ["記口訣「三圖兩文」", "三圖：LD、FBD、SFC；兩文：IL、ST", "C 語言不在其中"], "a": "C 語言"}}, "radio-comm": {"easy": "通訊方向分三種：只能單向傳的叫單工，兩邊都能講但要輪流的叫半雙工，兩邊可以同時講的叫全雙工。", "like": "單工像收音機，只能聽；半雙工像對講機，講完要說「over」換對方；全雙工像打電話，兩人可以同時講。", "gl": [["單工（Simplex）", "只能單向傳送"], ["半雙工（Half Duplex）", "可以雙向，但同一時間只有一方傳"], ["全雙工（Full Duplex）", "雙向同時傳送"]], "ex": {"q": "無線電對講機屬於哪一種傳輸方式？", "s": ["對講機要按住按鈕才能講", "講的時候聽不到對方，要輪流", "雙向但要輪流，就是半雙工"], "a": "半雙工"}}, "grounding": {"easy": "接地是幫漏電找一條通往大地的路：接地電阻越小，漏電越容易流走，人越安全。不同系統和設備，規定的接地電阻不同。", "like": "像排水溝：下大雨（漏電）時，水溝越暢通（電阻越小），水越快排掉，不會淹到人。", "gl": [["特種接地", "多 /* 出題機率＝難度分數 D × 記憶衰減 U × 看詳解 1.3（未練習固定 1.2，略高於 D=1）
   D（s[6]）：答錯 +1（連續答錯 +1.5）、答對 −0.5（第一次就答對 −0.7），夾在 0.3～4，最低不歸零
   U：1 − 2^(−距上次作答時間 ÷ 目前格子的 Leitner 間隔)，剛答完 ≈0、到期 0.5、兩倍時間 0.75，下限 0.03
   強度（設定）：平均 D^0、標準 D^1、加強錯題 D^1.6 */
const BOOSTS = [['0','平均','只看多久沒練，不看答錯紀錄'],['1','標準','答錯越多、越久沒練，越容易出現'],['2','加強錯題','錯題再加重']];

function dsc(s){ return typeof s[6] === 'number' ? s[6] : clampD(1 + .8 * Math.min(s[2], 5) - .5 * s[1] + (s[0] === 0 && s[2] ? .5 : 0)); }

function wsample(list, n, w){ return list.map(q => [Math.pow(Math.random(), 1 / w(q)), q]).sort((a,b) => b[0] - a[0]).slice(0, n).map(x => x[1]); }

function curSkin(){ return document.documentElement.getAttribute('data-skin') || 'auto'; }

    let cls = 'opt';

      '<button class="btn ' + (R.confirmSubmit ? 'warn' : 'primary') + '" data-x="submitExam">' + (R.confirmSubmit ? (left ? '還有 ' + left + ' 題未答，確定交卷' : '確定交卷') : '交卷') + '</button>';

      : '<span class="fb bad">答錯，正解 ' + ans + '<small>' + (R.fuses !== null ? (R.fuses > 0 ? '扣一顆愛心，剩 ' + R.fuses + ' 顆；這題會在回合末再出一次' : '愛心用完，回合結束') : '已記入錯題本') + '</small></span>';

  if (R.endAt) onTick();
  const nb = $('#nextBtn'); if (nb) nb.focus({preventScroll:true});
  // 只在作答結果或詳解開頭被擋住時才輕輕捲動，避免畫面一直跳

    const f = $('.qfoot'), ex = $('#exp');
    let dy = f ? f.getBoundingClientRect().bottom - innerHeight + 16 : 0;
    if (ex && !ex.hidden) dy = Math.max(dy, ex.getBoundingClientRect().top - innerHeight + 140);
    if (dy > 0) scrollBy({top: dy, behavior: 'smooth'});

function revHTML(items, mode){

}

function renderResult(r){

    extra = '<div class="sec-h"><h2>各回路得分</h2></div><div class="tblwrap"><table class="chtable"><thead><tr><th>工作項目</th><th style="text-align:right">答對 / 題數</th></tr></thead><tbody>' +

  } else if (r.mode === 'sweep') {
    const miss = CH.filter(c => r.per[c.id] && r.per[c.id][0] < r.per[c.id][1]);

      (miss.length ? '有 ' + miss.length + ' 個工作項目答錯，下面紅色的回路建議先用「回路練習」補強。' : '19 個工作項目全部答對。') + (r.ok > r.prevBest ? '刷新個人紀錄。' : '個人最佳 ' + S.best.sweep + ' / 20。') + '</p></div>';
    extra = '<div class="sec-h"><h2>巡檢報告 · 19 個工作項目</h2><span class="muted" style="font-size:13px">紅色＝這次答錯，點一下可直接練習該回路</span></div><div class="sweep">' +
      CH.filter(c => r.per[c.id]).map(c => { const p = r.per[c.id], bad = p[0] < p[1]; const tag = bad ? 'button' : 'div'; return '<' + tag + (bad ? ' class="x" data-act="practice" data-ch="' + c.id + '" title="開始這個回路的回路練習"' : '') + '><i aria-hidden="true"></i><span class="mono">' + pad(c.id) + '</span><span>' + esc(c.name) + (p[1] > 1 ? '（' + p[0] + '/' + p[1] + '）' : '') + '</span>' + (bad ? '<span class="go">練習 →</span>' : '') + '</' + tag + '>'; }).join('') + '</div>';

  }

  r.newOn.forEach(c => notes.push('NFB-' + pad(c) + '「' + CHM[c].name + '」熟練度達 80%，開關投入，紅燈亮。'));

function bookList(){
  const f = $('#bkF'); if (f) f.value = BK.f;
  let l = BK.ch ? BY[BK.ch] : QS;
  if (BK.fx && FGROUPS[BK.fx]) { const set = new Set(fxKeys(BK.fx)); l = l.filter(q => set.has(q.k)); }
  if (BK.note && NOTEM[BK.note]) { const set = new Set(NOTEM[BK.note].keys); l = l.filter(q => set.has(q.k)); }
  if (BK.f === 'wrong') l = l.filter(q => S.q[q.k] && S.q[q.k][2] > 0);
  if (BK.f === 'weak') l = l.filter(q => lvl(q.k) < 3);
  if (BK.f === 'new') l = l.filter(q => !S.q[q.k]);
  if (BK.f === 'multi') l = l.filter(q => q.multi);
  if (BK.f === 'wrong') l = l.slice().sort((a,b) => st(b.k)[2] - st(a.k)[2]);
  const s = BK.s.trim();
  if (s) l = l.filter(q => plain(q.q + q.o.join(' ')).includes(s));
  $('#bkCount').textContent = '共 ' + l.length + ' 題' + (l.length > BK.n ? '，顯示前 ' + BK.n + ' 題' : '');

  $('#bkMore').innerHTML = l.length > BK.n ? '<button class="btn" data-more="1">再載入 30 題</button>' : '';
}

/* ================= calculator ================= */
const CALC = {deg:true, ans:0, hist:[]};
const CKEYS = [
  ['sin(','sin','fn'],['cos(','cos','fn'],['tan(','tan','fn'],['acos(','acos','fn'],['BS','⌫','clr'],
  ['√(','√','fn'],['^2','x²','fn'],['^','^','fn'],['π','π','fn'],['AC','AC','clr'],
  ['7','7'],['8','8'],['9','9'],['(','('],[')',')'],
  ['4','4'],['5','5'],['6','6'],['×','×','op'],['÷','÷','op'],
  ['1','1'],['2','2'],['3','3'],['+','+','op'],['−','−','op'],
  ['0','0'],['.','.'],['Ans','Ans','fn'],['%','%','fn'],['=','=','eq']
];
function calcEval(src){
  const s = src.replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/²/g,'^2').replace(/，/g,',').replace(/（/g,'(').replace(/）/g,')');
  const re = /\s*(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+|[A-Za-z]+|[-+*/^%(),])/y;
  const toks = []; let m; re.lastIndex = 0;
  while (re.lastIndex < s.length) { const at = re.lastIndex; m = re.exec(s); if (!m) { if (/^\s*$/.test(s.slice(at))) break; throw '看不懂「' + s.slice(at).trim().slice(0, 6) + '」'; } toks.push(m[1]); }
  let depth = 0; toks.forEach(t => { if (t === '(') depth++; else if (t === ')') depth--; });
  while (depth-- > 0) toks.push(')');
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  const isNum = t => t !== undefined && /^[\d.]/.test(t), isId = t => t !== undefined && /^[A-Za-z]/.test(t);
  const toRad = x => CALC.deg ? x * Math.PI / 180 : x, fromRad = x => CALC.deg ? x * 180 / Math.PI : x;
  const FN = {sqrt:Math.sqrt, sin:x => Math.sin(toRad(x)), cos:x => Math.cos(toRad(x)), tan:x => Math.tan(toRad(x)), asin:x => fromRad(Math.asin(x)), acos:x => fromRad(Math.acos(x)), atan:x => fromRad(Math.atan(x)), log:Math.log10, ln:Math.log, abs:Math.abs};
  const CONST = {pi:Math.PI, e:Math.E, ans:() => CALC.ans};
  function expr(){ let v = term(); while (peek() === '+' || peek() === '-') { const o = next(), r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term(){ let v = unary();
    for (;;) { const t = peek();
      if (t === '*' || t === '/') { next(); const r = unary(); v = t === '*' ? v * r : v / r; }
      else if (isNum(t) || isId(t) || t === '(') v = v * unary();   // implicit multiply: 2π, 3(4), 2√3
      else return v; } }
  function unary(){ if (peek() === '-') { next(); return -unary(); } if (peek() === '+') { next(); return unary(); } return power(); }
  function power(){ const b = postfix(); if (peek() === '^') { next(); return Math.pow(b, unary()); } return b; }
  function postfix(){ let v = primary(); while (peek() === '%') { next(); v = v / 100; } return v; }
  function primary(){
    const t = next();
    if (t === undefined) throw '算式不完整';
    if (isNum(t)) { const v = parseFloat(t); if (isNaN(v)) throw '數字格式錯誤'; return v; }
    if (t === '(') { const v = expr(); if (next() !== ')') throw '括號沒有對齊'; return v; }
    if (isId(t)) { const k = t.toLowerCase();
      if (FN[k]) { const a = peek() === '(' ? primary() : power(); return FN[k](a); }

}
function calcFmt(v){ if (Math.abs(v) < 1e-12) return '0'; const a = Math.abs(v); if (a >= 1e12 || a < 1e-6) return v.toExponential(6).replace(/\.?0+e/, 'e'); return String(Number(v.toPrecision(10))); }

}

  if (d.reveal) { t.closest('article').classList.add('open'); return; }
  if (d.fxOpen) { fxSheet(d.fxOpen); return; }
  if (d.fxGo) { closeLayer(); start('fx', d.fxGo); return; }
  if (d.fxBook) { closeLayer(); BK = {ch:'', f:'all', s:'', hide:BK.hide, n:30, note:'', fx:d.fxBook}; setTab('book'); return; }
  if (d.fxSec) { FX.sec = d.fxSec; render(); return; }
  if (d.note) { noteSheet(d.note); return; }
  if (d.noteGo) { closeLayer(); start('note', d.noteGo); return; }
  if (d.noteBook) { closeLayer(); BK = {ch:'', f:'all', s:'', hide:BK.hide, n:30, note:d.noteBook}; setTab('book'); return; }
  if (d.nf) { NF = d.nf; render(); return; }
  if (d.clearNote) { BK.note = ''; BK.fx = ''; BK.n = 30; render(); return; }
  if (d.acct) { acctSheet(); return; }
  if (d.acctReg || d.acctIn || d.acctUse || d.acctSync || d.acctOut || d.acctDel) { acctAction(d); return; }
  if (d.lb) { LBV.f = d.lb; render(); return; }
  if (d.skinopen) { skinSheet(); return; }
  if (d.skinPick) { applySkin(d.skinPick, true); skinSheet(); return; }
  if (d.closeSheet) { closeLayer(); return; }
  if (d.reset) {
    if (t.dataset.armed) { S = fresh(); save(); toast('已清除全部進度'); setTab('ach'); }
    else { t.dataset.armed = '1'; t.textContent = '再按一次確認清除（無法復原）'; t.classList.add('warn'); }
    return;
  }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'bkCh') { BK.ch = e.target.value ? +e.target.value : ''; BK.n = 30; bookList(); }
  if (id === 'bkF') { BK.f = e.target.value; BK.n = 30; bookList(); }
  if (id === 'bkH') { BK.hide = e.target.checked; bookList(); }
  if (id === 'fxH') { FX.hide = e.target.checked; factsList(); }
  if (id === 'fxM') { FX.miss = e.target.checked; factsList(); }
  if (id === 'optShuffle') { S.opt.shuffle = e.target.checked; save(); }
  if (id === 'optBoost') { S.opt.boost = +e.target.value; save(); }
  if (id === 'optExamBoost') { S.opt.examBoost = e.target.checked; save(); }
});
let bkT = null;
document.addEventListener('input', e => { if (e.target.id === 'fxS') { clearTimeout(bkT); bkT = setTimeout(() => { FX.q = e.target.value; factsList(); }, 200); return; } if (e.target.id === 'bkS') { clearTimeout(bkT); bkT = setTimeout(() => { BK.s = e.target.value; BK.n = 30; bookList(); }, 200); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#layer').innerHTML) { closeLayer(); return; }
  if (e.key === 'Enter' && e.target.id === 'acctName') { e.preventDefault(); acctAction({acctIn:'1'}); return; }
  if (!R || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (/^[1-4]$/.test(e.key)) { e.preventDefault(); choose(+e.key - 1); }
  else if (e.key === 'Enter') {
    if (e.target.tagName === 'BUTTON' && e.target.dataset.x !== 'next' && !e.target.classList.contains('opt')) return;
    e.preventDefault();
    if (R.mode === 'exam') return;
    if (R.phase === 'ask') submit(); else next();
  }
  else if (R.mode === 'exam' && e.key === 'ArrowRight') examGo(R.i + 1);
  else if (R.mode === 'exam' && e.key === 'ArrowLeft') examGo(R.i - 1);
});

/* ================= boot ================= */
if (S.opt.skin && S.opt.skin !== curSkin()) applySkin(S.opt.skin, false);
checkAch(); pendingAch = [];
header(); render();
cloud(0);
acctLabel(); acctPull();
})();
</script>
