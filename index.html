<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>乙級送電計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a switchboard. Home is the 受電盤 (19 breakers on one bus); play happens on a meter-faced card below a voltage strip. */
/* ── Layer 1 · Primitive：各主題的原始色票（只在 Layer 2 被引用） ── */
:root{
  /* 盤面灰 */
  --panel-50:#F8F7F3; --panel-100:#E7E6E0; --panel-200:#DAD8D0; --panel-300:#BFBCB2; --panel-600:#555A61; --panel-900:#1C2024;
  --amber-100:#F6E8C3; --amber-400:#E0A100; --amber-600:#B47C00; --amber-800:#835500;
  --panel-lamp-red:#C8352B; --panel-lamp-green:#2B8250; --panel-ok:#1A7350; --panel-ok-tint:#DDEFE5; --panel-bad:#B0362A; --panel-bad-tint:#F7E0DC; --panel-on-accent:#1C2024;
  /* 藍晒圖 */
  --steel-50:#F8FAFD; --steel-100:#E8EEF5; --steel-200:#D6E0EC; --steel-300:#B6C4D6; --steel-600:#4A5A70; --steel-900:#13243B;
  --orange-100:#FBE3CC; --orange-400:#F08A24; --orange-600:#D9701A; --orange-800:#9C4A06;
  --blueprint-lamp-red:#C8352B; --blueprint-lamp-green:#22804A; --blueprint-ok:#16704E; --blueprint-ok-tint:#DCEFE6; --blueprint-bad:#B0362A; --blueprint-bad-tint:#F8E0DC; --blueprint-on-accent:#13243B;
  /* 機房綠 */
  --sage-50:#F7FAF7; --sage-100:#E5ECE6; --sage-200:#D2DDD4; --sage-300:#B5C6B9; --sage-600:#4C5B51; --sage-900:#16241B;
  --teal-100:#CFEAE1; --teal-400:#0E7C62; --teal-600:#0E7C62; --teal-800:#0A6350;
  --sage-lamp-red:#C2362B; --sage-lamp-green:#2A7D48; --sage-ok:#17714D; --sage-ok-tint:#DAEEE3; --sage-bad:#AF352A; --sage-bad-tint:#F6DFDB; --sage-on-accent:#FFFFFF;
  /* 白底高對比 */
  --mono-50:#FFFFFF; --mono-100:#FFFFFF; --mono-200:#ECECEC; --mono-300:#8C8C8C; --mono-600:#3F3F3F; --mono-900:#0F0F0F;
  --yellow-100:#FFF0BF; --yellow-400:#FFC20E; --yellow-600:#A87600; --yellow-800:#6E4D00;
  --paper-lamp-red:#D0021B; --paper-lamp-green:#00803A; --paper-ok:#006B38; --paper-ok-tint:#DDF2E5; --paper-bad:#B8001A; --paper-bad-tint:#FBE0E2; --paper-on-accent:#0F0F0F;
  /* 夜間 */
  --graphite-50:#1E2226; --graphite-100:#15181B; --graphite-200:#111316; --graphite-300:#3A4047; --graphite-600:#A0A5AC; --graphite-900:#E8E6E0;
  --gold-100:#3A3020; --gold-400:#F0B232; --gold-600:#F0B232; --gold-800:#F0B232;
  --night-lamp-red:#F05A4C; --night-lamp-green:#4CC17C; --night-ok:#5BC793; --night-ok-tint:#183428; --night-bad:#F2796B; --night-bad-tint:#3A1F1C; --night-on-accent:#1C2024;
}

/* ── Layer 2 · Semantic：介面用途。預設＝盤面灰；沒選主題時跟隨系統／檢視器的深淺色 ── */
:root{ --bg:var(--panel-100); --surface:var(--panel-50); --sunk:var(--panel-200); --line:var(--panel-300); --muted:var(--panel-600); --ink:var(--panel-900); --accent:var(--amber-400); --accent-soft:var(--amber-100); --accent-ink:var(--amber-800); --fill:var(--amber-600); --on-accent:var(--panel-on-accent); --rl:var(--panel-lamp-red); --gl:var(--panel-lamp-green); --ok:var(--panel-ok); --ok-bg:var(--panel-ok-tint); --bad:var(--panel-bad); --bad-bg:var(--panel-bad-tint); --fig:none; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(30,30,20,.12); color-scheme:light;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-skin]){ --bg:var(--graphite-100); --surface:var(--graphite-50); --sunk:var(--graphite-200); --line:var(--graphite-300); --muted:var(--graphite-600); --ink:var(--graphite-900); --accent:var(--gold-400); --accent-soft:var(--gold-100); --accent-ink:var(--gold-800); --fill:var(--gold-600); --on-accent:var(--night-on-accent); --rl:var(--night-lamp-red); --gl:var(--night-lamp-green); --ok:var(--night-ok); --ok-bg:var(--night-ok-tint); --bad:var(--night-bad); --bad-bg:var(--night-bad-tint); --fig:invert(.9) hue-rotate(180deg); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]:not([data-skin]){ --bg:var(--graphite-100); --surface:var(--graphite-50); --sunk:var(--graphite-200); --line:var(--graphite-300); --muted:var(--graphite-600); --ink:var(--graphite-900); --accent:var(--gold-400); --accent-soft:var(--gold-100); --accent-ink:var(--gold-800); --fill:var(--gold-600); --on-accent:var(--night-on-accent); --rl:var(--night-lamp-red); --gl:var(--night-lamp-green); --ok:var(--night-ok); --ok-bg:var(--night-ok-tint); --bad:var(--night-bad); --bad-bg:var(--night-bad-tint); --fig:invert(.9) hue-rotate(180deg); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.4); color-scheme:dark; }
:root[data-skin="panel"]{ --bg:var(--panel-100); --surface:var(--panel-50); --sunk:var(--panel-200); --line:var(--panel-300); --muted:var(--panel-600); --ink:var(--panel-900); --accent:var(--amber-400); --accent-soft:var(--amber-100); --accent-ink:var(--amber-800); --fill:var(--amber-600); --on-accent:var(--panel-on-accent); --rl:var(--panel-lamp-red); --gl:var(--panel-lamp-green); --ok:var(--panel-ok); --ok-bg:var(--panel-ok-tint); --bad:var(--panel-bad); --bad-bg:var(--panel-bad-tint); --fig:none; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(30,30,20,.12); color-scheme:light; }
:root[data-skin="blueprint"]{ --bg:var(--steel-100); --surface:var(--steel-50); --sunk:var(--steel-200); --line:var(--steel-300); --muted:var(--steel-600); --ink:var(--steel-900); --accent:var(--orange-400); --accent-soft:var(--orange-100); --accent-ink:var(--orange-800); --fill:var(--orange-600); --on-accent:var(--blueprint-on-accent); --rl:var(--blueprint-lamp-red); --gl:var(--blueprint-lamp-green); --ok:var(--blueprint-ok); --ok-bg:var(--blueprint-ok-tint); --bad:var(--blueprint-bad); --bad-bg:var(--blueprint-bad-tint); --fig:none; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(30,30,20,.12); color-scheme:light; }
:root[data-skin="sage"]{ --bg:var(--sage-100); --surface:var(--sage-50); --sunk:var(--sage-200); --line:var(--sage-300); --muted:var(--sage-600); --ink:var(--sage-900); --accent:var(--teal-400); --accent-soft:var(--teal-100); --accent-ink:var(--teal-800); --fill:var(--teal-600); --on-accent:var(--sage-on-accent); --rl:var(--sage-lamp-red); --gl:var(--sage-lamp-green); --ok:var(--sage-ok); --ok-bg:var(--sage-ok-tint); --bad:var(--sage-bad); --bad-bg:var(--sage-bad-tint); --fig:none; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(30,30,20,.12); color-scheme:light; }
:root[data-skin="paper"]{ --bg:var(--mono-100); --surface:var(--mono-50); --sunk:var(--mono-200); --line:var(--mono-300); --muted:var(--mono-600); --ink:var(--mono-900); --accent:var(--yellow-400); --accent-soft:var(--yellow-100); --accent-ink:var(--yellow-800); --fill:var(--yellow-600); --on-accent:var(--paper-on-accent); --rl:var(--paper-lamp-red); --gl:var(--paper-lamp-green); --ok:var(--paper-ok); --ok-bg:var(--paper-ok-tint); --bad:var(--paper-bad); --bad-bg:var(--paper-bad-tint); --fig:none; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(30,30,20,.12); color-scheme:light; }
:root[data-skin="night"]{ --bg:var(--graphite-100); --surface:var(--graphite-50); --sunk:var(--graphite-200); --line:var(--graphite-300); --muted:var(--graphite-600); --ink:var(--graphite-900); --accent:var(--gold-400); --accent-soft:var(--gold-100); --accent-ink:var(--gold-800); --fill:var(--gold-600); --on-accent:var(--night-on-accent); --rl:var(--night-lamp-red); --gl:var(--night-lamp-green); --ok:var(--night-ok); --ok-bg:var(--night-ok-tint); --bad:var(--night-bad); --bad-bg:var(--night-bad-tint); --fig:invert(.9) hue-rotate(180deg); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.4); color-scheme:dark; }

/* ── Layer 3 · Component：元件只引用這一層或 Layer 2 ── */
:root{
  --page-bg:var(--bg); --card-bg:var(--surface); --card-border:var(--line);
  --btn-primary-bg:var(--ink); --btn-primary-fg:var(--bg);
  --btn-warn-bg:var(--accent); --btn-warn-fg:var(--on-accent);
  --tab-active-bg:var(--ink); --tab-active-fg:var(--bg);
  --meter-track:var(--sunk); --meter-fill:var(--fill);
  --bulb-on:var(--accent); --lamp-on:var(--rl); --lamp-off:var(--gl);
  --opt-bg:var(--bg); --opt-border:var(--line); --opt-sel-border:var(--ink);
  --highlight-text:var(--accent-ink); --focus-ring:var(--accent-ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page-bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.multi{border-color:var(--accent-ink);color:var(--highlight-text);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:500;box-shadow:var(--shadow);min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-fg);border-color:var(--btn-primary-bg)}
.btn.warn{background:var(--btn-warn-bg);border-color:var(--btn-warn-bg);color:var(--btn-warn-fg)}
.btn.ghost{background:transparent;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:8px 12px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:22px;font-weight:900;letter-spacing:.04em}
.brand .mono{font-size:11px;color:var(--muted)}
.rank{display:flex;align-items:center;gap:10px;min-width:220px}
.rank b{font-weight:700;white-space:nowrap}
.xpbar{flex:1;height:8px;background:var(--meter-track);border-radius:4px;overflow:hidden;min-width:90px}
.xpbar i{display:block;height:100%;background:var(--meter-fill);transition:width .5s}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-family:var(--f-num);font-size:17px;font-weight:700}
.sync{font-size:11px;font-family:var(--f-mono);color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;min-height:28px}
.sync.on{border-style:solid;color:var(--ink)}
.acct-in{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:12px}
.acct-msg{min-height:1.5em;font-size:14px;margin:8px 0 0}
.acct-msg.bad{color:var(--bad)}
.acct-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acct-cmp>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
.acct-cmp b{font-size:15px}
.lb{list-style:none;padding:0;margin:14px 0 8px;display:grid;gap:6px;max-width:520px}
.lb li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.lb .rk{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.lb li.top1 .rk,.lb li.top2 .rk,.lb li.top3 .rk{color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;line-height:30px}
.lb b{font-family:var(--f-num);font-size:18px}
.lb em{font-style:normal;color:var(--muted);font-size:13px}
.lb li.me{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lb li.gap{background:transparent;border:0;padding:0;display:block;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-block:12px 18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--tab-active-bg);color:var(--tab-active-fg)}

/* ---------- home: switchboard ---------- */
.board{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);min-width:0}
.plate .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.bigline{display:flex;align-items:baseline;gap:10px;margin-block:4px 2px}
.bigline .num{font-size:64px;font-weight:700;line-height:1}
.bigline .of{font-size:24px;color:var(--muted)}
.bus{margin-top:14px;position:relative;padding-top:6px}
.bus::before{content:"";position:absolute;left:0;right:0;top:6px;height:4px;background:var(--ink);border-radius:2px}
.drops{display:grid;grid-template-columns:repeat(19,1fr);gap:2px}
.drop{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px;border:0;background:none;cursor:pointer;padding-inline:0}
.drop::before{content:"";width:2px;height:14px;background:var(--ink)}
.drop .bulb{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--sunk);transition:background .4s, box-shadow .4s}
.drop.on .bulb{background:var(--bulb-on);border-color:var(--fill);box-shadow:0 0 10px var(--bulb-on)}
.drop.part .bulb{background:linear-gradient(to top,var(--meter-fill) var(--p),var(--meter-track) var(--p))}
.drop small{font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.mode:hover{border-color:var(--ink)}
.mode .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font-family:var(--f-num);font-weight:700;font-size:15px}
.mode.hot .ico{background:var(--btn-warn-bg);color:var(--btn-warn-fg)}
.mode b{display:block;font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode .go{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:22px 10px;flex-wrap:wrap}
.sec-h h2{font-size:18px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.brk{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto auto;gap:6px 10px;text-align:left;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:12px;cursor:pointer;box-shadow:var(--shadow);min-height:150px;min-width:0}
.brk:hover{border-color:var(--ink)}
.brk .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.lamp{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;color:var(--muted);justify-self:end}
.lamp::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--lamp-off);box-shadow:0 0 0 2px var(--sunk)}
.lamp.on::before{background:var(--lamp-on);box-shadow:0 0 0 2px var(--sunk),0 0 8px var(--lamp-on)}
.brk .name{grid-column:1;font-weight:700;font-size:15px;line-height:1.35;align-self:start}
.handle{grid-column:2;grid-row:2 / span 2;width:26px;height:52px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);position:relative;justify-self:end}
.handle::after{content:"";position:absolute;left:3px;right:3px;height:22px;bottom:3px;border-radius:3px;background:var(--muted);transition:bottom .35s cubic-bezier(.5,1.6,.5,1),background .3s}
.handle.on::after{bottom:25px;background:var(--ink)}
.handle small{position:absolute;left:0;right:0;font-family:var(--f-mono);font-size:8px;text-align:center;color:var(--muted)}
.meter{grid-column:1;height:6px;background:var(--meter-track);border-radius:3px;position:relative;overflow:visible;align-self:center}
.meter b{display:block;height:100%;border-radius:3px;background:var(--meter-fill)}
.meter::after{content:"";position:absolute;left:80%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.brk .meta{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.brk .meta .gold{color:var(--highlight-text);font-weight:700}

/* sheet (chapter actions) */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:12px;width:min(520px,100%);padding:20px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.sheet h3{font-size:20px;margin-block:4px 6px}
.sheet .acts{display:grid;gap:8px;margin-top:16px}
.sheet .acts .btn{justify-content:space-between}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--sunk);border-radius:6px;padding:8px;text-align:center}
.kv b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.1}
.kv span{font-size:11px;color:var(--muted)}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbar .label{font-weight:700;margin-right:auto}
.fuses{display:flex;gap:4px}
.hchart{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:8px;margin-bottom:10px}
.hchart svg{width:100%;height:auto;display:block}
.hchart .ax{stroke:var(--line);stroke-width:1}
.hchart .ln{fill:none;stroke:var(--fill);stroke-width:2.5;stroke-linejoin:round}
.hchart .dt{fill:var(--surface);stroke:var(--fill);stroke-width:2}
.hchart .tx{fill:var(--muted);font-size:12px}
.htable{overflow-x:auto;border:1px solid var(--card-border);border-radius:10px;background:var(--card-bg);margin-bottom:16px}
.htable table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.htable th,.htable td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
.htable th{font-size:12px;color:var(--muted);font-weight:500}
.htable td.num{font-family:var(--f-num);font-size:16px;text-align:right}
.htable tr:last-child td{border-bottom:0}
.spd{position:relative;height:24px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-bottom:12px}
.spd i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--accent);animation:spdw var(--t2) linear forwards}
.spd span{position:relative;font-size:12px;padding:0 10px;line-height:24px;color:var(--ink);font-weight:700}
@keyframes spdw{0%{width:100%;background:var(--accent)}100%{width:0;background:var(--line)}}
.spd b{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.spdtag{display:inline-block;margin-left:8px;font-size:13px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--highlight-text);font-weight:700;vertical-align:middle}
.hearts{display:flex;gap:2px;align-items:center}
.heart{width:22px;height:22px;display:block}
.heart path{fill:var(--bad)}
.heart.lost path{fill:none;stroke:var(--muted);stroke-width:2}
.heart.pop{animation:heartpop .45s}
@keyframes heartpop{50%{transform:scale(1.15)}}
.fuse{width:30px;height:12px;border-radius:3px;border:2px solid var(--ink);position:relative;background:var(--surface)}
.fuse::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:2px;background:var(--fill)}
.fuse.blown{border-color:var(--bad);opacity:.6}
.fuse.blown::after{background:transparent;border-top:2px dashed var(--bad);top:2px}
.timer{font-family:var(--f-num);font-size:22px;font-weight:700;min-width:64px;text-align:right}
.timer.low{color:var(--bad)}
.progress{height:4px;background:var(--sunk);border-radius:2px;margin-block:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.volt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}
.volt div{border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);background:var(--surface)}
.volt div b{font-family:var(--f-num);font-size:18px;color:var(--muted)}
.volt div.lit{background:var(--accent-soft);border-color:var(--fill);color:var(--ink)}
.volt div.lit b{color:var(--ink)}
.volt div.cur{box-shadow:0 0 0 2px var(--fill)}
.qcard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.stem{font-size:19px;line-height:1.75;font-weight:500;overflow-wrap:anywhere}
img.fig{vertical-align:middle;max-width:100%;height:auto;filter:var(--fig);margin-inline:2px}
img.fig.big{display:block;margin:12px 0}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;text-align:left;padding:12px 14px;min-height:52px;border:1.5px solid var(--opt-border);border-radius:10px;background:var(--opt-bg);cursor:pointer;font-size:17px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .n{font-family:var(--f-num);font-size:22px;font-weight:700;color:var(--muted)}
.opt .box{width:20px;height:20px;border:2px solid var(--line);border-radius:4px}
.opt.sel{border-color:var(--opt-sel-border);background:var(--surface)}
.opt.sel .n{color:var(--ink)}
.opt.sel .box{background:var(--ink);border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .n{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .n{color:var(--bad)}
.opt:disabled{cursor:default}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;min-height:48px}
.fb{flex:1;min-width:0;font-weight:700}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--muted)}
.exp{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fill);border-radius:0 10px 10px 0;padding:12px 16px;font-size:16px;line-height:1.75;max-width:75ch}
.exp .eh{display:flex;align-items:baseline;gap:8px;font-weight:700;margin-bottom:2px}
.chip.flag{border-color:var(--bad);color:var(--bad);font-weight:700;margin-left:auto}
.exp .eh small{font-weight:400;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.qcard + .exp{margin-top:12px}
.rev .exp{margin-top:10px;font-size:15px;background:var(--bg)}
.rev.hide article:not(.open) .exp{display:none}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--highlight-text);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.xpfloat{font-family:var(--f-num);font-size:22px;color:var(--highlight-text);font-weight:700}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin-top:16px}
.navgrid button{height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer;font-family:var(--f-num);font-size:15px}
.navgrid button.done{background:var(--sunk);color:var(--ink)}
.navgrid button.cur{border:2px solid var(--ink)}
.navgrid button.m{border-bottom:3px solid var(--fill)}
.flash-ok .qcard{animation:okp .45s}
.flash-bad .qcard{animation:badp .5s}
@keyframes okp{40%{box-shadow:0 0 0 3px var(--ok)}}
/* 答錯只輕推一下（2px）＋紅框，不再左右猛晃 */
@keyframes badp{25%{transform:translateX(-2px);box-shadow:0 0 0 3px var(--bad)}50%{transform:translateX(2px)}75%{transform:none;box-shadow:0 0 0 3px var(--bad)}}
.trip{position:fixed;inset:0;pointer-events:none;background:var(--bad);opacity:0;z-index:30}
.trip.go{animation:trip .45s}
@keyframes trip{15%{opacity:.08}100%{opacity:0}}
sup,sub{font-size:.72em;line-height:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- result ---------- */
.res-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.res-head{grid-template-columns:1fr}}
.score{font-family:var(--f-num);font-size:84px;font-weight:700;line-height:.9}
.score small{font-size:28px;color:var(--muted)}
.stamp{display:inline-block;border:3px solid currentColor;padding:2px 12px;border-radius:6px;font-weight:900;letter-spacing:.2em;transform:rotate(-4deg);font-size:20px}
.stamp.pass{color:var(--ok)}
.stamp.fail{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-block:16px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tiles b{display:block;font-family:var(--f-num);font-size:28px;line-height:1.1}
.tiles span{font-size:12px;color:var(--muted)}
.notice{border-left:4px solid var(--fill);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin-block:8px}
.rev{display:grid;gap:10px;margin-top:10px}
.rev article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.rev .s{font-weight:500;overflow-wrap:anywhere}
.rev ol{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:15px}
.rev li{padding:4px 8px;border-radius:6px;overflow-wrap:anywhere}
.rev li.r{background:var(--ok-bg);color:var(--ok);font-weight:700}
.rev li.w{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.rev li .n{font-family:var(--f-num);font-weight:700;margin-right:6px}
.rev .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chtable{width:100%;border-collapse:collapse;font-size:14px}
.chtable td,.chtable th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.chtable td.r{text-align:right;font-family:var(--f-num);font-size:16px}
.tblwrap{overflow-x:auto}

/* ---------- book ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input[type=search]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:42px;max-width:100%}
.filters input[type=search]{flex:1;min-width:160px}
.filters input[type=checkbox]{width:18px;height:18px;margin:0}
.filters label{display:flex;align-items:center;gap:6px;font-size:14px}
.rev.hide li.r{background:transparent;color:inherit;font-weight:400}
.rev article .reveal{display:none}
.rev.hide article .reveal{display:inline-flex;margin-top:8px;min-height:34px;padding:4px 12px}
.rev.hide article.open li.r{background:var(--ok-bg);color:var(--ok);font-weight:700}
.rev.hide article.open .reveal{display:none}

/* ---------- achievements ---------- */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-block:10px 20px}
@media (max-width:640px){.ladder{grid-template-columns:repeat(3,1fr)}}
.ladder div{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;background:var(--surface)}
.ladder div.got{border-color:var(--fill);background:var(--accent-soft)}
.ladder div.cur{box-shadow:0 0 0 2px var(--fill)}
.ladder small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.badge{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;opacity:.55}
.badge.got{opacity:1;border-color:var(--fill)}
.badge .ic{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--muted)}
.badge.got .ic{border:2px solid var(--fill);background:var(--btn-warn-bg);color:var(--btn-warn-fg)}
.badge b{display:block;font-size:15px}
.badge span{font-size:12px;color:var(--muted)}
.settings{display:grid;gap:10px;margin-top:10px;max-width:640px}
.settings label{display:flex;gap:10px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.sheet.wide{width:min(760px,100%)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ncard{display:grid;gap:6px;text-align:left;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:14px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.ncard:hover{border-color:var(--ink)}
.ncard b{font-size:16px;line-height:1.35}
.ncard .s{font-size:13px;color:var(--muted);line-height:1.6}
.ncard .tags{display:flex;gap:4px;flex-wrap:wrap}
.ncard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ncard .meter{height:5px}
.ncard .meter::after{display:none}
.nfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.nfilter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:32px}
.nfilter button[aria-pressed="true"]{background:var(--tab-active-bg);color:var(--tab-active-fg);border-color:var(--tab-active-bg)}
.note h3{font-size:21px;margin-block:2px 4px}
.note .lead{color:var(--muted);margin:0 0 12px}
.note h4{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;font-family:var(--f-mono)}
.note ul{margin:0;padding-left:20px;display:grid;gap:6px}
.note .fx{display:grid;gap:6px}
.note .fx div{font-family:var(--f-mono);font-size:14px;background:var(--sunk);border-radius:6px;padding:8px 12px;overflow-wrap:anywhere}
.note .tipbox{background:var(--accent-soft);border-left:4px solid var(--fill);border-radius:0 8px 8px 0;padding:10px 14px;font-weight:700}
.note .trap li::marker{color:var(--bad)}
.note .easybox{font-size:18px;font-weight:700;line-height:1.55;background:var(--accent-soft);border-radius:10px;padding:12px 16px}
.note .like{margin:0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.note .gloss{margin:0;display:grid;gap:6px}
.note .gloss div{display:grid;grid-template-columns:minmax(7em,max-content) 1fr;gap:4px 12px;padding:6px 0;border-bottom:1px solid var(--line)}
.note .gloss div:last-child{border-bottom:0}
.note .gloss dt{font-weight:700}
.note .gloss dd{margin:0;color:var(--ink)}
@media (max-width:520px){.note .gloss div{grid-template-columns:1fr}}
.note .exbox{background:var(--sunk);border-radius:10px;padding:12px 16px}
.note .exq{margin:0 0 8px;font-weight:700}
.note .exbox ol{margin:0;padding-left:22px;display:grid;gap:4px}
.note .exa{margin:10px 0 0;font-weight:700;color:var(--ok)}
.note .src{font-size:12px;color:var(--muted);margin-top:14px}
.nlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.nlink{border:1px solid var(--fill);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;min-height:28px}
.nlink:hover{border-color:var(--ink)}
.fxbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fxbar input[type=search]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:42px;flex:1;min-width:180px}
.fxbar label{display:flex;align-items:center;gap:6px;font-size:14px}
.fsec{margin-top:22px}
.fsec > h3{font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.fsec > h3 small{font-size:12px;color:var(--muted);font-weight:400}
.fgroups{display:grid;gap:12px}
.fgroup{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.fgroup header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.fgroup header b{font-size:15px;margin-right:auto}
.fgroup header .btn{min-height:32px;padding:4px 12px;font-size:13px}
.ftable{width:100%;border-collapse:collapse;font-size:14px}
.ftable td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ftable tr:last-child td{border-bottom:0}
.ftable td.sub{font-weight:700;width:26%}
.ftable td.val{width:30%}
.ftable .v{font-family:var(--f-mono);font-weight:600;color:var(--highlight-text);font-size:15px;overflow-wrap:anywhere}
.ftable .meta{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.ftable .diff{display:block;font-size:12px;color:var(--bad);margin-top:4px}
.ftable .miss{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
.fxhide .ftable .v{filter:blur(6px);cursor:pointer;user-select:none}
.fxhide .ftable .v.shown{filter:none}
@media (max-width:640px){.ftable td{display:block;width:auto!important;border-bottom:0;padding:4px 12px}.ftable tr{display:block;border-bottom:1px solid var(--line);padding-block:6px}.ftable td.sub{padding-top:8px}}
body{padding-bottom:72px}
.calcfab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;border:1px solid var(--ink);background:var(--btn-primary-bg);color:var(--btn-primary-fg);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);min-height:44px;display:flex;align-items:center;gap:8px}
.calcfab .ic{font-family:var(--f-num);font-size:16px;letter-spacing:.02em}
.calcfab[aria-expanded="true"]{display:none}
.calc{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:36;width:min(320px,calc(100vw - 32px));background:var(--card-bg);border:1px solid var(--ink);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px;display:grid;gap:8px;max-height:calc(100dvh - 24px);overflow:auto}
@media (max-height:560px){.calc{gap:5px;padding:8px}.chist{display:none}.ckeys button{min-height:30px;font-size:15px}.cprev{font-size:20px;min-height:24px;line-height:24px}#cexpr{font-size:15px;padding:5px 8px}}
@media (max-width:560px){.calc{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
.calc header{display:flex;align-items:center;gap:6px}
.calc header b{margin-right:auto;font-size:14px}
.calc header button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-height:30px;min-width:34px;padding:2px 8px;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.chist{display:flex;flex-direction:column;gap:2px;max-height:72px;overflow:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chist button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:1px 4px;border-radius:4px;cursor:pointer;color:inherit;font:inherit;text-align:left}
.chist button:hover{background:var(--sunk);color:var(--ink)}
.chist button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.cprev{font-family:var(--f-num);font-size:26px;font-weight:700;text-align:right;min-height:32px;line-height:32px;color:var(--ink);overflow-wrap:anywhere}

.ckeys button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-family:var(--f-num);font-size:18px;color:var(--ink)}

.ckeys button.fn{font-family:var(--f-mono);font-size:13px;background:var(--sunk)}
.ckeys button.op{font-weight:700;background:var(--sunk)}
.ckeys button.eq{background:var(--btn-warn-bg);color:var(--btn-warn-fg);border-color:var(--btn-warn-bg);font-weight:700}
.ckeys button.clr{color:var(--bad);font-family:var(--f-mono);font-size:13px}
.skinbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink);min-height:32px}
.skinbtn:hover{border-color:var(--ink)}
.skinbtn i{width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--fill) 0 25%,var(--rl) 0 50%,var(--gl) 0 75%,var(--ink) 0)}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:420px){.skins{grid-template-columns:1fr}}
.skin{display:grid;gap:8px;text-align:left;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);cursor:pointer;min-width:0}
.skin:hover{border-color:var(--muted)}
.skin[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--fill)}
.skin .sw{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.skin .sw i{flex:1}
.skin .sw i:first-child{flex:2}
.skin b{font-size:15px}

就是相鄰兩牙之間的距離。記法：乘號前是外徑，乘號後是節距。"},{"c":2,"n":11,"a":[4],"q":"木螺絲釘之規格係以下列何者表示？","o":["材質與長度","螺紋與直徑","材質與直徑","直徑與長度"],"x":"木螺絲釘的規格以直徑（號數）與長度表示，選用時依要鎖入的木材厚度與受力大小來挑選，不以材質或螺紋來標示。"},{"c":2,"n":12,"a":[1],"q":"游標卡尺在本尺上每刻劃的尺寸為多少毫米？","o":["1","0.5","0.05","0.02"],"x":"游標卡尺本尺（主尺）每一刻劃為 1mm，靠副尺（游標尺）再細分，才能讀到 0.05mm 或 0.02mm。0.05、0.02 是游標卡尺的精度，不是本尺刻劃。"},{"c":2,"n":13,"a":[4],"q":"手提電鑽的規格一般以下列何者表示？","o":["重量","電流","轉數","能夾持鑽頭之大小"],"x":"手提電鑽的規格以能夾持鑽頭的最大直徑（夾頭容量）表示，例如 10mm、13mm 電鑽，不是用重量、電流或轉數。"},{"c":2,"n":14,"a":[4],"q":"測量電纜線之絕緣電阻時，常加保護線，其目的在防止下列何種現象引起測試誤差？","o":["電纜靜電充電","儀表本身漏電","儀表本身絕緣不良","電纜末端表面漏電流"],"x":"測電纜絕緣電阻時，電纜末端絕緣表面可能有漏電流流回儀表，使讀值偏低。加保護線（接高阻計的 G 端）可把這個表面漏電流旁路掉，不經過指示部分，量到的才是真正的絕緣電阻。"},{"c":2,"n":15,"a":[3],"q":"量測裸銅線之低電阻值時最準確的方法為","o":["惠斯登電橋法","柯勞許電橋法","凱爾文電橋法","電壓降法"],"x":"量 1Ω 以下的低電阻（如裸銅線）要用凱爾文電橋（雙電橋），可消除引線電阻與接觸電阻的影響，最準確。惠斯登電橋適合中電阻，柯勞許電橋用於電解液及接地電阻。記法：低電阻找凱爾文。"},{"c":2,"n":16,"a":[2],"q":"自電度表接至變比器之引線，高壓以上用戶應採用多少股以上絞線構成之PVC 電纜，且該引線應以導線管密封？","o":["5","7","9","10"],"x":"依用戶用電設備裝置規則有關電度表引線的規定，自電度表接至變比器（PT、CT）的引線，高壓以上用戶應採用 7 股以上絞線構成之 PVC 電纜，並以導線管密封保護，防止損傷與竊電。"},{"c":2,"n":17,"a":[2],"q":"比流器與比壓器原理皆依據","o":["高斯定律","法拉第定律","歐姆定律","焦耳定律"],"x":"比流器（CT）與比壓器（PT）都是變壓器，靠電磁感應把一次側的大電流、高電壓轉換成二次側的小值供儀表使用，依據的是法拉第電磁感應定律。"},{"c":2,"n":18,"a":[1],"q":"工業用防護頭盔（電工用）須能耐電壓性試驗多少仟伏特以上？","o":["20","10","5","3"],"x":"電工用防護頭盔除了要耐衝擊，還必須通過耐電壓試驗，要求能耐 20 仟伏特以上，防止作業時頭部碰觸帶電體而感電。記法：電工帽耐壓 20kV。"},{"c":2,"n":19,"a":[3],"q":"精密儀表所使用之電阻器必須使用下列何種材料製造？","o":["電阻係數小","電阻係數大","溫度係數小","溫度係數大 的材料製造"],"x":"精密儀表的電阻器最怕阻值隨溫度漂移，所以要選溫度係數小的材料（如錳銅），讀值才穩定。電阻係數大小只影響體積，跟準確度沒有直接關係。"},{"c":2,"n":20,"a":[4],"q":"比壓器（PT）之二次線路阻抗為10Ω，二次側線電壓為110V，此比壓器（PT）之負擔為多少VA？","o":["11","550","1100","1210"],"x":"PT 負擔是二次側所接負載消耗的視在功率，以伏安表示：VA＝V²/Z＝110²/10＝12100/10＝1210VA。"},{"c":2,"n":21,"a":[3],"q":"某電度表其電表常數為2400Rev/kWH，當該表每分鐘轉120 轉時，該回路負載為多少kW？","o":["5","4","3","2"],"x":"負載功率＝每小時轉數÷電表常數（每 kWh 轉數）。每分鐘 120 轉，每小時 120×60＝7200 轉，P＝7200/2400＝3kW。"},{"c":2,"n":22,"a":[1],"q":"利用二只單相瓦特表量測三相三線式負載之電功率，在正常接線情形下，其中一只瓦特表指示值為0，此負載之功率因數為","o":["0.5","0.707","0.866","1"],"x":"二瓦特表法：tanθ＝√3(W1−W2)/(W1+W2)。一表為 0 時 tanθ＝√3，θ＝60°，功率因數＝cos60°＝0.5。功率因數再低於 0.5，其中一表就會反轉成負值。"},{"c":2,"n":23,"a":[4],"q":"指針型三用電表量度電阻時，作零歐姆歸零調整，其目的是在補償","o":["接觸電阻","指針靈敏度","測試棒電阻","電池老化"],"x":"指針型三用電表量電阻靠表內電池供電，電池用久電壓下降，表棒短路時指針就到不了零歐姆。每次換檔都要做零歐姆調整，就是為了補償電池老化造成的電壓變化。"},{"c":2,"n":24,"a":[4],"q":"鉤式（夾式）電流表係利用比流器的原理製成，其一次側線圈為多少匝？","o":["100","10","5","1"],"x":"鉤式電流表把被測導線當作比流器的一次側，導線只穿過鐵心一次，所以一次側為 1 匝；纏在鐵心上的線圈才是二次側。"},{"c":2,"n":25,"a":[1],"q":"250 伏特電壓表，其靈敏度為5kΩ/V，欲測量500 伏特電壓時，需串聯多少kΩ之倍增器？","o":["1250","2500","3750","5000"],"x":"電壓表內阻 Rm＝250V×5kΩ/V＝1250kΩ。要擴大到 500V 為 2 倍，倍增器 Rs＝(n−1)Rm＝(2−1)×1250＝1250kΩ。驗算：總電阻需 500×5k＝2500kΩ，減去 1250kΩ 也是 1250kΩ。"},{"c":2,"n":26,"a":[3],"q":"比流器之負擔表示為","o":["伏特","安培","伏安","瓦特"],"x":"比流器的負擔是指二次側所接儀表、電驛與引線消耗的視在功率，以伏安（VA）表示，計算式為 I²Z。"},{"c":2,"n":27,"a":[3],"q":"線電流為10A 之平衡三相三線式負載系統，以鉤式（夾式）電流表任鉤其中二線量測電流時，其值為多少A？","o":["30","10 \u00010\u0001","10","0"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACYAAAAkBAMAAAAX21WWAAAAGFBMVEX///+enp6Hh4d0dHRRUVE2NjYbGxsCAgKzbZUKAAAAuElEQVR42s2QMQ4BURCGv+e91QmJQmdFQiEkG7ViExIHcAOJPYDG7XADnMCWkk1YsR2xGnlrrELHVJPvn39m8sNvSmVtEyDdg7HIOQGkwpGpBdsNPjC+YyrOiwZM4L17VW89kh8o2HCRc11SOEpWBrhJVgHMSrIY1MQXTG8hXbYt08Hz5ejcANBAP2qF+g6QlA42ujlVAGoNu++aUAfADbMbO88FDZ2XAIpTH5zZUCS28PJJjfnTegCD0yDQlxIwjwAAAABJRU5ErkJggg==",17,16]],"x":"平衡三相三線系統三線電流相量和為零，Ia＋Ib＝−Ic。鉤住任兩線量到的是兩線電流的相量和，大小等於第三線電流，也就是 10A。不是 10√3A（相量相加要考慮 120° 相位差），也不是 0（鉤三線才是 0）。"},{"c":2,"n":28,"a":[3],"q":"一般螺絲攻之第一、二、三攻的主要區別是","o":["外徑","牙深","前端倒角螺紋數","柄長"],"x":"螺絲攻第一、二、三攻的外徑與牙深都相同，主要差別在前端倒角的螺紋數：第一攻倒角牙數最多，容易導入起攻；第三攻最少，能攻到盲孔底部。"},{"c":2,"n":29,"a":[1],"q":"公制螺紋大小規格的標示是","o":["外徑與節距","外徑與牙數","節徑與牙數","節徑與節距"],"x":"公制螺紋規格以外徑與節距標示，例如 M10×1.5 表示外徑 10mm、節距 1.5mm。用牙數（每吋幾牙）標示的是英制螺紋。"},{"c":2,"n":30,"a":[4],"q":"一只300mA 電流表，其準確度為±2％，當讀數為120mA 時，其誤差百分率為多少％？","o":["±0.5","±1","±2","±5"],"x":"儀表準確度以滿刻度為基準：誤差＝300mA×2%＝±6mA。讀數 120mA 時誤差百分率＝6÷120×100%＝±5%。所以讀數愈小相對誤差愈大，量測時指針偏轉愈大愈準。"},{"c":2,"n":31,"a":[3],"q":"以三用電表量測某電阻之指示值，以不同測試檔測試時，指針指向何處所測得值較正確？","o":["偏左","中間","偏右","不影響"],"x":"依題庫答案選「偏右」。指針式三用電表的歐姆刻度左密右疏，指針偏左時刻度擠在一起不易讀準；換用適當檔位讓指針落在偏右、刻度較疏的區域，讀值較清楚、較正確。註：理論與多數教材都說指針在刻度中央附近誤差最小，太偏左或太偏右都會變差。","f":"爭議"},{"c":2,"n":32,"a":[1],"q":"某安培計滿刻度偏轉電流為1 毫安，校正百分率為滿刻度電流之±5％，若該安培計讀數為0.35 毫安時，其真實電流範圍為多少毫安？","o":["0.3325~0.3675","0.30~0.40","0~0.3675","0~0.40"],"x":"依題庫答案，誤差以讀數的±5%計算：0.35×5%＝0.0175毫安，真實電流為0.35−0.0175＝0.3325至0.35＋0.0175＝0.3675毫安。註：若照字面「滿刻度電流之±5%」，誤差應為1×5%＝±0.05毫安，範圍是0.30～0.40毫安；實務上指針式儀表的準確度多以滿刻度百分比標示。","f":"爭議"},{"c":2,"n":33,"a":[3],"q":"比流器（CT）二次側阻抗為0.4Ω，二次側電流為4A 時，比流器（CT）之負擔為多少VA？","o":["16","8","6.4","1.6"],"x":"CT 負擔是二次側消耗的視在功率，以伏安表示：VA＝I²Z＝4²×0.4＝16×0.4＝6.4VA。記法：PT 用 V²/Z，CT 用 I²Z。"},{"c":2,"n":34,"a":[3],"q":"兩只額定200 伏之直流伏特計，V\u00031\u0003 及V\u00032\u0003 靈敏度分別為20kΩ/V、40kΩ/V，當串聯於240 伏直流電源時，伏特計V\u00031\u0003 及V\u00032\u0003 各分別指示為多少V？","o":["160、80","120、120","80、160","160、160"],"x":"伏特計內阻＝額定電壓×靈敏度：V1＝200×20k＝4MΩ，V2＝200×40k＝8MΩ。串聯時分壓與內阻成正比，總電阻 12MΩ：V1＝240×4/12＝80V，V2＝240×8/12＝160V。"},{"c":2,"n":35,"a":[3],"q":"利用儀表進行負載之電流量測時，下列何者正確？","o":["伏特計與負載串聯連接","伏特計與負載並聯連接","安培計與負載串聯連接","安培計與負載並聯連接"],"x":"量電流時安培計要與負載串聯，讓負載電流全部流過電表。安培計內阻很小，若並聯會形成短路而燒表；伏特計則是並聯在負載兩端量電壓。記法：安串伏並。"},{"c":2,"n":36,"a":[2],"q":"利用儀表進行負載之電壓量測時，下列何者正確？","o":["伏特計與負載串聯連接","伏特計與負載並聯連接","安培計與負載串聯連接","安培計與負載並聯連接"],"x":"量電壓時伏特計要與負載並聯，量負載兩端的電位差。伏特計內阻很大，若串聯會使電路幾乎沒有電流；與負載串聯的是安培計。記法：安串伏並。"},{"c":2,"n":37,"a":[2],"q":"一電流表並聯電阻為1Ω之分流器後，其量測電流範圍提高為原來之10倍，電流表之內阻應為多少Ω？","o":["1","9","10","99"],"x":"擴大為 10 倍，表示分流器分走 9/10 電流、電表只流 1/10。並聯電壓相等：Im×Rm＝9Im×Rs，Rm＝9×Rs＝9×1＝9Ω。也可由 Rs＝Rm/(n−1) 反推。"},{"c":2,"n":38,"a":[1],"q":"下圖所示之接線是以伏特計與安培計測量負載直流電功率，為防止儀表之負載效應，減少誤差，下列何者正確？ \u00010\u0001","o":["為量測高電阻負載之電功率時，所採用之接線","為量測低電阻負載之電功率時，所採用之接線","不論量測負載電阻大小之電功率時，均可採用之接線","與負載電阻高低無關"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAW8AAADEBAMAAACivr2+AAAAGFBMVEX///+WlpZcXFw1NTUZGRkICAgBAQEAAACw0AmjAAAKyUlEQVR42u2d728jxRnHv7N2aaVWyaz3qE4BlLWdoyog5F9BqFdUkvioROkL7q686qsC7T/Q/6bwtlIRCX1FBSQ+XrQUNf6lVoVT4x8boNy1ze6OAyXR9bzTF+tdr9deO47HSbbdeRPvZjT+7MwzM8/zzPOsgahEJSoXspA 44,"a":[1,4],"q":"瓦特計之電流線圈，其匝數及線徑為？","o":["匝數少","匝數多","線徑細","線徑粗"],"x":"瓦特計的電流線圈與負載串聯，要通過負載電流且壓降要小，所以採匝數少、線徑粗。電壓線圈與負載並聯，才是匝數多、線徑細，兩者剛好相反。"},{"c":2,"n":45,"a":[3,4],"q":"下列哪些是裝設無螺紋金屬導線管（EMT 管）應該會使用之工具？","o":["擴管器","噴燈","EMT 彎管器","附鋸條鋼鋸"],"x":"EMT 管是薄鋼管，彎管用 EMT 彎管器，切管用附鋸條的鋼鋸。擴管器與噴燈是 PVC 管加熱彎曲、擴口接管用的工具，EMT 管用不到。"},{"c":2,"n":46,"a":[1,2,3],"q":"有關指針型三用電表之敘述，下列哪些正確？","o":["歐姆檔刻度為非線性","直流電壓檔刻度為線性","不可測量交流電流","直流電流檔刻度為非線性"],"x":"指針型三用電表歐姆檔刻度左密右疏，為非線性；直流電壓檔與直流電流檔刻度均勻，都是線性，所以說直流電流檔非線性是錯的。一般指針型三用電表沒有交流電流檔，不可測交流電流。"},{"c":2,"n":47,"a":[1,2,3],"q":"有關電儀表之特性與應用，下列哪些正確？","o":["電壓表與待測元件並聯","電流表與待測元件串聯","理想電流表內電阻為零","不知待測元件電流大小時，須先採用較小的電流檔位測量"],"x":"電壓表並聯、電流表串聯待測元件，理想電流表內阻為零才不影響電路，這三項都正確。不知電流大小時應先用最大檔位再逐步調低，先用小檔位容易燒表，所以該項錯誤。"},{"c":2,"n":48,"a":[1,3],"q":"有關直流電流表使用，下列哪些正確？","o":["串接於待測電路","並接於待測電路","須注意極性之正確","不須注意極性之正確"],"x":"直流電流表要串接於待測電路，讓電流全部流過電表；直流有正負極之分，接線必須注意極性，接反指針會反打而可能損壞儀表。並接與不須注意極性都是錯的。"},{"c":2,"n":49,"a":[1,2],"q":"在交流電路中負載平均功率及電壓相同下，當功率因數P F ( c o s θ ) 愈高時，下列敘述哪些正確？","o":["減少電費支出","降低線路損失","增加線路壓降","增加線路電流"],"x":"功率與電壓相同時 I＝P/(V·cosθ)，功率因數愈高電流愈小，線路損失 I²R 隨之降低，壓降也減少；功率因數高還可享電費上的調整優惠，減少電費支出。增加壓降、增加電流兩項正好說反了。"},{"c":3,"n":1,"a":[3],"q":"截面積14 平方毫米之銅絞線，係由7 股多少毫米之單芯銅線絞合而成？","o":["1.0","1.2","1.6","2.0"],"x":"每股截面積＝π×(d/2)²。取 1.6mm：π×0.8²≈2.01mm²，7 股合計≈14.07mm²，正好是 14 平方毫米。驗算 2.0mm 的 7 股約 22mm²，太大；1.2mm 的 7 股約 7.9mm²，太小。"},{"c":3,"n":2,"a":[4],"q":"導線的直徑如加倍時，在長度不變之下，其電阻變成為原來電阻的多少倍？","o":["2","4","1/2","1/4"],"x":"R＝ρL/A，而 A＝πd²/4。直徑加倍，截面積變為 4 倍，長度不變下電阻變為原來的 1/4。記法：電阻與直徑平方成反比。"},{"c":3,"n":3,"a":[1],"q":"在交流配電線路，其導線線徑超過200 平方毫米時，因集膚作用會導致導線交流電阻較其直流電阻值","o":["略大","略小","相等","不一定"],"x":"交流電流會集中在導體表面流動（集膚效應），相當於有效截面積變小，線徑愈粗愈明顯，所以導線的交流電阻會比直流電阻略大。"},{"c":3,"n":4,"a":[3],"q":"由直徑為0.26 毫米37 根組成之2.0 平方毫米可撓電纜，在周圍溫度35℃以下及最高容許溫度60℃時其安培容量為多少A？","o":["7","11","15","20"],"x":"37 股 0.26mm 的截面積約為 37×π×0.13²≈1.96mm²，即 2.0 平方毫米規格。查可撓電纜安培容量表，周溫 35℃以下、最高容許溫度 60℃時，2.0 平方毫米的安培容量為 15A。"},{"c":3,"n":5,"a":[4],"q":"下列電線之電阻係數最大者為","o":["鋁導線","銀導線","銅導線","鎳鉻合金線"],"x":"鎳鉻合金線是電熱線材料，電阻係數遠大於導電用金屬。導電材料的電阻係數由小到大為銀＜銅＜鋁，鎳鉻合金最大，所以才用來發熱。"},{"c":3,"n":6,"a":[4],"q":"鋁線之導電率約為銅線之百分之","o":["三○","四○","五○","六○"],"x":"以標準軟銅的導電率為 100%，鋁線的導電率約為 61%，所以約為銅線的百分之六○。這也是同電阻時鋁線要比銅線粗約 1.6 倍的原因。"},{"c":3,"n":7,"a":[4],"q":"照明燈具、插座及電熱工程選擇分路導線之線徑，單線直徑不得小於多少毫米？","o":["1.0","1.2","1.6","2.0"],"x":"依用戶用電設備裝置規則，照明燈具、插座及電熱工程的分路導線，單線直徑不得小於 2.0 毫米。記法：照明插座電熱，單線最少 2.0。"},{"c":3,"n":8,"a":[2],"q":"屋外照明配線架空導線，架空跨距超過15 米至50 米，導線線徑不得小於多少毫米？","o":["14","8","5.5","3.5"],"x":"依用戶用電設備裝置規則，屋外照明配線的架空導線，跨距超過 15 米至 50 米時，導線線徑不得小於 8 平方毫米，跨距愈大需要愈粗的導線來承受張力。"},{"c":3,"n":9,"a":[1],"q":"A、B 為同質材料之導線，A 之導線長度、截面積均為B 導線之2 倍，R\u0003A\u0003 及R\u0003B\u0003 分別代表兩導線電阻，則R\u0003A\u0003 及R\u0003B\u0003 兩導線電阻之關係為","o":["R\u0003A\u0003 =R\u0003B\u0003","R\u0003A\u0003 =R\u0003B\u0003 /2","R\u0003A\u0003 =2R\u0003B\u0003","R\u0003A\u0003 =4R\u0003B\u0003"],"x":"R＝ρL/A。A 導線的長度、截面積都是 B 的 2 倍：RA＝ρ(2L)/(2A)＝ρL/A＝RB，兩者電阻相等。"},{"c":3,"n":10,"a":[3],"q":"有三個相同電壓及容量之單相電熱器平均接在三相三線式或單相二線式之系統，如導線之材質、線徑及長度均相同時，則三相三線式之電壓降為單相二線式之多少倍？","o":["\u00010\u0001","\u00011\u0001","\u00012\u0001","2"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADkAAABaBAMAAADwVuNCAAAAGFBMVEX///+ioqKMjIxjY2M4ODgqKioWFhYAAAC4cbSqAAABz0lEQVR42u2WzW7TQBRGz9iJqAoy4xSxQklKskNITVJWSCzKkh0/r8CaB+JRKvEEoV2VFc6saJCIZ0CqlErEZkGajt3xFWxQFtyV7aNv5s6dz3cGtjFi/0Ud3p9XaKsCxytOm7TDFzu7abZsoPvTs6+PViZM4/bMzm/3Tjwaec8GillKmK4AchooAM5KlJlEU1HbcxJNjECjXNqUtpboGGG98sAdBK1K/kZa0aoCQDfQjgaG/bCv4tcaWL0PawcaoPQLrbztSQFyx//416Egfhkk3z5scc4VA28cmdV7HfDKVmgt3iH2HInGRtQ6iSrR6m1xXiXSx2Jn6AI81A3aEjh881yHtUCsp/eOQmcKykFyzI9n4ZEdysI0PghR7SgBbFCr12UuTqU9yoLd7K5EozXtmuC8JQB7k3A1HIAaDEahU3IvmQNqqUZnS1+r0mttufgY9/2R1ZO3faC3ziZ32qfDrtsHrhZUmI5PPx+fjDcpA670aeFmrQNa10egra5oYXTIuNHVVBMPFqZWjVyhNt8SV6vG96cXPxdAfGSXnYs65UGivgDRpH95y9yo5J1R8Qkoz509v+nYadT9nUBmA24vcMIdqdzN5n/8n29z/AIdK32DmqFowAAAAABJRU5ErkJggg==",26,40],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAABcBAMAAADJzWthAAAAGFBMVEX///+ampqNjY17e3tXV1cxMTEXFxcHBwelwGD3AAAB1ElEQVR42u2VMU8UQRTHf2/3Diq41QuluEQs1Bhguc5GiNAbQmNiZcI34Ev4FSzsNaG L/A，電阻為原來的 6 倍。"},{"c":3,"n":16,"a":[4],"q":"影響導體電阻大小的因素，除了導體長度及截面積外，還有何項因素？","o":["材料及電流","溫度及電流","電壓及電導係數","溫度及電導係數"],"x":"R＝ρL/A，除了長度與截面積，還取決於材料的電阻係數（即電導係數的倒數），而電阻係數會隨溫度改變，所以溫度也是因素。電流、電壓不會改變導體本身的電阻。"},{"c":3,"n":17,"a":[3],"q":"交流電的頻率為60Hz，則其角頻率約為多少弳度/秒？","o":["60","220","377","480"],"x":"角頻率是每秒轉過的弳度數，ω＝2πf＝2×3.1416×60≈376.99，約 377 弳度/秒。記法：60Hz 對應 377。"},{"c":3,"n":18,"a":[2],"q":"直徑為1.6mm 單芯線的配線回路，其線路電壓降為4%；若將導線換成相同材質、相同長度的2.0mm 單芯線，其線路電壓降約為多少％？","o":["2.0","2.6","3.2","5.0"],"x":"壓降與電阻成正比，電阻與直徑平方成反比。新壓降＝4%×(1.6/2.0)²＝4%×0.64＝2.56%≈2.6%。"},{"c":3,"n":19,"a":[1],"q":"單相二線（1ψ2W）式之線間電壓降為","o":["2IL（Rcosθ＋Xsinθ）","IL（Rcosθ＋Xsinθ）","\u00010\u0001IL（Rcosθ＋Xsinθ）","\u00011\u0001IL（Rcosθ＋Xsinθ）"],"im":[["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAD8AAAA7BAMAAAA+4E/6AAAAGFBMVEX///+enp6EhIRvb29DQ0MkJCQJCQkAAADL8iELAAABoElEQVR42t2Uu0oDQRSGv73ZusELNuKKPsBiwDpGIY2FFloH7EXxKXwFQbQVRNMKonkBZSsxhZpS8TaNhdlkxyLZdXYzSRCtPNXs8M2cc/7z78B/CCO7YXrJUj5ogCXL/wb2BNiZ83nlQwq6AJvdbMpMSZ/0B7ojA/jBAKAQ/DbFIGBoEGA0xY9TpJV0AcjN+639986WlQKWn2/B3JzAzH88alMIYBaAxZ41mAvtq31NDbb3BIZbqzC0bRQDzQ1RFUajCoQitpKmzRCQp310CADetDoYTeD5qbeScxKI/mzcshswCnXl61p3Q+UblvX+KeZ0gNVUBt/UFGm1kqXjH6iAveZ3NScUJc0NdzKI3dCO8pGqw5iL4wJb1cTdw0IFyndQTmVYfUkB58fVdLvO1ElK6isCHLXMYigys2iAh92KlU56TABZYQazMx7WQwEYK6pQ78pr5kxfAIx7qqNesfybzs9UBLB3qKlAVPdyq20f2j6lEkBVTSEF850XdETvqEuQbTfE/bZEytWN5MjZmd6TYpBpD2OX9npAovuQ/xtfAv5qVxAtAZ4AAAAASUVORK5CYII=",28,27],["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEYAAAA/BAMAAACvLaO+AAAAGFBMVEX///+kpKSEhIRHR0cxMTEuLi4tLS0nJyea5NYjAAABiklEQVR42uWVPU8CQRCGn90jkhgJd0hrcoDRxBDFaDB2NPbGaE+hvY3/h1oK6U0MrYkRGq3AXK+Bq4wiHxaceF/LXQyd2+zs3pOZd2d25+DfDikCW4bL7gMQYDKnrsW1DZDwMyd118ImlHH8ewTFEf0HRutEM3JBseKMoxh+RAwmF4MZRjOJVAiTCD3sOYNaRM6uDJaqrtx7P6++2JB/etZ0+aiKlb8HmWpjs6Pbc2KJNvQQpXl61gBa6ApGbgEWQE+ZH5H+tRuLuRufKuQgxFL60Q6jmX21npEzb1aSlwpGFqdz1oRkRKy32yYcR+gZPxCoRfliVk1HWIOslymXRAWgMGPo+s61UbwLRvMxnbuuta77GMvLjK0J0gRW3K3K9p+rhQFy2+1p4mdeyfsVdYP5Eab3zujBPNekjtFw7aebIXnOoE1l7pnA7lfQz4BZrL2Cjparhb1
